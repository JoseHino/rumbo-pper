AVTEX recibe 518 kHz y, además, 490 kHz."},{"id":"2020dic-2-30","t":19,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según el reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, ¿deben las embarcaciones de recreo mantener un diario del servicio radioeléctrico, para anotación de comunicaciones de socorro, urgencia, seguridad y sucesos de importancia que tengan lugar en las zonas próximas a la navegación de la embarcación?","o":["Sí.","No, dichos diarios son para otro tipo de embarcaciones/buques.","Únicamente si navegan en zona 1 y 2.","Siempre que sean de Lista 6.ª y lleven hasta doce pasajeros."],"a":1,"e":"RD 1185/2006: el diario del servicio radioeléctrico no se exige a las embarcaciones de recreo."},{"id":"2019oct-1-01","t":1,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"A efectos del Real Decreto Legislativo 2/2011, por el que se aprueba el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, se considera Marina Mercante:","o":["La actividad de transporte marítimo, incluyendo el que se lleva a cabo exclusivamente entre puertos o puntos de una misma Comunidad Autónoma, que tenga competencias en esta materia, sin conexión con puertos o puntos de otros ámbitos territoriales.","La actividad de transporte marítimo, incluyendo la ordenación de la flota pesquera, en los ámbitos propios de la pesca y de la ordenación del sector pesquero, y la actividad inspectora en estos mismos ámbitos.","La actividad de transporte marítimo, incluyendo el que se lleva a cabo exclusivamente entre puertos o puntos de una misma Comunidad Autónoma, que tenga competencias en esta materia, sin conexión con puertos o puntos de otros ámbitos territoriales y la ordenación de la flota pesquera, en los ámbitos propios de la pesca y de la ordenación del sector pesquero, y la actividad inspectora en estos mismos ámbitos.","La actividad de transporte marítimo, exceptuando el que se lleva a cabo exclusivamente entre puertos o puntos de una misma Comunidad Autónoma, que tenga competencias en esta materia, sin conexión con puertos o puntos de otros ámbitos territoriales."],"a":3,"e":"TRLPEMM: Marina Mercante es el transporte marítimo, salvo el que se hace exclusivamente entre puertos de una misma Comunidad Autónoma con competencias, sin conexión con otros ámbitos."},{"id":"2019oct-1-02","t":1,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"A efectos del Real Decreto Legislativo 2/2011, por el que se aprueba el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, la navegación, en función de su ámbito, será:","o":["Altura, gran altura, litoral y local.","Nacional, internacional, altura y gran altura.","Cabotaje, gran cabotaje, local, litoral.","Interior, de cabotaje, exterior y extranacional."],"a":3,"e":"TRLPEMM: por su ámbito, la navegación es interior, de cabotaje, exterior y extranacional."},{"id":"2019oct-1-03","t":2,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"A efectos de la Ley 14/2014, de Navegación Marítima, los buques obligados a detenerse o fondear en caso de peligro o fuerza mayor, deberán comunicar dichas circunstancias, inmediatamente y por cualquier medio, a:","o":["La Administración Marítima más próxima.","La Dirección General de la Marina Mercante.","La Administración portuaria más próxima.","La Capitanía Marítima."],"a":0,"e":"Ley de Navegación Marítima: el buque que se detiene o fondea por peligro o fuerza mayor lo comunica de inmediato a la Administración Marítima más próxima."},{"id":"2019oct-1-04","t":15,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"A efectos de la Ley 14/2014, de Navegación Marítima, la copropiedad ordinaria del buque, embarcación, artefacto naval o plataforma fija se regirá por las disposiciones generales de:","o":["Derecho Marítimo.","Derecho Común.","Derecho Administrativo.","Derecho Social."],"a":1,"e":"Ley de Navegación Marítima: la copropiedad ordinaria del buque se rige por las disposiciones generales del Derecho común.","av":{"n":"fuera","x":"La copropiedad del buque no figura de forma expresa en el temario de 2026 del tema 15 (registro, nacionalidad e hipoteca). La respuesta sigue siendo correcta."}},{"id":"2019oct-1-05","t":3,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Conforme al Real Decreto 953/2018, por el que se desarrolla la estructura orgánica básica del Ministerio de Fomento, ¿cuál de las siguientes opciones NO es una función de la Dirección General de la Marina Mercante?","o":["La dirección de la prevención y lucha contra la contaminación marina procedente de buques, embarcaciones y plataformas, así como de la limpieza de las aguas marinas.","La ordenación del establecimiento y aplicación del régimen tarifario y de prestación de servicios marítimos y la propuesta de establecimiento de obligaciones de servicio público y de contratos de servicio público.","La elaboración y propuesta de la regulación sectorial, en particular la referida a despacho de buques; registro y abanderamiento; titulaciones que permitan el acceso a las profesiones de la marina mercante; inspección de buques.","El asesoramiento jurídico interno, la tramitación de expedientes sancionadores, la emisión de informes y la administración de justicia penal marítima."],"a":3,"e":"Con el RD 953/2018, el asesoramiento jurídico y la justicia penal marítima no eran funciones de la DGMM.","av":{"n":"derogada","x":"El RD 953/2018 (Ministerio de Fomento) está derogado: la estructura actual la fija el RD 253/2024 (tema 3). Comprueba las funciones vigentes."}},{"id":"2019oct-1-06","t":4,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"De acuerdo con el Real Decreto Legislativo 2/2011, por el que se aprueba el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, en aquellos puertos, o grupos de puertos, en los que se desarrolle un determinado nivel de actividades de navegación o lo requieran las condiciones de tráfico, seguridad o protección marítima, existirá una:","o":["Capitanía Marítima.","Comandancia de Marina y Distritos Marítimos.","Autoridad Portuaria.","Comandancia de Marina."],"a":0,"e":"TRLPEMM: donde lo exija el nivel de actividad o las condiciones de tráfico, seguridad o protección, existe una Capitanía Marítima."},{"id":"2019oct-1-07","t":5,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"De acuerdo con la Orden de 18 de enero de 2000, por la que se aprueba el Reglamento sobre Despacho de Buques, ¿cuál de las siguientes afirmaciones es FALSA?","o":["Se autoriza el enrole de la misma tripulación para más de un buque o embarcación dedicado al tráfico interior, siempre y cuando se trate de buques o embarcaciones pertenecientes u operados por la misma empresa naviera y que presten servicio en el mismo puerto.","Se prohíbe, en todo caso, el enrole de la misma tripulación para más de un buque o embarcación.","Se autoriza el enrole de más de una tripulación en un mismo buque o embarcación que, en atención al tráfico que realiza, su tripulación esté sometida a frecuentes rotaciones.","Cuando más de una tripulación esté enrolada en un mismo buque o embarcación, se deberá comunicar a la Capitanía Marítima la identidad de los miembros de la tripulación que efectivamente se encuentren a bordo."],"a":1,"e":"Con el antiguo Reglamento de Despacho, era falso que se prohibiera siempre enrolar a la misma tripulación en más de un buque.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 los enrolamientos los regula el RD 186/2023 (tema 5): comprueba la respuesta en la norma nueva."}},{"id":"2019oct-1-08","t":6,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Según el Real Decreto 210/2004, por el que se establece un sistema de seguimiento e información sobre el tráfico marítimo, el operador, agente, o capitán de un buque con destino a puerto español, tiene el deber de notificar la información que se recoge en el Anexo I (Lista de información que deberá notificarse) de la norma, al menos con:","o":["12 horas de antelación, o en el momento en el que el buque abandone el puerto anterior si la duración de la travesía es inferior a 12 horas.","24 horas de antelación, o en el momento en el que el buque abandone el puerto anterior si la duración de la travesía es inferior a 24 horas.","48 horas de antelación, o en el momento en el que el buque abandone el puerto anterior si la duración de la travesía es inferior a 48 horas.","72 horas de antelación, o en el momento en el que el buque abandone el puerto anterior si la duración de la travesía es inferior a 72 horas."],"a":1,"e":"RD 210/2004: la información del anexo I se notifica al menos 24 horas antes, o al salir del puerto anterior si la travesía dura menos."},{"id":"2019oct-1-09","t":7,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"De conformidad con el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, ¿cuál de las siguientes afirmaciones es FALSA en relación al coordinador de seguridad de las pruebas náutico-deportivas?","o":["Será el coordinador de seguridad de la Capitanía Marítima competente en las aguas en las que se realice dicha prueba.","Ejercerá la dirección interna del desarrollo de las pruebas.","Comprobará que todas las embarcaciones participantes en la prueba están en las debidas condiciones de mantenimiento.","Retrasará o suprimirá las pruebas si disminuyen las condiciones de seguridad."],"a":0,"e":"RD 62/2008: el coordinador de seguridad de una prueba lo designa la entidad organizadora; no es el de la Capitanía Marítima."},{"id":"2019oct-1-10","t":7,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Según el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, aprobado por el Real Decreto 62/2008, NO corresponde al Capitán Marítimo competente por razón del ámbito geográfico de la Capitanía Marítima:","o":["Velar para que las concentraciones náuticas y las pruebas náutico-deportivas se celebren con sujeción a las normas establecidas en dicho Reglamento.","Retrasar, anular o suprimir las pruebas si disminuyen las condiciones de seguridad.","Supervisar la actividad del coordinador de seguridad, a efectos de garantizar que se cumplen las condiciones conforme a las cuales se ha autorizado la celebración del evento.","Condicionar la realización del evento a la adopción por parte de la entidad organizadora de las medidas que estime adecuadas."],"a":2,"e":"RD 62/2008: supervisar la actividad del coordinador de seguridad no figura entre las funciones del Capitán Marítimo."},{"id":"2019oct-1-11","t":8,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"El nombre de una embarcación de recreo abanderada en España y matriculada en la lista séptima:","o":["Deberá figurar en todo caso en la popa de la embarcación.","No contendrá anagramas.","No es obligatorio para embarcaciones de hasta 12 metros de eslora.","Podrá contener letras del alfabeto latino y/o arábigo."],"a":2,"e":"RD 1435/2010: el nombre no es obligatorio para embarcaciones de hasta 12 metros de eslora."},{"id":"2019oct-1-12","t":8,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Una embarcación de recreo no matriculada está siendo expuesta en el salón náutico de Vigo. Además del personal de la empresa responsable de la misma, ¿cuántas personas podrán ser autorizadas, como máximo, a probar la embarcación navegando por la ría?","o":["1 persona siempre que la documentación técnica de dicha embarcación lo permita.","2 personas siempre que la documentación técnica de dicha embarcación lo permita.","3 personas siempre que la documentación técnica de dicha embarcación lo permita.","Las que permita la documentación técnica de la embarcación, incluyendo al personal responsable de la misma."],"a":2,"e":"RD 685/2010: además del personal de la empresa, pueden probarla hasta 3 personas si la documentación técnica lo permite."},{"id":"2019oct-1-13","t":9,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Según el Reglamento del seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas, la cobertura del seguro de responsabilidad civil de suscripción obligatoria NO comprenderá:","o":["Daños materiales a terceros.","Daños a buques por colisión o sin contacto.","Muerte o lesiones corporales de terceras personas.","La muerte o lesiones sufridas por el patrón o piloto de la embarcación."],"a":3,"e":"RD 607/1999: el seguro obligatorio no cubre la muerte o lesiones del patrón o piloto de la embarcación."},{"id":"2019oct-1-14","t":10,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Según el Real Decreto 973/2009, por el que se regulan las titulaciones profesionales de la marina mercante, el límite de alcohol en sangre para los capitanes, oficiales y para otros miembros de la tripulación, que desempeñen determinados cometidos relacionados con la seguridad, la protección y el medio ambiente marino, se fija en:","o":["Un límite no superior a 0,25 % de nivel de alcohol en sangre, o 0,5 mg/l de alcohol en aliento, o una cantidad de alcohol que lleve a dicha concentración.","Un límite no superior a 0,5 % de nivel de alcohol en sangre, o 0,25 mg/l de alcohol en aliento, o una cantidad de alcohol que lleve a dicha concentración.","Un límite no superior a 0,25 % de nivel de alcohol en sangre, o 0,05 mg/l de alcohol en aliento, o una cantidad de alcohol que lleve a dicha concentración.","Un límite no superior a 0,05 % de nivel de alcohol en sangre, o 0,25 mg/l de alcohol en aliento, o una cantidad de alcohol que lleve a dicha concentración."],"a":3,"e":"El límite es 0,05 % de alcohol en sangre o 0,25 mg/l en aire espirado.","av":{"n":"ojo","x":"El RD 973/2009 está derogado; hoy la regla está en el art. 86.3 del RD 269/2022 (tema 10), con los mismos límites. La respuesta sigue valiendo."}},{"id":"2019oct-1-15","t":10,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Según el Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, se define la navegación diurna como:","o":["Toda navegación que se realiza entre el ocaso y el orto.","Toda navegación que se realiza entre las 0800 horas y las 2000 horas.","Toda navegación que se realiza entre el orto y el ocaso.","El Real Decreto no define la navegación diurna."],"a":2,"e":"RD 875/2014: navegación diurna es la que se realiza entre el orto y el ocaso."},{"id":"2019oct-1-16","t":11,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Conforme al Real Decreto 1434/1999, sobre inspecciones de las embarcaciones de recreo, los reconocimientos extraordinarios se realizarán:","o":["Cuando una embarcación de recreo efectúe reparaciones en su casco, maquinaria y equipo, o sufra modificaciones o alteraciones en los mismos.","Después de haber sufrido varada, abordaje, serias averías por temporal u otro motivo, o averías en su maquinaria y demás elementos y componentes de la embarcación, que pueda afectar las condiciones de seguridad de navegación de la embarcación.","A requerimiento de un órgano judicial.","Cuando una embarcación vaya a cambiar de la lista séptima a la lista sexta."],"a":2,"e":"RD 1434/1999: los reconocimientos extraordinarios se hacen a requerimiento de un órgano judicial."},{"id":"2019oct-1-17","t":12,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Conforme a la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, para una embarcación de eslora L= 9 metros el peso del ancla será de:","o":["6 kg.","10 kg.","14 kg.","20 kg."],"a":2,"e":"Con la Orden FOM/1144/2003, el ancla de una embarcación de 9 m pesaba 14 kg.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el equipo de las embarcaciones de recreo lo regula hoy el RD 339/2021 (tema 12), que cambia muchas cifras. No te fíes de esta respuesta."}},{"id":"2019oct-1-18","t":12,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Conforme a la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, los combustibles utilizados a bordo de las embarcaciones de recreo se clasifican en los siguientes grupos:","o":["Grupo 1º de combustibles líquidos cuyo punto de inflamación sea inferior a 50ºC y Grupo 2º de combustibles líquidos cuyo punto de inflamación sea igual o superior a 50ºC.","Grupo 1º de combustibles líquidos cuyo punto de inflamación sea inferior a 65ºC y Grupo 2º de combustibles líquidos cuyo punto de inflamación sea igual o superior a 65ºC.","Grupo 1º de combustibles líquidos cuyo punto de inflamación sea inferior a 55ºC y Grupo 2º de combustibles líquidos cuyo punto de inflamación sea igual o superior a 55ºC.","Grupo 1º de combustibles líquidos cuyo punto de inflamación sea inferior a 45ºC y Grupo 2º de combustibles líquidos cuyo punto de inflamación sea igual o superior a 45ºC."],"a":2,"e":"Con la Orden FOM/1144/2003, el punto de inflamación que separaba los grupos de combustible era 55 ºC.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el equipo de las embarcaciones de recreo lo regula hoy el RD 339/2021 (tema 12), que cambia muchas cifras. No te fíes de esta respuesta."}},{"id":"2019oct-1-19","t":13,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"En virtud del Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, señale de las siguientes cuál se queda fuera de su ámbito de aplicación:","o":["Las embarcaciones de recreo y las embarcaciones de recreo semiacabadas.","Los motores de propulsión instalados fuera o dentro de embarcaciones en los que se realice una modificación importante del motor.","Las embarcaciones que sean objeto de cualquier tipo de modificación.","Las motos náuticas y las motos náuticas semiacabadas."],"a":2,"e":"RD 98/2016: no basta cualquier modificación para quedar dentro de su ámbito; las embarcaciones y motos náuticas (incluidas las semiacabadas) y los motores modificados sí entran."},{"id":"2019oct-1-20","t":14,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Según el Convenio internacional sobre búsqueda y salvamento marítimo de 1979, cuál de las siguientes fases de emergencia NO se encuentra dentro de las que distinguirán, los centros coordinadores o subcentros de salvamento:","o":["Fase de alerta.","Fase de incertidumbre.","Fase de socorro.","Fase de alarma."],"a":3,"e":"Convenio SAR: las fases de emergencia son incertidumbre, alerta y socorro; no hay «fase de alarma»."},{"id":"2019oct-1-21","t":14,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Según se establece en el Real Decreto Legislativo 2/2011, por el que se aprueba el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, el órgano de gestión de la Sociedad de Salvamento y Seguridad Marítima es:","o":["El Consejo de Administración.","El Director de la Sociedad.","El Presidente.","El Director General de la Marina Mercante."],"a":1,"e":"TRLPEMM: el órgano de gestión de SASEMAR es el Director de la Sociedad."},{"id":"2019oct-1-22","t":15,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Según establece la Ley 14/2014, de Navegación Marítima, deberán obligatoriamente inscribirse en la Sección de Buques del Registro de Bienes Muebles:","o":["Los buques, embarcaciones y artefactos de titularidad pública.","Todos los buques, embarcaciones y artefactos navales abanderados en España.","Los buques y embarcaciones de recreo o deportivos.","Los buques en construcción."],"a":1,"e":"Ley de Navegación Marítima: se inscriben obligatoriamente todos los buques, embarcaciones y artefactos navales abanderados en España."},{"id":"2019oct-1-23","t":15,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Según establece la Ley 14/2014 de Navegación Marítima, los privilegios marítimos gravan el buque, embarcaciones y artefactos navales:","o":["Sin necesidad de publicidad registral.","Requiriéndose publicidad registral.","No gozan de preferencia sobre las hipotecas y demás cargas y gravámenes inscritos.","Salvo que cambien de propiedad, matrícula o pabellón."],"a":0,"e":"Ley de Navegación Marítima: los privilegios marítimos gravan el buque sin necesidad de publicidad registral."},{"id":"2019oct-1-24","t":16,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Respecto a la capacidad para otorgar testamento marítimo, pueden hacerlo:","o":["Las personas jurídicas.","Los menores de catorce años de uno y otro sexo.","El que habitual o accidentalmente no se hallare en su cabal juicio.","Los extranjeros y los menores emancipados."],"a":3,"e":"Código Civil: pueden otorgar testamento marítimo los extranjeros y los menores emancipados; no las personas jurídicas ni los menores de 14 años."},{"id":"2019oct-1-25","t":17,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Un buque podrá salir del puerto de escala sin entregar los desechos generados por éste en una instalación portuaria receptora autorizada, si:","o":["Dicho buque tiene un certificado de exención emitido por la Autoridad Portuaria del citado puerto.","Dicho buque tiene un certificado de exención emitido por Puertos del Estado.","Ha sido expresamente autorizado para ello por la Autoridad Portuaria del citado puerto.","Ha sido expresamente autorizado para ello por la Capitanía Marítima del citado puerto."],"a":3,"e":"Con el RD 1381/2002, el buque podía salir sin entregar los desechos si lo autorizaba expresamente la Capitanía Marítima.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2019oct-1-26","t":17,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"El Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, define los “Desechos generados por los buques” como:","o":["Todos los desechos, incluidas las aguas residuales y los residuos distintos de los del cargamento, producidos durante el servicio del buque y que estén regulados por los anexos I, IV, V y VI del Convenio MARPOL 73/78, así como los desechos relacionados con el cargamento según se definen en las directrices para la aplicación del anexo V del citado convenio.","Todos los desechos, incluidas las aguas residuales y los residuos distintos de los del cargamento, producidos durante el servicio del buque y que estén regulados por los anexos I, II, IV, V y VI del Convenio MARPOL 73/78, así como los desechos relacionados con el cargamento según se definen en las directrices para la aplicación del anexo V del citado convenio.","Todos los desechos, incluidas las aguas residuales y los residuos distintos de los del cargamento, producidos durante el servicio del buque y que estén regulados por los anexos I, III, V y VI del Convenio MARPOL 73/78, así como los desechos relacionados con el cargamento según se definen en las directrices para la aplicación del anexo V del citado convenio.","Todos los desechos, incluidas las aguas residuales y los residuos distintos de los del cargamento, producidos durante el servicio del buque y que estén regulados por los anexos I, IV, V y VI del Convenio MARPOL 73/78, salvo los desechos relacionados con el cargamento según se definen en las directrices para la aplicación del anexo V del citado convenio."],"a":0,"e":"Con el RD 1381/2002, los desechos generados por buques incluían los regulados por los anexos I, IV, V y VI de MARPOL y los relacionados con el cargamento.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2019oct-1-27","t":18,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"A los efectos del Anexo V del Convenio MARPOL, ¿cuáles son las zonas especiales?","o":["La zona del mar Mediterráneo, la zona del mar Báltico, la zona del mar Negro, la zona de los Golfos, la zona del mar del Norte, la zona del Antártico, el Ártico y el Mar de Aral y la región del Gran Caribe.","La zona del mar Mediterráneo, la zona del mar Báltico, la zona del mar Negro, la zona del mar Rojo, la zona de los Golfos, la zona del mar del Norte, la zona del Antártico y la región del Gran Caribe, incluidos el golfo de México y el mar Caribe.","La zona del mar Mediterráneo, la zona del Atlántico Sur, la zona del mar Báltico, la zona del mar Negro, la zona del mar Rojo, la zona de los Golfos, la zona del mar del Norte, la zona del Antártico y la región del Gran Caribe.","La zona del mar Mediterráneo, la zona del mar Báltico, la zona del mar Negro, la zona del mar Rojo, la zona de los Golfos, la zona del mar del Norte, la zona del Antártico y la región del Gran Caribe, sin incluir el golfo de México."],"a":1,"e":"MARPOL anexo V: zonas especiales son Mediterráneo, Báltico, mar Negro, mar Rojo, Golfos, mar del Norte, Antártico y Gran Caribe (incluidos golfo de México y mar Caribe)."},{"id":"2019oct-1-28","t":18,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"¿Cómo se denomina al Anexo VII del MARPOL?","o":["Reglas para prevenir la contaminación por las aguas sucias de los buques.","Reglas para prevenir la contaminación atmosférica ocasionada por los buques.","El MARPOL no tiene Anexo VII.","Reglas para prevenir la contaminación por sustancias perjudiciales transportadas por mar en bultos."],"a":2,"e":"MARPOL solo tiene seis anexos: no existe el anexo VII."},{"id":"2019oct-1-29","t":19,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Según el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, para un buque que navega entre el puerto de Mahón y el de Melilla, su equipamiento radioeléctrico mínimo debería ir de acuerdo a la siguiente zona marítima:","o":["A1.","A2.","A3.","A4."],"a":0,"e":"RD 1185/2006: según la plantilla oficial, entre Mahón y Melilla basta el equipamiento de la zona A1."},{"id":"2019oct-1-30","t":19,"src":"oficial","conv":"2019oct","convName":"Octubre 2019","q":"Según el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, los equipos NAVTEX que se instalen a partir del 1 de junio de 2007 deberán ser aptos para recibir emisiones sobre seguridad marítima en las frecuencias de 518 kHz, y:","o":["500 kHz.","495 kHz.","490 kHz.","485 kHz."],"a":2,"e":"RD 1185/2006: los NAVTEX instalados desde el 1-6-2007 reciben 518 kHz y 490 kHz."},{"id":"2019abr-1-01","t":1,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, constituyen infracciones graves:","o":["Ordenar o emprender la navegación sin que el buque reúna las debidas condiciones de navegabilidad haciendo peligrar su seguridad.","El incumplimiento de las disposiciones reglamentarias sobre la seguridad marítima que ocasione accidentes con daños para las personas.","El incumplimiento de la normativa o de las instrucciones que en materia de seguridad marítima o de contaminación se dicten por los órganos competentes.","La obstrucción al ejercicio de las funciones de policía que correspondan a la Autoridad Portuaria o Marítima."],"a":3,"e":"TRLPEMM: obstruir las funciones de policía de la Autoridad Portuaria o Marítima es infracción grave; las demás opciones son muy graves."},{"id":"2019abr-1-02","t":1,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, NO se considera Marina Mercante:","o":["La ordenación del tráfico y las comunicaciones marítimas.","La ordenación de la flota pesquera, en los ámbitos propios de la pesca y de la ordenación del sector pesquero, y la actividad inspectora en estos mismos ámbitos.","El salvamento marítimo, en los términos previstos en el artículo 264.","La garantía del cumplimiento de las obligaciones en materia de defensa nacional y protección civil en la mar."],"a":1,"e":"TRLPEMM: la ordenación de la flota pesquera y su inspección no se consideran Marina Mercante."},{"id":"2019abr-1-03","t":2,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según la Ley 14/2014, de Navegación Marítima, ¿está obligado el capitán de un buque a informar de fallos o deficiencias que adviertan en las señales marítimas?","o":["Sí, siempre a la Administración Marítima.","Únicamente en el caso de señalizaciones de peligro.","No es una obligación, pero sí una recomendación.","No."],"a":0,"e":"Ley de Navegación Marítima: el capitán debe informar siempre a la Administración Marítima de los fallos que advierta en las señales marítimas."},{"id":"2019abr-1-04","t":2,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según la Ley 14/2014, de Navegación Marítima, ¿a qué órgano corresponde la orden del cierre temporal de un puerto o terminal?","o":["Al Centro Coordinador de Salvamento Marítimo.","A la Capitanía Marítima.","A la Autoridad Portuaria.","A la Dirección General de la Marina Mercante."],"a":2,"e":"Ley de Navegación Marítima: el cierre temporal de un puerto o terminal lo ordena la Autoridad Portuaria."},{"id":"2019abr-1-05","t":3,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Real Decreto 953/2018, por el que se desarrolla la estructura orgánica básica del Ministerio de Fomento, la tramitación de expedientes sancionadores en la Dirección General de la Marina Mercante corresponde a la Subdirección General de:","o":["Coordinación y Gestión Administrativa.","Normativa Marítima y Cooperación Internacional.","Seguridad y Contaminación Marítima.","Régimen Sancionador y Disciplinario."],"a":1,"e":"Con el RD 953/2018, los expedientes sancionadores de la DGMM los tramitaba la Subdirección General de Normativa Marítima y Cooperación Internacional.","av":{"n":"derogada","x":"El RD 953/2018 (Ministerio de Fomento) está derogado: la estructura actual la fija el RD 253/2024 (tema 3). Comprueba qué Subdirección lleva hoy los sancionadores."}},{"id":"2019abr-1-06","t":4,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Conforme al Real Decreto 638/2007, por el que se regulan las Capitanías Marítimas y los Distritos Marítimos, en el caso de siniestros, accidentes y sucesos en las aguas de competencia de la Capitanía Marítima, el Capitán Marítimo:","o":["Dirigirá la comisión encargada de la investigación.","No podrá dirigir o participar en la investigación.","Lo comunicará a la Dirección General de la Marina Mercante.","Dirigirá y participará en la comisión encargada de la investigación."],"a":2,"e":"RD 638/2007: ante siniestros en sus aguas, el Capitán Marítimo lo comunica a la Dirección General de la Marina Mercante."},{"id":"2019abr-1-07","t":5,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Reglamento sobre Despacho de Buques, el Rol se canjeará por uno nuevo:","o":["Cuando el buque cambie de propietario.","Cuando el buque cambie de nombre.","Cuando el buque cambie de matrícula.","Cuando se altere de manera sustancial el calado del buque."],"a":3,"e":"Con el antiguo Reglamento de Despacho, el Rol se canjeaba cuando se alteraba sustancialmente el calado del buque.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 el despacho y el rol los regula el RD 186/2023 (tema 5): comprueba la respuesta en la norma nueva."}},{"id":"2019abr-1-08","t":5,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Reglamento sobre Despacho de Buques, se despacharán por tiempo los buques que realicen:","o":["Navegaciones en las que el buque regrese al puerto de origen dentro de las veinticuatro horas desde su salida de aquél, siempre que no haya realizado escalas en otros puertos.","Navegaciones en las que el buque regrese al puerto de origen dentro de las veinticuatro horas desde su salida de aquél, haya efectuado o no escalas en otros puertos.","Navegaciones en aguas marítimas entre las zonas de servicio de puertos próximos entre sí.","Cualquier navegación de cabotaje."],"a":1,"e":"Con el antiguo Reglamento de Despacho, se despachaban por tiempo las navegaciones con regreso al puerto de origen en 24 horas, con o sin escalas.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 el despacho y el rol los regula el RD 186/2023 (tema 5): comprueba la respuesta en la norma nueva."}},{"id":"2019abr-1-09","t":6,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Reglamento de inspección y certificación de buques civiles, los defectos descubiertos y las prácticas de reparación del buque y de sus equipos que afecten a la seguridad del buque deberán ser comunicados:","o":["En un plazo no superior a 48 horas al Capitán Marítimo del puerto.","Inmediatamente si el buque se encuentra navegando.","A la autoridad que corresponda, del primer puerto al que vaya a arribar y siempre con anterioridad a la arribada a dicho puerto si el buque se encuentra navegando.","Únicamente deben ser comunicadas las averías y accidentes de consideración."],"a":2,"e":"RD 1837/2000: navegando, los defectos que afecten a la seguridad se comunican a la autoridad del primer puerto de arribada, antes de llegar.","av":{"n":"fuera","x":"Del RD 1837/2000 el temario de 2026 solo pide algún artículo suelto (tema 6), y no está claro que este punto entre. La respuesta sigue siendo correcta."}},{"id":"2019abr-1-10","t":7,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar aplicable a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, en los actos colectivos náuticos, ¿cuál es el número máximo de personas a bordo en embarcaciones de recreo?","o":["12 personas.","El que figure autorizado en sus certificados.","El resultante de multiplicar la eslora total por la manga por 0,5.","El equivalente a los aros salvavidas de los que disponga el buque."],"a":1,"e":"RD 62/2008: en actos colectivos, las embarcaciones de recreo no pueden llevar más personas de las autorizadas en sus certificados."},{"id":"2019abr-1-11","t":7,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar aplicable a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, en las regatas de largo recorrido, ¿quién o quiénes establecen los criterios de seguridad aplicables a la regata?","o":["El capitán marítimo competente por razón del puerto de destino.","El capitán marítimo competente por razón del puerto de origen.","Los capitanes marítimos afectados por la derrota de la misma.","El Director General de la Marina Mercante en caso de que no haya consenso."],"a":1,"e":"RD 62/2008: en regatas de largo recorrido, los criterios de seguridad los fija el capitán marítimo del puerto de origen."},{"id":"2019abr-1-12","t":8,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, ¿qué número de identificación de la embarcación incluye el código del país del fabricante, el código del constructor, un número de serie único, el mes y el año de fabricación y el año del modelo?","o":["El número CIN.","El número NIB.","El número NIC.","El indicativo de inscripción."],"a":0,"e":"RD 1435/2010: ese número (país, constructor, serie, mes y año de fabricación y año del modelo) es el CIN."},{"id":"2019abr-1-13","t":8,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el régimen especial de las embarcaciones de recreo con marcado CE de eslora igual o inferior a 12 metros, dichas embarcaciones ¿hasta dónde podrán navegar?","o":["Solo podrán navegar en aguas jurisdiccionales españolas.","Solo podrán navegar en el mar territorial español y, en cualquier caso, no podrán sobrepasar las zonas de navegación a las que estén limitadas de acuerdo con su categoría de diseño.","Podrán navegar por aguas continentales exclusivamente.","Podrán navegar en las zonas de navegación a las que estén limitadas de acuerdo con su categoría de diseño sin sobrepasar las 24 millas marinas contadas desde la línea de base a partir de la cual se mide la anchura del mar territorial."],"a":1,"e":"Régimen especial de las embarcaciones de recreo con marcado CE de hasta 12 m: solo mar territorial español y sin superar las zonas de su categoría de diseño."},{"id":"2019abr-1-14","t":9,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"En caso de ser requerida por las autoridades competentes y no encontrarse a bordo la documentación acreditativa de la vigencia del seguro, ¿de cuántos días hábiles dispone el tomador para justificar dicha vigencia según el Reglamento del seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas?","o":["Ninguno, siempre ha de encontrarse a bordo.","2.","5.","7."],"a":2,"e":"RD 607/1999: si no se lleva a bordo el justificante del seguro, hay 5 días hábiles para acreditar su vigencia."},{"id":"2019abr-1-15","t":10,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según definición del Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, las embarcaciones de las escuelas designadas para las prácticas precisas para la obtención de los títulos de patrón de navegación básica y patrón de embarcaciones de recreo deberán ser embarcaciones de recreo con esloras mínimas de:","o":["6 metros.","4,5 metros.","11,5 metros.","10 metros."],"a":0,"e":"RD 875/2014: las embarcaciones de escuela para las prácticas de PNB y PER deben tener al menos 6 m de eslora."},{"id":"2019abr-1-16","t":10,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, las esloras de las embarcaciones con fines deportivos o de recreo están comprendidas entre:","o":["2,5 y 12 metros.","2,5 y 24 metros.","4,5 y 24 metros.","4,5 y 12 metros."],"a":1,"e":"RD 875/2014: las embarcaciones de recreo tienen entre 2,5 y 24 metros de eslora."},{"id":"2019abr-1-17","t":11,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Real Decreto 1434/1999, por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo, ¿quién deberá realizar la solicitud de realización de los reconocimientos periódicos?","o":["La entidad colaboradora de inspección.","El patrón de la embarcación.","La Capitanía Marítima.","El propietario."],"a":3,"e":"RD 1434/1999: los reconocimientos periódicos los solicita el propietario."},{"id":"2019abr-1-18","t":11,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Real Decreto 1434/1999, por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo, ¿cuál de las siguientes es una infracción grave?","o":["La utilización, dentro del puerto, de señales acústicas no autorizadas por el correspondiente reglamento.","La realización de reparaciones, carenas y recogidas susceptibles de causar contaminación en contravención de la normativa aplicable.","El incumplimiento de la normativa y de las instrucciones dictadas por la Autoridad competente en relación con las obligaciones de entrega de residuos generados por los buques y residuos de carga.","Las riñas y pendencias entre las personas embarcadas cuando afecten a la seguridad del buque o de la navegación."],"a":3,"e":"Según la plantilla oficial, las riñas y pendencias que afecten a la seguridad del buque o de la navegación son infracción grave."},{"id":"2019abr-1-19","t":12,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, ¿cuál de los siguientes elementos NO es obligatorio en zona 7?","o":["Bocina de niebla.","Código de señales.","Reflector de radar.","Espejo de señales."],"a":2,"e":"Con la Orden FOM/1144/2003, el reflector de radar no era obligatorio en zona 7.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el equipo de las embarcaciones de recreo lo regula hoy el RD 339/2021 (tema 12), que cambia muchas cifras. No te fíes de esta respuesta."}},{"id":"2019abr-1-20","t":12,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, las conducciones por las que se pueden verter las aguas sucias directamente al mar mientras permanezcan en zona portuaria podrán ser precintadas:","o":["Únicamente mediante autorización de la autoridad portuaria.","Únicamente mediante autorización de la autoridad marítima.","Únicamente mediante autorización de salvamento marítimo.","Mediante autorización de la autoridad marítima y/o portuaria."],"a":3,"e":"Con la Orden FOM/1144/2003, las conducciones de aguas sucias en puerto podían precintarse con autorización de la autoridad marítima y/o portuaria.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el equipo de las embarcaciones de recreo lo regula hoy el RD 339/2021 (tema 12), que cambia muchas cifras. No te fíes de esta respuesta."}},{"id":"2019abr-1-21","t":13,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"En virtud del Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, señale la respuesta INCORRECTA respecto al marcado CE:","o":["Se colocará antes de la introducción del producto en el mercado o de su puesta en servicio.","En el caso de motores de propulsión, el marcado CE podrá fijarse al casco de la embarcación haciendo referencia al mismo.","Se colocará de manera visible, legible e indeleble.","Irá seguido del número de identificación del organismo notificado cuando éste participe en la fase de control de la producción."],"a":1,"e":"RD 98/2016: es incorrecto que el marcado CE de un motor pueda ponerse en el casco haciendo referencia a él."},{"id":"2019abr-1-22","t":14,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"El Convenio Internacional sobre Salvamento Marítimo, 1989, establece lo siguiente respecto a su aplicación:","o":["Será aplicable a las plataformas fijas o flotantes, pero no a las unidades móviles de perforación mar adentro, cuando tales plataformas estén en estación y realizando operaciones de explotación de recursos minerales en los fondos marinos.","Será aplicable a las unidades móviles de perforación mar adentro pero no a las plataformas fijas o flotantes, cuando tales unidades estén realizando operaciones de exploración en los fondos marinos.","Será aplicable a las plataformas fijas o flotantes y a las unidades móviles de perforación mar adentro cuando tales plataformas o unidades estén en estación y realizando operaciones de exploración, explotación o producción de recursos minerales en los fondos marinos.","No será aplicable a las plataformas fijas o flotantes ni a las unidades móviles de perforación mar adentro cuando tales plataformas o unidades estén en estación y realizando operaciones de exploración, explotación o producción de recursos minerales en los fondos marinos."],"a":3,"e":"Convenio de Salvamento de 1989: no se aplica a plataformas ni a unidades de perforación en estación explorando o explotando recursos minerales."},{"id":"2019abr-1-23","t":15,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"De acuerdo con la Ley 14/2014 de Navegación Marítima y en relación a la nacionalidad de los buques, ¿con qué documento puede un buque adquirido en Croacia realizar un viaje hasta llegar a Cádiz bajo pabellón español?","o":["Sólo con el pasavante emitido por la Dirección General de la Marina Mercante de España.","Con la Patente de Navegación y provisionalmente podrá realizarse ese viaje por medio de pasavante por el tiempo necesario.","Con el correspondiente permiso del país de origen junto con un certificado de baja temporal.","Es suficiente con un contrato de compraventa en el que una de las partes sea nacional español."],"a":1,"e":"Ley de Navegación Marítima: se navega con la Patente de Navegación y, provisionalmente, con pasavante el tiempo necesario para llegar a puerto nacional."},{"id":"2019abr-1-24","t":15,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según la Ley 14/2014 de Navegación Marítima, con la finalidad de proporcionar seguridad a las relaciones jurídicas, las titularidades y gravámenes sobre los buques, embarcaciones y artefactos navales se inscribirán:","o":["En ningún sitio porque ya no es necesario.","En el Registro de Buques y de Empresas Navieras de las capitanías marítimas o distritos marítimos.","En el área del Registro Marítimo Central de la Dirección General de la Marina Mercante.","En la correspondiente sección del Registro de Bienes Muebles."],"a":3,"e":"Ley de Navegación Marítima: titularidades y gravámenes se inscriben en la sección correspondiente del Registro de Bienes Muebles."},{"id":"2019abr-1-25","t":16,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según lo dispuesto en el artículo 52 del Código Civil, podrá autorizar el matrimonio del que se halle en peligro de muerte:","o":["El Notario.","El Oficial o Jefe superior inmediato respecto de los militares acuartelados.","Respecto de los matrimonios que se celebren a bordo de nave o aeronave, el Capitán o Comandante de la misma.","El Capitán marítimo competente, respecto de los matrimonios que se celebren a bordo de buques fondeados."],"a":2,"e":"Código Civil art. 52: a bordo de nave o aeronave, puede autorizar el matrimonio en peligro de muerte el Capitán o Comandante."},{"id":"2019abr-1-26","t":17,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"Según el Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, ¿cada cuánto tiempo la entidad gestora del puerto aprobará un nuevo plan de recepción y manipulación de residuos?","o":["Cada tres años y, en todo caso, cuando se introduzcan cambios significativos que afecten al funcionamiento del servicio.","Anualmente y, en todo caso, cuando se introduzcan cambios significativos que afecten al funcionamiento del servicio.","Cada dos años y, en todo caso, cuando se introduzcan cambios significativos que afecten al funcionamiento del servicio.","Cada cinco años y, en todo caso, cuando se introduzcan cambios significativos que afecten al funcionamiento del servicio."],"a":0,"e":"Con el RD 1381/2002, la entidad gestora aprobaba un nuevo plan cada tres años o antes si había cambios significativos.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2019abr-1-27","t":17,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"De acuerdo a lo establecido en el Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, de los siguientes buques, ¿cuáles realizarán la notificación reducida antes de entrar en el puerto de destino?","o":["Todos los buques y embarcaciones de organismos públicos.","Los buques de guerra y las unidades navales auxiliares.","Todos los buques de pesca.","Los buques de pesca fresca y embarcaciones deportivas o de recreo autorizadas para un máximo de doce pasajeros."],"a":3,"e":"Con el RD 1381/2002, hacían notificación reducida los pesqueros de pesca fresca y las embarcaciones de recreo de hasta doce pasajeros.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2019abr-1-28","t":18,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"¿Cuál de las siguientes zonas está considerada como zona especial a efectos del Anexo V del Convenio MARPOL?","o":["La zona del Mar Báltico.","La zona del Mar Cantábrico.","No existen zonas especiales a efectos del Anexo V.","La zona del Mar de Arafura."],"a":0,"e":"MARPOL anexo V: el mar Báltico es zona especial; el Cantábrico no."},{"id":"2019abr-1-29","t":19,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"El Reglamento de radiocomunicaciones marítimas en los buques civiles españoles establece que el diario de servicio radioeléctrico será obligatorio para:","o":["Los buques de carga o de servicios de puerto que salen al mar (clase S) de 150 toneladas o más y para los buques de pasaje autorizados a realizar navegaciones superiores a 20 millas.","Los buques de carga o de servicios de puerto que salen al mar (clase T) de 150 toneladas o más y para los buques de pasaje autorizados a realizar navegaciones superiores a 20 millas.","Las embarcaciones de recreo autorizadas a realizar navegaciones superiores a 20 millas.","Los buques de carga o de servicios de puerto que salen al mar (clase S) de 150 toneladas o más y para las embarcaciones de recreo autorizadas a realizar navegaciones superiores a 20 millas."],"a":1,"e":"Según la plantilla oficial, el diario del servicio radioeléctrico es obligatorio para buques de carga o de servicios de puerto clase T de 150 t o más y para buques de pasaje de más de 20 millas."},{"id":"2019abr-1-30","t":19,"src":"oficial","conv":"2019abr","convName":"Abril 2019","q":"El Reglamento de radiocomunicaciones marítimas en los buques civiles españoles establece que los buques y embarcaciones de recreo autorizados a navegar por la Zona 2 deben estar provistos de, entre otros, el siguiente equipamiento radioeléctrico:","o":["Un receptor NAVTEX.","Una radiobaliza personal de 121,5 MHz, de activación automática y manual.","Una instalación radioeléctrica de VHF.","Un respondedor de radar de 3 GHz."],"a":2,"e":"RD 1185/2006: en Zona 2 la embarcación de recreo lleva una instalación de VHF (hoy, con LSD)."},{"id":"2018oct-1-01","t":1,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, ¿cuál de las siguientes infracciones está considerada como muy grave?","o":["El vertido no autorizado desde buques o artefactos flotantes de productos sólidos, líquidos o gaseosos en la Zona I, interior de las aguas portuarias.","El incumplimiento de las disposiciones vigentes sobre elementos, instalaciones y documentos a bordo para la prevención y el control de las operaciones de evacuación de desechos u otras sustancias.","Navegar los buques sin llevar el nombre, número OMI y folio de inscripción reglamentaria cuando proceda.","Las riñas y pendencias entre las personas embarcadas cuando afecten a la seguridad del buque o de la navegación."],"a":0,"e":"TRLPEMM: el vertido no autorizado desde buques en la Zona I de las aguas portuarias es infracción muy grave."},{"id":"2018oct-1-02","t":1,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, de los siguientes buques o embarcaciones, ¿cuál NO está considerado como buque civil?","o":["Un petrolero de 150.000 GT.","Una patrullera de 12 metros del Servicio de Vigilancia Aduanera.","Un arrastrero de 1.500 GT.","Un yate de recreo de 26 metros."],"a":1,"e":"TRLPEMM: los buques al servicio de la Administración en misiones no comerciales, como la patrullera de Vigilancia Aduanera, no se consideran buques civiles."},{"id":"2018oct-1-03","t":2,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según la Ley 14/2014, de Navegación Marítima, ¿quién concede la autorización para entrar en puerto?","o":["El Centro Coordinador de Salvamento Marítimo.","La administración portuaria.","La administración marítima.","La administración tributaria."],"a":1,"e":"Ley de Navegación Marítima: la autorización para entrar en puerto la concede la administración portuaria."},{"id":"2018oct-1-04","t":2,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según la Ley 14/2014, de Navegación Marítima, es obligatorio llevar izado el pabellón de bandera del buque en lugar bien visible, cuando éste navegue:","o":["En aguas interiores, independientemente del estado del pabellón.","En aguas interiores, únicamente para los buques de pabellón extranjero.","En aguas interiores se puede enarbolar la bandera española o la de la comunidad autónoma.","En aguas interiores no es necesario izar la bandera."],"a":0,"e":"Ley de Navegación Marítima: en aguas interiores es obligatorio llevar izado el pabellón, sea cual sea."},{"id":"2018oct-1-05","t":3,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, diga cuál de las siguientes afirmaciones respecto a la Comisión Permanente de Investigación de Accidentes e Incidentes Marítimos (CIAIM) es correcta:","o":["Es un órgano colegiado adscrito al Ministerio de la Presidencia.","Está compuesto por un Director General, un Secretario y varios vocales.","Sus investigaciones perseguirán la determinación de responsabilidad y la atribución de la culpa.","Sus investigadores tendrán la condición de autoridad pública."],"a":3,"e":"TRLPEMM: los investigadores de la CIAIM tienen la condición de autoridad pública; la Comisión no busca culpables."},{"id":"2018oct-1-06","t":1,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, en el caso de que una contaminación ocurra en la zona de servicio de un puerto, ¿a quién le corresponde la competencia para la lucha contra la contaminación?","o":["Al Capitán Marítimo.","Al Director General de la Marina Mercante.","A la Autoridad Portuaria.","Al Ministro de Fomento."],"a":2,"e":"TRLPEMM: la lucha contra la contaminación en la zona de servicio de un puerto corresponde a la Autoridad Portuaria."},{"id":"2018oct-1-07","t":5,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Reglamento sobre Despacho de Buques, el despacho por tiempo:","o":["Se autorizará en navegaciones en las que el buque regrese a puerto dentro de las 24 horas desde su salida de aquél, siempre que no haya efectuado escalas en otros puertos.","Si durante el periodo de validez del despacho por tiempo se produjeran enroles o desenroles, el Capitán estará obligado a comunicar tal hecho a la Capitanía de su puerto base o del puerto donde haya ocurrido la incidencia en los cinco primeros días hábiles.","Se autorizará en navegaciones de línea regular de cabotaje, así como los de cabotaje y cabotaje consecutivo, que no siendo línea regular se efectúen con itinerarios repetitivos.","Se autorizarán por un máximo de hasta dos años para los buques que realicen navegaciones en aguas marítimas de la zona de servicio de un determinado puerto."],"a":2,"e":"Con el antiguo Reglamento de Despacho, el despacho por tiempo se autorizaba en líneas regulares de cabotaje y en cabotajes con itinerarios repetitivos.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 el despacho y el rol los regula el RD 186/2023 (tema 5): comprueba la respuesta en la norma nueva."}},{"id":"2018oct-1-08","t":5,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Reglamento sobre Despacho de Buques, el enrole de personal ajeno a la tripulación y al pasaje será autorizado por:","o":["El Capitán del buque.","El Capitán Marítimo.","La Autoridad Portuaria.","El consignatario del buque."],"a":0,"e":"Con el antiguo Reglamento de Despacho, el enrole de personal ajeno a la tripulación y al pasaje lo autorizaba el Capitán del buque.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 el despacho y el rol los regula el RD 186/2023 (tema 5): comprueba la respuesta en la norma nueva."}},{"id":"2018oct-1-09","t":6,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Real Decreto 210/2004, por el que se establece un sistema de seguimiento y de información sobre el tráfico marítimo, NO se considera mercancía contaminante:","o":["Las sustancias nocivas líquidas, según se definen en el anexo II del Convenio MARPOL.","Las basuras según la definición del anexo V del Convenio MARPOL.","Los hidrocarburos según la definición del anexo I del Convenio MARPOL.","Las sustancias perjudiciales según se definen en el anexo III del Convenio MARPOL."],"a":1,"e":"RD 210/2004: las basuras del anexo V de MARPOL no se consideran mercancía contaminante."},{"id":"2018oct-1-10","t":7,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar aplicable a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, en los actos colectivos náuticos, ¿qué altura mínima deberán tener las amuradas o barandillas en cubierta de las embarcaciones participantes?","o":["90 cm.","120 cm.","60 cm.","100 cm."],"a":0,"e":"RD 62/2008: en los actos náuticos colectivos, las amuradas o barandillas deben tener al menos 90 cm."},{"id":"2018oct-1-11","t":7,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar aplicable a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, ¿qué normas son de aplicación a las regatas internacionales organizadas, individual o conjuntamente, por instituciones internacionales o nacionales de reconocido prestigio, que partan de un puerto español hacia aguas extranjeras?","o":["Las establecidas por el Real Decreto 60/2008, de 25 de enero.","Las establecidas por su propia organización.","Las establecidas por la Federación Internacional de Vela.","Las establecidas únicamente por el Capitán Marítimo."],"a":1,"e":"RD 62/2008: a las regatas internacionales de prestigio que salen de puerto español hacia aguas extranjeras se les aplican las normas de su propia organización."},{"id":"2018oct-1-12","t":8,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, ¿en qué documento se anotarán los actos registrables relacionados con la embarcación y demás vicisitudes que le afecten a lo largo de su vida útil, cerrándose con la anotación de la baja correspondiente?","o":["En los correspondientes certificados.","En la patente de navegación.","En la hoja de asiento.","En el rol del buque."],"a":2,"e":"RD 1435/2010: los actos registrables y vicisitudes de la embarcación se anotan en la hoja de asiento, que se cierra con la baja."},{"id":"2018oct-1-13","t":8,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Real Decreto 685/2010, por el que se regula el otorgamiento de permiso temporal de navegación para determinadas embarcaciones de recreo, en relación a la asignación de señales identificativas, ¿cuál de las opciones es FALSA?","o":["En el certificado se asignará a las embarcaciones y buques una señal alfanumérica que coincidirá con el número de identificación (CIN).","La señal identificativa deberá llevarse adherida o pintada en el casco, con pintura o material indeleble.","La señal identificativa será en caracteres oscuros sobre fondo claro o en caracteres claros sobre fondo oscuro en función del color de la pintura del buque.","La señal identificativa sólo se efectuará mediante grabación en hueco o bien mediante cualquier otro método equivalente."],"a":3,"e":"RD 685/2010: es falso que la señal solo pueda hacerse grabada en hueco; basta llevarla adherida o pintada con material indeleble."},{"id":"2018oct-1-14","t":9,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Reglamento del seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas, NO se considera embarcación de recreo o deportiva:","o":["Los objetos flotantes destinados a la navegación de recreo y deportiva propulsados a motor.","Los objetos flotantes carentes de motor independientemente de su eslora.","Las motos náuticas.","Los objetos flotantes carentes de motor y eslora superior a seis metros."],"a":1,"e":"RD 607/1999: los objetos flotantes sin motor de hasta 6 m quedan fuera; por eso no es cierto que lo estén «independientemente de su eslora»."},{"id":"2018oct-1-15","t":10,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"En aplicación del Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, la eslora mínima de las embarcaciones de recreo para las prácticas de obtención del título de patrón de yate es de:","o":["6 metros.","12 metros.","11,5 metros.","8 metros."],"a":2,"e":"RD 875/2014: según la plantilla oficial, las prácticas de patrón de yate se hacen en embarcaciones de al menos 11,5 m de eslora."},{"id":"2018oct-1-16","t":10,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"En virtud del Real Decreto 973/2009 por el que se regulan las titulaciones profesionales de la marina mercante, el límite de alcohol en sangre permitido a bordo NO será superior a:","o":["0,25 g/l de alcohol en el aliento.","0,05 % de nivel de alcohol en sangre.","0,025 mg/l de alcohol en el aliento.","0,07 % de nivel de alcohol en sangre."],"a":1,"e":"El límite es 0,05 % de alcohol en sangre (o 0,25 mg/l en aire espirado).","av":{"n":"ojo","x":"El RD 973/2009 está derogado; hoy la regla está en el art. 86.3 del RD 269/2022 (tema 10), con los mismos límites. La respuesta sigue valiendo."}},{"id":"2018oct-1-17","t":11,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Real Decreto 1434/1999, por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo, ¿cuál es el número máximo de pasajeros que puede transportar una embarcación de recreo para que sea considerada como tal?","o":["6.","10.","12.","16."],"a":2,"e":"RD 1434/1999: una embarcación de recreo no puede transportar más de 12 pasajeros."},{"id":"2018oct-1-18","t":11,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Real Decreto 1434/1999 por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo, ¿qué embarcaciones estarán obligadas a realizar un reconocimiento intermedio en seco?","o":["Embarcaciones registradas en la lista 6.ª de eslora mayor de 6 metros, las embarcaciones de la lista 7.ª de eslora mayor de 15 metros y las embarcaciones de la lista 7.ª con casco de madera de eslora mayor de 6 metros.","Embarcaciones registradas en la lista 6.ª de eslora mayor o igual a 6 metros, las embarcaciones de la lista 7.ª de eslora mayor o igual a 14 metros y las embarcaciones de la lista 7.ª con casco de madera de eslora mayor de 6 metros.","Embarcaciones registradas en la lista 6.ª de eslora mayor o igual a 6 metros, las embarcaciones de la lista 7.ª de eslora mayor o igual a 15 metros y las embarcaciones de la lista 7.ª con casco de madera de eslora mayor o igual a 6 metros.","Embarcaciones registradas en la lista 6.ª de eslora mayor de 6 metros, las embarcaciones de la lista 7.ª de eslora mayor de 14 metros y las embarcaciones de la lista 7.ª con casco de madera de eslora mayor de 6 metros."],"a":2,"e":"RD 1434/1999: hacen reconocimiento intermedio en seco las de lista 6.ª de 6 m o más, las de lista 7.ª de 15 m o más y las de lista 7.ª de madera de 6 m o más."},{"id":"2018oct-1-19","t":12,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, ¿cuál de las siguientes afirmaciones respecto a la descarga de aguas sucias NO es correcta?","o":["No se permite en aguas portuarias.","Se puede realizar a más de 12 millas si no han sido previamente desmenuzadas ni desinfectadas.","Se puede realizar si la distancia es superior a 3 millas de la tierra más próxima y éstas han sido previamente desmenuzadas y desinfectadas.","Se permite en las bahías si dichas descargas se realizan con tratamiento y no producen sólidos flotantes visibles ni ocasionan decoloración en las aguas circundantes."],"a":3,"e":"Con la Orden FOM/1144/2003, no era cierto que se pudiera descargar en las bahías con tratamiento.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el equipo de las embarcaciones de recreo lo regula hoy el RD 339/2021 (tema 12), que cambia muchas cifras. No te fíes de esta respuesta."}},{"id":"2018oct-1-20","t":12,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, antes de arrancar aquellos motores interiores con arranque eléctrico se deberá ventilar el compartimento motor:","o":["Durante al menos 4 minutos independientemente del combustible utilizado.","Durante al menos 4 minutos si el combustible tiene un punto de inflamación \u003c 55 ºC.","Durante al menos 4 minutos si el combustible tiene un punto de inflamación ≥ 55 ºC.","No es necesaria la ventilación si se dispone de un ventilador eléctrico antideflagrante."],"a":1,"e":"Con la Orden FOM/1144/2003, con combustible de punto de inflamación inferior a 55 ºC se ventilaba el compartimento motor al menos 4 minutos.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el equipo de las embarcaciones de recreo lo regula hoy el RD 339/2021 (tema 12), que cambia muchas cifras. No te fíes de esta respuesta."}},{"id":"2018oct-1-21","t":13,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"En virtud del Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, señale su ámbito de aplicación:","o":["Las tablas de surf, incluidas las de motor.","Los motores de propulsión instalados o destinados específicamente a ser instalados fuera o dentro de embarcaciones de recreo o motos náuticas.","Las embarcaciones deportivas destinadas exclusivamente a regatas, incluidas las de remo y las de entrenamiento a remo, denominadas así por el fabricante.","Las embarcaciones y vehículos anfibios."],"a":1,"e":"RD 98/2016: se aplica a los motores de propulsión instalados o destinados a instalarse en embarcaciones de recreo o motos náuticas."},{"id":"2018oct-1-22","t":14,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, la Sociedad de Salvamento y Seguridad Marítima es:","o":["Una entidad pública empresarial adscrita al Ministerio del Interior.","Una entidad pública empresarial adscrita al Ministerio de Fomento.","Una entidad privada adscrita al Ministerio de Fomento, dotada de personalidad jurídica, patrimonio propio y plena capacidad de obrar.","Una entidad perteneciente a la Dirección General de la Marina Mercante y dependiente de la Subdirección General de Seguridad, Contaminación e Inspección Marítima."],"a":1,"e":"TRLPEMM: SASEMAR es una entidad pública empresarial adscrita al Ministerio (entonces de Fomento).","av":{"n":"ojo","x":"Hoy SASEMAR está adscrita al Ministerio de Transportes y Movilidad Sostenible, no al «de Fomento». Sigue siendo entidad pública empresarial, así que la opción correcta es la misma."}},{"id":"2018oct-1-23","t":15,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"De acuerdo con la Ley 14/2014 de Navegación Marítima, ¿qué documento acredita la nacionalidad española del buque y lo autoriza para navegar por los mares enarbolando el pabellón nacional?","o":["La Patente de Navegación.","El rol del buque.","El distintivo de llamada.","El certificado de navegabilidad."],"a":0,"e":"Ley de Navegación Marítima: la Patente de Navegación acredita la nacionalidad española y autoriza a navegar con el pabellón nacional."},{"id":"2018oct-1-24","t":15,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según la Ley 14/2014 de Navegación Marítima, además de los datos relativos a la tripulación, ¿cuál de las siguientes es otra finalidad que tiene el Rol de Despacho y Dotación?","o":["Registrar las anotaciones por singladuras y todos los acontecimientos relevantes ocurridos. En particular, se toma nota de los actos del capitán cuando actúe en el ejercicio de funciones públicas.","Registrar las anotaciones de los pilotos de guardia sobre las vicisitudes náuticas y meteorológicas que se produzcan durante la navegación.","Registrar los certificados del buque y sus fechas de caducidad.","Acreditar el viaje que está realizando el buque, así como el hecho de que lo ha emprendido previo cumplimiento de todos los requisitos legales y reglamentarios para su despacho."],"a":3,"e":"Ley de Navegación Marítima: el Rol de Despacho y Dotación acredita además el viaje y que se emprendió tras cumplir los requisitos de despacho."},{"id":"2018oct-1-25","t":16,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según lo dispuesto en el artículo 676 del Código Civil, el testamento puede ser común o especial. El común puede ser:","o":["Ológrafo, abierto o cerrado.","Militar.","Marítimo.","Hecho en país extranjero."],"a":0,"e":"Código Civil art. 676: el testamento común puede ser ológrafo, abierto o cerrado."},{"id":"2018oct-1-26","t":17,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según el Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, ¿a qué instalaciones les expide la Dirección General de la Marina Mercante un certificado de aptitud?","o":["A aquellas instalaciones portuarias receptoras que utilicen medios flotantes.","A todas las instalaciones portuarias receptoras independientemente del tipo de medios utilizados.","A todas las instalaciones portuarias receptoras localizadas fuera del recinto portuario.","A todas las instalaciones portuarias receptoras cuya plantilla cuenta con más de 12 trabajadores."],"a":0,"e":"Con el RD 1381/2002, la DGMM expedía certificado de aptitud a las instalaciones receptoras que usaban medios flotantes.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2018oct-1-27","t":17,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"De acuerdo a lo establecido en el Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, ¿qué vigencia tiene el certificado de exención total o parcial de la entrega de los residuos?","o":["No existe ningún tipo de exención.","La vigencia depende de las características del buque.","La vigencia es anual.","La vigencia será de 18 meses, independientemente de las características del buque."],"a":2,"e":"Con el RD 1381/2002, el certificado de exención tenía vigencia anual.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2018oct-1-28","t":18,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"Según se define en el Anexo IV del MARPOL, NO se consideran «aguas sucias»:","o":["Desagües procedentes de espacios en los que se transportan animales vivos.","Desagües y otros residuos, procedentes de cualquier tipo de inodoros y urinarios.","Desagües procedentes de las bodegas o tanques de carga.","Desagües procedentes de lavabos, lavaderos y conductos de salida situados en cámaras de servicios médicos."],"a":2,"e":"MARPOL anexo IV: los desagües de bodegas o tanques de carga no son aguas sucias."},{"id":"2018oct-1-29","t":19,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"El Reglamento de radiocomunicaciones marítimas en los buques civiles españoles define la zona de navegación 3 como:","o":["La zona comprendida entre la costa y la línea paralela a la misma trazada a 60 millas.","La zona comprendida entre la costa y la línea paralela a la misma trazada a 25 millas.","La zona comprendida entre la costa y la línea paralela a la misma trazada a 30 millas.","La zona comprendida en aguas costeras protegidas, puertos, radas, bahías abrigadas y aguas protegidas en general."],"a":1,"e":"RD 1185/2006: la zona de navegación 3 llega hasta 25 millas de la costa."},{"id":"2018oct-1-30","t":19,"src":"oficial","conv":"2018oct","convName":"Octubre 2018","q":"El Reglamento de radiocomunicaciones marítimas en los buques civiles españoles establece que los buques y embarcaciones de recreo autorizados a navegar por la Zona 1 deben llevar, entre otros:","o":["Un Sistema de Identificación Automática (SIA).","Un equipo radiotelefónico bidireccional portátil de MF/HF.","Un respondedor de radar de 3 GHz.","Un respondedor de radar de 9 GHz."],"a":3,"e":"Según la plantilla oficial de 2018, en Zona 1 la embarcación de recreo llevaba, entre otros, un respondedor de radar de 9 GHz.","av":{"n":"ojo","x":"El equipo radio de recreo por zonas se modificó en 2022 (RD 587/2022), pero el art. 56 vigente sigue exigiendo en Zona 1 un respondedor de radar. La respuesta sigue valiendo."}},{"id":"2018abr-1-01","t":1,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, se entiende por empresa naviera a la persona física o jurídica que se dedique a la explotación de:","o":["Buques civiles.","Buques mercantes.","Buques de pesca.","Cualquier buque no afecto al servicio de la seguridad pública o de la vigilancia y represión del contrabando."],"a":1,"e":"TRLPEMM: empresa naviera es quien explota buques mercantes."},{"id":"2018abr-1-02","t":1,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, la declaración de abandono de un buque será formulada por:","o":["El Presidente de Puertos del Estado.","El Ministro de Fomento, a propuesta de Puertos del Estado y del Director General de la Marina Mercante.","El Director General de la Marina Mercante.","El Consejo de Administración de la Autoridad Portuaria."],"a":3,"e":"TRLPEMM: la declaración de abandono la formula el Consejo de Administración de la Autoridad Portuaria."},{"id":"2018abr-1-03","t":2,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según la Ley 14/2014, de Navegación Marítima, el capitán de un buque nacional debe comunicar, de inmediato y por el método más rápido posible, un accidente de navegación ocurrido al buque o causado por él a:","o":["El Centro Coordinador de Salvamento Marítimo.","Cruz Roja.","La Autoridad Portuaria.","La Capitanía Marítima."],"a":3,"e":"Ley de Navegación Marítima: el capitán comunica de inmediato el accidente de navegación a la Capitanía Marítima."},{"id":"2018abr-1-04","t":2,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según la Ley 14/2014, de Navegación Marítima, ¿quién es el responsable de la elaboración y publicación de las cartas náuticas?","o":["La Dirección General de la Marina Mercante.","El Servicio de Publicaciones del Ministerio de Fomento.","Puertos del Estado.","El Ministerio de Defensa."],"a":3,"e":"Ley de Navegación Marítima: las cartas náuticas las elabora y publica el Ministerio de Defensa."},{"id":"2018abr-1-05","t":3,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Real Decreto 362/2017, por el que se desarrolla la estructura orgánica básica del Ministerio de Fomento, la Dirección General de la Marina Mercante depende de:","o":["La Subsecretaría.","La Secretaría de Seguridad Marítima.","La Secretaría General de Transporte.","La Autoridad Portuaria."],"a":2,"e":"Con el RD 362/2017, la DGMM dependía de la Secretaría General de Transporte.","av":{"n":"derogada","x":"El RD 362/2017 (Ministerio de Fomento) está derogado: la estructura actual la fija el RD 253/2024 (tema 3), con otros nombres de órganos. Comprueba de quién depende hoy la DGMM."}},{"id":"2018abr-1-06","t":4,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Conforme al Real Decreto 638/2007, por el que se regulan las Capitanías Marítimas y los Distritos Marítimos, el Capitán Marítimo, en el caso de producirse vertidos contaminantes procedentes de buques, plataformas fijas u otras instalaciones marítimas en las aguas comprendidas en el ámbito de la competencia de la Capitanía:","o":["Avisará al naviero o propietario de la embarcación.","Lo comunicará al Presidente de la Autonomía.","Lo comunicará a Salvamento Marítimo.","Ejercerá la prevención y control."],"a":3,"e":"RD 638/2007: ante vertidos contaminantes en su ámbito, el Capitán Marítimo ejerce la prevención y el control."},{"id":"2018abr-1-07","t":5,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Reglamento sobre Despacho de Buques, diga cuál de las siguientes afirmaciones es FALSA:","o":["Los documentos o datos exigibles o que puedan ser exigidos para el despacho podrán ser aportados mediante técnicas de tratamiento o de intercambio electrónico de datos, si fuesen susceptibles de ello, a condición de que contengan la información requerida.","El Rol se canjeará por uno nuevo cuando el buque cambie de matrícula o Lista.","Los buques mercantes y de pesca nacionales se considerarán despachados si, tras la aportación de la documentación preceptiva para el despacho, no existe prohibición expresa de la correspondiente Capitanía Marítima antes de la salida prevista, siempre que el buque no salga a puerto extranjero.","En puertos extranjeros, el Capitán del buque podrá efectuar el autodespacho."],"a":1,"e":"Con el antiguo Reglamento de Despacho, era falso que el Rol se canjease al cambiar de matrícula o Lista.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 el despacho, el rol y sus infracciones los regula el RD 186/2023 (tema 5): comprueba la respuesta en la norma nueva."}},{"id":"2018abr-1-08","t":5,"src":"oficial","conv":"2018abr","convN
