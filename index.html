o es:","o":["Una unidad de alerta y rescate.","Un medio de búsqueda y salvamento.","Una unidad de búsqueda y salvamento.","Una unidad coordinadora de salvamento."],"a":2,"e":"Convenio SAR: la unidad con personal capacitado y equipo para operar con rapidez es una «unidad de búsqueda y salvamento»."},{"id":"2022abr-1-22","t":15,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según establece la Ley 14/2014, de Navegación Marítima, el libro que llevarán los buques donde vayan enrolados dos o más oficiales de puente y en el que los pilotos de guardia registrarán cuantas vicisitudes náuticas y meteorológicas se produzcan durante la navegación, recibe el nombre de:","o":["Diario de Navegación.","Cuaderno de Maniobra.","Cuaderno de Bitácora.","Diario de Derrota."],"a":2,"e":"Ley de Navegación Marítima: el libro donde los pilotos de guardia anotan las vicisitudes náuticas y meteorológicas es el Cuaderno de Bitácora."},{"id":"2022abr-1-23","t":15,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Tal y como establece el artículo 94 de la Ley 14/2014, de Navegación Marítima, los buques nacionales arrendados por un residente fuera de España podrán ser autorizados para abanderarse temporalmente en el Estado de residencia del arrendatario:","o":["Antes de formalizar el contrato de arrendamiento.","En tanto dure el contrato de arrendamiento.","Si el arrendatario adopta la nacionalidad española.","Siempre que el Estado de residencia del arrendatario pertenezca al espacio económico europeo."],"a":1,"e":"Ley de Navegación Marítima art. 94: el abanderamiento temporal en el Estado del arrendatario se autoriza mientras dure el arrendamiento."},{"id":"2022abr-1-24","t":16,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según el artículo 194 del Código Civil, procederá la declaración de fallecimiento de los que se encuentren a bordo de una nave que se presuma naufragada o desaparecida por inmersión en el mar, por no llegar a su destino, o si careciendo de punto fijo de arribo, no retornase y haya evidencias racionales de ausencia de supervivientes, luego que en cualquiera de los casos hayan transcurrido:","o":["Ocho días contados desde las últimas noticias recibidas.","Tres meses contados desde las últimas noticias recibidas.","Un mes contado desde las últimas noticias recibidas.","Seis meses contados desde las últimas noticias recibidas."],"a":2,"e":"Código Civil art. 194: en nave presuntamente naufragada o desaparecida, la declaración de fallecimiento procede al mes de las últimas noticias."},{"id":"2022abr-1-25","t":17,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según el Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, ¿a qué puertos españoles se aplica dicho real decreto?","o":["Únicamente a los puertos de interés general.","Únicamente a los puertos autonómicos.","Exclusivamente a los puertos de interés especial y autonómicos.","A todos los puertos españoles donde hagan escala los buques incluidos en el ámbito de aplicación."],"a":3,"e":"Con el RD 1381/2002, la norma se aplicaba a todos los puertos españoles donde hicieran escala los buques de su ámbito.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2022abr-1-26","t":17,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según el Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, ¿quién aprueba y aplica el plan de recepción y manipulación de desechos en un puerto?","o":["La Autoridad Portuaria de ese puerto aprueba el plan y lo aplica la entidad gestora de ese mismo puerto.","La entidad gestora de ese puerto.","La Capitanía Marítima de ese puerto aprueba el plan y lo aplica la entidad gestora de ese mismo puerto.","Puertos del Estado aprueba el plan del puerto y lo aplica la Autoridad Portuaria de ese mismo puerto."],"a":1,"e":"Con el RD 1381/2002, el plan de recepción y manipulación de desechos lo aprobaba y aplicaba la entidad gestora del puerto.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2022abr-1-27","t":18,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"El anexo IV del Convenio MARPOL, es de aplicación para:","o":["Buques nuevos de arqueo bruto igual o superior a 400 en viajes nacionales.","Buques existentes de arqueo igual o superior a 400, cinco años después de la fecha de entrada en vigor del Anexo IV.","Buques nuevos de arqueo bruto inferior a 400 que estén autorizados a transportar más de 12 personas.","Buques nuevos de arqueo bruto igual o superior a 150 siempre que estén autorizados a transportar más de 10 personas."],"a":1,"e":"MARPOL anexo IV: se aplicaba a los buques existentes de arqueo igual o superior a 400 cinco años después de su entrada en vigor."},{"id":"2022abr-1-28","t":18,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Conforme al anexo V del Convenio MARPOL, la descarga de basuras fuera de las zonas especiales se permitirá siempre que el buque:","o":["Esté en ruta y a una distancia mínima 3 millas en el caso de residuos de carga.","Esté en ruta y disponga de una planta de tratado y desmenuzado de basuras, en dicho caso no existirá limitación de distancia a costa.","Se encuentre a una distancia superior a 12 millas para el caso de residuos de carga siempre que hayan sido desmenuzados o triturados de manera que puedan pasar por cribas con mallas de una abertura máxima de 25 mm.","Se encuentre en navegación y a una distancia de 12 millas de la tierra más próxima en el caso de desechos de alimentos que no hayan sido previamente desmenuzados o triturados."],"a":3,"e":"MARPOL anexo V: fuera de zonas especiales, los desechos de alimentos sin triturar se descargan en ruta y a 12 millas o más de la tierra más próxima."},{"id":"2022abr-1-29","t":19,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"De acuerdo al Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, el receptor de llamada intensificada a grupos de Inmarsat (LIG) será obligatorio para todos los buques que realicen navegaciones de manera permanente por zonas:","o":["En las que no esté establecido el servicio NAVTEX.","En las que no haya estación de MF/HF.","Zonas 2 y 3.","Zonas A1 y A2."],"a":0,"e":"RD 1185/2006: el receptor LIG de Inmarsat es obligatorio en zonas sin servicio NAVTEX."},{"id":"2022abr-1-30","t":19,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, en el caso de desmontaje de cualquier equipo instalado en un buque, este debe ser comunicado a la Capitanía Marítima del puerto donde se encuentre el buque:","o":["Por el propietario del buque.","Por el operador del buque.","Por el patrón del buque.","No es obligatoria la comunicación en caso de desmontaje de un equipo."],"a":1,"e":"RD 1185/2006: el desmontaje de un equipo lo comunica el operador del buque a la Capitanía Marítima."},{"id":"2021oct-1-01","t":1,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"La política de la Marina Mercante se dirigirá, en el marco de las competencias asignadas a la Administración General del Estado en el artículo 149.1 de la Constitución, a la consecución de los siguientes objetivos (señalar la respuesta INCORRECTA):","o":["La protección del medio ambiente marino.","La existencia de los servicios de transporte marítimo que demanden las necesidades del país.","La promoción de la competencia en el transporte marítimo conforme a la clasificación de mercados de transporte que sea establecida por la Unión Europea.","La tutela de la seguridad marítima."],"a":2,"e":"TRLPEMM: la promoción de la competencia «conforme a la clasificación de la UE» no figura entre los objetivos de la política de Marina Mercante."},{"id":"2021oct-1-02","t":1,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, ¿cuál de las siguientes se considera una infracción grave?","o":["La falta de presentación por parte del capitán, o de la persona que deba hacerlo, de la documentación exigida.","La utilización, dentro del puerto, de señales acústicas no autorizadas por el correspondiente reglamento.","La realización de reparaciones, carenas y recogidas susceptibles de causar contaminación en contravención de la normativa aplicable.","El incumplimiento de las normas vigentes sobre el uso en los buques del pabellón nacional o contraseñas."],"a":3,"e":"TRLPEMM: incumplir las normas sobre el uso del pabellón nacional o contraseñas es infracción grave."},{"id":"2021oct-1-03","t":2,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"Según la Ley 14/2014, de Navegación Marítima, ¿quién concede el permiso de entrada en puerto?","o":["La Policía Portuaria.","El Capitán Marítimo.","La Administración Portuaria.","El Jefe de Distrito Marítimo."],"a":2,"e":"Ley de Navegación Marítima: el permiso de entrada en puerto lo concede la Administración Portuaria."},{"id":"2021oct-1-04","t":2,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"Según la Ley 14/2014, de Navegación Marítima, ¿quién es responsable de la publicación de los Avisos a los Navegantes?","o":["La Dirección General de la Marina Mercante, bajo la dependencia y supervisión del Ministerio Transportes, Movilidad y Agenda Urbana.","El Ministerio de Defensa.","El Ministerio de Transportes, Movilidad y Agenda Urbana.","Puertos del Estado."],"a":1,"e":"Ley de Navegación Marítima: la publicación de los Avisos a los Navegantes corresponde al Ministerio de Defensa."},{"id":"2021oct-1-05","t":3,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo al Texto Refundido de la Ley de Puertos de Estado y de la Marina Mercante, ¿cuál es el cometido de la Comisión Permanente de Investigación de Accidentes e Incidentes Marítimos (CIAIM)?","o":["La investigación de las causas técnicas de los accidentes e incidentes marítimos.","La investigación de las causas técnicas de los accidentes e incidentes marítimos y la imposición de las correspondientes sanciones.","La investigación de las causas técnicas de los accidentes e incidentes con buques de cualquier lista.","La investigación de las causas técnicas de los accidentes e incidentes con buques excepto pesqueros."],"a":0,"e":"TRLPEMM: la CIAIM investiga las causas técnicas de los accidentes e incidentes marítimos, sin imponer sanciones."},{"id":"2021oct-1-06","t":4,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"Según el Real Decreto 638/2007, por el que se regulan las Capitanías Marítimas y los Distritos Marítimos, las Capitanías Marítimas coordinarán sus actividades para el cumplimiento de sus fines respectivos relacionados con la seguridad marítima y de la navegación, el salvamento de la vida humana en el mar y la prevención y lucha contra la contaminación del medio marino y la protección marítima:","o":["Con el Servicio Marítimo de la Guardia Civil.","Con Salvamento Marítimo.","Con la Autoridad Portuaria.","Con el Ayuntamiento."],"a":2,"e":"RD 638/2007: las Capitanías Marítimas coordinan esos fines con la Autoridad Portuaria."},{"id":"2021oct-1-07","t":5,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo a la Orden de 18 de enero de 2000, por la que se aprueba el Reglamento sobre Despacho de buques, la autorización de enrole se considera otorgada por el visto bueno de:","o":["La Autoridad Portuaria mediante la firma y sellado de la Libreta Marítima del tripulante a embarcar.","La Autoridad Marítima mediante la firma y sellado de la Libreta Marítima del tripulante a embarcar.","La Autoridad Portuaria mediante la firma y sellado del Rol al embarcar.","La Autoridad Marítima mediante la firma y sellado del Rol al embarcar."],"a":1,"e":"Con el antiguo Reglamento de Despacho (Orden de 18-1-2000), la autorización de enrole se daba con la firma y el sello de la Autoridad Marítima en la Libreta Marítima.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 los enrolamientos los regula el RD 186/2023 (tema 5): comprueba la respuesta en la norma nueva."}},{"id":"2021oct-1-08","t":6,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo al Real Decreto 210/2004, por el que se establece un sistema de seguimiento e información sobre el tráfico marítimo, el Director General de la Marina Mercante estará asistido, como autoridad competente en la toma de decisiones respecto de los buques necesitados de asistencia, por:","o":["Un comité técnico, del cual formará parte, entre otros, el Capitán Marítimo de la zona afectada.","Un comité técnico, del cual no podrá formar parte el Capitán Marítimo de la zona afectada.","Un consejo asesor independiente, del cual no podrá formar parte ningún miembro de la Administración marítima.","Un consejo asesor formado íntegramente por miembros de SASEMAR."],"a":0,"e":"RD 210/2004: el Director General de la Marina Mercante está asistido por un comité técnico del que forma parte el Capitán Marítimo de la zona."},{"id":"2021oct-1-09","t":7,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"Según el Real Decreto 62/2008, sobre las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, ¿cuál es el plazo máximo para notificar el otorgamiento de la autorización de una concentración desde que la entidad organizadora la solicitó, si ésta cumple con todos los requisitos establecidos en este Real Decreto?","o":["10 días.","15 días.","30 días.","1 mes."],"a":0,"e":"RD 62/2008: la autorización de una concentración se notifica en un plazo máximo de 10 días desde la solicitud."},{"id":"2021oct-1-10","t":7,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"Según el Real Decreto 62/2008, sobre las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, ¿a quién corresponde ejercer la dirección interna de las actividades preparatorias y de ejecución y desarrollo de las concentraciones náuticas conmemorativas?","o":["Al Coordinador de Seguridad.","Al Capitán Marítimo.","A la Entidad Organizadora.","Al Comité de Regatas."],"a":0,"e":"RD 62/2008: la dirección interna de las concentraciones conmemorativas la ejerce el Coordinador de Seguridad."},{"id":"2021oct-1-11","t":8,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"Según el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, ¿qué se entiende por un conjunto alfanumérico con el que se identifica e individualiza a cada embarcación de recreo, formada por orden correlativo por la lista, la provincia marítima, el distrito marítimo y el folio / año?","o":["Abanderamiento.","Puerto de matrícula.","Indicativo de matrícula.","Indicativo de inscripción."],"a":2,"e":"RD 1435/2010: ese conjunto alfanumérico (lista, provincia, distrito y folio/año) es el indicativo de matrícula."},{"id":"2021oct-1-12","t":8,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo con el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, el “Número CIN” de una embarcación NO incluye:","o":["El puerto de matrícula de la embarcación.","El código del país del fabricante.","El número de serie único.","El año de fabricación de la embarcación."],"a":0,"e":"RD 1435/2010: el número CIN incluye el código del país del fabricante, el número de serie y el año, pero no el puerto de matrícula."},{"id":"2021oct-1-13","t":9,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo al el Real Decreto 607/1999, de 16 de abril, por el que se aprueba el Reglamento del seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas, la cobertura del seguro de responsabilidad civil de suscripción obligatoria comprenderá:","o":["La muerte o lesiones sufridas por personas transportadas que efectúen pagos para el crucero o viaje.","La muerte o lesiones sufridas por el patrón o piloto de la embarcación.","Los daños causados por la embarcación durante su reparación.","Los daños a buques por colisión o sin contacto."],"a":3,"e":"RD 607/1999: el seguro obligatorio cubre los daños a buques por colisión o sin contacto."},{"id":"2021oct-1-15","t":10,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo a la disposición adicional primera del Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, las resoluciones de autorización a los poseedores de los títulos objeto de este real decreto para el gobierno de embarcaciones inscritas en la lista octava, serán emitidas por:","o":["La Capitanía Marítima competente.","La Subdirección General de Seguridad, Contaminación e Inspección Marítima.","El Área de Registro de Buques y Empresas Navieras.","El Director General de la Marina Mercante."],"a":0,"e":"RD 875/2014, DA 1.ª: las autorizaciones para gobernar embarcaciones de la lista octava las emite la Capitanía Marítima competente."},{"id":"2021oct-1-16","t":11,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"Conforme al Real Decreto 1434/1999, sobre inspecciones de las embarcaciones de recreo, en el certificado de navegabilidad para embarcaciones de recreo de eslora menor de 24 metros, figurarán, entre otros, los siguientes datos:","o":["Nombre, número de serie y velocidad máxima.","Categoría de navegación, puerto de matrícula y propietario.","Nombre, número de serie y propietario.","Categoría de navegación, puerto de matrícula y carga máxima (kg)."],"a":3,"e":"RD 1434/1999: en el certificado de navegabilidad de embarcaciones de menos de 24 m figuran la categoría de navegación, el puerto de matrícula y la carga máxima."},{"id":"2021oct-1-17","t":12,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo con el Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo. Las revisiones de las balsas salvavidas, los chalecos salvavidas inflables, los extintores portátiles y los sistemas fijos de extinción de incendios, que ya estuvieran instalados a bordo de una embarcación de recreo, conforme a los requisitos de la Orden FOM/1144/2003, de 28 de abril, se llevarán a cabo de acuerdo con:","o":["La normativa por la cual han sido instalados a bordo.","Las normas establecidas por una Organización Reconocida.","Las normas establecidas por la Entidad Colaboradora de Inspección que opera bajo la supervisión de la Dirección General de la Marina Mercante.","Las nuevas disposiciones contenidas en el Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo."],"a":3,"e":"RD 339/2021: las revisiones de los equipos ya instalados con la Orden FOM/1144/2003 se hacen según las nuevas disposiciones del RD 339/2021."},{"id":"2021oct-1-18","t":12,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"Conforme al Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, cuando una embarcación de recreo disponga de una instalación eléctrica de más de 50 voltios:","o":["Todos los extintores portátiles a bordo serán adecuados para fuegos con presencia de electricidad.","El 50% de los extintores portátiles a bordo serán adecuados para fuegos con presencia de electricidad.","Al menos uno de los extintores portátiles a bordo será adecuado para fuegos con presencia de electricidad.","Al menos dos de los extintores portátiles a bordo será adecuado para fuegos con presencia de electricidad."],"a":2,"e":"RD 339/2021: con instalación eléctrica de más de 50 voltios, al menos un extintor portátil será apto para fuegos con presencia de electricidad."},{"id":"2021oct-1-20","t":14,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo al Convenio Internacional sobre Búsqueda y Salvamento, 1979, ¿con qué color se recomienda identificar el contenido de los recipientes lanzables en los que haya alimentos y agua?","o":["Azul.","Rojo.","Amarillo.","Negro."],"a":0,"e":"Convenio SAR: los recipientes lanzables con alimentos y agua se identifican de color azul."},{"id":"2021oct-1-21","t":14,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"¿Quién es el órgano de gestión de la Sociedad de Salvamento y Seguridad Marítima?","o":["El Presidente.","El Consejo de Administración.","El Director de la Sociedad.","El Director General de la Marina Mercante."],"a":2,"e":"TRLPEMM: el órgano de gestión de SASEMAR es el Director de la Sociedad."},{"id":"2021oct-1-22","t":15,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo con el artículo 65.1 de la Ley 14/2014 de Navegación Marítima, la inscripción de las titularidades y gravámenes sobre los buques y embarcaciones se efectuará con la finalidad de proporcionar seguridad a las relaciones jurídicas de aquellos en:","o":["El Registro de Buques y Empresas Navieras.","La Sección de Buques del Registro de Bienes Muebles.","El Registro de la Propiedad.","El Registro de Bienes Inmuebles."],"a":1,"e":"Ley de Navegación Marítima art. 65.1: titularidades y gravámenes se inscriben en la Sección de Buques del Registro de Bienes Muebles."},{"id":"2021oct-1-23","t":15,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo con el artículo 122 de la Ley 14/2014, de Navegación Marítima, el régimen jurídico de los privilegios marítimos, será de aplicación:","o":["A los buques y embarcaciones, pero no a los artefactos navales.","Únicamente a los buques.","A los buques, embarcaciones y artefactos navales.","Únicamente a las embarcaciones."],"a":2,"e":"Ley de Navegación Marítima art. 122: los privilegios marítimos se aplican a buques, embarcaciones y artefactos navales."},{"id":"2021oct-1-24","t":16,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo con el artículo 729 del Código Civil, “Si fuere ológrafo el testamento y durante el viaje falleciera el testador, el Comandante o Capitán recogerá el testamento para custodiarlo, haciendo mención de ello en el Diario y lo entregará”:","o":["A la Autoridad Portuaria en la forma y para los efectos pertinentes, cuando el buque arribe al primer puerto del Reino.","A la Autoridad marítima local en la forma y para los efectos pertinentes, cuando el buque arribe al primer puerto del Reino.","A la Autoridad Portuaria en la forma y para los efectos pertinentes, a la finalización del viaje.","Al Delegado o Subdelegado del Gobierno en la provincia correspondiente, cuando el buque arribe al primer puerto del Reino."],"a":1,"e":"Código Civil art. 729: el capitán custodia el testamento ológrafo, lo anota en el Diario y lo entrega a la Autoridad marítima local en el primer puerto del Reino."},{"id":"2021oct-1-25","t":17,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"Según el Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, la entrega de desechos generados por los buques y residuos de carga tendrá la consideración, a efectos aduaneros, de:","o":["Depósito aduanero.","Despacho a Libre Práctica.","Declaración a Libre Práctica.","Despacho de importación."],"a":1,"e":"Con el RD 1381/2002, la entrega de desechos tenía, a efectos aduaneros, la consideración de despacho a libre práctica.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2021oct-1-26","t":17,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"El Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, define los desechos generados por los buques como:","o":["Todos los desechos, incluidas las aguas residuales y los residuos del cargamento, producidos durante el servicio del buque y que estén regulados por los anexos I, IV y V del Convenio MARPOL 73/78.","Todos los desechos, incluidas las aguas residuales y los residuos distintos de los del cargamento, producidos durante el servicio del buque y que estén regulados por los anexos II, III, V y VI del Convenio MARPOL 73/78.","Todos los desechos, incluidas las aguas residuales y los residuos distintos de los del cargamento, producidos durante el servicio del buque y que estén regulados por los anexos I, IV, V y VI del Convenio MARPOL 73/78.","Todos los desechos, incluidas las aguas residuales y los residuos distintos de los del cargamento, producidos durante el servicio del buque y que estén regulados por los anexos I, IV, V y VI del Convenio MARPOL 73/78, a excepción de los desechos relacionados con el cargamento según se definen en las directrices para la aplicación del anexo V del citado convenio."],"a":2,"e":"Con el RD 1381/2002, los desechos generados por buques eran los producidos durante el servicio y regulados por los anexos I, IV, V y VI de MARPOL, distintos de los del cargamento.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2021oct-1-27","t":18,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo al Anexo VI del Convenio MARPOL, se entiende por “zona de control de las emisiones”:","o":["Una zona en la que es necesario adoptar las mismas medidas especiales que se adoptan en la zona marítima especialmente sensible.","Una zona en la que es necesario adoptar medidas especiales de carácter obligatorio para prevenir, reducir y contener la contaminación atmosférica por NOx o SOx y materia particulada, o los tres tipos de emisiones.","Una zona en la que es necesario adoptar medidas especiales de carácter obligatorio para prevenir, reducir y contener la contaminación atmosférica por las emisiones de sustancias que agotan la capa de ozono, definidas en el Protocolo de Montreal relativo a las sustancias que agotan la capa de ozono, de 1987.","Una zona en la que es necesario adoptar medidas especiales de carácter obligatorio para prevenir, reducir y contener la contaminación atmosférica por CO2 y materia particulada, o los dos tipos de emisiones."],"a":1,"e":"MARPOL anexo VI: una zona de control de emisiones exige medidas obligatorias contra la contaminación atmosférica por NOx, SOx y materia particulada.","av":{"n":"fuera","x":"El anexo VI de MARPOL ya no está en el temario de 2026 (solo el articulado y los anexos IV y V). La respuesta sigue siendo correcta, pero es difícil que salga."}},{"id":"2021oct-1-28","t":18,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"Según el Anexo IV de MARPOL, la zona especial es:","o":["La zona del mar Báltico y del mar Negro.","Cualquier extensión de mar en la que, por razones técnicas reconocidas en relación con sus condiciones oceanográficas y ecológicas y el carácter particular de su tráfico marítimo se hace necesario adoptar procedimientos especiales obligatorios para prevenir la contaminación del mar por hidrocarburos.","Cualquier extensión de mar en la que, por razones técnicas reconocidas en relación con sus condiciones oceanográficas y ecológicas y el carácter particular de su tráfico marítimo, se hace necesario adoptar procedimientos especiales obligatorios para prevenir la contaminación del mar por aguas sucias.","Cualquier extensión de mar en la que, por razones técnicas reconocidas en relación con sus condiciones oceanográficas y ecológicas y el carácter particular de su tráfico marítimo, se hace necesario adoptar procedimientos especiales obligatorios para prevenir la contaminación del mar por las aguas de lastre del buque."],"a":2,"e":"MARPOL anexo IV: zona especial es la que, por sus condiciones oceanográficas, ecológicas y de tráfico, exige procedimientos especiales contra la contaminación por aguas sucias."},{"id":"2021oct-1-29","t":19,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"Según el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, se establece una escucha continua en la frecuencia de socorro, mientras permanezcan en el mar, todos los buques españoles de socorro en el canal 16 que corresponde a la frecuencia:","o":["156,800 MHz.","156,525 MHz.","156,418 MHz.","156,725 MHz."],"a":0,"e":"RD 1185/2006: el canal 16 de VHF corresponde a 156,800 MHz."},{"id":"2021oct-1-30","t":19,"src":"oficial","conv":"2021oct","convName":"Octubre 2021","q":"De acuerdo al Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, las fuentes de alimentación de reserva que se instalen en las embarcaciones de recreo dispondrán de capacidad suficiente para alimentar las instalaciones de radiocomunicaciones obligatorias durante un tiempo mínimo de:","o":["Dos horas","Tres horas.","Cuatro horas.","Seis horas."],"a":1,"e":"RD 1185/2006: las fuentes de reserva de las embarcaciones de recreo deben alimentar los equipos obligatorios al menos tres horas."},{"id":"2021abr-1-01","t":1,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según el Texto refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, ¿cuál de los siguientes NO es un objetivo de la Marina Mercante?","o":["La tutela y el mantenimiento de la señalización marítima y las ayudas a la navegación.","La tutela de la seguridad de la navegación marítima.","La existencia de los servicios de transporte marítimo que demanden las necesidades del país.","La protección del medio ambiente marino."],"a":0,"e":"TRLPEMM: la señalización marítima y las ayudas a la navegación no son objetivo de la política de Marina Mercante."},{"id":"2021abr-1-02","t":1,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según el Texto refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, ¿a quién corresponde la declaración de buque abandonado?","o":["Al Capitán Marítimo.","Al Capitán del buque o, en su caso, al consignatario.","Al Consejo de Administración de la Autoridad Portuaria.","Al Director de la Autoridad Portuaria."],"a":2,"e":"TRLPEMM: la declaración de buque abandonado corresponde al Consejo de Administración de la Autoridad Portuaria."},{"id":"2021abr-1-03","t":2,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Si la Administración pública tuviese conocimiento de que un buque extranjero situado en la zona contigua se propone iniciar la extracción no autorizada de objetos arqueológicos del lecho marino:","o":["Tendrá derecho a solicitar información, pero no a interceptarlo ni inspeccionarlo mientras no haya iniciado las operaciones.","Tendrá derecho a realizar una inspección y en su caso, adoptar las demás medidas que sean necesarias y proporcionales para prevenir o sancionar la infracción, incluida la detención y conducción a puerto.","Tendrá derecho a solicitar información y deberá informar al buque que si procede con las operaciones de extracción no autorizadas podrá ser interceptado y sancionado.","No podrá ejercer ninguna acción en contra del buque, ya que la extracción de objetos arqueológicos del lecho marino en la zona contigua no está tipificada como una infracción de las leyes y reglamentos nacionales."],"a":1,"e":"Ley de Navegación Marítima: en la zona contigua, la Administración puede inspeccionar y adoptar medidas, incluida la detención y conducción a puerto, contra la extracción no autorizada de objetos arqueológicos."},{"id":"2021abr-1-04","t":2,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Los sistemas de tráfico marítimo situados en aguas marítimas en las que España ejerce soberanía, derechos soberanos o jurisdicción, una vez obtenida su aprobación y publicación internacional que, en su caso, resulte necesaria:","o":["Serán de empleo obligatorio en todos los casos.","Sólo podrán ser de empleo obligado cuando estén emplazados en las aguas interiores marítimas o en el mar territorial previa ratificación de su aprobación nacional por la Agencia Europea de Seguridad Marítima (EMSA).","Podrán ser de empleo obligado cuando estén emplazados en la zona económica exclusiva si han sido aprobados por la Organización Marítima Internacional (OMI).","Serán o no obligatorios, a discreción de la Administración Marítima."],"a":2,"e":"Ley de Navegación Marítima: los sistemas de tráfico pueden ser obligatorios en la zona económica exclusiva si los aprueba la OMI."},{"id":"2021abr-1-05","t":3,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Conforme al Real Decreto 645/2020, de 7 de julio, por el que se desarrolla la estructura orgánica básica del Ministerio de Transportes, Movilidad y Agenda Urbana, la Dirección General de la Marina Mercante es el órgano competente para:","o":["La ordenación específica del transporte marítimo y los puertos españoles de interés general en los términos establecidos en el texto refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, de 5 de septiembre.","La ordenación de la marina mercante y la administración marítima española.","La ordenación del transporte.","La ordenación general de la navegación marítima y de la flota civil española, en los términos establecidos en el texto refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, de 5 de septiembre."],"a":3,"e":"El RD 645/2020 atribuía a la DGMM la ordenación general de la navegación marítima y de la flota civil española.","av":{"n":"derogada","x":"El RD 645/2020 está derogado: hoy la estructura del Ministerio la regula el RD 253/2024 (tema 3). Comprueba la redacción actual antes de darla por buena."}},{"id":"2021abr-1-06","t":4,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según el Real Decreto 638/2007, por el que se regulan las Capitanías Marítimas y los Distritos Marítimos, las Capitanías Marítimas y Distritos Marítimos componen:","o":["Las Direcciones provinciales de la Marina Mercante.","La Administración Territorial Marítima.","La Administración marítima periférica.","Los Servicios territoriales."],"a":2,"e":"RD 638/2007: Capitanías Marítimas y Distritos Marítimos componen la Administración marítima periférica."},{"id":"2021abr-1-08","t":6,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"De acuerdo al Real Decreto 1837/2000, por el que se aprueba el Reglamento de inspección y certificación de buques civiles, si un buque de bandera española va a efectuar algún cambio que pueda afectar a la disposición estructural del buque, ¿requiere de alguna autorización previa?","o":["Sí, de la Dirección General de la Marina Mercante.","Sí, del astillero de construcción del buque.","No, una vez aprobado el proyecto de construcción, los cambios posteriores no requieren aprobación.","No, únicamente se requiere autorización de la Capitanía Marítima en cambios relacionados con máquinas, equipo y demás componentes móviles del buque."],"a":0,"e":"RD 1837/2000: los cambios que afecten a la disposición estructural de un buque español requieren autorización previa de la DGMM.","av":{"n":"fuera","x":"Del RD 1837/2000 el temario de 2026 solo pide algún artículo suelto (tema 6), y no está claro que este punto entre. La respuesta sigue siendo correcta."}},{"id":"2021abr-1-09","t":7,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según el Real Decreto 62/2008, sobre las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, si una prueba deportiva de circuito se ha de celebrar en la zona I de servicio de puerto, ¿ante quién se debe solicitar la autorización correspondiente?","o":["No se puede realizar una prueba deportiva en la zona I del puerto.","Ante el centro coordinador del puerto.","Ante el capitán marítimo.","Ante la autoridad portuaria."],"a":3,"e":"RD 62/2008: las pruebas en la zona I de servicio del puerto se autorizan ante la autoridad portuaria."},{"id":"2021abr-1-10","t":7,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según el Real Decreto 62/2008, sobre las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, se entiende por concentraciones náuticas de carácter conmemorativo: los actos colectivos marítimos de carácter cultural que se caracterizan por la navegación en grupo de embarcaciones, en las aguas marítimas de responsabilidad de una capitanía marítima, normalmente inscritas en las listas:","o":["Primera, sexta y séptima.","Quinta, sexta y séptima, únicamente.","Tercera, sexta y séptima, únicamente.","Tercera, cuarta, quinta, sexta y séptima, así como extranjeras."],"a":3,"e":"RD 62/2008: las concentraciones conmemorativas suelen reunir embarcaciones de las listas tercera, cuarta, quinta, sexta y séptima, y también extranjeras."},{"id":"2021abr-1-11","t":8,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, el nombre propuesto en el abanderamiento de una embarcación será:","o":["Obligatorio para las de eslora superior a 12 metros, y potestativo para las iguales o inferiores a dicha eslora.","Obligatorio para las de eslora superior a 8 metros, y potestativo para las iguales o inferiores a dicha eslora.","Obligatorio para las de eslora a partir de 24 metros, y potestativo para las iguales o inferiores a dicha eslora.","Obligatorio para cualquier eslora, sin perjuicio de los requisitos que debe respetar el nombre propuesto."],"a":0,"e":"RD 1435/2010: el nombre es obligatorio para esloras de más de 12 metros y potestativo para las de 12 o menos."},{"id":"2021abr-1-12","t":8,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"De acuerdo al Real Decreto 685/2010, por el que se regula el otorgamiento del permiso temporal de navegación para determinadas embarcaciones de recreo, una vez alcanzada la fecha de caducidad, ¿puede solicitarse la prórroga de tales permisos?","o":["No, una vez caducados son improrrogables.","Sí, se entenderán automáticamente prorrogados por 1 mes, siempre que el propietario se asegure que sigue cumpliendo los requisitos que sirvieron para la emisión del permiso inicial.","Sí, previa inspección de un inspector de la Capitanía Marítima, quién posteriormente firmará la prórroga por un plazo máximo de 3 meses.","Sí, podrán ser prorrogados por el Director General de la Marina Mercante a petición de las empresas interesadas."],"a":3,"e":"RD 685/2010: los permisos temporales pueden ser prorrogados por el Director General de la Marina Mercante a petición de las empresas interesadas."},{"id":"2021abr-1-13","t":9,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"La cobertura obligatoria que determina el Real Decreto 607/1999, por el que se aprueba el Reglamento del seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas, NO incluye la responsabilidad civil:","o":["En que pueda incurrir el propietario con motivo del periodo en que están sus embarcaciones atracadas, durante los períodos en que aquéllas estén expuestas a las situaciones de riesgo.","Ocasionada por los riesgos derivados de participación en regatas, pruebas, competiciones de todo tipo y sus entrenamientos, incluidos apuestas y desafíos, para lo cual se deberá suscribir un seguro especial.","De los esquiadores que pueda arrastrar la embarcación, por los daños materiales y personales y por los perjuicios que sean consecuencia de ellos.","De las personas que debidamente autorizadas por el propietario patroneen las mismas, así como aquellas otras que les secunden en su gobierno."],"a":1,"e":"RD 607/1999: los riesgos de regatas, pruebas y competiciones (y sus entrenamientos) no entran en el seguro obligatorio: necesitan un seguro especial."},{"id":"2021abr-1-14","t":10,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según el Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, los cursos de formación en radiocomunicaciones, tal y como se definen en el mismo, habilitan para:","o":["La obtención del título de patrón para navegación básica y la operación de la estación radio de a bordo, de acuerdo a las atribuciones de dicho título.","La obtención del título de patrón de embarcaciones de recreo y la operación de la estación radio de a bordo, de acuerdo a las atribuciones de dicho título.","La obtención del título de capitán de yate y la operación de la estación radio de a bordo, de acuerdo a las atribuciones de dicho título.","La obtención del título de patrón de yate y la operación de la estación radio de a bordo, de acuerdo a las atribuciones de dicho título."],"a":0,"e":"RD 875/2014: el curso de radiocomunicaciones permite obtener el PNB con habilitación para operar la estación de radio de a bordo según sus atribuciones."},{"id":"2021abr-1-15","t":10,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"De acuerdo con el Real Decreto 973/2009, por el que se regulan las titulaciones profesionales de la marina mercante, el límite de alcohol en aliento no será superior a:","o":["0,25 %.","0,25 mg/l.","0,25 g/l.","0,025 %."],"a":1,"e":"El límite de alcohol en aire espirado es 0,25 mg/l.","av":{"n":"ojo","x":"El RD 973/2009 está derogado; hoy la regla está en el art. 86.3 del RD 269/2022 (tema 10), con el mismo límite de 0,25 mg/l. La respuesta sigue valiendo."}},{"id":"2021abr-1-16","t":11,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Conforme al Real Decreto 1434/1999, sobre inspecciones de las embarcaciones de recreo, en lo relativo a la ejecución de los reconocimientos, si ha lugar, durante la inspección de las bañeras autoachicables se comprobará:","o":["La existencia de un antideslizante eficaz de algún tipo en las zonas de trabajo.","El correcto apriete de los tornillos de fijación en el caso de cadenotes atornillados.","El estado de la zona del casco y/o refuerzos sobre los que se fijen los arbotantes.","La existencia de los desagües especificados en el proyecto, verificando que se hallan libres de obstáculos que impidan fluir el agua libremente."],"a":3,"e":"RD 1434/1999: en las bañeras autoachicables se comprueba que los desagües del proyecto existen y están libres de obstáculos."},{"id":"2021abr-1-17","t":12,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"De acuerdo a la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, en relación con los extintores portátiles, ¿cuál de las siguientes afirmaciones es CORRECTA?","o":["Cuando la embarcación lleve instalación eléctrica de más de 12 voltios, uno de los extintores debe ser adecuado para fuegos de origen eléctrico.","Cuando la embarcación lleve instalación eléctrica de más de 50 voltios, dos de los extintores debe ser adecuado para fuegos de origen eléctrico.","Cuando la embarcación lleve instalación eléctrica de más de 50 voltios, uno de los extintores debe ser adecuado para fuegos de origen eléctrico.","Cuando la embarcación lleve instalación eléctrica de más de 24 voltios, uno de los extintores debe ser adecuado para fuegos de origen eléctrico."],"a":2,"e":"Con más de 50 voltios, uno de los extintores debe ser apto para fuegos eléctricos.","av":{"n":"ojo","x":"La Orden FOM/1144/2003 está derogada desde 2021 por el RD 339/2021 (tema 12). Con la norma nueva la regla de los 50 voltios es la misma, así que la respuesta sigue valiendo."}},{"id":"2021abr-1-18","t":12,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"De acuerdo a la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, ¿cuántos extintores deben llevar a bordo las embarcaciones de recreo de lista 6.ª, cabina cerrada y eslora de 21 metros?","o":["1.","2.","3.","4."],"a":3,"e":"Con la Orden FOM/1144/2003, una embarcación de lista 6.ª con cabina cerrada y 21 m de eslora llevaba 4 extintores.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el número de extintores lo fija hoy el RD 339/2021 (tema 12) con otras reglas. No te fíes de esta respuesta."}},{"id":"2021abr-1-19","t":13,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Conforme al Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, para las categorías de diseño A y B, el módulo A1 relativo al diseño y construcción de las embarcaciones de recreo con una eslora superior a 2,5 metros e inferior a 12 metros, comprende:","o":["El examen UE de tipo.","La conformidad basada en el pleno aseguramiento de la calidad.","El control interno de la producción más ensayo supervisado de los productos.","La conformidad basada en verificación por unidad."],"a":2,"e":"RD 98/2016: para las categorías A y B, de 2,5 a 12 m, el módulo A1 es el control interno de la producción más ensayo supervisado."},{"id":"2021abr-1-20","t":14,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"La Sociedad de Salvamento y Seguridad Marítima es:","o":["Una entidad privada.","Un órgano colegiado autónomo.","Una agencia estatal.","Una entidad pública empresarial."],"a":3,"e":"TRLPEMM: SASEMAR es una entidad pública empresarial."},{"id":"2021abr-1-21","t":14,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Conforme al Convenio Internacional sobre Búsqueda y Salvamento Marítimo 1979, ¿qué tipos de notificación debería comprender un sistema de notificación para buques?","o":["Notificación inicial y final.","Plan de navegación, notificación de la situación y notificación final.","Notificación ordinaria, de urgencia y de emergencia.","Plan de viaje, plan de desvío y notificación final."],"a":1,"e":"Convenio SAR: el sistema de notificación comprende plan de navegación, notificación de situación y notificación final."},{"id":"2021abr-1-22","t":15,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según establece la Ley 14/2014 de Navegación Marítima, el Principio de Tracto Sucesivo implica que:","o":["La inscripción no convalida los actos o contratos que sean nulos con arreglo a las leyes.","Los actos sujetos a inscripción que no estén debidamente inscritos o anotados no perjudican a terceros de buena fe.","El contenido del Registro se presume exacto y válido.","Para que pueda inscribirse o anotarse en el Registro cualquier otro acto, negocio jurídico o resolución judicial o administrativa relativa al buque, será preciso que la persona que lo otorgue o aquella contra quien se dirija tenga previamente inscrito su derecho."],"a":3,"e":"Ley de Navegación Marítima: tracto sucesivo significa que quien otorga el acto (o contra quien se dirige) debe tener su derecho previamente inscrito."},{"id":"2021abr-1-23","t":15,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según establece la Ley 14/2014 de Navegación Marítima, el Certificado de Matrícula acredita:","o":["La nacionalidad española del buque y que ha sido autorizado para navegar por los mares enarbolando el pabellón nacional.","El viaje que está realizando el buque, así como el hecho de que lo ha emprendido previo cumplimiento de todos los requisitos legales y reglamentarios para su despacho.","Que el buque está legalmente matriculado en España.","Las vicisitudes náuticas y meteorológicas que se produzcan durante la navegación."],"a":2,"e":"Ley de Navegación Marítima: el Certificado de Matrícula acredita que el buque está legalmente matriculado en España."},{"id":"2021abr-1-24","t":16,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según el artículo 54 del Código Civil, el matrimonio secreto:","o":["Se tramitará reservadamente, sin la publicación de edictos o proclamas.","Cuando concurra causa grave suficientemente probada, el Ministro de Transporte, Movilidad y Agenda Urbana podrá autorizarlo.","Para su reconocimiento basta su inscripción en el Registro Mercantil.","No perjudicará los derechos adquiridos de buena fe por terceras personas sino desde su publicación en el Registro Civil Central."],"a":0,"e":"Código Civil art. 54: el expediente del matrimonio secreto se tramita reservadamente, sin publicar edictos o proclamas; lo autoriza el Ministro de Justicia."},{"id":"2021abr-1-25","t":17,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según el Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, el capitán de un buque que se dirija a un puerto español deberá notificar la información que figura en el anexo II:","o":["A la Autoridad Portuaria en cuanto se conozca el puerto de escala, si se dispone de esa información al menos doce horas antes de su llegada.","Como mínimo cuarenta y ocho horas antes de la llegada prevista del buque, a la Capitanía Marítima correspondiente.","A la Capitanía Marítima correspondiente y a la entidad gestora del puerto, a más tardar en el momento de salir del puerto de salida, si la duración del viaje es inferior a veinticuatro horas.","A la Dirección General de la Marina Mercante, y no a la entidad gestora del puerto ni a la Capitanía Marítima correspondiente."],"a":2,"e":"Con el RD 1381/2002, si el viaje duraba menos de 24 horas, la notificación se hacía a la Capitanía y a la entidad gestora como muy tarde al salir del puerto de salida.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2021abr-1-26","t":17,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"El Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, establece que un buque podrá salir del puerto de escala sin entregar los desechos en dicho puerto, si:","o":["Ha sido expresamente autorizado para ello por la Capitanía Marítima del citado puerto.","Ha sido expresamente autorizado para ello por la Autoridad Portuaria del citado puerto.","El capitán considera que su buque dispone de suficiente capacidad de almacenamiento hasta el siguiente puerto de escala.","La Autoridad Portuaria de dicho puerto considera que el buque dispone de suficiente capacidad de almacenamiento."],"a":0,"e":"Con el RD 1381/2002, el buque podía salir sin entregar los desechos si lo autorizaba expresamente la Capitanía Marítima.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2021abr-1-27","t":18,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"De acuerdo al Anexo IV del Convenio MARPOL, se entiende por «aguas sucias»:","o":["Residuos y aguas de lavado de tanques, y otras mezclas oleosas.","Desagües procedentes de lavabos, lavaderos y conductos de salida situados en cámaras de servicios médicos.","Aguas que pueden estar contaminadas por hidrocarburos resultantes de fugas o trabajos de mantenimiento en los espacios de máquinas.","Productos de aceites de desecho residuales generados durante las operaciones normales del buque."],"a":1,"e":"MARPOL anexo IV: entre las aguas sucias están los desagües de lavabos, lavaderos y conductos de cámaras de servicios médicos."},{"id":"2021abr-1-28","t":18,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"El Anexo V de MARPOL establece que en todo buque de eslora igual o superior a 12 metros, independientemente de su arqueo:","o":["Habrá un plan de gestión de basuras aprobado por la Administración.","El Libro de registro de basuras no podrá ser parte del diario oficial de navegación.","Se colocarán rótulos en los que se notifiquen a la tripulación y a los pasajeros las prescripciones sobre descarga.","Existirá un registro de pasajeros siempre que esté autorizado a transportar 15 o más personas."],"a":2,"e":"MARPOL anexo V: todo buque de 12 m o más lleva rótulos que informan a tripulación y pasajeros de las prescripciones sobre descarga."},{"id":"2021abr-1-29","t":19,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, si a día de hoy se instala un receptor NAVTEX, éste además de la frecuencia internacional deberá recibir informaciones sobre seguridad marítima en la frecuencia de:","o":["518 kHz.","490 kHz.","590 kHz.","418 kHz."],"a":1,"e":"RD 1185/2006: el NAVTEX recibe, además de 518 kHz, la frecuencia nacional de 490 kHz."},{"id":"2021abr-1-30","t":19,"src":"oficial","conv":"2021abr","convName":"Abril 2021","q":"Según el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, cuando se instale un equipo radioeléctrico registrado por la Administración marítima en una embarcación de recreo, se deberá:","o":["Notificar, en todo caso, si la embarcación lleva Licencia de Estación de Barco.","Notificar, siempre, independientemente de la eslora de la embarcación.","Solicitar autorización previa.","Todas las embarcaciones menores de 12 metros están exentas de notificación."],"a":0,"e":"RD 1185/2006: en recreo basta notificar la instalación; las de 12 m o menos solo notifican si tienen Licencia de Estación de Barco."},{"id":"2020dic-2-01","t":1,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"De acuerdo con el Texto refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, de 5 de septiembre, la política de la Marina Mercante se dirigirá, en el marco de las competencias asignadas a la Administración General del Estado en el artículo 149.1 de la Constitución, a la consecución de los siguientes objetivos (señalar la respuesta incorrecta):","o":["La tutela de la seguridad de la vida humana en la mar.","La tutela de la seguridad de la navegación marítima.","La protección de la biodiversidad marítima.","La protección del medio ambiente marino."],"a":2,"e":"TRLPEMM: la protección de la biodiversidad marítima no figura entre los objetivos de la política de Marina Mercante."},{"id":"2020dic-2-02","t":1,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"A los efectos del texto refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, de 5 de septiembre, ¿se considera buque civil un artefacto flotante sin desplazamiento, apto para la navegación?","o":["Sí, siempre.","No, en ningún caso.","Sí, excepto que dicho artefacto esté afecto al servicio de la defensa nacional.","Sólo en el caso de que se requiera un título para su manejo."],"a":2,"e":"TRLPEMM: el artefacto flotante apto para navegar es buque civil, salvo que esté afecto a la defensa nacional."},{"id":"2020dic-2-03","t":2,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según la Ley 14/2014, de 24 de julio, de Navegación Marítima, ¿qué requisito o requisitos se requieren de la autoridad judicial para ordenar la entrada y el registro de camarotes en un buque extranjero atracado en puerto español?","o":["Debe solicitar el permiso correspondiente a la Autoridad Marítima del Estado del pabellón, a la mayor brevedad posible, a través del Ministerio de Asuntos Exteriores, Unión Europea y Cooperación.","Solamente se requiere la comunicación al cónsul del Estado del pabellón a la mayor brevedad posible.","No se requiere ningún requisito, ya que según el artículo 12.1 de la Ley de Navegación Marítima, la jurisdicción civil y penal de los tribunales españoles se extenderá a todos los buques extranjeros mientras permanezcan en los puertos nacionales o demás aguas interiores marítimas.","Debe solicitar el permiso correspondiente a la Autoridad Judicial del Estado del pabellón, a la mayor brevedad posible."],"a":1,"e":"Ley de Navegación Marítima: para entrar y registrar camarotes de un buque extranjero en puerto basta comunicarlo cuanto antes al cónsul del Estado del pabellón."},{"id":"2020dic-2-04","t":2,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según la Ley 14/2014, de 24 de julio, de Navegación Marítima, los buques que naveguen por los espacios marítimos españoles:","o":["Deberán llevar izado su pabellón en lugar bien visible cuando naveguen por las aguas interiores marítimas.","Deberán llevar izado su pabellón en lugar bien visible cuando naveguen por el mar territorial.","Deberán llevar izado su pabellón en todo momento, en un lugar bien visible, así como el pabellón español si se trata de buques civiles extranjeros.","Deberán llevar izado su pabellón en todo momento, salvo que naveguen en régimen de paso inocente, en cuyo caso se ajustarán a las previsiones de la Convención de las Naciones Unidas sobre el Derecho del Mar, firmada en Montego Bay el 10 de diciembre de 1982."],"a":0,"e":"Ley de Navegación Marítima: es obligatorio llevar izado el pabellón en lugar bien visible al navegar por las aguas interiores marítimas."},{"id":"2020dic-2-05","t":3,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"De acuerdo con el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, ¿qué órgano colegiado tiene competencia para la investigación de las causas técnicas de los accidentes e incidentes marítimos?","o":["El Colegio de Oficiales de la Marina Mercante.","Salvamento Marítimo.","La Comisión Permanente de Investigación de Accidentes e Incidentes Marítimos (CIAIM).","La Dirección General de la Marina Mercante."],"a":2,"e":"TRLPEMM: el órgano colegiado que investiga las causas técnicas es la CIAIM."},{"id":"2020dic-2-06","t":4,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"De acuerdo con el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, ¿a quién corresponde la intervención en los procedimientos de determinación de las condiciones de los canales de entrada y salida de los puertos, mediante informe vinculante en lo que afecte a la seguridad marítima?","o":["Al Jefe de Explotación de la Autoridad Portuaria.","Al Capitán Marítimo.","Al Jefe de Distrito.","Al Director de la Autoridad Portuaria."],"a":1,"e":"TRLPEMM: el informe vinculante sobre las condiciones de los canales de entrada y salida de los puertos lo emite el Capitán Marítimo."},{"id":"2020dic-2-07","t":5,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"De acuerdo a la Orden de 18 de enero de 2000 por la que se aprueba el Reglamento sobre Despacho de buques, si durante la validez del despacho por tiempo se produjeran enroles o desenroles:","o":["El Capitán estará obligado a presentar ante la autoridad marítima una nueva Lista de Tripulantes que recoja dichos cambios.","Dicho despacho quedará anulado, debiendo renovarse en la Capitanía Marítima donde se formalizó inicialmente.","Este hecho no afectaría a la validez del despacho, no debiendo realizarse ningún trámite administrativo.","Es conveniente dar aviso de que la tripulación ha cambiado a la Capitanía Marítima en la que se formaliza dicho despacho por tiempo, no siendo obligatorio aportar nueva lista de tripulantes con todos los datos."],"a":0,"e":"Con el antiguo Reglamento de Despacho, si había enroles o desenroles en un despacho por tiempo, el Capitán presentaba una nueva Lista de Tripulantes.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 el despacho por tiempo y los enrolamientos los regula el RD 186/2023 (tema 5): comprueba la respuesta en la norma nueva."}},{"id":"2020dic-2-09","t":7,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según el Real Decreto 62/2008, sobre las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, el Capitán marítimo correspondiente podrá:","o":["Suspender el evento siempre que la Autoridad Portuaria lo autorice previamente.","Retrasar, anular o suprimir las pruebas si disminuyen las condiciones de seguridad.","Ejercer la dirección interna del desarrollo de la concentración náutica, asegurándose de que ésta se realiza en las debidas condiciones de seguridad.","Solicitar y obtener las autorizaciones adicionales de otras instituciones o de las administraciones públicas que fueran precisas para la celebración del evento."],"a":1,"e":"RD 62/2008: el Capitán marítimo puede retrasar, anular o suprimir las pruebas si disminuyen las condiciones de seguridad."},{"id":"2020dic-2-10","t":7,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según el Real Decreto 62/2008, sobre las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, se denomina regata de altura aquella que tiene lugar:","o":["Únicamente en alta mar.","En alta mar, zona económica exclusiva y mar territorial.","En zonas A3 y A4.","En zona 1 y zona 2."],"a":1,"e":"RD 62/2008: regata de altura es la que tiene lugar en alta mar, zona económica exclusiva y mar territorial."},{"id":"2020dic-2-11","t":8,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"De acuerdo con el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, ¿cómo se define «matrícula»?","o":["Puerto donde se encuentre el distrito marítimo en el que esté registrada una embarcación.","Conjunto alfanumérico con el que se identifica e individualiza a cada embarcación de recreo, formado por orden correlativo por la lista, la provincia marítima, el distrito marítimo y el folio / año.","Conjunto alfanumérico de carácter secuencial asignado por el distrito marítimo correspondiente, con el que se identifica e individualiza a cada embarcación de recreo de eslora igual o inferior a 12 metros, y que estén sujetas a lo establecido en el artículo 8 de este real decreto.","Acto administrativo por el que, tras la correspondiente tramitación prevista en este real decreto, se autoriza que una embarcación enarbole pabellón español."],"a":0,"e":"RD 1435/2010: matrícula es el conjunto alfanumérico formado por lista, provincia marítima, distrito marítimo y folio/año."},{"id":"2020dic-2-12","t":8,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"De acuerdo con el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, ¿qué tipo de embarcaciones están exentas del deber de abanderamiento y matriculación?","o":["Todas las embarcaciones de recreo de eslora igual o inferior a 12 metros, siempre que la propia embarcación y su equipo propulsor ostenten el marcado CE.","Todas las embarcaciones de recreo de eslora igual o superior a 12 metros, siempre que la propia embarcación ostente el marcado CE.","Todas las embarcaciones de recreo de eslora igual o inferior a 12 metros.","Todas las embarcaciones de recreo de eslora inferior a 6 metros, siempre que ostenten el marcado CE, no siendo necesario que el equipo propulsor disponga de dicho marcado."],"a":0,"e":"Según la plantilla oficial, quedan exentas las embarcaciones de recreo de hasta 12 m cuando la embarcación y su propulsor llevan marcado CE."},{"id":"2020dic-2-13","t":9,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según el Reglamento del seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas, la cobertura del seguro de responsabilidad civil de suscripción obligatoria no comprenderá:","o":["Daños materiales a terceros.","Daños a buques por colisión o sin contacto.","Muerte o lesiones corporales de terceras personas.","La muerte o lesiones sufridas por personas transportadas que efectúen pagos para el crucero o viaje."],"a":3,"e":"RD 607/1999: no cubre la muerte o lesiones de las personas transportadas que pagan por el crucero o viaje."},{"id":"2020dic-2-14","t":10,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según el Real Decreto 875/2014, de 10 de octubre, la eslora es la distancia medida paralelamente a la línea de flotación de referencia y al eje de la embarcación, entre dos planos verticales perpendiculares al plano central de la embarcación, situados uno en la parte más a proa de la misma y el otro en la parte más a popa. Esta eslora incluye, entre otros:","o":["Aquellas partes desmontables del casco que actúan como soporte hidrostático o hidrodinámico cuando la embarcación está en reposo o navegando.","Timones.","Apoyos para la propulsión y las jarcias.","Protecciones y defensas."],"a":0,"e":"RD 875/2014: la eslora incluye las partes desmontables del casco que dan soporte hidrostático o hidrodinámico; no timones, apoyos de jarcia ni defensas."},{"id":"2020dic-2-15","t":10,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según el Real Decreto 875/2014, de 10 de octubre, ¿qué eslora mínima han de tener las embarcaciones para la realización de las prácticas precisas para la obtención de los títulos de patrón para navegación básica y patrón de embarcaciones de recreo?","o":["11,5 metros.","6 metros.","6,5 metros.","7 metros."],"a":1,"e":"RD 875/2014: las prácticas de PNB y PER se hacen en embarcaciones de al menos 6 m de eslora."},{"id":"2020dic-2-16","t":11,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"De acuerdo con el Real Decreto 1434/1999, por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo para garantizar la seguridad de la vida humana en la mar y se determinan las condiciones que deben reunir las entidades colaboradoras de inspección, ¿cuándo NO será obligatoria la realización de reconocimientos adicionales?","o":["Cuando una embarcación vaya a cambiar de lista séptima a lista sexta.","Después de haber sufrido una varada.","A requerimiento de un órgano judicial.","Cuando una embarcación de recreo efectúe reparaciones en su casco, maquinaria y equipo."],"a":2,"e":"RD 1434/1999: el reconocimiento a requerimiento judicial es extraordinario, no adicional."},{"id":"2020dic-2-17","t":12,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Conforme a la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, los depósitos fijos o instalaciones relativas a los sistemas de retención de instalaciones sanitarias:","o":["No estarán conectados con las descargas de los aseos instalados en la embarcación y su instalación se realizará en lugares accesibles.","Estarán conectados con las descargas de los aseos instalados en la embarcación, con conexiones lo más largas y directas posible y su instalación se realizará en lugares accesibles.","Estarán conectados con las descargas de los aseos instalados en la embarcación, con conexiones lo más cortas y directas posible y su instalación se realizará en lugares accesibles.","No estarán conectados con las descargas de los aseos instalados en la embarcación y su instalación se realizará en lugares inaccesibles para evitar su manipulación."],"a":2,"e":"Con la Orden FOM/1144/2003, los depósitos de retención se conectaban a los aseos con conexiones lo más cortas y directas posible, en lugares accesibles.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el equipo de las embarcaciones de recreo lo regula hoy el RD 339/2021 (tema 12), que cambia muchas cifras. No te fíes de esta respuesta."}},{"id":"2020dic-2-18","t":12,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Conforme a la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, ¿debe llevar obligatoriamente linterna estanca una embarcación de recreo asignada para navegar en Zona 5?","o":["Sí, siempre 1, independientemente de la Zona.","No.","Sí, para Zona 5 corresponde llevar 2.","Las linternas estancas sólo son obligatorias en Zona 6 como sustitución de las luces de navegación."],"a":1,"e":"Con la Orden FOM/1144/2003, en Zona 5 no era obligatoria la linterna estanca.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el equipo de las embarcaciones de recreo lo regula hoy el RD 339/2021 (tema 12), que cambia muchas cifras. No te fíes de esta respuesta."}},{"id":"2020dic-2-19","t":13,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Conforme al Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, se considerará modificación importante del motor a toda modificación de un motor de propulsión que aumente la potencia nominal del mismo en más de un:","o":["30 %.","15 %.","25 %.","50 %."],"a":1,"e":"RD 98/2016: es modificación importante del motor la que aumenta su potencia nominal en más de un 15 %."},{"id":"2020dic-2-20","t":14,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Conforme al Convenio Internacional sobre Búsqueda y Salvamento Marítimo 1979, la situación en la cual se teme por la seguridad de un buque y de las personas que lleve a bordo corresponde a la fase de:","o":["Alerta.","Incertidumbre.","Riesgo.","Peligro."],"a":0,"e":"Convenio SAR: cuando se teme por la seguridad del buque y de las personas a bordo es fase de alerta."},{"id":"2020dic-2-21","t":14,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"De acuerdo al Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, señale qué función NO corresponde al Director de la Sociedad de Salvamento y Seguridad Marítima:","o":["Disponer los gastos y ordenar los pagos correspondientes.","Dirigir los servicios de la Sociedad y controlar el desarrollo de su actividad.","Velar por el cumplimiento de las normas aplicables a la Sociedad y por la ejecución de los acuerdos tomados por el Consejo de Administración.","Presentar al Consejo de Administración el anteproyecto de presupuestos, el programa de actuación, inversiones y financiación, el plan anual de objetivos y las cuentas anuales para su examen y posterior tramitación."],"a":2,"e":"TRLPEMM: velar por las normas y por la ejecución de los acuerdos del Consejo corresponde al Presidente de SASEMAR, no al Director."},{"id":"2020dic-2-22","t":15,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según establece la Ley 14/2014 de Navegación Marítima, el Principio de Legitimación implica que:","o":["La inscripción no convalida los actos o contratos que sean nulos con arreglo a las leyes.","Los actos sujetos a inscripción que no estén debidamente inscritos o anotados no perjudican a terceros de buena fe.","El contenido del Registro se presume exacto y válido.","La inscripción en el Registro se practicará en virtud de escritura pública, póliza intervenida por notario, resolución judicial firme o documento administrativo expedido por funcionario con facultades suficientes por razón de su cargo."],"a":2,"e":"Ley de Navegación Marítima: por el principio de legitimación, el contenido del Registro se presume exacto y válido."},{"id":"2020dic-2-23","t":15,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según establece la Ley 14/2014 de Navegación Marítima, para que la hipoteca naval quede válidamente constituida podrá ser otorgada en escritura pública, en póliza intervenida por notario o en documento privado y deberá inscribirse en el:","o":["Registro Mercantil.","Registro de Bienes Inmuebles.","Registro de Bienes Muebles.","Registro de Buques y Empresas Navieras."],"a":2,"e":"Ley de Navegación Marítima: la hipoteca naval se inscribe en el Registro de Bienes Muebles."},{"id":"2020dic-2-24","t":16,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según el artículo 724 del Código Civil, los testamentos abiertos, ológrafos y cerrados hechos en alta mar serán custodiados por:","o":["El Capitán, y se hará mención de ellos en el Diario de Navegación.","El Capitán, y no será necesario hacer mención de ellos en el Diario de Navegación.","Dos testigos, y se hará mención de ellos en el Diario de Navegación.","Dos testigos, y no será necesario hacer mención de ellos en el Diario de Navegación."],"a":0,"e":"Código Civil art. 724: los testamentos hechos en alta mar los custodia el Capitán y se mencionan en el Diario de Navegación."},{"id":"2020dic-2-25","t":17,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"En lo que respecta a las exenciones de la entrega de desechos, el capitán de un buque podrá solicitar a la Capitanía Marítima una exención total o parcial de las obligaciones reguladas en el artículo 6 y en el apartado 1 del artículo 7 del Real Decreto 1381/2002, si:","o":["Opera en tráfico regular con escalas frecuentes y regulares en determinados puertos, sin necesidad de justificar la existencia e implantación de un plan que asegure la entrega de los desechos.","Ha justificado suficientemente la existencia e implantación de un plan que asegura la entrega de los desechos generados por el buque y el pago de las correspondientes tarifas, y opera en tráfico regular con escalas frecuentes y regulares en determinados puertos.","Opera en tráfico regular con escalas frecuentes y regulares en determinados puertos, justificando la existencia e implantación de un plan que asegure la entrega de los desechos. Podrá solicitarlo a la Autoridad Portuaria de cualquiera de los puertos de escala.","Ha justificado suficientemente la existencia e implantación de un plan que asegura la entrega de los desechos generados por el buque y el pago de las correspondientes tarifas, aunque no opere en tráfico regular con escalas frecuentes y regulares en determinados puertos."],"a":1,"e":"Con el RD 1381/2002, la exención exigía justificar un plan de entrega y pago de tarifas y operar en tráfico regular con escalas frecuentes.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2020dic-2-26","t":17,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Atendiendo a los tipos de desechos generados por buques o residuos de carga que reciban, el Real Decreto 1381/2002 clasifica a las instalaciones portuarias receptoras que reciben desechos incluidos en el Anexo I del Convenio MARPOL 73/78 en las siguientes sub-clases:","o":["Tipo A, Tipo B y Tipo C, siendo las Tipo C las que reciben desechos generados por buques o residuos de carga de hidrocarburos y agua de lastre contaminada.","Tipo I.A, Tipo I.B y Tipo I.C, siendo las Tipo I.C las que reciben desechos generados por buques o residuos de carga de hidrocarburos y agua de lastre contaminada.","Tipo A, Tipo B y Tipo C, siendo las Tipo B las que reciben desechos generados por buques procedentes de las sentinas de la cámara de máquinas o de los equipos de depuración de combustible.","Tipo A, Tipo B y Tipo C, siendo las Tipo A las que reciben desechos generados por buques o residuos de carga de petróleo crudo y agua de lastre contaminada con petróleo crudo."],"a":3,"e":"Con el RD 1381/2002, las instalaciones del anexo I se dividían en Tipo A, B y C; la Tipo A recibía petróleo crudo y lastre contaminado con crudo.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2020dic-2-27","t":18,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según se establece en el articulado del Convenio MARPOL, el término descarga, en relación con las sustancias perjudiciales o con efluentes que contengan tales sustancias, incluye:","o":["Las operaciones de vertimiento en el sentido que se da a este término en el Convenio sobre la prevención de la contaminación del mar por vertimiento de desechos y otras materias, adoptado en Londres el 13 de noviembre de 1972.","Cualquier derrame procedente de un buque por cualquier causa, y comprende todo tipo de escape, evacuación, rebose, fuga, achique, emisión o vaciamiento.","El derrame de sustancias perjudiciales directamente resultantes de la exploración, la explotación y el consiguiente tratamiento, en instalaciones mar adentro, de los recursos minerales de los fondos marinos.","El derrame de sustancias perjudiciales con objeto de efectuar trabajos lícitos de investigación científica acerca de la reducción o control de la contaminación."],"a":1,"e":"MARPOL: «descarga» es cualquier derrame procedente de un buque por cualquier causa (escape, evacuación, rebose, fuga, achique, emisión o vaciamiento)."},{"id":"2020dic-2-28","t":18,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Todo buque que esté sujeto a las disposiciones del Anexo IV del Convenio MARPOL estará equipado con un sistema de tratamiento de aguas sucias. Indique cuál de los siguientes sistemas cumple con los requisitos de dicho anexo:","o":["Constará de un tanque de retención que tenga capacidad suficiente, a juicio de la Administración, para retener todas las aguas sucias habida cuenta del servicio que presta el buque, independientemente del número de personas a bordo.","El sistema podrá desmenuzar y desinfectar las aguas sucias y estará aprobado por la Administración. Estará dotado de medios que, a juicio de la Administración, permitan almacenar temporalmente las aguas sucias cuando el buque esté a menos de dos millas marinas de la tierra más próxima.","Podrá ser una instalación de tratamiento de aguas sucias aprobada por la Administración. En caso de que cumpla las normas y los métodos de prueba elaborados por la Organización, no será necesaria dicha aprobación.","El sistema estará dotado de medios que, a juicio de la Administración, permitan almacenar temporalmente las aguas sucias cuando el buque esté a menos de tres millas marinas de la tierra más próxima. Deberá desmenuzar y desinfectar las aguas sucias y estará aprobado por la Administración."],"a":3,"e":"MARPOL anexo IV regla 9: el sistema de desmenuzar y desinfectar, aprobado, con almacenamiento temporal a menos de 3 millas de tierra, cumple el anexo."},{"id":"2020dic-2-29","t":19,"src":"oficial","conv":"2020dic","convName":"Diciembre 2020","q":"Según el reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, si a día de hoy se instala un receptor NAVTEX, éste además de la frecuencia internacional deberá recibir informaciones sobre seguridad marítima en la frecuencia de:","o":["518 kHz.","490 kHz.","9,6 kHz.","1022 kHz."],"a":1,"e":"RD 1185/2006: el N
