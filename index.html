<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rumbo al PPER</title>
<meta name="description" content="App de estudio no oficial para el examen de Patrón Profesional de Embarcaciones de Recreo (PPER): 19 temas jugables, preguntas oficiales y simulacros.">
<meta name="theme-color" content="#F7F9F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A121C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rumbo PPER">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F9F8;--surface:#FFFFFF;--surface-2:#EAF1F4;--water:#DCEBF2;--water-2:#C6DEEA;--land:#EFE3C2;
  --ink:#142236;--ink-2:#4A5B6E;--ink-3:#7A8A9A;--rule:#C7D3DC;
  --magenta:#B0207A;--magenta-soft:#F6E3EE;
  --ok:#1F7A4D;--ok-soft:#DFF1E6;--bad:#C62828;--bad-soft:#FBE3E3;--gold:#B7860B;
  --f-red:#C8102E;--f-yellow:#F6C700;--f-blue:#0B4EA2;--f-white:#FFFFFF;--f-black:#151515;
  --shadow:0 1px 0 rgba(20,34,54,.05),0 8px 22px -14px rgba(20,34,54,.35);
  --f-display:'Spectral',Georgia,serif;--f-ui:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A121C;--surface:#111C29;--surface-2:#172638;--water:#13283A;--water-2:#1B3550;--land:#2E2A1F;
  --ink:#D7E2EC;--ink-2:#8FA3B6;--ink-3:#687C90;--rule:#23384B;
  --magenta:#E070B6;--magenta-soft:#3A1F33;
  --ok:#45C08A;--ok-soft:#123222;--bad:#FF6B6B;--bad-soft:#3A1A1C;--gold:#E2B33C;
  --shadow:0 1px 0 rgba(0,0,0,.35),0 10px 26px -14px rgba(0,0,0,.9);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A121C;--surface:#111C29;--surface-2:#172638;--water:#13283A;--water-2:#1B3550;--land:#2E2A1F;
  --ink:#D7E2EC;--ink-2:#8FA3B6;--ink-3:#687C90;--rule:#23384B;
  --magenta:#E070B6;--magenta-soft:#3A1F33;
  --ok:#45C08A;--ok-soft:#123222;--bad:#FF6B6B;--bad-soft:#3A1A1C;--gold:#E2B33C;
  --shadow:0 1px 0 rgba(0,0,0,.35),0 10px 26px -14px rgba(0,0,0,.9);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
a{color:var(--magenta)}
b,strong{font-weight:650}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;padding:0 16px 28px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top h1{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none;display:grid;place-items:center;width:40px;height:40px;margin-left:-8px;border:0;border-radius:10px;background:transparent}
.iconbtn:hover{background:var(--surface-2)}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--rule);font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.chip.clock{font-size:14px;font-weight:500}
.chip.clock.low{color:var(--bad);border-color:var(--bad)}
.tabs{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;border:0;background:transparent;color:var(--ink-3);font-size:11px;font-weight:600;letter-spacing:.01em}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--magenta)}
.tabs .badge{position:absolute;margin-left:18px;margin-top:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--magenta);color:#fff;font-size:10px;line-height:16px;font-family:var(--f-mono)}
.tabs button{position:relative}
.label{margin:22px 0 10px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:-.01em}
.disp{font-family:var(--f-display);font-style:italic}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--ink);color:var(--bg);font-weight:650;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--rule)}
.btn.mag{background:var(--magenta);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btnrow>.btn{flex:1}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:12px}
.hero{position:relative;margin:0 -16px;padding:18px 16px 16px;background-color:var(--water);background-image:linear-gradient(var(--water-2) 1px,transparent 1px),linear-gradient(90deg,var(--water-2) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px;border-bottom:1px solid var(--rule);overflow:hidden}
.hero .rose{position:absolute;right:-26px;top:-22px;width:150px;height:150px;opacity:.22;color:var(--ink)}
.hero h2{margin:0;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:34px;line-height:1.05}
.hero .sub{margin:6px 0 0;color:var(--ink-2);font-size:14px;max-width:30em}
.count{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.count .n{font-family:var(--f-display);font-style:italic;font-size:56px;line-height:.9;color:var(--magenta)}
.count .t{font-size:14px;line-height:1.3;color:var(--ink-2)}
.count .t b{color:var(--ink)}
.logbook{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.logbook>div{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:9px 10px 10px}
.logbook .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.logbook .v{font-family:var(--f-display);font-style:italic;font-size:24px;line-height:1.1}
.logbook .v small{font-family:var(--f-mono);font-style:normal;font-size:11px;color:var(--ink-3)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;width:0;background:var(--magenta);border-radius:inherit;transition:width .5s ease}
.bar.ok>i{background:var(--ok)}
.rank{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.rank .r{font-weight:700}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:14px;border:1px solid var(--rule);background:var(--surface);text-align:left;box-shadow:var(--shadow)}
.quick button b{font-size:15px}
.quick button span{font-size:12px;color:var(--ink-2)}
.route{position:relative;margin-top:6px}
.route::before{content:'';position:absolute;left:27px;top:28px;bottom:28px;border-left:2px dashed var(--magenta);opacity:.55}
.wp{position:relative;display:grid;grid-template-columns:56px 1fr 16px;gap:12px;align-items:center;width:100%;padding:9px 0;border:0;background:transparent;text-align:left}
.wp .fl{justify-self:center;width:46px;height:31px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18),0 2px 6px -2px rgba(0,0,0,.35);overflow:hidden;background:var(--bg)}
.fl svg,.flag svg{display:block;width:100%;height:100%}
.wp .k{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.wp .ti{display:block;font-weight:650;line-height:1.25}
.wp .me{display:flex;align-items:center;gap:8px;margin-top:3px}
.wp .chev{color:var(--ink-3);font-size:20px}
.wp.next .ti{color:var(--magenta)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--magenta-soft);color:var(--magenta);font-size:11px;font-weight:700;letter-spacing:.02em;vertical-align:1px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--land);color:var(--ink)}
.tag.off{background:var(--surface-2);color:var(--ink-2)}
.stars{font-size:13px;letter-spacing:1px;color:var(--rule);white-space:nowrap}
.stars i{font-style:normal}
.stars i.on{color:var(--gold)}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--ok)}
.thead{display:flex;gap:14px;align-items:flex-start;padding-top:16px}
.flag{flex:none;width:72px;height:48px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 4px 10px -4px rgba(0,0,0,.4)}
.thead h2{margin:0;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:26px;line-height:1.1}
.thead .law{margin-top:4px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.signal{margin-top:12px;font-size:13px;color:var(--ink-2)}
.notice{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--land);color:var(--ink);font-size:14px;line-height:1.45}
.notice b:first-child{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.stage{display:flex;align-items:center;gap:14px;width:100%;padding:14px;margin-bottom:10px;border:1px solid var(--rule);border-radius:14px;background:var(--surface);text-align:left;box-shadow:var(--shadow)}
.stage .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--magenta);color:var(--magenta);font-family:var(--f-display);font-style:italic;font-size:19px}
.stage.done .n{background:var(--ok);border-color:var(--ok);color:#fff;font-style:normal;font-size:16px}
.stage b{display:block}
.stage .s{display:block;font-size:13px;color:var(--ink-2)}
.prog{display:flex;align-items:center;gap:10px;margin:14px 0 12px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.prog .bar{flex:1;margin:0}
.lcard{position:relative;padding:20px 18px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);touch-action:pan-y}
.lcard h3{margin:0 0 10px;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:23px;line-height:1.15}
.lcard .body{font-size:16.5px;line-height:1.6}
.lcard .ref{margin-top:14px;padding-top:10px;border-top:1px dashed var(--rule);font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.tip{display:flex;gap:10px;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--magenta-soft);font-size:14.5px;line-height:1.45}
.tip svg{flex:none;width:24px;height:16px;margin-top:3px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.lcard.list+.lcard.list{margin-top:12px}
.q{margin:6px 0 16px;font-size:17px;line-height:1.5;font-weight:550}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;margin:0 0 10px;padding:13px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);text-align:left;line-height:1.42;transition:border-color .15s,background .15s}
.opt .l{flex:none;width:28px;height:28px;margin-top:-2px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--rule);font-family:var(--f-mono);font-size:13px}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel .l{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.fb{margin:6px 0 4px;padding:12px 14px;border-left:4px solid var(--ok);border-radius:0 12px 12px 0;background:var(--surface);box-shadow:var(--shadow);font-size:15px;line-height:1.5}
.fb.bad{border-left-color:var(--bad)}
.fb .h{display:block;font-weight:700;color:var(--ok);margin-bottom:2px}
.fb.bad .h{color:var(--bad)}
.tfcard{padding:22px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);font-size:19px;line-height:1.45;font-weight:550;min-height:150px;display:flex;align-items:center}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tfbtns button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:72px;padding:10px;border-radius:14px;border:0;color:#fff;font-weight:700;font-size:18px}
.tfbtns button span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.tfbtns .port{background:#C62828}
.tfbtns .stbd{background:#1F7A4D}
.tfbtns button:disabled{opacity:.35}
.hud{display:flex;align-items:center;gap:12px;margin:14px 0 10px}
.lives{display:flex;gap:4px}
.lives svg{width:24px;height:24px}
.lives svg.lost{opacity:.18;filter:grayscale(1)}
.tbar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.tbar>i{display:block;height:100%;background:var(--ink-2);border-radius:inherit;transition:width .25s linear}
.tbar.low>i{background:var(--bad)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs .col{display:flex;flex-direction:column;gap:8px}
.tile{min-height:58px;padding:9px 10px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);text-align:left;font-size:14px;line-height:1.3;box-shadow:var(--shadow);transition:background .15s,border-color .15s}
.tile.sel{border-color:var(--magenta);box-shadow:inset 0 0 0 2px var(--magenta)}
.tile.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);box-shadow:none}
.tile.no{animation:shake .35s;border-color:var(--bad)}
.cloze{padding:22px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);font-size:18.5px;line-height:1.6}
.blank{display:inline-block;min-width:4.2em;padding:0 6px;border-bottom:2px dashed var(--magenta);text-align:center;font-weight:700;color:var(--magenta)}
.blank.ok{color:var(--ok);border-bottom-style:solid;border-color:var(--ok)}
.blank.bad{color:var(--bad);border-bottom-style:solid;border-color:var(--bad)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.chips .opt{margin:0;justify-content:center;text-align:center;font-weight:650;font-size:16px}
.result{text-align:center;padding:26px 8px 6px}
.result .big{font-family:var(--f-display);font-style:italic;font-size:64px;line-height:1;color:var(--magenta)}
.result .big small{font-size:28px;color:var(--ink-3)}
.result h2{margin:10px 0 4px;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:26px}
.result .stars{font-size:30px;letter-spacing:6px}
.result .flag{margin:0 auto 14px}
.verdict{display:inline-block;margin-top:10px;padding:4px 14px;border-radius:99px;font-weight:800;letter-spacing:.12em;font-size:14px}
.verdict.ok{background:var(--ok);color:#fff}
.verdict.bad{background:var(--bad);color:#fff}
.qgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:12px 0}
.qgrid button{aspect-ratio:1;padding:0;border-radius:7px;border:1px solid var(--rule);background:var(--surface);font-family:var(--f-mono);font-size:11px}
.qgrid button.ans{background:var(--water-2);border-color:var(--water-2)}
.qgrid button.cur{outline:2px solid var(--magenta);outline-offset:1px}
.qgrid button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qgrid button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.qgrid button.blank{background:var(--surface-2);color:var(--ink-3)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule)}
.list li:last-child{border-bottom:0}
.list .fl{flex:none;width:30px;height:20px;overflow:hidden;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.list button.li{display:flex;gap:12px;align-items:center;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.boxes>div{padding:8px 4px;border-radius:10px;background:var(--surface-2);text-align:center}
.boxes b{display:block;font-family:var(--f-display);font-style:italic;font-size:22px;line-height:1.1}
.boxes span{font-size:10.5px;color:var(--ink-2)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badges>div{padding:12px 8px;border-radius:12px;border:1px dashed var(--rule);text-align:center;font-size:12px;line-height:1.3;color:var(--ink-3)}
.badges>div.on{border-style:solid;border-color:var(--gold);color:var(--ink);background:var(--surface)}
.badges .ic{display:block;font-size:22px;margin-bottom:4px;filter:grayscale(1);opacity:.5}
.badges .on .ic{filter:none;opacity:1}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);gap:3px}
.seg button{padding:7px 12px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
.dl dt{color:var(--ink-2)}
.dl dd{margin:0;font-weight:600}
.prose{font-size:15px;line-height:1.55}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:20px}
.prose li{margin-bottom:4px}
.toast{position:fixed;left:50%;top:66px;z-index:70;transform:translateX(-50%);padding:6px 14px;border-radius:99px;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:13px;pointer-events:none;animation:toast 1.6s ease forwards}
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(6,12,20,.55)}
.modal>div{width:100%;max-width:400px;padding:20px;border-radius:18px;background:var(--surface);box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
.modal h3{margin:0 0 6px;font-family:var(--f-display);font-style:italic;font-size:22px}
.empty{padding:28px 10px;text-align:center;color:var(--ink-2)}
.empty svg{width:64px;height:64px;color:var(--ink-3);margin-bottom:8px}

<script type="application/json" id="pper-data">{"version":"2026.11.24","exam":{"name":"Primera convocatoria de 2027","approx":true,"date":"2027-04-17","enrolFrom":"2027-03-01","enrolTo":"2027-03-15","place":"Madrid (lugar por confirmar)","prev":"En 2026 fue el sábado 18 de abril, con matrícula del 1 al 15 de marzo; la segunda, el 21 de noviembre.","questions":30,"options":4,"minutes":60,"pass":18},"topics":[{"id":1,"title":"Puertos del Estado y Marina Mercante","law":"Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante (RDL 2/2011, TRLPEMM)","scope":"Título preliminar cap. III (arts. 6-10) · Libro III, títulos III y IV (arts. 297-320)","intro":"Qué es la Marina Mercante, las zonas y tipos de navegación, las medidas para proteger la navegación y el régimen de infracciones y sanciones.","update":null,"weight":2,"cards":[{"t":"Qué es Marina Mercante","b":"Incluye el transporte marítimo (salvo el que va solo entre puertos de una misma Comunidad Autónoma con competencias), la flota civil, la seguridad de la navegación y de la vida humana en la mar, el salvamento, la prevención de la contaminación desde buques, la inspección, el tráfico y las comunicaciones marítimas y el abanderamiento, registro y despacho de buques.","ref":"Art. 6.1","tip":"No es Marina Mercante la ordenación de la flota pesquera ni la inspección en el ámbito pesquero (art. 6.2)."},{"t":"Objetivos de la política de Marina Mercante","b":"Tutela de la seguridad de la vida humana en la mar, de la navegación y de la seguridad marítima; protección del medio ambiente marino; servicios de transporte que necesite el país; navegaciones de interés público; autopistas del mar y competencia en el transporte marítimo.","ref":"Art. 7"},{"t":"Zonas marítimas","b":"Las \u003cb>aguas interiores\u003c/b> quedan dentro de las líneas de base (incluyen puertos y ríos navegables hasta donde haya puertos de interés general). El \u003cb>mar territorial\u003c/b> llega a \u003cb>12 millas\u003c/b>, la \u003cb>zona contigua\u003c/b> a \u003cb>24 millas\u003c/b> y la \u003cb>zona económica exclusiva\u003c/b> a \u003cb>200 millas\u003c/b>, todas contadas desde las líneas de base.","ref":"Art. 8.1"},{"t":"Tipos de navegación por su ámbito","b":"\u003cb>Interior\u003c/b>: dentro de un puerto o de aguas interiores. \u003cb>Cabotaje\u003c/b>: entre puertos o puntos de zonas españolas. \u003cb>Exterior\u003c/b>: entre zonas españolas y puntos de fuera. \u003cb>Extranacional\u003c/b>: entre puntos situados fuera de las zonas españolas.","ref":"Art. 8.2","tip":"Por sus condiciones de prestación, la navegación es regular (línea con itinerario, frecuencia y tarifas) o no regular (art. 8.3)."},{"t":"Flota civil y buque civil","b":"La flota civil española está formada por la flota mercante, la pesquera, los buques de recreo y deportivos y los demás buques civiles. \u003cb>Buque civil\u003c/b> es cualquier embarcación, plataforma o artefacto flotante, con o sin desplazamiento, apto para navegar y no afecto a la defensa nacional.","ref":"Art. 9.1-9.2"},{"t":"Buque mercante, plataforma fija y naviero","b":"\u003cb>Buque mercante\u003c/b>: buque civil con propósito mercantil, excluida la pesca. \u003cb>Plataforma fija\u003c/b>: instalación emplazada sobre el lecho marino, anclada o apoyada (no lo son oleoductos, gasoductos ni cables submarinos). \u003cb>Empresa naviera\u003c/b>: quien explota buques mercantes propios o ajenos, aunque no sea su actividad principal.","ref":"Arts. 9.3, 9.4 y 10"},{"t":"Medidas de garantía de la navegación","b":"El Ministerio, a través de Autoridades Portuarias y Capitanías Marítimas, puede visitar, inspeccionar, condicionar el fondeo y apresar buques. Si un buque estorba el acceso a un puerto o sale a la mar incumpliendo gravemente el despacho, el \u003cb>Capitán Marítimo\u003c/b> puede ordenar su detención, fondeo y retención.","ref":"Arts. 297-298"},{"t":"Buques necesitados de asistencia","b":"El \u003cb>Director General de la Marina Mercante\u003c/b> decide sobre los buques en peligro de naufragar o que amenacen la navegación o el medio marino, y sobre su acogida en un \u003cb>lugar de refugio\u003c/b>. Puede apoyarse en un Comité técnico.","ref":"Art. 299","tip":"No puede condicionar la acogida a que exista un seguro o una garantía del propietario."},{"t":"Buque abandonado","b":"Se considera abandonado el buque que permanece \u003cb>más de 3 meses\u003c/b> atracado, amarrado o fondeado en el mismo lugar del puerto, \u003cb>sin actividad apreciable\u003c/b> exteriormente \u003cb>y sin pagar\u003c/b> tasas o tarifas, \u003cb>y así lo declara el Consejo de Administración de la Autoridad Portuaria\u003c/b>. Pasa a ser del Estado y se vende en pública subasta o se hunde.","ref":"Art. 302","tip":"Las condiciones son acumulativas («y»), no alternativas («o»)."},{"t":"Desguace y hundimiento","b":"El desguace en aguas portuarias exige \u003cb>informe vinculante del Capitán Marítimo\u003c/b>. Ante peligro de hundimiento en puerto actúa la \u003cb>Autoridad Portuaria\u003c/b>, previo informe de la Capitanía; fuera de las aguas portuarias es competente el Capitán Marítimo.","ref":"Arts. 303-304","tip":"El informe de Pesca y Medio Ambiente se entiende positivo si no llega en 15 días."},{"t":"Gravedad de las infracciones","b":"\u003cb>Grave\u003c/b>: lesión con baja de hasta 7 días, daños entre 1.200 y 6.000 €, peligro para el buque o la navegación, o reincidencia en leves. \u003cb>Muy grave\u003c/b>: baja de más de 7 días, daños de más de 6.000 €, grave peligro o reincidencia en graves.","ref":"Arts. 307-308"},{"t":"Infracciones graves típicas","b":"Navegar sin nombre, número OMI o folio; sin patente de navegación; sin estar matriculado o con certificados caducados; \u003cb>sin los sistemas de señalización para la localización y visualización permanente\u003c/b>; exceder la velocidad en la franja de \u003cb>200 m en playas y 50 m\u003c/b> en el resto de la costa; traspasar las atribuciones del título; no comunicar accidentes.","ref":"Art. 307"},{"t":"Infracciones muy graves típicas","b":"Navegar sin condiciones de navegabilidad; usar sin necesidad señales de socorro; incumplir la dotación mínima de seguridad; denegar auxilio; \u003cb>capitán, patrón o práctico\u003c/b> bajo los efectos del alcohol o drogas; evacuación deliberada de residuos.","ref":"Art. 308","tip":"Alcohol o drogas: persona embarcada que pone en peligro el buque, leve; tripulante, grave; capitán, patrón o práctico, muy grave."},{"t":"Prescripción","b":"Las infracciones y las sanciones prescriben a los \u003cb>5 años\u003c/b> (muy graves), \u003cb>3 años\u003c/b> (graves) y \u003cb>1 año\u003c/b> (leves).","ref":"Arts. 309 y 312.12"},{"t":"Quién responde","b":"En buques \u003cb>mercantes\u003c/b>: la empresa naviera titular de la actividad o, \u003cb>en su defecto\u003c/b>, el capitán. En buques de \u003cb>recreo\u003c/b>: el propietario o el directamente responsable, y \u003cb>subsidiariamente\u003c/b> el capitán o patrón. En \u003cb>contaminación\u003c/b> desde buques responden \u003cb>solidariamente\u003c/b> naviero, propietario, asegurador de la responsabilidad civil y capitán.","ref":"Art. 310.2"},{"t":"Multas","b":"Leves: hasta 60.000 €. Graves: seguridad marítima hasta 180.000 €, tráfico marítimo hasta 120.000 €, contaminación hasta 601.000 €. Muy graves: seguridad marítima hasta 901.000 €, tráfico hasta 300.000 €, contaminación hasta 3.005.000 €.","ref":"Art. 312"},{"t":"Suspensión del título profesional","b":"Por infracciones contra la seguridad marítima cometidas por capitán, patrón, práctico o dotación: graves, hasta \u003cb>1 año\u003c/b> (la acuerda el Director General de la Marina Mercante); muy graves, de \u003cb>1 a 5 años\u003c/b> (el Ministro, a propuesta de la DGMM).","ref":"Art. 312.10"},{"t":"Quién sanciona","b":"\u003cb>Capitanes Marítimos\u003c/b>: leves contra la seguridad marítima, el tráfico marítimo o por contaminación desde buques. \u003cb>Director General de la Marina Mercante\u003c/b>: graves en esas materias. \u003cb>Secretario de Estado\u003c/b>: muy graves de menos de 1.202.000 €. \u003cb>Ministro\u003c/b>: muy graves de más de 1.202.000 €.","ref":"Art. 315"},{"t":"Principios y medidas no sancionadoras","b":"Si un hecho encaja en dos infracciones, se aplica la de mayor sanción. Si puede ser delito, pasa al Ministerio Fiscal y se suspende el expediente; la sanción penal excluye la administrativa. Además de la multa caben la restitución, la indemnización, la caducidad del título o la denegación de escala o salida.","ref":"Arts. 311 y 313"},{"t":"Criterios de graduación","b":"La cuantía depende del beneficio obtenido, la relevancia externa de la conducta, la negligencia o intencionalidad, el daño causado y el número de infracciones.","ref":"Art. 314"},{"t":"Diario y retención del buque","b":"El capitán anota en el \u003cb>diario de navegación o en el rol\u003c/b> los hechos que puedan ser infracción; el asiento lo firman él y el interesado o, si se niega, \u003cb>dos testigos\u003c/b>. El Capitán Marítimo puede retener el buque como medida cautelar, sustituible por aval suficiente a juicio de la DGMM.","ref":"Arts. 319-320"}],"tf":[{"s":"El mar territorial se extiende hasta 12 millas contadas desde las líneas de base.","a":true,"e":"Art. 8.1: 12 millas náuticas desde las líneas de base."},{"s":"La zona contigua llega hasta las 200 millas desde las líneas de base.","a":false,"e":"La zona contigua llega a 24 millas; 200 millas es la zona económica exclusiva (art. 8.1)."},{"s":"La ordenación de la flota pesquera forma parte de la Marina Mercante.","a":false,"e":"El art. 6.2 la excluye expresamente."},{"s":"La navegación extranacional es la que se hace entre puntos situados fuera de las zonas españolas.","a":true,"e":"Art. 8.2."},{"s":"Un buque civil puede estar afecto al servicio de la defensa nacional.","a":false,"e":"Buque civil es el apto para navegar y NO afecto a la defensa nacional (art. 9.2)."},{"s":"Los oleoductos y los cables submarinos se consideran plataformas fijas.","a":false,"e":"El art. 9.4 los excluye expresamente."},{"s":"Un buque es abandonado si lleva más de 3 meses en el puerto sin actividad, sin pagar tasas y así lo declara el Consejo de Administración de la Autoridad Portuaria.","a":true,"e":"Art. 302.2: las tres condiciones son acumulativas."},{"s":"El Director General de la Marina Mercante puede exigir un seguro como condición para acoger a un buque en un lugar de refugio.","a":false,"e":"Art. 299.2: no puede condicionar la acogida a la existencia de seguro o garantía."},{"s":"Navegar sin haber obtenido la patente de navegación es una infracción grave.","a":true,"e":"Art. 307.3.p."},{"s":"Usar señales de socorro sin necesidad es una infracción leve.","a":false,"e":"Es muy grave (art. 308.2.d)."},{"s":"Las infracciones graves prescriben a los 3 años.","a":true,"e":"Art. 309.1: 5 años muy graves, 3 graves y 1 leves."},{"s":"En contaminación desde buques, el naviero, el propietario, el asegurador y el capitán responden solidariamente.","a":true,"e":"Art. 310.2.d."},{"s":"Las infracciones leves contra la seguridad marítima las sanciona el Director General de la Marina Mercante.","a":false,"e":"Las leves las sancionan los Capitanes Marítimos; las graves, el Director General (art. 315)."},{"s":"La sanción penal no impide imponer además la sanción administrativa por los mismos hechos.","a":false,"e":"Art. 311.3: la sanción penal excluye la administrativa."}],"pairs":[{"title":"Cada zona con su límite","items":[["Mar territorial","12 millas"],["Zona contigua","24 millas"],["Zona económica exclusiva","200 millas"],["Aguas interiores","Dentro de las líneas de base"]]},{"title":"Alcohol o drogas a bordo: qué gravedad","items":[["Persona embarcada ebria que pone en peligro el buque","Leve"],["Tripulante ebrio que altera su capacidad","Grave"],["Patrón ebrio que altera su capacidad","Muy grave"]]},{"title":"Cada infracción con su gravedad","items":[["Señales acústicas no autorizadas en puerto","Leve"],["Navegar sin patente de navegación","Grave"],["Vertido no autorizado en la Zona II (exterior del puerto)","Grave"],["Vertido no autorizado en la Zona I (interior del puerto)","Muy grave"]]},{"title":"Quién sanciona","items":[["Leve contra la seguridad marítima","Capitán Marítimo"],["Grave contra el tráfico marítimo","Director General de la Marina Mercante"],["Muy grave de menos de 1.202.000 €","Secretario de Estado de Transportes"],["Muy grave de más de 1.202.000 €","Ministro de Transportes"]]}],"cloze":[{"s":"La zona económica exclusiva se extiende hasta ___ millas desde las líneas de base.","o":["24","100","200","12"],"a":2},{"s":"Un buque se considera abandonado tras más de ___ sin actividad apreciable y sin pagar tasas.","o":["1 mes","2 meses","3 meses","6 meses"],"a":2},{"s":"Las infracciones leves se sancionan con multa de hasta ___ euros.","o":["6.000","60.000","120.000","180.000"],"a":1},{"s":"Una infracción grave contra la seguridad marítima puede costar hasta ___ euros.","o":["120.000","180.000","601.000","901.000"],"a":1},{"s":"Excesos de velocidad en la franja de ___ metros en playas y 50 m en el resto de la costa son infracción grave.","o":["100","150","200","250"],"a":2},{"s":"Si el interesado se niega a firmar el asiento del diario, lo firman ___ testigos.","o":["uno","dos","tres","cuatro"],"a":1},{"s":"La suspensión del título por infracción muy grave dura entre 1 y ___ años.","o":["2","3","5","10"],"a":2},{"s":"Una lesión con baja de más de ___ días convierte la infracción en muy grave.","o":["3","7","15","30"],"a":1}]},{"id":2,"title":"Ley de Navegación Marítima (I)","law":"Ley 14/2014, de 24 de julio, de Navegación Marítima","scope":"Título preliminar · Título I caps. I-III · Título II cap. I · Título III cap. III (dotación y capitán)","intro":"Objeto de la ley, normas de policía, estancia en puerto, régimen general de la navegación, qué es buque, embarcación y artefacto, y la dotación y el capitán.","update":null,"weight":2,"cards":[{"t":"Objeto de la Ley 14/2014","b":"Regula las \u003cb>situaciones y relaciones jurídicas nacidas con ocasión de la navegación marítima\u003c/b>. También es navegación marítima la de ríos, canales, lagos o embalses accesibles desde el mar, hasta donde se note la marea, y los tramos de ríos hasta donde haya puertos de interés general.","ref":"Art. 1"},{"t":"Fuentes y buques de Estado","b":"Se aplica en tanto no contradiga los tratados internacionales y las normas de la UE; de forma supletoria, leyes y reglamentos complementarios, usos y costumbres y, por último, el Derecho común. \u003cb>No se aplica a los buques de Estado\u003c/b>, incluidos los de guerra, salvo que diga otra cosa.","ref":"Arts. 2-3"},{"t":"Ámbito de las normas de policía","b":"Se aplican a \u003cb>todos los buques\u003c/b> que estén en espacios marítimos españoles, y a los \u003cb>buques nacionales\u003c/b> estén donde estén. Lo dicho para buques vale para artefactos navales según su naturaleza y, salvo previsión en contra, para embarcaciones.","ref":"Arts. 4-6"},{"t":"Entrada y cierre de puertos","b":"La autorización para entrar en puerto la da la \u003cb>Administración portuaria\u003c/b>. El \u003cb>cierre temporal\u003c/b> de puertos y terminales lo ordena la \u003cb>Autoridad Portuaria, previo informe de la Capitanía Marítima\u003c/b>. La Administración Marítima puede proponer prohibir la navegación por mal tiempo, obstáculos o seguridad.","ref":"Arts. 7-8"},{"t":"Arribada forzosa, consignatario y polizones","b":"En arribada forzosa se comunican las causas a la Administración Marítima. Todo buque extranjero necesita \u003cb>consignatario\u003c/b> en puerto español, salvo las \u003cb>embarcaciones de recreo\u003c/b>, que puede representar su propietario o capitán. El capitán debe avisar de los polizones y mantenerlos a bordo en condiciones dignas.","ref":"Arts. 9-11","tip":"Los gastos de los polizones los pagan solidariamente armador y consignatario."},{"t":"Jurisdicción sobre buques extranjeros","b":"Los tribunales españoles tienen jurisdicción civil y penal sobre los buques extranjeros (salvo los de Estado) mientras estén en puertos o aguas interiores. Para entrar y registrar el buque basta comunicarlo al cónsul del pabellón.","ref":"Art. 12"},{"t":"Buques inactivos y despacho","b":"La \u003cb>Autoridad Portuaria\u003c/b> autoriza el atraque o fondeo de buques inactivos y la Administración Marítima fija su dotación de seguridad. Para hacerse a la mar todo buque necesita el \u003cb>despacho\u003c/b> de la Administración Marítima, previa presentación de la Declaración General; las embarcaciones de recreo tienen un régimen simplificado.","ref":"Arts. 16 y 18"},{"t":"Detención y fondeo","b":"Navegar no da derecho a detenerse o fondear fuera de los puertos, salvo \u003cb>fuerza mayor\u003c/b>, autorización de la Administración Marítima o \u003cb>embarcaciones de recreo en calas o lugares de baño no balizados\u003c/b>, sin poner en peligro la navegación.","ref":"Art. 21","tip":"Quien fondee por peligro o fuerza mayor debe comunicarlo de inmediato a la Administración Marítima más próxima."},{"t":"Pabellón y submarinos","b":"Los buques deben estar abanderados en \u003cb>un solo Estado\u003c/b>, llevar nombre y puerto de matrícula y llevar izado el pabellón en aguas interiores y en puerto. Los extranjeros (salvo los de guerra) enarbolan además el pabellón español. Los submarinos extranjeros navegan en superficie con pabellón.","ref":"Art. 22"},{"t":"Zona contigua, pesca e investigación","b":"En la zona contigua España controla las infracciones aduaneras, fiscales, sanitarias y de inmigración. Los buques extranjeros no pueden pescar en aguas interiores ni en el mar territorial salvo autorización. La investigación científica extranjera necesita autorización.","ref":"Arts. 23-26"},{"t":"Hielos y avisos de los capitanes","b":"Todos los buques cumplen el Reglamento para prevenir abordajes. Con hielos en la derrota, de noche se navega a velocidad moderada o se cambia el rumbo. Los capitanes avisan de fallos en el balizamiento, hielos, derrelictos y temporales extraordinarios.","ref":"Arts. 27-29","tip":"Cartas náuticas, Derroteros, Libro de Faros y Avisos a los Navegantes son del Ministerio de Defensa (art. 28.2)."},{"t":"Sistemas de tráfico marítimo","b":"Solo pueden ser de \u003cb>empleo obligatorio\u003c/b> si están en \u003cb>aguas interiores o mar territorial\u003c/b> y, con aprobación de la OMI, en la zona económica exclusiva. Alrededor de artefactos y plataformas hay zonas de seguridad de hasta \u003cb>500 metros\u003c/b>.","ref":"Arts. 30-31"},{"t":"Contaminación","b":"La Administración Marítima tiene un plan nacional de lucha contra la contaminación. Los capitanes de buques nacionales notifican sin demora cualquier contaminación que conozcan a la Administración Marítima y al Estado ribereño más próximo.","ref":"Arts. 32-34"},{"t":"Buque, embarcación y artefacto","b":"\u003cb>Buque\u003c/b>: vehículo con cubierta corrida y eslora de \u003cb>24 m o más\u003c/b>. \u003cb>Embarcación\u003c/b>: sin cubierta corrida o de eslora menor de 24 m. \u003cb>Artefacto naval\u003c/b>: construcción flotante destinada a quedar en un punto fijo, o el buque amarrado, varado o fondeado permanentemente para otra actividad.","ref":"Arts. 56-58"},{"t":"Plataforma fija y naturaleza del buque","b":"La \u003cb>plataforma fija\u003c/b> es \u003cb>bien inmueble\u003c/b> según el Código Civil, porque está sujeta al fondo. El \u003cb>buque es un bien mueble registrable\u003c/b>, con partes integrantes, pertenencias y accesorios; se identifica por nombre, matrícula, número OMI, pabellón y arqueo.","ref":"Arts. 59-61"},{"t":"Adquisición del buque","b":"Debe constar por escrito y, para afectar a terceros, inscribirse en el Registro de Bienes Muebles. También se adquiere por \u003cb>posesión de buena fe durante 3 años\u003c/b> con justo título registrado, o por \u003cb>10 años\u003c/b> de posesión continuada si falta algún requisito.","ref":"Arts. 62-63","tip":"Los negocios sobre el buque incluyen partes integrantes y pertenencias, pero no los accesorios, salvo pacto."},{"t":"Dotación","b":"Es el conjunto de personas empleadas a bordo, contratadas por el armador o por terceros. Ningún español puede formar parte de la dotación de buques mercantes sin el \u003cb>Documento de Identidad del Marino o Libreta Marítima\u003c/b>, salvo urgencia. Categorías: capitán, oficiales y subalternos.","ref":"Arts. 156-160"},{"t":"Dotación mínima de seguridad","b":"La fija la \u003cb>Administración Marítima\u003c/b> para cada buque, según sus circunstancias técnicas, de navegación y de tráfico y la organización del trabajo a bordo. Expide un \u003cb>Certificado de Dotación Mínima de Seguridad\u003c/b> que va a bordo.","ref":"Art. 161"},{"t":"Nacionalidad de la dotación","b":"Capitán y primer oficial de cubierta: nacionales del \u003cb>Espacio Económico Europeo\u003c/b> (o españoles si ejercen poder público). En buques mercantes, el resto de la dotación debe ser española o del EEE \u003cb>al menos en un 50 %\u003c/b>.","ref":"Art. 162"},{"t":"El capitán","b":"Ostenta el mando y la dirección del buque, la jefatura de la dotación y \u003cb>representa a bordo la autoridad pública\u003c/b>. Lo nombra y cesa el \u003cb>armador\u003c/b>. Si falta, manda el oficial de cubierta de mayor jerarquía y, en último término, los de máquinas.","ref":"Arts. 171-176"},{"t":"El capitán como encargado del Registro Civil","b":"Extiende en el \u003cb>Diario de Navegación\u003c/b> las actas de nacimientos, defunciones y matrimonios en peligro de muerte; autoriza el testamento marítimo. Sin médico, firma el certificado de defunción, pero no antes de \u003cb>24 horas\u003c/b> desde las señales inequívocas de muerte.","ref":"Arts. 178-179","tip":"El inventario de pertenencias del fallecido se hace con dos oficiales y dos testigos."},{"t":"Lanzamiento del cadáver al mar","b":"Solo si no puede conservarse a bordo. Se anota en el Diario con fecha, hora, situación, que fue amortajado y lastrado al uso marinero y la presencia de \u003cb>al menos dos testigos\u003c/b>.","ref":"Art. 180"},{"t":"Obligaciones técnicas y de auxilio","b":"El capitán asume el gobierno en recaladas y maniobras de entrada y salida. Solo abandona el buque cuando pierde la esperanza de salvarlo. Debe auxiliar a las vidas en peligro \u003cb>si puede hacerlo sin grave peligro\u003c/b> para su buque, dotación o pasajeros.","ref":"Arts. 182-184"},{"t":"Accidentes y protesta de mar","b":"El capitán comunica de inmediato los accidentes a la Capitanía Marítima o al cónsul y se presenta a declarar en las \u003cb>24 horas hábiles\u003c/b> siguientes a la llegada a puerto. Puede levantar \u003cb>protesta de mar\u003c/b> si de los hechos pudiera deducirse su responsabilidad.","ref":"Arts. 186-187"}],"tf":[{"s":"La Ley 14/2014 se aplica a los buques de guerra.","a":false,"e":"Art. 3: no se aplica a los buques de Estado, incluidos los de guerra, salvo que la ley diga otra cosa."},{"s":"El cierre temporal de un puerto lo ordena la Autoridad Portuaria, previo informe de la Capitanía Marítima.","a":true,"e":"Art. 8.1."},{"s":"Las embarcaciones de recreo extranjeras necesitan siempre un consignatario en los puertos españoles.","a":false,"e":"Art. 10.2: pueden ser representadas directamente por su propietario o capitán."},{"s":"Una embarcación de recreo puede detenerse a fondear en una cala no balizada sin autorización expresa.","a":true,"e":"Art. 21.1, siempre que no ponga en peligro la vida humana o la navegación."},{"s":"Un buque puede estar abanderado en dos Estados para navegar por aguas españolas.","a":false,"e":"Art. 22.1: debe estar abanderado en un solo Estado."},{"s":"Los sistemas de tráfico marítimo pueden ser obligatorios en la zona contigua sin más requisitos.","a":false,"e":"Art. 30.3: solo en aguas interiores y mar territorial, y en la ZEE si lo aprueba la OMI."},{"s":"Las zonas de seguridad alrededor de las plataformas fijas no exceden, en principio, de 500 metros.","a":true,"e":"Art. 31.2."},{"s":"Se entiende por buque el vehículo con cubierta corrida y eslora igual o superior a 24 metros.","a":true,"e":"Art. 56."},{"s":"La plataforma fija es un bien mueble registrable.","a":false,"e":"Art. 59.2: es bien inmueble. El bien mueble registrable es el buque (art. 60)."},{"s":"La propiedad de un buque se adquiere por posesión de buena fe durante 3 años con justo título registrado.","a":true,"e":"Art. 63.2. Sin alguno de esos requisitos hacen falta 10 años."},{"s":"La dotación mínima de seguridad la fija el capitán antes de cada viaje.","a":false,"e":"Art. 161.2: la establece la Administración Marítima."},{"s":"El nombramiento y cese del capitán corresponde al armador.","a":true,"e":"Art. 172."},{"s":"El capitán puede extender el certificado de defunción en cuanto aprecie la muerte.","a":false,"e":"Art. 179.2: no antes de 24 horas desde las señales inequívocas de muerte."},{"s":"El capitán debe presentarse a declarar sobre un accidente en las 24 horas hábiles siguientes a su llegada a puerto.","a":true,"e":"Art. 186.2."}],"pairs":[{"title":"Quién lo hace","items":[["Autorizar la entrada en puerto","Administración portuaria"],["Ordenar el cierre temporal de un puerto","Autoridad Portuaria (previo informe de Capitanía)"],["Fijar la dotación mínima de seguridad","Administración Marítima"],["Publicar cartas náuticas y Avisos a los Navegantes","Ministerio de Defensa"],["Nombrar y cesar al capitán","Armador"]]},{"title":"Cada concepto con su definición","items":[["Buque","Cubierta corrida y eslora ≥ 24 m"],["Embarcación","Sin cubierta corrida o eslora &lt; 24 m"],["Artefacto naval","Flotante destinado a un punto fijo"],["Plataforma fija","Bien inmueble apoyado en el lecho"]]}],"cloze":[{"s":"El buque tiene cubierta corrida y una eslora igual o superior a ___ metros.","o":["12","15","20","24"],"a":3},{"s":"Las zonas de seguridad alrededor de plataformas fijas no exceden de ___ metros.","o":["200","500","1.000","1 milla"],"a":1},{"s":"Sin justo título registrado, la propiedad del buque se adquiere por posesión continuada de ___ años.","o":["3","5","10","20"],"a":2},{"s":"En buques mercantes, el resto de la dotación debe ser española o del EEE al menos en un ___ %.","o":["25","50","75","100"],"a":1},{"s":"El certificado de defunción no se extiende antes de ___ horas desde las señales inequívocas de muerte.","o":["6","12","24","48"],"a":2},{"s":"El lanzamiento de un cadáver al mar requiere la presencia de al menos ___ testigos.","o":["uno","dos","tres","cuatro"],"a":1}]},{"id":3,"title":"Administración marítima central","law":"TRLPEMM (libro II, título II, cap. I) · RD 253/2024 (estructura del Ministerio de Transportes y Movilidad Sostenible) · RD 1009/2023","scope":"Arts. 263-265 TRLPEMM · art. 7 y 9 RD 253/2024 · art. 6 RD 1009/2023","intro":"Competencias del Ministerio en materia marítima, el servicio público de salvamento y la estructura y funciones de la Dirección General de la Marina Mercante.","update":"Tus apuntes citan el RD 362/2017 y el RD 424/2016 (Ministerio de Fomento). El temario 2026 exige el RD 253/2024 y el RD 1009/2023 (Ministerio de Transportes y Movilidad Sostenible); este tema ya está actualizado.","weight":1,"cards":[{"t":"Competencias del Ministerio","b":"Al Ministerio (hoy de Transportes y Movilidad Sostenible) le corresponde la \u003cb>ordenación general de la navegación marítima y de la flota civil\u003c/b>, salvo lo relativo a la flota pesquera y al sector pesquero, que es del ministerio de Pesca.","ref":"Art. 263 TRLPEMM"},{"t":"Qué competencias concretas tiene","b":"Seguridad de la vida humana en la mar y de la navegación; salvamento y lucha contra la contaminación del medio marino; registro, abanderamiento y despacho; concesiones de servicios de navegación; inspecciones técnicas y radioeléctricas; control del tráfico marítimo; personal marítimo y dotaciones mínimas; Comisión de Faros; potestad sancionadora.","ref":"Art. 263 a)-l)","tip":"Los vertidos procedentes de tierra son competencia de las Comunidades Autónomas."},{"t":"Inspecciones: directas o por entidades","b":"Las inspecciones y controles técnicos, radioeléctricos, de seguridad y de prevención de la contaminación los puede hacer el Ministerio \u003cb>directamente o a través de Entidades Colaboradoras\u003c/b>, que actúan bajo sus criterios y cobran para cubrir sus costes.","ref":"Art. 263.e"},{"t":"Servicio público de salvamento","b":"Lo presta la Administración General del Estado junto con las demás Administraciones competentes, bajo el \u003cb>principio de coordinación\u003c/b>, a través de planes y programas que integran los medios de todas ellas.","ref":"Art. 264.1"},{"t":"Plan Nacional de Servicios Especiales de Salvamento","b":"Lo aprueba el \u003cb>Gobierno, a propuesta del Ministro\u003c/b>. Se desarrolla mediante \u003cb>programas sectoriales y territoriales\u003c/b> que aprueba el Ministerio. Los planes autonómicos deben ajustarse a sus directrices.","ref":"Art. 264.2-3"},{"t":"Objetivos del Plan Nacional","b":"Coordinar los medios de búsqueda, salvamento y lucha contra la contaminación de todas las Administraciones e instituciones; implantar un \u003cb>control de tráfico marítimo que cubra todas las costas\u003c/b> con centros coordinadores regionales y locales; potenciar los medios y formar al personal.","ref":"Art. 264.2 a)-c)"},{"t":"Comisión Nacional de Salvamento Marítimo","b":"Es el \u003cb>órgano de coordinación de las Administraciones públicas competentes\u003c/b> en la planificación y el seguimiento de los objetivos del Plan. Su composición y funciones se fijan por reglamento. Está adscrita a la Secretaría General de Transportes Aéreo y Marítimo a través de la DGMM.","ref":"Art. 264.4 TRLPEMM · art. 7.6 RD 253/2024"},{"t":"Comunidades Autónomas","b":"Las que lo recojan en su Estatuto ejecutan la legislación del Estado en salvamento marítimo en las aguas territoriales de su litoral, \u003cb>incluida la potestad sancionadora\u003c/b>.","ref":"Art. 264.5"},{"t":"CIAIM","b":"El artículo 265 regulaba la Comisión Permanente de Investigación de Accidentes e Incidentes Marítimos. \u003cb>Está derogado desde 2024\u003c/b> (Ley 2/2024): la investigación de accidentes tiene ahora su propia ley.","ref":"Art. 265 (derogado)"},{"t":"Estructura del Ministerio","b":"Ministerio de Transportes y Movilidad Sostenible → \u003cb>Secretaría de Estado de Transportes y Movilidad Sostenible\u003c/b> → \u003cb>Secretaría General de Transportes Aéreo y Marítimo\u003c/b> → Dirección General de Aviación Civil y \u003cb>Dirección General de la Marina Mercante\u003c/b>.","ref":"Art. 6 RD 1009/2023 · art. 7 RD 253/2024"},{"t":"SASEMAR dentro del Ministerio","b":"La Sociedad de Salvamento y Seguridad Marítima (SASEMAR) está adscrita a la Secretaría General de Transportes Aéreo y Marítimo, bajo la dirección de la Secretaría de Estado, \u003cb>a través de la Dirección General de la Marina Mercante\u003c/b>.","ref":"Art. 7.5 RD 253/2024"},{"t":"Dirección General de la Marina Mercante","b":"Es el \u003cb>órgano competente para la ordenación general de la navegación marítima y de la flota civil española\u003c/b>, en los términos del TRLPEMM y de la Ley 14/2014.","ref":"Art. 9.1 RD 253/2024"},{"t":"Funciones DGMM: tráfico y seguridad","b":"Control del tráfico marítimo y del despacho; registro y abanderamiento; salvamento y bienes naufragados; seguridad de la navegación y protección marítima, \u003cb>incluidos los riesgos cibernéticos\u003c/b>; centros de formación marítima; Comisión de Faros; coordinación de emergencias marítimas.","ref":"Art. 9.1 a)-c)"},{"t":"Funciones DGMM: recreo y personal","b":"Ordenación de la \u003cb>náutica de recreo y gestión de las titulaciones náuticas\u003c/b>; registro del personal marítimo civil; Certificado de Trabajo Marítimo y Declaración de Conformidad Laboral Marítima (Convenio OIT 2006); Certificado de Trabajo en la Pesca (Convenio 188 OIT).","ref":"Art. 9.1 d)-g)"},{"t":"Funciones DGMM: buques y medio ambiente","b":"Dotaciones mínimas de seguridad y equipamiento según SOLAS y MARPOL; inspecciones y control como \u003cb>Estado rector del puerto\u003c/b>; supervisión de organizaciones reconocidas y entidades colaboradoras; emisiones y descarbonización; lucha contra la contaminación; agua de lastre; seguridad de instalaciones marinas como la eólica.","ref":"Art. 9.1 h)-o)"},{"t":"Funciones DGMM: gestión","b":"Normativa marítima y transposición de normas de la UE y la OMI; expedientes sancionadores; régimen tarifario y obligaciones de servicio público; \u003cb>bonificaciones\u003c/b> al transporte de residentes en Canarias, Baleares, Ceuta y Melilla y familias numerosas; coordinación de Capitanías y Distritos Marítimos.","ref":"Art. 9.1 p)-x)"},{"t":"Subdirecciones de la DGMM","b":"Tres: \u003cb>Seguridad, Contaminación e Inspección Marítima\u003c/b>; \u003cb>Normativa Marítima y Cooperación Internacional\u003c/b>; \u003cb>Coordinación y Gestión Administrativa\u003c/b>.","ref":"Art. 9.2 RD 253/2024"}],"tf":[{"s":"La ordenación del sector pesquero es competencia del Ministerio de Transportes en materia de Marina Mercante.","a":false,"e":"Art. 263: queda exceptuada y corresponde al ministerio competente en pesca."},{"s":"Las inspecciones técnicas de buques pueden hacerse a través de Entidades Colaboradoras.","a":true,"e":"Art. 263.e."},{"s":"El Plan Nacional de Servicios Especiales de Salvamento lo aprueba el Ministro de Transportes.","a":false,"e":"Lo aprueba el Gobierno a propuesta del Ministro (art. 264.2). El Ministerio aprueba los programas que lo desarrollan."},{"s":"La Comisión Nacional de Salvamento Marítimo coordina a las Administraciones públicas competentes en la planificación del salvamento.","a":true,"e":"Art. 264.4."},{"s":"Las Comunidades Autónomas con competencia estatutaria pueden ejercer la potestad sancionadora en salvamento marítimo en sus aguas territoriales.","a":true,"e":"Art. 264.5."},{"s":"La Dirección General de la Marina Mercante depende de la Secretaría General de Transportes Aéreo y Marítimo.","a":true,"e":"Art. 7.2 RD 253/2024 y art. 6 RD 1009/2023."},{"s":"SASEMAR depende directamente de la Subsecretaría del Ministerio.","a":false,"e":"Está adscrita a la Secretaría General de Transportes Aéreo y Marítimo a través de la DGMM (art. 7.5 RD 253/2024)."},{"s":"La gestión de las titulaciones náuticas de recreo es función de la Dirección General de la Marina Mercante.","a":true,"e":"Art. 9.1.d RD 253/2024."},{"s":"La DGMM tiene una sola subdirección general.","a":false,"e":"Tiene tres (art. 9.2 RD 253/2024)."},{"s":"El artículo 265 del TRLPEMM sobre la CIAIM sigue en vigor.","a":false,"e":"Fue derogado por la Ley 2/2024."},{"s":"La DGMM gestiona las bonificaciones al transporte marítimo de residentes en Canarias, Baleares, Ceuta y Melilla.","a":true,"e":"Art. 9.1.w RD 253/2024."}],"pairs":[{"title":"Quién aprueba o coordina","items":[["Plan Nacional de Servicios Especiales de Salvamento","Gobierno, a propuesta del Ministro"],["Programas sectoriales y territoriales del Plan","Ministerio"],["Coordinación de las Administraciones en salvamento","Comisión Nacional de Salvamento Marítimo"],["Ordenación general de la navegación y de la flota civil","Dirección General de la Marina Mercante"]]},{"title":"Cadena jerárquica","items":[["Órgano superior del que cuelgan las Secretarías Generales","Secretaría de Estado de Transportes y Movilidad Sostenible"],["Secretaría General de la que depende la DGMM","Transportes Aéreo y Marítimo"],["La otra Dirección General de esa Secretaría","Aviación Civil"],["Vía de adscripción de SASEMAR","A través de la DGMM"]]}],"cloze":[{"s":"El Plan Nacional de Salvamento lo aprueba el ___ a propuesta del Ministro.","o":["Ministerio","Gobierno","Congreso","Director General"],"a":1},{"s":"La DGMM se estructura en ___ subdirecciones generales.","o":["dos","tres","cuatro","cinco"],"a":1},{"s":"El Certificado de Trabajo Marítimo deriva del Convenio de la OIT sobre el trabajo marítimo de ___.","o":["1979","1989","2006","2007"],"a":2},{"s":"El Certificado de Trabajo en la Pesca deriva del Convenio ___ de la OIT.","o":["147","178","188","190"],"a":2},{"s":"El artículo 265 del TRLPEMM (CIAIM) fue derogado en el año ___.","o":["2014","2020","2024","2026"],"a":2}]},{"id":4,"title":"Administración marítima periférica","law":"TRLPEMM art. 266 · Real Decreto 638/2007, de 18 de mayo, Capitanías Marítimas y Distritos Marítimos","scope":"Art. 266 TRLPEMM · RD 638/2007, capítulos I y II","intro":"Capitanías Marítimas y Distritos Marítimos: cuándo existen, de quién dependen, con quién se coordinan y qué funciones tienen el Capitán Marítimo y el Jefe de Distrito.","update":null,"weight":1,"cards":[{"t":"Cuándo existe una Capitanía Marítima","b":"En los puertos o grupos de puertos con un determinado nivel de actividad de navegación, o cuando lo requieran las condiciones de \u003cb>tráfico, seguridad o protección marítima\u003c/b>.","ref":"Art. 266.1 TRLPEMM"},{"t":"Funciones legales del Capitán Marítimo","b":"Dirige la Capitanía y, entre otras cosas: autoriza o prohíbe la entrada y salida de buques y los despacha; fija zonas de fondeo y maniobra y \u003cb>zonas prohibidas\u003c/b>; informa con carácter \u003cb>vinculante\u003c/b> sobre los canales de acceso a los puertos; fija criterios de maniobra de buques con mercancías peligrosas; dispone de practicaje y remolque; dirige la inspección.","ref":"Art. 266.4 a)-f)"},{"t":"Fondeo: Capitanía o puerto","b":"Dentro de la zona de servicio del puerto, el fondeo y la asignación de puestos los autoriza la \u003cb>Administración portuaria\u003c/b>. Fuera de la zona de servicio, el \u003cb>Capitán Marítimo\u003c/b> puede autorizar el fondeo.","ref":"Art. 266.4.b · art. 10.i RD 638/2007"},{"t":"Contaminación en la zona de servicio","b":"La lucha contra la contaminación en las aguas de la zona de servicio de los puertos corresponde a las \u003cb>Autoridades Portuarias\u003c/b>; en el resto de aguas españolas, a la Capitanía, con deber de especial colaboración.","ref":"Art. 266.4.g"},{"t":"Consejos de Navegación","b":"Donde no haya Consejo de Navegación y Puerto puede existir un \u003cb>Consejo de Navegación presidido por el Capitán Marítimo\u003c/b>, como órgano de asistencia, información y colaboración.","ref":"Art. 266.3"},{"t":"Estructura periférica","b":"La Administración marítima periférica son las \u003cb>Capitanías Marítimas\u003c/b> y los \u003cb>Distritos Marítimos\u003c/b>. Cada Capitanía comprende uno o varios Distritos, dependientes del Capitán Marítimo, con un \u003cb>Jefe de Distrito\u003c/b> al frente.","ref":"Arts. 1 y 5 RD 638/2007"},{"t":"Requisitos para crear una Capitanía","b":"Alguno de estos: existencia de \u003cb>puertos de interés general\u003c/b>; gran intensidad o particularidades del tráfico marítimo; o condiciones técnicas o geográficas que afecten a la seguridad o a la prevención de la contaminación.","ref":"Art. 2"},{"t":"Cómo se crean Capitanías y Distritos","b":"Capitanías: procedimiento iniciado por la Secretaría General de Transportes, con informe de la Delegación del Gobierno, y creación por \u003cb>orden ministerial\u003c/b>. Distritos: a propuesta de la \u003cb>DGMM\u003c/b>, previo informe del Capitán Marítimo, por \u003cb>orden conjunta\u003c/b> de los ministros.","ref":"Arts. 3 y 5.3","tip":"Para fijar los Distritos se valora la flota, las instalaciones portuarias y la actividad náutico-deportiva."},{"t":"Ámbito geográfico","b":"La ribera del mar y los espacios terrestres con instalaciones que controle la Capitanía; las aguas entre las líneas de rumbo que parten de los puntos fijados; y las desembocaduras de ríos hasta donde se note la marea y los tramos navegables hasta puertos de interés general.","ref":"Art. 4"},{"t":"Dependencia orgánica","b":"Capitanías y Distritos dependen \u003cb>orgánica y funcionalmente del Ministerio, a través de la Dirección General de la Marina Mercante\u003c/b>.","ref":"Art. 6","tip":"No dependen de la Autoridad Portuaria, de Defensa ni de las Comunidades Autónomas."},{"t":"Coordinación con puertos y SASEMAR","b":"La Capitanía coordina su actividad con la autoridad portuaria. Los servicios de salvamento y lucha contra la contaminación que preste \u003cb>SASEMAR\u003c/b> en su ámbito se hacen \u003cb>bajo la dirección y las instrucciones del Capitán Marítimo\u003c/b>.","ref":"Art. 7.1-7.2"},{"t":"Información a otros organismos","b":"Las Capitanías informan al Centro para la Prevención y Lucha contra la Contaminación Marítima y del Litoral \u003cb>cada tres meses\u003c/b> y de inmediato si hay contaminación. Las autoridades portuarias informan al Capitán Marítimo y al \u003cb>Instituto Hidrográfico de la Marina\u003c/b> de obras en diques, balizamiento o accesos.","ref":"Arts. 7.3 y 8"},{"t":"El Capitán Marítimo","b":"Jefe de las unidades de la Capitanía y director de sus Distritos, con dependencia orgánica y funcional de la DGMM. En vacante, ausencia o enfermedad le sustituye el titular de la unidad que designe la \u003cb>DGMM\u003c/b>.","ref":"Art. 9"},{"t":"Funciones del Capitán Marítimo (I)","b":"Actuar según los planes de salvamento y contaminación; comunicar a la DGMM todos los siniestros y accidentes; adoptar medidas de urgencia; pedir al juez medidas contra el naviero; prevenir vertidos; \u003cb>prohibir o restringir la navegación\u003c/b> en zonas y por tiempo limitado.","ref":"Art. 10 a)-h)"},{"t":"Funciones del Capitán Marítimo (II)","b":"Autorizar el fondeo fuera de las aguas de servicio de los puertos de interés general; protección marítima a bordo; \u003cb>tripulaciones mínimas de embarcaciones de menos de 24 m\u003c/b>; proponer dispositivos de tráfico y exenciones de practicaje; proponer a la autoridad portuaria el \u003cb>cierre del puerto\u003c/b>; lugares de refugio e inspecciones del Memorando de París.","ref":"Art. 10 i)-p)"},{"t":"Funciones del Jefe de Distrito","b":"Registro y abanderamiento de buques y embarcaciones de \u003cb>menos de 24 m\u003c/b> (salvo bajas por exportación y patentes de navegación); \u003cb>despacho de buques\u003c/b>; enrolamientos y desenrolamientos; colaboración en playas y puertos; tramitación de títulos profesionales y de recreo; fondeos junto a puertos autonómicos.","ref":"Art. 11"},{"t":"Organización e inspección","b":"Las Capitanías se organizan en cuatro ámbitos: ordenación de la navegación, seguridad marítima, contaminación, y asuntos generales, jurídicos y sancionadores. Las inspecciones se hacen a través de la DGMM y las Capitanías \u003cb>bajo la supervisión del Capitán Marítimo\u003c/b>; los Jefes de Distrito pueden inspeccionar si tienen la titulación exigida.","ref":"Arts. 12-13"},{"t":"Recursos","b":"Contra las resoluciones de Capitanes Marítimos y Jefes de Distrito cabe recurso administrativo que resuelve el \u003cb>Director General de la Marina Mercante\u003c/b>.","ref":"Art. 14"}],"tf":[{"s":"En la zona de servicio de un puerto, la autorización de fondeo corresponde a la Administración portuaria.","a":true,"e":"Art. 266.4.b TRLPEMM."},{"s":"El informe del Capitán Marítimo sobre las condiciones de los canales de entrada y salida de los puertos es vinculante en lo que afecte a la seguridad marítima.","a":true,"e":"Art. 266.4.c."},{"s":"Las Capitanías Marítimas dependen orgánicamente de la Autoridad Portuaria del puerto donde tienen su sede.","a":false,"e":"Dependen orgánica y funcionalmente del Ministerio a través de la DGMM (art. 6)."},{"s":"Los Distritos Marítimos dependen del Capitán Marítimo.","a":true,"e":"Art. 5.1."},{"s":"Las actuaciones de SASEMAR en el ámbito de una Capitanía se realizan bajo la dirección del Capitán Marítimo.","a":true,"e":"Art. 7.2."},{"s":"Las Capitanías informan cada seis meses al Centro para la Prevención y Lucha contra la Contaminación Marítima y del Litoral.","a":false,"e":"Cada tres meses y de forma inmediata si hay un suceso de contaminación (art. 7.3)."},{"s":"En caso de vacante del Capitán Marítimo, le sustituye el Jefe de Distrito más antiguo.","a":false,"e":"Le sustituye el titular de la unidad que designe la DGMM (art. 9.4)."},{"s":"El Capitán Marítimo resuelve los expedientes de tripulaciones mínimas de seguridad de embarcaciones de menos de 24 metros.","a":true,"e":"Art. 10.k."},{"s":"El Jefe de Distrito expide las patentes de navegación.","a":false,"e":"Art. 11.2.a: las patentes de navegación y las bajas por exportación quedan excluidas."},{"s":"El despacho de buques es una función de los Jefes de Distrito Marítimo.","a":true,"e":"Art. 11.2.b."},{"s":"Los recursos contra las resoluciones de los Capitanes Marítimos los resuelve el Director General de la Marina Mercante.","a":true,"e":"Art. 14."}],"pairs":[{"title":"¿Capitán Marítimo o Jefe de Distrito?","items":[["Prohibir la navegación en una zona por tiempo limitado","Capitán Marítimo"],["Despacho de buques","Jefe de Distrito"],["Abanderamiento de embarcaciones de menos de 24 m","Jefe de Distrito"],["Proponer el cierre del puerto a la autoridad portuaria","Capitán Marítimo"],["Tramitar títulos profesionales y de recreo","Jefe de Distrito"]]},{"title":"Quién lo hace","items":[["Crear una Capitanía Marítima","Orden ministerial"],["Proponer la creación de un Distrito Marítimo","Dirección General de la Marina Mercante"],["Dirigir a SASEMAR en el ámbito de la Capitanía","Capitán Marítimo"],["Resolver recursos contra el Capitán Marítimo","Director General de la Marina Mercante"]]}],"cloze":[{"s":"La Capitanía informa al Centro de Prevención y Lucha contra la Contaminación cada ___ meses.","o":["dos","tres","seis","doce"],"a":1},{"s":"El Jefe de Distrito tramita el abanderamiento de buques y embarcaciones de menos de ___ metros.","o":["12","15","20","24"],"a":3},{"s":"Las obras en diques y balizamiento se comunican también al Instituto ___ de la Marina.","o":["Geográfico","Hidrográfico","Oceanográfico","Cartográfico"],"a":1},{"s":"Las Capitanías se organizan en ___ ámbitos funcionales.","o":["dos","tres","cuatro","cinco"],"a":2}]},{"id":5,"title":"Despacho de buques y rol","law":"Real Decreto 186/2023, de 21 de marzo, Reglamento de Ordenación de la Navegación Marítima · Orden de 18 de enero de 2000 (solo art. 33.c)","scope":"Cap. II (arts. 5, 6, 9, 15, 16, 17) · cap. III (rol) · cap. IV (enrolamientos) · cap. V (entrada y estancia) · DT 2.ª","intro":"Cómo se despacha un buque o embarcación, qué es el rol de despacho y dotación, cómo se comunican enrolamientos y desenrolamientos y cuándo se necesita autorización para entrar en aguas españolas.","update":"Tus apuntes desarrollan el antiguo Reglamento de Despacho de Buques (Orden de 18 de enero de 2000). Desde 2023 lo sustituye el RD 186/2023, que es lo que pregunta el examen; de la Orden de 2000 solo queda en el temario el art. 33.c (seguro de las personas ajenas a la tripulación). Incluye los cambios del RD 1188/2025.","weight":1,"cards":[{"t":"Qué regula el RD 186/2023","b":"El despacho de buques, el \u003cb>rol de despacho y dotación\u003c/b>, los enrolamientos y desenrolamientos, la entrada y estancia en aguas españolas, las operaciones fuera de límites, las descargas contaminantes de buques en tránsito, el fondeo y el régimen sancionador.","ref":"Art. 1"},{"t":"A quién no se aplica el despacho","b":"Las \u003cb>embarcaciones de recreo de uso privado sin tripulación profesional\u003c/b> están exentas de despacho, igual que las de remo, las \u003cb>motos náuticas\u003c/b> y los artefactos flotantes de recreo, salvo los casos del art. 9. Tampoco los buques históricos sin tripulación profesional.","ref":"Art. 2.3","tip":"El reglamento no se aplica a buques de guerra, de las Fuerzas y Cuerpos de Seguridad ni de Vigilancia Aduanera."},{"t":"Quién despacha","b":"Los \u003cb>capitanes marítimos y jefes de Distrito\u003c/b> gestionan el despacho y los enrolamientos. Los buques privados de búsqueda y salvamento los despacha el \u003cb>Director General de la Marina Mercante\u003c/b>. La entrada en aguas españolas la autoriza el capitán marítimo, salvo la de buques que piden \u003cb>asistencia o refugio\u003c/b> (DGMM).","ref":"Art. 3"},{"t":"Qué es el despacho","b":"Es la \u003cb>autorización o habilitación de la Administración marítima\u003c/b> para que el buque emprenda la navegación para la actividad a la que se va a dedicar, una vez que su capitán, armador, naviero o consignatario cumple las formalidades.","ref":"Art. 5"},{"t":"Cuatro modalidades de despacho","b":"\u003cb>Régimen general\u003c/b> mediante declaración responsable; \u003cb>autorización expresa\u003c/b> en los supuestos previstos; \u003cb>despacho simplificado\u003c/b>; y \u003cb>autodespacho\u003c/b>.","ref":"Art. 6.1"},{"t":"Vigencia del despacho","b":"En régimen general y simplificado, \u003cb>máximo un año\u003c/b> desde la declaración responsable. La autorización expresa vale \u003cb>por viaje o hasta tres meses\u003c/b>. El despacho pierde eficacia si caduca cualquier certificado obligatorio.","ref":"Art. 6.2","tip":"El Director General puede exigir temporalmente autorización expresa para salir a la mar por razones de seguridad."},{"t":"Autorización expresa: plazos","b":"La solicitud se presenta \u003cb>al menos 48 horas\u003c/b> antes de la salida. Si falta algo, hay \u003cb>10 días\u003c/b> para subsanar. Completa, se resuelve en \u003cb>48 horas\u003c/b>; sin respuesta en ese plazo, se entiende \u003cb>denegada\u003c/b>. Contra la denegación cabe \u003cb>recurso de alzada ante el DGMM\u003c/b>.","ref":"Arts. 11-12"},{"t":"Recreo: cuándo necesita autorización expresa","b":"1) \u003cb>Cambio temporal de uso privado a comercial\u003c/b>, hasta \u003cb>3 meses consecutivos\u003c/b> en el año natural. 2) Un viaje o actividad puntual distinta de la autorizada, si la categoría de diseño lo permite. 3) Primer despacho de un barco de pabellón UE o de tercer país para \u003cb>arrendamiento náutico\u003c/b> en España.","ref":"Art. 9.1"},{"t":"Requisitos del cambio a uso comercial","b":"Estar en \u003cb>lista séptima\u003c/b>; certificados en vigor; reconocimientos como si fuera de lista sexta; seguro de responsabilidad civil más \u003cb>seguro de accidentes\u003c/b> para todas las personas a bordo; gestión por una empresa de arrendamiento náutico.","ref":"Art. 9.2","tip":"El propietario no puede prestar servicio a bordo durante ese periodo y las motos náuticas no pueden acogerse."},{"t":"Autodespacho","b":"Lo hace el capitán cuando no ha podido presentar la documentación por causas ajenas al buque. Debe remitirla en \u003cb>menos de 72 horas\u003c/b> desde la salida. No cabe si el buque necesita autorización expresa. Los buques de Estado y los de SASEMAR siempre se autodespachan.","ref":"Arts. 13-14"},{"t":"Despacho simplificado","b":"Lo formaliza el interesado con una \u003cb>declaración responsable\u003c/b> y sin entregar la documentación de salida. Pueden usarlo: recreo de pabellón español, recreo con tripulación profesional, arrendamiento náutico, buques que vuelven al puerto de salida en \u003cb>24 horas\u003c/b>, pesca, aguas interiores y líneas regulares.","ref":"Art. 15","tip":"Pabellón de tercer país: solo tras un primer despacho con autorización expresa (art. 9)."},{"t":"Documentación del simplificado","b":"Declaración general del capitán y lista de tripulantes, a disposición de la Administración \u003cb>cuando la pida\u003c/b>. En recreo y pesca, la declaración responsable vale como declaración general del capitán.","ref":"Art. 16"},{"t":"Cuándo decae el simplificado","b":"Si no se comunican las modificaciones, si un pesquero no tiene licencia, si se hacen actividades distintas de las declaradas, si se incumple la tripulación mínima o los certificados, o al \u003cb>cumplirse un año\u003c/b> desde la declaración.","ref":"Art. 17"},{"t":"El rol de despacho y dotación","b":"Es el documento exigido a los buques y embarcaciones de \u003cb>pabellón español\u003c/b> que acredita el viaje que realizan y que lo emprendieron cumpliendo todos los requisitos de despacho. Se lleva a bordo una copia actualizada, impresa o electrónica.","ref":"Art. 19.1"},{"t":"Contenido y formato del rol","b":"Foto, nombre, matrícula, NIB, número OMI, características, datos de tripulantes y personal ajeno, viaje y observaciones. Es \u003cb>electrónico\u003c/b>; solo se lleva impreso si no hay dispositivos. Los cambios se comunican antes de salir o, en la mar, en \u003cb>24 horas\u003c/b>.","ref":"Arts. 19.2-20"},{"t":"Enrolamientos","b":"Responden el armador, naviero o propietario y el capitán o patrón: deben cumplir la \u003cb>tripulación mínima de seguridad\u003c/b> y que todos tengan titulación, certificados, documento de identidad del marino y certificado médico. Los extranjeros se inscriben antes en una base de datos de la DGMM.","ref":"Art. 21"},{"t":"Comunicación de enrolamientos","b":"Se comunican por la \u003cb>sede electrónica\u003c/b> del Ministerio a la mayor brevedad y, a más tardar, \u003cb>antes de salir\u003c/b> a la mar o, si ya se está en la mar, en un máximo de \u003cb>24 horas\u003c/b>.","ref":"Art. 23"},{"t":"Enrolamientos múltiples","b":"El jefe de Distrito o el capitán marítimo pueden autorizar que una misma tripulación se enrole en varios buques del mismo puerto o puertos cercanos (de la \u003cb>misma Capitanía\u003c/b>), y el enrole simultáneo de varias tripulaciones que rotan.","ref":"Art. 22"},{"t":"Desenrolamiento de oficio","b":"Si un tripulante no tiene la titulación, la libreta o el documento del marino, o no está a bordo, se puede retener el buque y desembarcarlo de oficio. Recurso de alzada ante el DGMM en \u003cb>un mes\u003c/b>.","ref":"Art. 25"},{"t":"Personas ajenas a la tripulación y al pasaje","b":"Las autoriza el \u003cb>capitán\u003c/b> si cabe en el número máximo de personas. Deben llevar DNI o pasaporte, un \u003cb>seguro de muerte o accidente\u003c/b> (no inferior al seguro obligatorio de viajeros) y se anotan en la lista de tripulantes. Los menores necesitan autorización de sus padres o tutores.","ref":"Art. 26"},{"t":"Seguro de las personas ajenas (DT 2.ª)","b":"Mientras no se reforme el TRLPEMM, el seguro se exige según el \u003cb>art. 33.c de la Orden de 18 de enero de 2000\u003c/b>: póliza vigente que cubra los riesgos de \u003cb>muerte o accidente\u003c/b> con ocasión del viaje o viajes para los que se despache el buque.","ref":"DT 2.ª RD 186/2023 · art. 33.c OM 2000"},{"t":"Entrada: autorización tácita","b":"Se entiende autorizada si no hay resolución denegatoria de la Capitanía: en \u003cb>paso inocente lateral\u003c/b>; si va a puerto tras el procedimiento integrado de escala; o donde hay libertad de navegación.","ref":"Art. 27"},{"t":"Entrada: autorización expresa","b":"La necesitan, entre otros: buques con \u003cb>mercancías peligrosas clase 5.1\u003c/b> (nitrato amónico), radiactivas o explosivos; \u003cb>petroleros de casco único\u003c/b>; buques con \u003cb>avería, corrimiento de carga, incendio o inundación\u003c/b>; los que piden asistencia o refugio (los autoriza el DGMM); los rechazados por inspección; y los \u003cb>buques autónomos extranjeros\u003c/b>.","ref":"Art. 28"},{"t":"Solicitud y prohibición de entrada","b":"La autorización expresa se pide con \u003cb>48 horas\u003c/b> de antelación. La Autoridad Portuaria puede prohibir la entrada en puerto y la Administración marítima en los espacios marítimos, con ayuda de la Armada, la Guardia Civil y Vigilancia Aduanera.","ref":"Arts. 29-30"}],"tf":[{"s":"Una embarcación de recreo de uso privado sin tripulación profesional está exenta de despacho.","a":true,"e":"Art. 2.3.a, salvo los supuestos del art. 9."},{"s":"Las motos náuticas pueden acogerse al cambio temporal de uso privado a comercial.","a":false,"e":"Art. 9.3: no se autoriza a las motos náuticas."},{"s":"El despacho en régimen general tiene una vigencia máxima de un año desde la declaración responsable.","a":true,"e":"Art. 6.2."},{"s":"La autorización expresa de despacho se solicita con al menos 24 horas de antelación.","a":false,"e":"Al menos 48 horas antes de la salida (art. 11.2)."},{"s":"Si la Administración no resuelve en 48 horas la autorización expresa de despacho, se entiende concedida.","a":false,"e":"Se entiende denegada (art. 12.2)."},{"s":"El cambio temporal de uso privado a comercial de una embarcación de recreo puede durar hasta tres meses consecutivos en el año natural.","a":true,"e":"Art. 9.1.a."},{"s":"Para el cambio temporal a uso comercial la embarcación debe estar matriculada en la lista sexta.","a":false,"e":"Debe estar en la lista séptima (art. 9.2.a); durante el periodo se somete a los reconocimientos de la sexta."},{"s":"En el autodespacho la documentación se remite a la Administración en un plazo inferior a 72 horas desde la salida.","a":true,"e":"Art. 13.2."},{"s":"Un buque que regresa a su puerto de salida dentro de las 24 horas puede acogerse al despacho simplificado.","a":true,"e":"Art. 15.2.f."},{"s":"El rol de despacho y dotación se exige también a los buques extranjeros que hacen escala en España.","a":false,"e":"Es el documento exigido a los buques y embarcaciones de pabellón español (art. 19.1)."},{"s":"Los enrolamientos producidos en la mar se comunican en un plazo máximo de 24 horas.","a":true,"e":"Art. 23.1."},{"s":"El embarque de personas ajenas a la tripulación y al pasaje lo autoriza el capitán.","a":true,"e":"Art. 26.1."},{"s":"Un buque que entra en paso inocente lateral necesita autorización expresa de la Capitanía.","a":false,"e":"La entrada se entiende tácitamente autorizada (art. 27.1.a)."},{"s":"La entrada de un buque que pide refugio la autoriza el Director General de la Marina Mercante.","a":true,"e":"Art. 28.d y art. 3.2.a."}],"pairs":[{"title":"Cada plazo con su trámite","items":[["Pedir autorización expresa de despacho","48 h antes de la salida"],["Remitir documentación tras un autodespacho","Menos de 72 h"],["Comunicar un enrolamiento estando en la mar","24 h"],["Subsanar una solicitud incompleta","10 días"],["Vigencia máxima del despacho general","1 año"]]},{"title":"¿Tácita o expresa?","items":[["Paso inocente en navegación lateral","Autorización tácita"],["Buque con inundación que debe entrar en aguas interiores","Autorización expresa"],["Petrolero de casco único","Autorización expresa"],["Escala tras el procedimiento integrado de escala","Autorización tácita"]]}],"cloze":[{"s":"La autorización expresa de despacho vale por viaje o por un periodo no superior a ___ meses.","o":["uno","tres","seis","doce"],"a":1},{"s":"El cambio temporal a uso comercial exige estar inscrita en la lista ___.","o":["cuarta","quinta","sexta","séptima"],"a":3},{"s":"El recurso de alzada contra un desenrolamiento de oficio se presenta en el plazo de ___.","o":["10 días","15 días","un mes","tres meses"],"a":2},{"s":"La autorización expresa de entrada se pide con una antelación mínima de ___ horas.","o":["12","24","48","72"],"a":2},{"s":"Las mercancías peligrosas de la clase ___ (nitrato amónico) requieren autorización expresa de entrada.","o":["1.1","3","5.1","9"],"a":2},{"s":"El seguro de las personas ajenas al pasaje sigue el art. 33.c de la Orden de 18 de enero de ___.","o":["1992","2000","2010","2023"],"a":1}]},{"id":6,"title":"Tráfico marítimo y lugares de refugio","law":"Real Decreto 210/2004, de 6 de febrero (seguimiento e información sobre el tráfico marítimo) · RD 1837/2000 (Reglamento de inspección y certificación de buques civiles), art. 14","scope":"RD 210/2004 caps. I, II y IV · RD 1837/2000 art. 14 (y art. 4, que también ha caído)","intro":"Notificación y seguimiento de buques, AIS y cajas negras, qué hacer ante accidentes y mal tiempo, lugares de refugio y obligaciones de capitanes y patrones con los certificados.","update":null,"weight":1,"cards":[{"t":"Para qué sirve el RD 210/2004","b":"Crea un sistema de \u003cb>seguimiento e información del tráfico marítimo\u003c/b> para aumentar la seguridad, responder mejor a accidentes (incluida la búsqueda y rescate) y detectar antes la contaminación. Obliga a capitanes, operadores, agentes y expedidores de mercancías peligrosas.","ref":"Art. 1"},{"t":"A qué b
