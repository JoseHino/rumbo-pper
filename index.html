mergencia\u003c/b> conectable al timonel.","ref":"Anexo I.A.5.1"},{"t":"Moto náutica sin conductor","b":"Debe tener \u003cb>apagado automático\u003c/b> del motor o un mecanismo que la haga \u003cb>girar en círculo a velocidad reducida\u003c/b> si el conductor cae o se baja.","ref":"Anexo I.A.5.1.5"},{"t":"Combustible y electricidad","b":"Los depósitos de \u003cb>gasolina no forman parte del casco\u003c/b>, están protegidos del fuego, aislados de la habitación y ventilados; los de \u003cb>diésel pueden ser parte del casco\u003c/b>. Baterías fijas, protegidas del agua y ventiladas.","ref":"Anexo I.A.5.2-5.3"},{"t":"Gobierno, gas e incendios","b":"Gobierno de emergencia en veleros y en monomotores con timón a distancia. Cada aparato de gas con ramal y llave propios; bombonas en un \u003cb>recinto accesible solo desde fuera\u003c/b> y ventilado al exterior. Los compartimentos de \u003cb>motores de gasolina\u003c/b> llevan extinción que \u003cb>no obligue a abrirlos\u003c/b>.","ref":"Anexo I.A.5.4-5.6"},{"t":"Luces y vertidos","b":"Las luces y señales cumplen el COLREG 1972 (o el CEVNI). Todo \u003cb>retrete\u003c/b> va conectado \u003cb>exclusivamente\u003c/b> a un sistema de retención o tratamiento; con depósitos de retención, \u003cb>conexión universal a tierra\u003c/b>; y válvulas que cierren herméticamente.","ref":"Anexo I.A.5.7-5.8"},{"t":"Identificación del motor","b":"Cada motor de propulsión lleva marcado: \u003cb>fabricante\u003c/b> (y quien lo adaptó), \u003cb>tipo y familia\u003c/b>, \u003cb>número de serie único\u003c/b> y \u003cb>marcado CE\u003c/b>. Debe ser indeleble, durar toda la vida del motor, estar en una pieza que no se cambie y verse con el motor montado.","ref":"Anexo I.B.1"},{"t":"Componentes del anexo II","b":"1) Protección contra el fuego de motores de gasolina y zonas de depósitos de gasolina. 2) \u003cb>Mecanismo que impide arrancar el fueraborda con marcha metida\u003c/b>. 3) \u003cb>Timones, mecanismos de dirección y cables\u003c/b>. 4) \u003cb>Depósitos de combustible fijos y conductos\u003c/b>. 5) \u003cb>Escotillas y portillos prefabricados\u003c/b>.","ref":"Anexo II","tip":"Hornillos, aires acondicionados o microondas no están en la lista."}],"tf":[{"s":"El RD 98/2016 se aplica a los componentes del anexo II cuando se comercializan por separado.","a":true,"e":"Art. 2.c."},{"s":"Las embarcaciones diseñadas exclusivamente para regatas están incluidas en el RD 98/2016.","a":false,"e":"Están excluidas (art. 3.1.a)."},{"s":"Una embarcación construida por su usuario queda excluida si no se vende durante 5 años desde su puesta en servicio.","a":true,"e":"Art. 3.1.g."},{"s":"Aumentar la potencia nominal de un motor en un 10 % es una modificación importante.","a":false,"e":"Lo es si aumenta más de un 15 % o puede superar los límites de emisiones (art. 4.8)."},{"s":"La Dirección General de la Marina Mercante es la autoridad notificante.","a":true,"e":"Art. 6."},{"s":"Un producto que no cumple los requisitos no puede exhibirse nunca en un salón náutico.","a":false,"e":"Puede exhibirse si se indica visible y acústicamente que no cumple (art. 5.3)."},{"s":"La categoría de diseño C está pensada para vientos de hasta fuerza 6 y olas de hasta 2 m.","a":true,"e":"Anexo I.A.1."},{"s":"La categoría D corresponde a vientos de hasta fuerza 4 y olas de hasta 0,3 m.","a":true,"e":"Anexo I.A.1."},{"s":"El número de identificación incluye el mes y el año de producción y el año del modelo.","a":true,"e":"Anexo I.A.2.1."},{"s":"La carga máxima de la chapa del fabricante incluye el contenido de los depósitos fijos llenos.","a":false,"e":"Lo excluye expresamente (anexo I.A.2.2.d)."},{"s":"Los depósitos de gasóleo pueden formar parte integrante del casco.","a":true,"e":"Anexo I.A.5.2.2; los de gasolina no."},{"s":"Todo retrete debe conectarse exclusivamente a un sistema de retención o de tratamiento.","a":true,"e":"Anexo I.A.5.8."},{"s":"Los microondas son componentes del anexo II del RD 98/2016.","a":false,"e":"El anexo II solo recoge cinco componentes y no incluye electrodomésticos."}],"pairs":[{"title":"Categoría de diseño: viento y ola","items":[["A","Más de fuerza 8 y más de 4 m"],["B","Hasta fuerza 8 y 4 m"],["C","Hasta fuerza 6 y 2 m"],["D","Hasta fuerza 4 y 0,3 m"]]},{"title":"¿Dónde va cada dato?","items":[["Código de país y número de serie","Número de identificación (CIN)"],["Categoría de diseño y personas recomendadas","Chapa del fabricante"],["Tipo y familia de motor","Marcado del motor"],["Información para un uso seguro","Manual de instrucciones"]]}],"cloze":[{"s":"La moto náutica mide menos de ___ m de eslora.","o":["3","4","5","6"],"a":1},{"s":"Una modificación que aumente la potencia más de un ___ % es importante.","o":["5","10","15","25"],"a":2},{"s":"Las construidas por el usuario quedan excluidas si no se comercializan en ___ años.","o":["2","3","5","10"],"a":2},{"s":"El fueraborda sin dispositivo antiarranque con marcha se admite si su empuje estático es inferior a ___ N.","o":["250","500","750","1.000"],"a":1},{"s":"Las de categoría C y D de más de ___ m tienen emplazamiento para balsa salvavidas.","o":["4","6","8","12"],"a":1},{"s":"Quedan excluidas las históricas diseñadas antes de ___.","o":["1900","1950","1970","1998"],"a":1}]},{"id":14,"title":"Búsqueda, salvamento y SASEMAR","law":"Convenio SAR 1979 (Hamburgo) · Convenio Internacional sobre Salvamento Marítimo 1989 (Londres) · TRLPEMM arts. 267-272 (SASEMAR)","scope":"SAR: definiciones, organización, procedimientos, notificación · Salvamento 1989: generalidades, ejecución, derechos de los salvadores, reclamaciones · SASEMAR: naturaleza, objeto y órganos","intro":"Cómo se organiza la búsqueda y salvamento (centros, regiones y fases de emergencia), cuándo tiene derecho el salvador a recompensa y qué es y qué hace Salvamento Marítimo.","update":null,"weight":2,"cards":[{"t":"Convenio SAR 1979","b":"Convenio Internacional sobre \u003cb>Búsqueda y Salvamento\u003c/b> Marítimos, firmado en \u003cb>Hamburgo\u003c/b> en 1979; en vigor para España desde 1993, con enmiendas de 1998 y 2004.","ref":"SAR"},{"t":"Búsqueda y salvamento","b":"\u003cb>Búsqueda\u003c/b>: operación, coordinada normalmente por un centro coordinador, para \u003cb>localizar\u003c/b> a personas en peligro. \u003cb>Salvamento\u003c/b>: operación para \u003cb>rescatarlas\u003c/b>, prestarles primeros auxilios y \u003cb>llevarlas a un lugar seguro\u003c/b>.","ref":"SAR cap. 1"},{"t":"Centros y regiones","b":"\u003cb>Centro coordinador de salvamento\u003c/b>: promueve la buena organización de los servicios SAR y coordina las operaciones en su región. \u003cb>Subcentro\u003c/b>: le complementa. \u003cb>Región SAR\u003c/b>: zona definida asociada a un centro. \u003cb>Puesto de alerta\u003c/b>: intermediario entre quien avisa y el centro.","ref":"SAR cap. 1"},{"t":"Fases de emergencia","b":"Por orden: \u003cb>incertidumbre\u003c/b> (hay dudas sobre la seguridad), \u003cb>alerta\u003c/b> (se teme por ella) y \u003cb>peligro\u003c/b> o socorro (convicción de peligro grave e inminente que exige auxilio inmediato).","ref":"SAR caps. 1 y 4"},{"t":"Cuándo se declara cada fase","b":"\u003cb>Incertidumbre\u003c/b>: desaparece una persona, un buque no llega a tiempo o no notifica su situación. \u003cb>Alerta\u003c/b>: fallan los intentos de contacto o el buque tiene su capacidad disminuida sin peligro. \u003cb>Peligro\u003c/b>: hay información indudable de peligro o, tras la alerta, todo apunta a él.","ref":"SAR cap. 4"},{"t":"Organización de los servicios","b":"Cada Estado establece: marco jurídico, autoridad responsable, recursos, comunicaciones, coordinación y procedimientos de mejora. Las regiones deben ser \u003cb>contiguas y sin solaparse\u003c/b>, y se comunican al Secretario General de la OMI. Se auxilia a cualquier persona, \u003cb>sea cual sea su nacionalidad o condición\u003c/b>.","ref":"SAR cap. 2"},{"t":"Requisitos de un centro coordinador","b":"Funciona \u003cb>las 24 horas\u003c/b>, con personal formado que conozca el \u003cb>inglés\u003c/b>, y puede recibir alertas y comunicarse con quien está en peligro y con otros centros. Se fomentan centros conjuntos \u003cb>marítimos y aeronáuticos\u003c/b>.","ref":"SAR cap. 2"},{"t":"Colores de los contenedores lanzados","b":"\u003cb>Rojo\u003c/b>: medicinas y primeros auxilios. \u003cb>Azul\u003c/b>: alimentos y agua. \u003cb>Amarillo\u003c/b>: mantas y ropa protectora. \u003cb>Negro\u003c/b>: equipo diverso (hornillos, hachas, compases, utensilios).","ref":"SAR cap. 2"},{"t":"Cooperación entre Estados","b":"Se recomienda autorizar la entrada inmediata de unidades de salvamento de otros Estados en aguas o espacio aéreo propios. Los Estados coordinan que el capitán que ha rescatado personas sea \u003cb>liberado con la mínima desviación\u003c/b> y que los supervivientes se desembarquen \u003cb>en un lugar seguro\u003c/b> lo antes posible.","ref":"SAR cap. 3"},{"t":"Coordinador en el lugar del siniestro","b":"Se designa a la persona más competente, a ser posible antes de llegar a la zona. Si no hay centro coordinador, los medios implicados lo nombran de mutuo acuerdo. Las operaciones siguen hasta que \u003cb>no quede esperanza razonable\u003c/b> de hallar supervivientes; lo decide el centro o, en su defecto, el coordinador en el lugar.","ref":"SAR cap. 4"},{"t":"Sistemas de notificación para buques","b":"Sirven para reducir el tiempo entre la pérdida de contacto y el inicio de la búsqueda, identificar buques que puedan ayudar, acotar el área y facilitar asistencia médica. Tres tipos de mensaje: \u003cb>plan de navegación\u003c/b>, \u003cb>notificación de la situación\u003c/b> y \u003cb>notificación final\u003c/b>.","ref":"SAR cap. 5"},{"t":"Convenio de Salvamento 1989","b":"Firmado en \u003cb>Londres\u003c/b> en 1989. \u003cb>Operación de salvamento\u003c/b>: todo acto para auxiliar a un buque o salvaguardar bienes en peligro en cualquier agua. No se aplica a plataformas en operación ni a buques de Estado con inmunidad.","ref":"Salvamento 1989, cap. I"},{"t":"Contratos de salvamento","b":"El \u003cb>capitán\u003c/b> puede contratar el salvamento en nombre del propietario del buque, y el capitán o el propietario en nombre de los dueños de la carga. Un contrato puede anularse si se firmó bajo presión del peligro con condiciones no equitativas o si el precio es excesivo o insuficiente.","ref":"Arts. 6-7"},{"t":"Obligaciones durante el salvamento","b":"El \u003cb>salvador\u003c/b> actúa con diligencia, evita daños ambientales, pide ayuda si hace falta y acepta otros salvadores si se le pide razonablemente. \u003cb>Propietario y capitán\u003c/b> colaboran y aceptan la entrega del buque en lugar seguro. Los Estados ribereños pueden actuar para proteger sus costas.","ref":"Arts. 8-9"},{"t":"Obligación de prestar auxilio","b":"Todo capitán debe auxiliar a cualquier persona en peligro de desaparecer en la mar, \u003cb>siempre que no entrañe grave peligro para su buque y las personas a bordo\u003c/b>. El propietario no responde por el incumplimiento del capitán.","ref":"Art. 10"},{"t":"Derecho a recompensa","b":"Solo si hay un \u003cb>resultado útil\u003c/b>; sin él no hay pago, salvo la compensación especial. Vale aunque salvador y salvado sean del mismo armador. La recompensa \u003cb>no puede superar el valor\u003c/b> del buque y los bienes salvados.","ref":"Arts. 12-13"},{"t":"Criterios de la recompensa","b":"Valor de lo salvado; esfuerzos para evitar daños ambientales; éxito obtenido; naturaleza y grado del peligro; pericia; tiempo, gastos y pérdidas; riesgos asumidos; prontitud; preparación y valor del equipo. No hay orden de prioridad.","ref":"Art. 13"},{"t":"Compensación especial","b":"Si el buque amenazaba el \u003cb>medio ambiente\u003c/b> y la recompensa no cubre los gastos, el salvador recibe del propietario una compensación igual a sus gastos, que puede subir un \u003cb>30 %\u003c/b> si evitó o redujo los daños, y el tribunal puede elevarla hasta el \u003cb>100 %\u003c/b> de los gastos.","ref":"Art. 14"},{"t":"Salvamento de personas","b":"Las personas salvadas \u003cb>no pagan nada\u003c/b>. Quien salva vidas tiene derecho a una parte equitativa de lo pagado por salvar el buque, los bienes o evitar daños ambientales. El reparto entre capitán, armador y tripulación sigue la ley del pabellón del buque salvador.","ref":"Arts. 15-16"},{"t":"Pérdida del derecho","b":"No se paga lo que no exceda de un \u003cb>contrato previo\u003c/b>. El salvador puede perder el pago si el peligro fue culpa suya o si comete fraude, y no cobra si actuó pese a la \u003cb>prohibición expresa y razonable\u003c/b> del propietario o del capitán.","ref":"Arts. 17-19"},{"t":"Reclamaciones","b":"El salvador conserva su \u003cb>privilegio marítimo\u003c/b> salvo que se le dé fianza bastante. Puede exigir \u003cb>fianza\u003c/b>, y sin su consentimiento el buque no sale del primer puerto hasta que se constituya. Las acciones prescriben a los \u003cb>2 años\u003c/b>, prorrogables por declaración del demandado.","ref":"Arts. 20-23"},{"t":"SASEMAR: naturaleza","b":"La Sociedad de Salvamento y Seguridad Marítima es una \u003cb>entidad pública empresarial\u003c/b> adscrita al Ministerio, con personalidad jurídica y patrimonio propio, que actúa conforme al \u003cb>derecho privado\u003c/b> (salvo en sus potestades administrativas). El Ministro fija sus directrices y aprueba su plan anual de objetivos.","ref":"Art. 267 TRLPEMM"},{"t":"SASEMAR: objeto","b":"Salvamento de la vida humana en la mar; prevención y lucha contra la contaminación; \u003cb>seguimiento y ayuda al tráfico marítimo\u003c/b>; seguridad marítima y de la navegación; \u003cb>remolque y asistencia a buques\u003c/b>. Puede asumir por delegación formación, docencia, ensayos y homologación.","ref":"Art. 268.1-2","tip":"La inspección de la seguridad de los buques no es función de SASEMAR, sino de la Administración marítima."},{"t":"SASEMAR: recuperar costes","b":"Cuando actúa por orden de la Administración (por ejemplo, contra una contaminación), puede \u003cb>reclamar los costes directamente a quien los haya causado\u003c/b> y ejecutar el aval que se haya exigido.","ref":"Art. 268.3-4"},{"t":"SASEMAR: órganos","b":"De gobierno: el \u003cb>Consejo de Administración\u003c/b> (presidente, director y de 8 a 15 miembros nombrados por el Ministro, por 4 años) y el \u003cb>Presidente\u003c/b>, que es el \u003cb>Director General de la Marina Mercante\u003c/b> y tiene voto de calidad. De gestión: el \u003cb>Director\u003c/b>, nombrado por el Ministro a propuesta del Consejo.","ref":"Arts. 269-272"}],"tf":[{"s":"El Convenio SAR se firmó en Hamburgo en 1979.","a":true,"e":"Convenio Internacional sobre Búsqueda y Salvamento Marítimos, Hamburgo 1979."},{"s":"La búsqueda es la operación para rescatar a las personas en peligro y llevarlas a un lugar seguro.","a":false,"e":"Eso es el salvamento; la búsqueda es localizarlas."},{"s":"El orden de las fases de emergencia es incertidumbre, alerta y peligro.","a":true,"e":"SAR cap. 4."},{"s":"Todo centro coordinador de salvamento funciona las 24 horas con personal que conozca el inglés.","a":true,"e":"SAR cap. 2."},{"s":"Los contenedores lanzados con alimentos y agua son de color rojo.","a":false,"e":"Los de alimentos y agua son azules; los rojos llevan medicinas."},{"s":"El auxilio se presta solo a las personas de la nacionalidad del Estado responsable de la región.","a":false,"e":"Se presta sin importar la nacionalidad, condición jurídica o circunstancias."},{"s":"El capitán puede celebrar contratos de salvamento en nombre del propietario del buque.","a":true,"e":"Art. 6.2 Convenio 1989."},{"s":"Un capitán está obligado a auxiliar a una persona en peligro aunque ello suponga un grave peligro para su buque.","a":false,"e":"No, si entraña grave peligro para su buque y quienes van a bordo (art. 10)."},{"s":"Sin resultado útil el salvador no tiene derecho a recompensa, salvo la compensación especial por medio ambiente.","a":true,"e":"Arts. 12 y 14."},{"s":"La recompensa puede superar el valor del buque salvado.","a":false,"e":"No puede exceder del valor del buque y demás bienes salvados (art. 13.3)."},{"s":"Las personas salvadas deben pagar una remuneración al salvador.","a":false,"e":"No están obligadas a pagar nada (art. 16.1)."},{"s":"Las acciones de pago por salvamento prescriben a los dos años.","a":true,"e":"Art. 23."},{"s":"SASEMAR es una entidad pública empresarial.","a":true,"e":"Art. 267.1 TRLPEMM."},{"s":"El Presidente de SASEMAR es el Director General de la Marina Mercante.","a":true,"e":"Art. 271.1 TRLPEMM."},{"s":"La inspección de seguridad de los buques es una de las funciones de SASEMAR.","a":false,"e":"No figura en su objeto (art. 268); corresponde a la Administración marítima."}],"pairs":[{"title":"Fase de emergencia y situación","items":[["Un buque no llega a su destino a la hora prevista","Incertidumbre"],["Fallan los intentos de contactar tras la incertidumbre","Alerta"],["Información indudable de peligro que exige auxilio inmediato","Peligro"]]},{"title":"Color del contenedor y su contenido","items":[["Rojo","Medicinas y primeros auxilios"],["Azul","Alimentos y agua"],["Amarillo","Mantas y ropa protectora"],["Negro","Equipo diverso"]]},{"title":"SASEMAR: quién es quién","items":[["Presidente","Director General de la Marina Mercante"],["Nombra al Director","Ministro, a propuesta del Consejo"],["Miembros designados del Consejo","De 8 a 15"],["Duración de los nombramientos del Consejo","4 años renovables"]]}],"cloze":[{"s":"La compensación especial puede incrementarse hasta un ___ % de los gastos del salvador.","o":["15","30","50","100"],"a":1},{"s":"El tribunal puede elevar la compensación especial hasta el ___ % de los gastos.","o":["50","75","100","200"],"a":2},{"s":"Las acciones relativas a los pagos de salvamento prescriben a los ___ años.","o":["1","2","3","5"],"a":1},{"s":"El Convenio de Salvamento de 1989 se firmó en ___.","o":["Hamburgo","Londres","Bruselas","Ginebra"],"a":1},{"s":"Los sistemas de notificación comprenden ___ tipos de mensajes.","o":["dos","tres","cuatro","cinco"],"a":1}]},{"id":15,"title":"Registro, nacionalidad e hipoteca naval","law":"Ley 14/2014, de 24 de julio, de Navegación Marítima","scope":"Título II: cap. II (registro y documentación, arts. 65-87) · cap. III (nacionalidad, arts. 88-96) · cap. VII (privilegios marítimos e hipoteca naval, arts. 122-144)","intro":"Los dos registros del buque, los documentos y libros que deben ir a bordo, cómo se adquiere la nacionalidad española, el cambio de pabellón, los privilegios marítimos y la hipoteca naval.","update":null,"weight":2,"cards":[{"t":"Dos registros distintos","b":"Las \u003cb>titularidades y gravámenes\u003c/b> se inscriben en la \u003cb>Sección de Buques del Registro de Bienes Muebles\u003c/b> (Ministerio de Justicia, a cargo de un Registrador). La \u003cb>matrícula\u003c/b> corresponde a la \u003cb>Administración Marítima\u003c/b> en el \u003cb>Registro de Buques y Empresas Navieras\u003c/b>, para la identificación y el control administrativo.","ref":"Arts. 65 y 68"},{"t":"Qué se inscribe en Bienes Muebles","b":"Es \u003cb>obligatorio\u003c/b> para buques, embarcaciones y artefactos abanderados en España. Es \u003cb>potestativo\u003c/b> para los de titularidad pública y los de \u003cb>recreo o deportivos\u003c/b>; pero sus hipotecas y gravámenes solo afectan a terceros si están inscritos.","ref":"Art. 69","tip":"Los buques en construcción pueden inscribirse siempre y deben hacerlo si se hipotecan."},{"t":"Principios del Registro de Bienes Muebles","b":"\u003cb>Folio real\u003c/b>. Inscripción por escritura pública, póliza notarial, resolución judicial firme o documento administrativo. El contenido del registro \u003cb>se presume exacto\u003c/b>; la inscripción \u003cb>no convalida\u003c/b> actos nulos; lo no inscrito \u003cb>no perjudica a terceros de buena fe\u003c/b>.","ref":"Arts. 70-77"},{"t":"Documentos a bordo","b":"Todo buque nacional lleva: \u003cb>Certificado de Matrícula\u003c/b>, \u003cb>Patente de Navegación\u003c/b>, \u003cb>Rol de Despacho y Dotación\u003c/b>, \u003cb>Diario de Navegación\u003c/b>, \u003cb>Cuaderno de Máquinas\u003c/b> y, en su caso, \u003cb>Cuaderno de Bitácora\u003c/b> y certificados de seguros. Recreo y embarcaciones tienen un régimen simplificado.","ref":"Art. 78"},{"t":"Certificado de Matrícula","b":"Reproduce literalmente la hoja de asiento y se renueva con cada cambio. Acredita que el buque está \u003cb>legalmente matriculado en España\u003c/b> y se exhibe a petición de la \u003cb>Administración Marítima nacional\u003c/b>, del Estado ribereño o del Estado del puerto.","ref":"Art. 79"},{"t":"Patente de Navegación","b":"Acredita la \u003cb>nacionalidad española\u003c/b> del buque y que está autorizado a navegar con \u003cb>pabellón nacional\u003c/b>. También legitima la identidad del capitán.","ref":"Art. 80"},{"t":"Rol y Diario de Navegación","b":"El \u003cb>Rol\u003c/b> acredita el viaje y que se emprendió tras cumplir los requisitos del despacho, con los datos de toda la dotación. En el \u003cb>Diario de Navegación\u003c/b> se anotan \u003cb>por singladuras\u003c/b> los acontecimientos relevantes y los actos del capitán como autoridad pública.","ref":"Arts. 81-82"},{"t":"Cuadernos de Bitácora y de Máquinas","b":"El \u003cb>Cuaderno de Bitácora\u003c/b> es obligatorio cuando van enrolados \u003cb>dos o más oficiales de puente\u003c/b>; en él los pilotos de guardia anotan las vicisitudes náuticas y meteorológicas. El \u003cb>de Máquinas\u003c/b> recoge marcha, mantenimiento, averías y reparaciones.","ref":"Arts. 83-84"},{"t":"Cómo se llevan los libros","b":"Foliados, rubricados y sellados hoja por hoja por la Administración Marítima, sin enmiendas ni raspaduras. Firman el capitán (Diario), los pilotos (Bitácora) y el jefe de máquinas (Máquinas). Se conservan \u003cb>un año desde el último asiento\u003c/b>.","ref":"Arts. 85-86","tip":"Si el buque cambia de propiedad o de pabellón, los libros se depositan en la Administración Marítima del último puerto de matrícula."},{"t":"Copia del Diario","b":"El capitán debe dar copia certificada de los asientos del Diario a quien tenga \u003cb>interés legítimo\u003c/b>. Si se niega, el interesado acude a la Capitanía Marítima.","ref":"Art. 87"},{"t":"Abanderamiento","b":"Es el acto que otorga el derecho a enarbolar el \u003cb>pabellón español\u003c/b>. Todos los buques matriculados en el Registro de Buques y Empresas Navieras están abanderados en España y tienen \u003cb>nacionalidad española\u003c/b> a todos los efectos.","ref":"Arts. 88 y 90"},{"t":"Navegar con pabellón español","b":"Se hace una vez obtenida la \u003cb>Patente de Navegación\u003c/b>. Provisionalmente, con \u003cb>pasavante\u003c/b>, el tiempo necesario para que un buque comprado en el extranjero llegue a puerto español.","ref":"Art. 89"},{"t":"Prohibición de doble registro","b":"Un buque \u003cb>no puede estar matriculado a la vez\u003c/b> en España y en otro Estado, \u003cb>salvo en el abanderamiento temporal\u003c/b>. Los buques matriculados en España solo enarbolan el pabellón español.","ref":"Art. 91"},{"t":"Baja en el registro anterior","b":"No se matricula ni se da pasavante hasta que el registro extranjero acredite la \u003cb>baja\u003c/b>, o certifique que la baja será simultánea al alta en España.","ref":"Art. 92"},{"t":"Cambio de pabellón y garantías","b":"Para dar de baja un buque y registrarlo definitivamente en el extranjero hay que \u003cb>cancelar hipotecas y cargas\u003c/b> o contar con el \u003cb>consentimiento escrito\u003c/b> de sus titulares. Lo mismo para el cambio temporal.","ref":"Arts. 93 y 96"},{"t":"Cambio temporal de pabellón","b":"Un buque español \u003cb>arrendado por un residente en el extranjero\u003c/b> puede abanderarse temporalmente en el Estado del arrendatario mientras dure el contrato; y al revés, un buque extranjero arrendado por un residente en España puede llevar el pabellón español.","ref":"Arts. 94-95","tip":"La ley aplicable a las hipotecas sigue siendo la del registro donde se constituyeron."},{"t":"Privilegios marítimos","b":"Se rigen por el \u003cb>Convenio de Ginebra de 1993\u003c/b> sobre privilegios marítimos e hipoteca naval. Gravan el buque \u003cb>sin necesidad de inscripción\u003c/b>, lo siguen aunque cambie de dueño o pabellón y tienen \u003cb>preferencia sobre las hipotecas\u003c/b>.","ref":"Art. 122","tip":"Los sueldos de la dotación de varios buques de una misma empresa forman un privilegio sobre toda la flota, que se extingue al año."},{"t":"Hipoteca naval: objeto y efectos","b":"Pueden hipotecarse todos los buques, embarcaciones y artefactos navales, \u003cb>incluso en construcción\u003c/b>. La hipoteca sujeta el buque, \u003cb>sea quien sea su poseedor\u003c/b>, al cumplimiento de la obligación.","ref":"Arts. 126-127"},{"t":"Constitución de la hipoteca","b":"\u003cb>Podrá\u003c/b> otorgarse en escritura pública, en póliza intervenida por notario o en documento privado, y \u003cb>deberá inscribirse en el Registro de Bienes Muebles\u003c/b> para quedar válidamente constituida.","ref":"Art. 128"},{"t":"Quién hipoteca y buque en construcción","b":"Solo el propietario con libre disposición (o quien esté autorizado), por sí o con poder especial. Para hipotecar un buque en construcción debe estar invertida \u003cb>la tercera parte\u003c/b> del valor presupuestado del casco y la propiedad inscrita.","ref":"Arts. 130-131"},{"t":"Alcance de la hipoteca","b":"Comprende partes integrantes y pertenencias, \u003cb>no los accesorios\u003c/b>, y salvo pacto las \u003cb>indemnizaciones\u003c/b> por daños no reparados, la avería gruesa y el seguro. Salvo pacto, cubre frente a terceros los intereses de los \u003cb>dos últimos años\u003c/b> y la anualidad corriente (pueden pactarse hasta 5).","ref":"Arts. 132.2 y 134"},{"t":"Seguro y preferencia","b":"Notificado el asegurador, no puede pagar al asegurado sin \u003cb>consentimiento del acreedor hipotecario\u003c/b>. La hipoteca tiene preferencia \u003cb>desde su inscripción\u003c/b> (fecha del asiento de presentación) y, a igual fecha, por la hora de presentación.","ref":"Arts. 135-137"},{"t":"Ejecución y prescripción","b":"El acreedor puede ejecutar al vencimiento, si el deudor entra en \u003cb>concurso\u003c/b> o si el buque queda inútil para navegar. La acción hipotecaria prescribe a los \u003cb>3 años\u003c/b>; la inscripción puede cancelarse por caducidad \u003cb>6 años\u003c/b> después del vencimiento.","ref":"Arts. 140-142"}],"tf":[{"s":"La matrícula del buque se lleva en el Registro de Bienes Muebles.","a":false,"e":"La matrícula corresponde a la Administración Marítima en el Registro de Buques y Empresas Navieras; titularidades y gravámenes van al Registro de Bienes Muebles (art. 65)."},{"s":"La inscripción de las embarcaciones de recreo en el Registro de Bienes Muebles es potestativa.","a":true,"e":"Art. 69.2."},{"s":"La inscripción en el Registro de Bienes Muebles convalida los actos nulos.","a":false,"e":"No los convalida (art. 76)."},{"s":"El Cuaderno de Bitácora es obligatorio cuando van enrolados dos o más oficiales de puente.","a":true,"e":"Art. 83."},{"s":"Los libros de a bordo deben conservarse un año desde el último asiento.","a":true,"e":"Art. 86.1."},{"s":"La Patente de Navegación acredita la nacionalidad española del buque.","a":true,"e":"Art. 80."},{"s":"El Certificado de Matrícula acredita la nacionalidad del buque.","a":false,"e":"Acredita que está legalmente matriculado en España; la nacionalidad la acredita la Patente de Navegación (arts. 79-80)."},{"s":"Un buque comprado en el extranjero puede navegar provisionalmente con pasavante hasta llegar a puerto español.","a":true,"e":"Art. 89."},{"s":"Un buque puede estar matriculado a la vez en España y en Malta en cualquier caso.","a":false,"e":"Solo en los supuestos de abanderamiento temporal (art. 91.1)."},{"s":"Los privilegios marítimos necesitan inscribirse en el registro para gravar el buque.","a":false,"e":"Gravan el buque sin necesidad de publicidad registral (art. 122.2)."},{"s":"Para quedar válidamente constituida, la hipoteca naval debe inscribirse en el Registro de Bienes Muebles.","a":true,"e":"Art. 128."},{"s":"La hipoteca naval solo puede otorgarse en escritura pública.","a":false,"e":"Puede ser escritura pública, póliza intervenida por notario o documento privado (art. 128)."},{"s":"La hipoteca naval comprende los accesorios del buque.","a":false,"e":"Comprende partes integrantes y pertenencias, pero no accesorios (art. 134.1)."},{"s":"La acción hipotecaria naval prescribe a los tres años.","a":true,"e":"Art. 142.1."}],"pairs":[{"title":"Cada documento con lo que acredita","items":[["Certificado de Matrícula","Que está matriculado legalmente en España"],["Patente de Navegación","La nacionalidad española y el derecho al pabellón"],["Rol de Despacho y Dotación","El viaje y el cumplimiento del despacho"],["Diario de Navegación","Los acontecimientos por singladuras"],["Cuaderno de Bitácora","Vicisitudes náuticas y meteorológicas de la guardia"]]},{"title":"Hipoteca naval: cifras","items":[["Inversión mínima para hipotecar un buque en construcción","Un tercio del valor del casco"],["Intereses cubiertos frente a terceros (salvo pacto)","Los dos últimos años"],["Prescripción de la acción hipotecaria","3 años"],["Cancelación por caducidad","6 años desde el vencimiento"]]}],"cloze":[{"s":"Los libros de a bordo se conservan ___ desde el último asiento.","o":["seis meses","un año","dos años","cinco años"],"a":1},{"s":"El Cuaderno de Bitácora es obligatorio con ___ o más oficiales de puente.","o":["uno","dos","tres","cuatro"],"a":1},{"s":"Los privilegios marítimos se rigen por el Convenio de Ginebra de ___.","o":["1979","1989","1993","2006"],"a":2},{"s":"Puede pactarse que la hipoteca asegure intereses remuneratorios de hasta ___ años.","o":["2","3","5","10"],"a":2},{"s":"El privilegio sobre la flota por sueldos se extingue al cabo de ___.","o":["seis meses","un año","dos años","tres años"],"a":1}]},{"id":16,"title":"Código Civil a bordo","law":"Código Civil: arts. 10.2 y 11 (Derecho internacional privado) · arts. 49-58 (forma del matrimonio) · arts. 61, 62 y 65 (inscripción) · art. 194 (declaración de fallecimiento) · arts. 662-743 (testamentos, salvo el militar)","scope":"Ley del pabellón, matrimonio en peligro de muerte a bordo, declaración de fallecimiento por naufragio y testamentos (en especial el marítimo)","intro":"Qué ley rige los actos celebrados a bordo, cómo se celebra e inscribe un matrimonio (también en peligro de muerte), cuándo se declara fallecido a un náufrago y cómo se otorgan los testamentos, sobre todo el marítimo.","update":"Tus apuntes de este tema solo resumen el Registro Civil. El temario 2026 pide artículos concretos del Código Civil (ley del pabellón, matrimonio, art. 194 y testamentos); este tema los recoge del texto vigente del BOE, con las reformas de 2015, 2021 y 2025.","weight":1,"cards":[{"t":"Ley aplicable al buque","b":"Los buques, aeronaves y trenes, y los derechos sobre ellos, se rigen por la ley del lugar de su \u003cb>abanderamiento, matrícula o registro\u003c/b>. Los coches, por la ley del lugar donde se hallen.","ref":"Art. 10.2"},{"t":"Forma de los actos: regla general","b":"Las formas de contratos, testamentos y demás actos se rigen por la \u003cb>ley del país donde se otorgan\u003c/b>. También valen si siguen la ley aplicable a su contenido, la ley personal del disponente o la común de los otorgantes.","ref":"Art. 11.1"},{"t":"Actos a bordo","b":"Los actos otorgados a bordo de buques o aeronaves \u003cb>durante su navegación\u003c/b> se entienden celebrados en el país de su \u003cb>abanderamiento, matrícula o registro\u003c/b>. Los buques y aeronaves \u003cb>militares\u003c/b> son territorio del Estado al que pertenecen.","ref":"Art. 11.1","tip":"Un francés que testa en un crucero italiano en aguas griegas: forma de la ley italiana."},{"t":"Otras reglas de forma","b":"Si la ley del contenido exige una forma, se aplica siempre, aunque se otorgue en el extranjero. A los actos autorizados por \u003cb>diplomáticos o cónsules españoles\u003c/b> en el extranjero se les aplica la \u003cb>ley española\u003c/b>.","ref":"Art. 11.2-11.3"},{"t":"Formas del matrimonio","b":"Un español puede casarse dentro o fuera de España en la \u003cb>forma civil\u003c/b> del Código o en \u003cb>forma religiosa\u003c/b>, y fuera de España también según la ley del lugar. Dos extranjeros pueden casarse en España en forma española o según la ley personal de cualquiera de ellos.","ref":"Arts. 49-50"},{"t":"Quién tramita y quién casa","b":"El acta o expediente previo lo tramita el letrado de la Administración de Justicia, notario o encargado del Registro Civil del domicilio de uno de los contrayentes (o el cónsul). Casan el \u003cb>Alcalde o concejal\u003c/b>, el letrado de la Administración de Justicia o el \u003cb>notario\u003c/b>, o el funcionario diplomático o consular.","ref":"Arts. 51 y 56-57"},{"t":"Matrimonio en peligro de muerte","b":"Pueden celebrarlo, además de los anteriores, el oficial o jefe de los militares en campaña y el \u003cb>Capitán o Comandante\u003c/b> si se celebra \u003cb>a bordo de nave o aeronave\u003c/b>. No requiere acta previa, pero sí \u003cb>dos testigos mayores de edad\u003c/b> y, si el peligro viene de enfermedad, dictamen médico salvo imposibilidad.","ref":"Art. 52","tip":"La Ley 14/2014 (art. 178) manda al capitán extender el acta en el Diario de Navegación."},{"t":"Validez, matrimonio secreto y por poder","b":"La incompetencia de quien celebra no afecta a la validez si un cónyuge actuó de \u003cb>buena fe\u003c/b>. El Ministro de Justicia puede autorizar un \u003cb>matrimonio secreto\u003c/b> por causa grave. Uno de los contrayentes puede casarse por \u003cb>apoderado\u003c/b> con poder especial; el otro debe asistir en persona.","ref":"Arts. 53-55"},{"t":"La ceremonia","b":"Quien celebra lee los \u003cb>arts. 66, 67 y 68\u003c/b> (igualdad y deberes de los cónyuges), pregunta a cada uno si consiente y, si ambos responden que sí, los declara unidos y extiende el acta o escritura.","ref":"Art. 58"},{"t":"Inscripción del matrimonio","b":"Produce efectos civiles \u003cb>desde su celebración\u003c/b>, pero el pleno reconocimiento exige \u003cb>inscribirlo\u003c/b> en el Registro Civil; sin inscribir no perjudica a terceros de buena fe. Se documenta en acta o escritura firmada por el celebrante, los contrayentes y \u003cb>dos testigos\u003c/b>.","ref":"Arts. 61-62"},{"t":"Matrimonio sin expediente previo","b":"Si se celebró sin el acta o expediente previo (por ejemplo, a bordo en peligro de muerte), antes de inscribirlo se comprueba que se cumplían los requisitos. Si lo celebró otra autoridad, su acta se remite al encargado del Registro Civil del \u003cb>lugar de celebración\u003c/b>.","ref":"Art. 65"},{"t":"Declaración de fallecimiento por naufragio","b":"Procede: si consta que iba a bordo de una nave cuyo \u003cb>naufragio se ha comprobado\u003c/b> y hay evidencias de que no hay supervivientes; a los \u003cb>8 días\u003c/b> sin noticias tras un naufragio comprobado (o si hay restos sin identificar); y si la nave se presume naufragada por no llegar a destino, al \u003cb>mes\u003c/b> de las últimas noticias o de la salida.","ref":"Art. 194.2.º-4.º","tip":"Para militares desaparecidos en campaña, dos años desde el tratado de paz o el fin de la guerra."},{"t":"Capacidad para testar","b":"Pueden testar todos los que la ley no prohíbe. \u003cb>No pueden\u003c/b>: los \u003cb>menores de 14 años\u003c/b> y quien no pueda formar o expresar su voluntad ni con apoyos. El testamento es \u003cb>personalísimo\u003c/b> y no puede ser \u003cb>mancomunado\u003c/b> (dos personas en un mismo instrumento).","ref":"Arts. 662-670"},{"t":"Clases de testamento","b":"\u003cb>Comunes\u003c/b>: ológrafo, abierto y cerrado. \u003cb>Especiales\u003c/b>: militar, \u003cb>marítimo\u003c/b> y hecho en país extranjero.","ref":"Arts. 676-677"},{"t":"Testigos","b":"No pueden serlo los menores (salvo en epidemia), quienes no entiendan el idioma del testador, quienes no tengan el discernimiento necesario ni el cónyuge o parientes del notario. En el abierto, tampoco los herederos y legatarios ni sus parientes cercanos.","ref":"Arts. 681-682"},{"t":"Testamento ológrafo","b":"Solo para \u003cb>mayores de edad\u003c/b>; escrito \u003cb>todo él y firmado\u003c/b> por el testador, con \u003cb>año, mes y día\u003c/b>. Los extranjeros pueden hacerlo en su idioma. Quien lo tenga lo presenta al notario en \u003cb>10 días\u003c/b> desde que sepa del fallecimiento, y debe protocolizarse en \u003cb>5 años\u003c/b>.","ref":"Arts. 688-690"},{"t":"Testamento abierto y excepciones","b":"Se otorga ante \u003cb>notario\u003c/b>; con dos testigos si el testador no sabe o no puede firmar o si se pide. En \u003cb>peligro inminente de muerte\u003c/b> vale ante \u003cb>5 testigos\u003c/b> sin notario; en \u003cb>epidemia\u003c/b>, ante \u003cb>3 testigos mayores de 16 años\u003c/b>. Queda ineficaz \u003cb>2 meses\u003c/b> después de salir del peligro; si muere, hay \u003cb>3 meses\u003c/b> para elevarlo a escritura.","ref":"Arts. 694-704"},{"t":"Testamento cerrado","b":"Escrito y firmado, en una cubierta cerrada y sellada que se presenta al notario, que extiende el acta sobre ella. No pueden hacerlo quienes no sepan o no puedan leer. Quien lo guarde lo presenta en \u003cb>10 días\u003c/b> desde que sepa del fallecimiento; ocultarlo con dolo hace perder la herencia.","ref":"Arts. 706-715"},{"t":"Testamento marítimo: quién lo autoriza","b":"Durante un viaje marítimo, abierto o cerrado: en \u003cb>buques de guerra\u003c/b>, ante el Contador con dos testigos y visto bueno del Comandante; en \u003cb>buques mercantes\u003c/b>, lo autoriza el \u003cb>Capitán\u003c/b> con \u003cb>dos testigos idóneos\u003c/b>, elegidos entre los pasajeros si los hay y al menos uno que sepa firmar.","ref":"Art. 722","tip":"El testamento del propio capitán lo autoriza quien deba sustituirle (art. 723)."},{"t":"Testamento marítimo: custodia y entrega","b":"Lo custodia el capitán y se anota en el \u003cb>Diario de Navegación\u003c/b> (también ológrafos y cerrados). En puerto extranjero con cónsul español se le entrega \u003cb>copia\u003c/b>; en el \u003cb>primer puerto español\u003c/b>, el original a la \u003cb>Autoridad marítima local\u003c/b>. Si el testador es extranjero, se tramita por vía diplomática.","ref":"Arts. 724-729"},{"t":"Testamento marítimo: caducidad","b":"Los testamentos abiertos y cerrados otorgados en el mar \u003cb>caducan a los 4 meses\u003c/b> contados desde que el testador \u003cb>desembarque en un punto donde pueda testar en forma ordinaria\u003c/b>.","ref":"Art. 730"},{"t":"Peligro de naufragio","b":"Tripulantes y pasajeros pueden testar \u003cb>de palabra ante dos testigos\u003c/b>. Es \u003cb>ineficaz si el testador se salva\u003c/b> del peligro y, aunque no se salve, si los testigos \u003cb>no lo formalizan\u003c/b> después.","ref":"Arts. 731 y 720"},{"t":"Testamento en el extranjero","b":"El español puede testar según las formas del país donde esté; \u003cb>en alta mar a bordo de un buque extranjero\u003c/b>, según la ley de la nación del buque; en ológrafo siempre; o ante el cónsul español. El mancomunado nunca vale en España.","ref":"Arts. 732-734"},{"t":"Revocación","b":"Los testamentos son \u003cb>esencialmente revocables\u003c/b> y solo se revocan con las solemnidades de testar. El posterior perfecto revoca el anterior salvo que diga lo contrario. El \u003cb>reconocimiento de un hijo\u003c/b> no pierde fuerza aunque se revoque el testamento.","ref":"Arts. 737-741"}],"tf":[{"s":"Los actos otorgados a bordo de un buque durante su navegación se entienden celebrados en el país de su abanderamiento, matrícula o registro.","a":true,"e":"Art. 11.1."},{"s":"Un testamento otorgado a bordo de un buque italiano en aguas griegas debe ajustarse a la forma griega.","a":false,"e":"Se entiende celebrado en Italia, país del pabellón (art. 11.1)."},{"s":"Los automóviles se rigen por la ley del lugar de su matrícula.","a":false,"e":"Por la ley del lugar donde se hallen; la de la matrícula es para buques, aeronaves y trenes (art. 10.2)."},{"s":"El capitán puede celebrar a bordo el matrimonio de quien se halle en peligro de muerte.","a":true,"e":"Art. 52.3.º."},{"s":"El matrimonio en peligro de muerte necesita la tramitación previa del acta o expediente.","a":false,"e":"No la requiere, pero sí dos testigos mayores de edad (art. 52)."},{"s":"El matrimonio produce efectos civiles desde su inscripción en el Registro Civil.","a":false,"e":"Desde su celebración; la inscripción es necesaria para su pleno reconocimiento (art. 61)."},{"s":"Puede declararse el fallecimiento de quien iba en una nave presuntamente naufragada al mes de las últimas noticias.","a":true,"e":"Art. 194.4.º."},{"s":"Una persona de 15 años puede otorgar testamento abierto.","a":true,"e":"Solo no pueden testar los menores de 14 años (art. 663); el ológrafo, eso sí, exige mayoría de edad (art. 688)."},{"s":"El testamento marítimo es un testamento especial.","a":true,"e":"Art. 677: militar, marítimo y hecho en país extranjero."},{"s":"En un buque mercante el testamento marítimo lo autoriza el capitán con dos testigos idóneos.","a":true,"e":"Art. 722."},{"s":"Los testamentos marítimos caducan pasado un año desde que el testador desembarca.","a":false,"e":"Caducan pasados cuatro meses desde que desembarque donde pueda testar en forma ordinaria (art. 730)."},{"s":"El testamento de palabra en peligro de naufragio es ineficaz si el testador se salva del peligro.","a":true,"e":"Arts. 731 y 720."},{"s":"El testamento ológrafo debe estar escrito y firmado por el testador con año, mes y día.","a":true,"e":"Art. 688."},{"s":"En peligro inminente de muerte puede otorgarse testamento abierto ante cinco testigos sin notario.","a":true,"e":"Art. 700."},{"s":"Un testamento mancomunado otorgado por españoles en el extranjero es válido si lo permite la ley de ese país.","a":false,"e":"No es válido en España (art. 733)."}],"pairs":[{"title":"Cada plazo con su regla","items":[["Caducidad del testamento marítimo tras desembarcar","4 meses"],["Ineficacia del abierto en peligro de muerte tras salir del peligro","2 meses"],["Presentar un ológrafo o cerrado al notario","10 días"],["Protocolizar el testamento ológrafo","5 años"],["Declaración de fallecimiento sin noticias tras naufragio comprobado","8 días"]]},{"title":"Cuántos testigos","items":[["Testamento marítimo en buque mercante","2"],["Testamento abierto en peligro inminente de muerte","5"],["Testamento en caso de epidemia","3 mayores de 16 años"],["Matrimonio en peligro de muerte","2 mayores de edad"]]}],"cloze":[{"s":"No pueden testar los menores de ___ años.","o":["12","14","16","18"],"a":1},{"s":"Si un pasajero de una nave que no llega a destino no da noticias, se le declara fallecido pasado ___ desde las últimas noticias.","o":["8 días","un mes","tres meses","un año"],"a":1},{"s":"El testamento de palabra en peligro de naufragio se otorga ante ___ testigos.","o":["dos","tres","cinco","siete"],"a":0},{"s":"Si el testador muere tras testar en peligro de muerte, hay ___ meses para elevarlo a escritura pública.","o":["dos","tres","cuatro","seis"],"a":1},{"s":"En la boda se leen los artículos 66, 67 y ___ del Código Civil.","o":["61","68","69","70"],"a":1}]},{"id":17,"title":"Desechos de buques en puerto","law":"Real Decreto 128/2022, de 15 de febrero, sobre instalaciones portuarias receptoras de desechos de buques (transpone la Directiva UE 2019/883)","scope":"RD 128/2022 completo (deroga el RD 1381/2002 y la Orden FOM/1392/2004)","intro":"Qué son los desechos de buques, qué instalaciones debe tener cada puerto, cuándo hay que notificar y entregar los desechos, cómo se pagan (tarifa indirecta) y quién controla.","update":"Tus apuntes desarrollan el RD 1381/2002, derogado en 2022. El temario 2026 pide el RD 128/2022, con conceptos nuevos que salen en el examen: «desechos de buques», «desechos pescados de manera no intencionada», tarifa indirecta y SafeSeaNet.","weight":2,"cards":[{"t":"Objeto","b":"Proteger el medio marino de las \u003cb>descargas de desechos\u003c/b> de los buques que usan los puertos españoles, mejorando la disponibilidad y el uso de \u003cb>instalaciones portuarias receptoras\u003c/b> y la entrega de los desechos en ellas.","ref":"Art. 1"},{"t":"Desechos de buques","b":"Son \u003cb>todos\u003c/b>: los \u003cb>desechos generados\u003c/b> por buques, los \u003cb>residuos de carga\u003c/b> y los \u003cb>desechos pescados de manera no intencionada\u003c/b>. Legalmente se consideran \u003cb>residuos\u003c/b> (Ley 22/2011).","ref":"Art. 2.i"},{"t":"Tipos de desechos","b":"\u003cb>Generados por buques\u003c/b>: los producidos durante el servicio, de los anexos I, IV, V y VI de MARPOL. \u003cb>Residuos de carga\u003c/b>: restos de carga en cubierta, bodegas o tanques (anexos I, II y V). \u003cb>Pescados de forma no intencionada\u003c/b>: los que caen en las artes de pesca.","ref":"Art. 2.j, k y s"},{"t":"Otras definiciones","b":"\u003cb>Buque\u003c/b>: cualquier buque, embarcación o artefacto apto para navegar. \u003cb>Buque de recreo\u003c/b>: más de 24 m, menos de 3.000 GT y hasta 12 pasajeros. \u003cb>Escalas frecuentes\u003c/b>: al menos una vez por quincena. \u003cb>GISIS\u003c/b>: sistema de información de la OMI.","ref":"Art. 2"},{"t":"Ámbito","b":"Todos los buques, \u003cb>de cualquier pabellón\u003c/b>, que hagan escala u operen en un puerto español, y todos los puertos donde hagan escala. Se \u003cb>excluyen\u003c/b> los \u003cb>buques de Estado\u003c/b> y los \u003cb>afectos a servicios portuarios\u003c/b>.","ref":"Art. 3.1","tip":"En fondeaderos no se aplican la entrega obligatoria ni la tarifa indirecta si no hay operaciones comerciales y la escala dura menos de 7 días."},{"t":"Instalaciones en cada puerto","b":"Todos los puertos españoles tendrán instalaciones receptoras adecuadas para los buques que los usan, sin causarles \u003cb>demoras innecesarias\u003c/b>. Las garantiza la \u003cb>entidad gestora del puerto\u003c/b>. Quien sufra una demora injustificada puede reclamar indemnización.","ref":"Art. 4"},{"t":"Capacidad e informe de la Capitanía","b":"La entidad gestora fija las necesidades de recepción y pide informe preceptivo a la \u003cb>Capitanía Marítima\u003c/b>, que es \u003cb>vinculante\u003c/b> en la capacidad por operación y jornada, tipos y cantidades de desechos y seguridad.","ref":"Art. 5"},{"t":"Gestión y recogida separada","b":"Los gestores tratan los desechos de forma respetuosa con el medio ambiente y garantizan la \u003cb>recogida separada\u003c/b> por categorías MARPOL para facilitar la reutilización y el reciclado. Los residuos de cocina del transporte internacional siguen normas sanitarias más estrictas.","ref":"Art. 6"},{"t":"Medios flotantes","b":"Los gestores que recogen con medios flotantes necesitan un \u003cb>certificado de aptitud del Capitán Marítimo\u003c/b>, que se resuelve en \u003cb>3 meses\u003c/b> (silencio negativo; alzada ante el DGMM) y vale mientras no cambien sus características.","ref":"Art. 7"},{"t":"Categorías de instalaciones","b":"Según lo que reciben: \u003cb>MARPOL anexo I\u003c/b> (hidrocarburos), \u003cb>II\u003c/b> (sustancias nocivas líquidas), \u003cb>IV\u003c/b> (aguas sucias), \u003cb>V\u003c/b> (basuras), \u003cb>VI\u003c/b> (sustancias que agotan el ozono y residuos de lavado de gases) y \u003cb>desechos pescados de forma no intencionada\u003c/b>.","ref":"Art. 8"},{"t":"Registro de servicios","b":"El gestor anota fecha y hora de inicio y fin, nombre, número OMI, bandera y tipo de buque, cantidad, naturaleza y destino de los desechos e incidencias. Registro informatizado consultable durante \u003cb>5 años\u003c/b>.","ref":"Art. 9"},{"t":"Deficiencias de instalaciones","b":"Un buque español que encuentre deficiencias en una instalación extranjera lo comunica a la \u003cb>DGMM\u003c/b> con el formulario de la OMI. Las quejas sobre puertos españoles las investigan las administraciones portuarias; \u003cb>Puertos del Estado\u003c/b> es el punto de contacto nacional.","ref":"Art. 10"},{"t":"Planes de recepción y manipulación","b":"Cada entidad gestora aprueba un plan, con información pública y audiencia, y lo renueva \u003cb>al menos cada 5 años\u003c/b> o si hay cambios significativos. Puertos vecinos pueden hacer planes conjuntos. Hay que publicar una \u003cb>Guía de Usuario\u003c/b> en castellano e inglés, también en SafeSeaNet.","ref":"Arts. 11-13"},{"t":"Puertos exentos de plan","b":"Los \u003cb>puertos pequeños no comerciales\u003c/b> con tráfico raro o escaso solo de recreo pueden quedar exentos si sus instalaciones están integradas en el \u003cb>sistema municipal de residuos\u003c/b>, con informe vinculante de la Capitanía. Se comunican por SafeSeaNet.","ref":"Art. 14"},{"t":"Notificación previa de desechos","b":"La hace el naviero, armador, consignatario o capitán con el formulario del anexo II, por la \u003cb>ventanilla única\u003c/b>: \u003cb>24 horas antes\u003c/b> de llegar; en cuanto se conozca el puerto si es con menos antelación; o al salir del último puerto si el viaje dura menos de 24 h.","ref":"Art. 16.2","tip":"Se aplica a buques de 300 GT o más, salvo pesqueros, tradicionales y de recreo de menos de 45 m."},{"t":"Entrega obligatoria","b":"El capitán de un buque que hace escala en un puerto español \u003cb>entrega todos sus desechos\u003c/b> en una instalación receptora \u003cb>antes de salir\u003c/b>. El gestor le da un \u003cb>recibo de entrega\u003c/b>, que se guarda a bordo \u003cb>al menos 2 años\u003c/b> junto a los libros de registro.","ref":"Art. 17.1-17.4"},{"t":"Cuándo se puede salir sin entregar","b":"Si hay \u003cb>capacidad de almacenamiento suficiente\u003c/b> hasta el siguiente puerto (autorizado por la Capitanía si el buque notifica), o si solo fondea menos de 7 días sin operaciones comerciales. La Capitanía exige la entrega si se desconoce el siguiente puerto o este no tiene instalaciones adecuadas.","ref":"Art. 17.5-17.6"},{"t":"Tarifa indirecta","b":"\u003cb>Todos los buques que hacen escala la pagan\u003c/b>, entreguen o no desechos. Cubre los costes administrativos y al menos el \u003cb>30 %\u003c/b> de los costes directos de recepción del año anterior. El objetivo es que no salga más barato tirar los desechos al mar.","ref":"Art. 18.2.a-b"},{"t":"Basuras sin coste adicional","b":"No se cobra tarifa directa por los desechos del \u003cb>anexo V\u003c/b> (basuras), salvo que superen la capacidad de almacenamiento o lo notificado. Lo mismo para los desechos \u003cb>pescados de forma no intencionada\u003c/b>. Los residuos de lavado de gases se pagan aparte.","ref":"Art. 18.2.c-g"},{"t":"Tarifas diferenciadas y reducciones","b":"Pueden variar según tipo y tamaño de buque, horario o peligrosidad de los desechos. Se reducen para el \u003cb>transporte marítimo de corta distancia\u003c/b> y para buques que generan pocos desechos y los gestionan de forma sostenible.","ref":"Arts. 18.4-18.5 y 19"},{"t":"Exenciones por tráfico regular","b":"La \u003cb>DGMM\u003c/b> puede eximir de notificar y entregar a buques en \u003cb>tráfico regular con escalas frecuentes y regulares\u003c/b> si tienen un acuerdo de entrega y pago en un puerto de su ruta. Certificado de exención por \u003cb>2 años como máximo\u003c/b>; resolución en 3 meses (silencio negativo).","ref":"Art. 21"},{"t":"Inspecciones e inmovilización","b":"La DGMM, a través de las Capitanías, inspecciona cada año al menos el \u003cb>15 %\u003c/b> de los buques que hicieron escala, según su perfil de riesgo. Si un buque no entrega sus desechos, la Capitanía le \u003cb>prohíbe salir\u003c/b> hasta que lo haga.","ref":"Arts. 22-23"},{"t":"Sanciones y comunicaciones","b":"Sancionan la \u003cb>autoridad marítima\u003c/b> y las \u003cb>autoridades portuarias\u003c/b> de los puertos de interés general, según el TRLPEMM. Todas las comunicaciones electrónicas van por \u003cb>SafeSeaNet\u003c/b>, a través de \u003cb>Puertos del Estado\u003c/b>.","ref":"Arts. 26-27"},{"t":"Pesqueros de 24 a 45 m","b":"También hacen notificación previa, salvo que vengan de caladero o puerto nacional o de puerto extranjero con menos de \u003cb>4 días\u003c/b> de navegación.","ref":"DA 2.ª"}],"tf":[{"s":"Los desechos pescados de manera no intencionada forman parte de los «desechos de buques».","a":true,"e":"Art. 2.i."},{"s":"El RD 128/2022 se aplica a los buques de Estado.","a":false,"e":"Quedan excluidos, igual que los afectos a servicios portuarios (art. 3.1.a)."},{"s":"El RD 128/2022 se aplica a buques de cualquier pabellón que hagan escala en un puerto español.","a":true,"e":"Art. 3.1.a."},{"s":"El informe de la Capitanía sobre la capacidad de las instalaciones receptoras es vinculante.","a":true,"e":"Art. 5.2."},{"s":"El certificado de aptitud de los medios flotantes lo expide la Autoridad Portuaria.","a":false,"e":"Lo expide el Capitán Marítimo (art. 7.1)."},{"s":"Los planes de recepción y manipulación de desechos se aprueban al menos cada cinco años.","a":true,"e":"Art. 11.2."},{"s":"Una embarcación de recreo de 20 metros debe hacer la notificación previa de desechos.","a":false,"e":"Están exceptuadas las embarcaciones y buques de recreo de menos de 45 m (art. 16.1)."},{"s":"La notificación previa se hace al menos 24 horas antes de la llegada si se conoce el puerto de escala.","a":true,"e":"Art. 16.2.a."},{"s":"El recibo de entrega de desechos se conserva a bordo al menos dos años.","a":true,"e":"Art. 17.4."},{"s":"Solo pagan la tarifa indirecta los buques que entregan desechos.","a":false,"e":"La pagan todos los buques que hacen escala, entreguen o no desechos (art. 18.2.a)."},{"s":"La tarifa indirecta cubre al menos el 30 % de los costes directos de recepción.","a":true,"e":"Art. 18.2.b."},{"s":"Las basuras del anexo V se cobran con tarifa directa según su volumen.","a":false,"e":"No se cobra tarifa directa salvo que se supere la capacidad de almacenamiento o lo notificado (art. 18.2.c)."},{"s":"Las Capitanías inspeccionan cada año al menos el 15 % de los buques que hicieron escala.","a":true,"e":"Art. 22.2."},{"s":"Las comunicaciones electrónicas del RD 128/2022 se basan en el sistema SafeSeaNet.","a":true,"e":"Art. 27.1."}],"pairs":[{"title":"Categoría de instalación y lo que recibe","items":[["MARPOL anexo I","Hidrocarburos"],["MARPOL anexo II","Sustancias nocivas líquidas"],["MARPOL anexo IV","Aguas sucias"],["MARPOL anexo V","Basuras"],["MARPOL anexo VI","Ozono y residuos de lavado de gases"]]},{"title":"Cada cifra con su regla","items":[["Antelación de la notificación previa","24 horas"],["Conservación del recibo de entrega","2 años"],["Parte mínima de costes directos en la tarifa indirecta","30 %"],["Buques inspeccionados al año","15 %"],["Validez máxima del certificado de exención","2 años"]]},{"title":"Quién hace qué","items":[["Garantizar las instalaciones receptoras del puerto","Entidad gestora del puerto"],["Certificado de aptitud de medios flotantes","Capitán Marítimo"],["Exención por tráfico regular","Dirección General de la Marina Mercante"],["Punto de contacto nacional y SafeSeaNet","Puertos del Estado"]]}],"cloze":[{"s":"La notificación previa de desechos se aplica, en general, a buques de ___ GT o más.","o":["100","300","500","1.000"],"a":1},{"s":"Pesqueros, tradicionales y de recreo de menos de ___ m no hacen notificación previa.","o":["24","35","45","60"],"a":2},{"s":"En fondeadero, la entrega no es obligatoria si la escala dura menos de ___ días sin operaciones comerciales.","o":["3","5","7","15"],"a":2},{"s":"Los registros de servicios de recepción se conservan durante ___ años.","o":["2","3","5","10"],"a":2},{"s":"Las escalas frecuentes son las de al menos una vez por ___.","o":["semana","quincena","mes","trimestre"],"a":1},{"s":"Los desechos pescados de forma no intencionada se comunican cada ___ a la Dirección General de la Costa y el Mar.","o":["mes","trimestre","semestre","año"],"a":3}]},{"id":18,"title":"MARPOL: aguas sucias y basuras","law":"Convenio internacional para prevenir la contaminación por los buques, 1973/78 (MARPOL) · Anexo IV revisado (MEPC.115(51)) · Anexo V revisado (MEPC.201(62), BOE 6-12-2012)","scope":"Conocimiento general del articulado · Anexo IV (aguas sucias) · Anexo V (basuras)","intro":"La estructura del Convenio MARPOL y, en detalle, qué son aguas sucias y basuras, a qué buques se aplica cada anexo, qué certificados y registros se exigen y a qué distancia se puede descargar cada cosa.","update":"En tus apuntes el Anexo V está escaneado como imagen; aquí está transcrito del BOE del 6 de diciembre de 2012 (Anexo V revisado, en vigor desde el 1 de enero de 2013).","weight":2,"cards":[{"t":"Qué es MARPOL","b":"Convenio de la OMI de \u003cb>1973\u003c/b>, modificado por el \u003cb>Protocolo de 1978\u003c/b> (de ahí «MARPOL 73/78») y por el Protocolo de 1997, que añadió el anexo VI. Sustituyó al antiguo OILPOL.","ref":"Articulado"},{"t":"Los seis anexos","b":"\u003cb>I\u003c/b> hidrocarburos; \u003cb>II\u003c/b> sustancias nocivas líquidas a granel; \u003cb>III\u003c/b> sustancias perjudiciales en bultos; \u003cb>IV\u003c/b> aguas sucias; \u003cb>V\u003c/b> basuras; \u003cb>VI\u003c/b> contaminación atmosférica. Los anexos I y II son obligatorios; III, IV y V son \u003cb>facultativos\u003c/b>: un Estado puede declarar que no los acepta.","ref":"Arts. 1 y 14"},{"t":"Definiciones del articulado","b":"\u003cb>Descarga\u003c/b>: cualquier derrame procedente de un buque por cualquier causa (escape, achique, rebose…), salvo el vertimiento regulado aparte. \u003cb>Buque\u003c/b>: todo tipo de buque que opere en el medio marino, incluidos aerodeslizadores, sumergibles y plataformas. \u003cb>Administración\u003c/b>: el Estado del pabellón.","ref":"Art. 2"},{"t":"Ámbito y transgresiones","b":"Se aplica a los buques con pabellón de una Parte o que operen bajo su autoridad, \u003cb>no a buques de guerra ni de Estado\u003c/b> en servicio no comercial. Las transgresiones se sancionan por la ley del pabellón, o por la del Estado en cuyas aguas se cometan, con sanciones suficientemente severas.","ref":"Arts. 3-4"},{"t":"Inspección, demoras e informes","b":"Los certificados válidos se aceptan como prueba, pero el Estado del puerto puede inspeccionar e impedir que el buque zarpe si no cumple. Si un buque sufre una \u003cb>demora innecesaria\u003c/b> tiene derecho a \u003cb>indemnización\u003c/b>. Los sucesos de contaminación se notifican \u003cb>sin demora\u003c/b>.","ref":"Arts. 5-8"},{"t":"Anexo IV: qué son aguas sucias","b":"1) Desagües de \u003cb>inodoros y urinarios\u003c/b>; 2) desagües de lavabos, lavaderos y conductos de \u003cb>cámaras de servicios médicos\u003c/b>; 3) desagües de \u003cb>espacios con animales vivos\u003c/b>; 4) otras aguas residuales \u003cb>mezcladas\u003c/b> con las anteriores.","ref":"Anexo IV, regla 1.3","tip":"No son aguas sucias los desagües de cámaras de máquinas ni los líquidos de espacios de carga contaminados con la carga."},{"t":"Anexo IV: otras definiciones","b":"\u003cb>Tanque de retención\u003c/b>: el que recoge y almacena aguas sucias. \u003cb>Tierra más próxima\u003c/b>: desde la \u003cb>línea de base\u003c/b> del mar territorial. \u003cb>Persona\u003c/b>: tripulantes y pasajeros. \u003cb>Viaje internacional\u003c/b>: entre un país Parte y un puerto de fuera.","ref":"Anexo IV, regla 1"},{"t":"Anexo IV: a qué buques se aplica","b":"A buques en \u003cb>viajes internacionales\u003c/b>: de arqueo bruto \u003cb>igual o superior a 400\u003c/b>, o de \u003cb>menos de 400 autorizados a llevar más de 15 personas\u003c/b>.","ref":"Anexo IV, regla 2","tip":"No se aplica a un buque de menos de 400 GT autorizado para 15 personas o menos."},{"t":"Anexo IV: reconocimientos","b":"\u003cb>Inicial\u003c/b> antes de entrar en servicio; \u003cb>de renovación\u003c/b> a intervalos de \u003cb>no más de 5 años\u003c/b>; y \u003cb>adicional\u003c/b> tras reparaciones importantes. Los hace la Administración, que puede delegar en inspectores u organizaciones reconocidas.","ref":"Anexo IV, regla 4"},{"t":"Certificado de aguas sucias","b":"Certificado internacional de prevención de la contaminación por \u003cb>aguas sucias\u003c/b>, para buques que van a puertos de otras Partes. Al menos en \u003cb>español, francés o inglés\u003c/b>. Validez máxima de \u003cb>5 años\u003c/b>; prórroga de hasta 3 meses para llegar al puerto de reconocimiento y gracia de 1 mes en viajes cortos.","ref":"Anexo IV, reglas 5, 7 y 8","tip":"Pierde validez si no se hacen los reconocimientos o si el buque cambia de pabellón."},{"t":"Sistemas de aguas sucias","b":"Todo buque sujeto lleva uno de estos: una \u003cb>instalación de tratamiento\u003c/b> aprobada; un sistema para \u003cb>desmenuzar y desinfectar\u003c/b> (con almacenamiento para cuando esté a menos de 3 millas); o un \u003cb>tanque de retención\u003c/b> con indicador visual de contenido.","ref":"Anexo IV, regla 9"},{"t":"Conexión universal a tierra","b":"Brida de \u003cb>210 mm\u003c/b> de diámetro exterior, círculo de pernos de 170 mm, \u003cb>4 orificios de 18 mm\u003c/b>, espesor de 16 mm y 4 pernos de 16 mm, para conductos de hasta 100 mm y \u003cb>600 kPa\u003c/b>. Con puntal de 5 m o menos, la conexión puede ser de \u003cb>38 mm\u003c/b>.","ref":"Anexo IV, regla 10"},{"t":"Descarga de aguas sucias","b":"Solo: a más de \u003cb>3 millas\u003c/b> de la tierra más próxima si están \u003cb>desmenuzadas y desinfectadas\u003c/b>; a más de \u003cb>12 millas\u003c/b> si no lo están, descargando a régimen moderado, \u003cb>en ruta\u003c/b> y a \u003cb>4 nudos o más\u003c/b>; o con una \u003cb>instalación de tratamiento aprobada\u003c/b> cuyo efluente no deje sólidos flotantes ni coloree el agua.","ref":"Anexo IV, regla 11","tip":"Excepciones: seguridad del buque, salvar vidas o averías con precauciones razonables (regla 3)."},{"t":"Anexo V: qué son basuras","b":"Desechos de alimentos, domésticos y operacionales, \u003cb>todos los plásticos\u003c/b>, residuos de carga, cenizas de incinerador, \u003cb>aceite de cocina\u003c/b>, \u003cb>artes de pesca\u003c/b> y cadáveres de animales resultantes de las operaciones normales del buque. \u003cb>No\u003c/b> lo son el pescado fresco ni sus partes de la propia actividad pesquera.","ref":"Anexo V, regla 1.9"},{"t":"Anexo V: definiciones útiles","b":"\u003cb>En ruta\u003c/b>: navegando con uno o varios rumbos para que la descarga se esparza por la mayor zona razonable. \u003cb>Desechos domésticos\u003c/b>: los de los alojamientos (las aguas grises no lo son). \u003cb>Plásticos\u003c/b>: incluye cabuyería y redes sintéticas, bolsas y cenizas de plásticos.","ref":"Anexo V, regla 1"},{"t":"Anexo V: a quién se aplica","b":"Salvo disposición en contrario, a \u003cb>todos los buques\u003c/b>, sin límite de tamaño ni de tipo de viaje.","ref":"Anexo V, regla 2"},{"t":"Prohibición general","b":"Está prohibido descargar basuras en el mar salvo lo previsto en las reglas 4 a 7. Nunca se pueden tirar \u003cb>plásticos\u003c/b> (ni redes sintéticas ni bolsas) ni \u003cb>aceite de cocina\u003c/b>.","ref":"Anexo V, regla 3"},{"t":"Fuera de zonas especiales","b":"Siempre \u003cb>en ruta\u003c/b> y lo más lejos posible de tierra: \u003cb>desechos de alimentos triturados\u003c/b> (que pasen por una criba de \u003cb>25 mm\u003c/b>) a no menos de \u003cb>3 millas\u003c/b>; \u003cb>no triturados\u003c/b>, a no menos de \u003cb>12 millas\u003c/b>; residuos de carga no recuperables y no perjudiciales, a no menos de 12 millas; cadáveres de animales, lo más lejos posible.","ref":"Anexo V, regla 4"},{"t":"Plataformas","b":"Prohibido descargar basuras desde plataformas fijas o flotantes y desde buques atracados a ellas o a \u003cb>menos de 500 m\u003c/b>. Solo se permiten desechos de alimentos triturados si la plataforma está a más de \u003cb>12 millas\u003c/b> de tierra.","ref":"Anexo V, regla 5"},{"t":"Zonas especiales","b":"\u003cb>Mediterráneo\u003c/b>, Báltico, mar Negro, mar Rojo, zona de los Golfos, mar del Norte, Antártico y Gran Caribe. En ellas solo se pueden descargar, en ruta, \u003cb>desechos de alimentos triturados\u003c/b> a no menos de \u003cb>12 millas\u003c/b> de tierra o del hielo, y ciertos residuos de carga en condiciones muy estrictas.","ref":"Anexo V, reglas 1.14 y 6","tip":"El Mediterráneo va hasta el meridiano 5º36' W, en el estrecho de Gibraltar."},{"t":"Excepciones","b":"No se aplican las prohibiciones cuando la descarga es necesaria para la \u003cb>seguridad del buque\u003c/b> o para \u003cb>salvar vidas\u003c/b>; por pérdidas accidentales tras averías con precauciones; por pérdida accidental de artes de pesca; o para proteger el medio marino. Por riesgo inminente para la salud, se pueden tirar desechos de alimentos sin estar en ruta.","ref":"Anexo V, regla 7"},{"t":"Rótulos y plan de gestión","b":"\u003cb>Rótulos\u003c/b> con las normas de descarga en todo buque de \u003cb>12 m o más\u003c/b>, en el idioma de trabajo y, en viajes internacionales, también en español, francés o inglés. \u003cb>Plan de gestión de basuras\u003c/b> en buques de \u003cb>100 GT o más\u003c/b>, en los autorizados a llevar \u003cb>15 personas o más\u003c/b> y en plataformas.","ref":"Anexo V, regla 10.1-10.2"},{"t":"Libro registro de basuras","b":"Obligatorio en buques de \u003cb>400 GT o más\u003c/b> y en los autorizados a llevar \u003cb>15 personas o más\u003c/b> en viajes a puertos de otras Partes. Cada operación anota fecha, hora, situación, categoría y cantidad; el capitán firma cada página; se conserva \u003cb>2 años\u003c/b> desde la última anotación.","ref":"Anexo V, regla 10.3","tip":"Categorías del libro: A plásticos, B alimentos, C domésticos, D aceite de cocina, E cenizas, F operacionales, G residuos de carga, H cadáveres, I artes de pesca."}],"tf":[{"s":"Los anexos I y II de MARPOL son obligatorios para las Partes.","a":true,"e":"Los anexos III, IV y V son facultativos (art. 14)."},{"s":"MARPOL se aplica a los buques de guerra.","a":false,"e":"No se aplica a buques de guerra ni a otros buques de Estado en servicio no comercial (art. 3)."},{"s":"Los desagües de los espacios que transportan animales vivos son aguas sucias.","a":true,"e":"Anexo IV, regla 1.3.3."},{"s":"Los desagües de los espacios de máquinas se consideran aguas sucias.","a":false,"e":"No figuran en la definición de la regla 1.3 del anexo IV."},{"s":"El anexo IV se aplica a un buque nuevo de 300 GT autorizado a llevar 12 personas en viajes internacionales.","a":false,"e":"Solo a los de menos de 400 GT si están autorizados a llevar más de 15 personas (regla 2)."},{"s":"El certificado internacional de prevención de la contaminación por aguas sucias vale como máximo cinco años.","a":true,"e":"Anexo IV, regla 8.1."},{"s":"Las aguas sucias desmenuzadas y desinfectadas pueden descargarse a más de 3 millas de la tierra más próxima.","a":true,"e":"Anexo IV, regla 11.1.1."},{"s":"Las aguas sucias del tanque de retención pueden descargarse de golpe con el buque parado.","a":false,"e":"Se descargan a régimen moderado, en ruta y a 4 nudos o más (regla 11.1.1)."},{"s":"El anexo V se aplica a todos los buques, salvo disposición en contrario.","a":true,"e":"Anexo V, regla 2."},{"s":"Puede descargarse aceite de cocina en el mar a más de 12 millas.","a":false,"e":"Está prohibido (regla 3.3)."},{"s":"Fuera de zonas especiales, los restos de comida sin triturar pueden tirarse en ruta a más de 12 millas.","a":true,"e":"Anexo V, regla 4.1.2."},{"s":"Los desechos de alimentos triturados deben poder pasar por una criba de 25 mm.","a":true,"e":"Anexo V, reglas 4.1.1 y 6.1.1."},{"s":"El Mediterráneo es zona especial a efectos del anexo V.","a":true,"e":"Anexo V, regla 1.14."},{"s":"Todo buque de 10 m de eslora debe exhibir rótulos sobre la descarga de basuras.","a":false,"e":"Los rótulos son obligatorios desde 12 m de eslora (regla 10.1)."},{"s":"El Libro registro de basuras se conserva al menos dos años desde la última anotación.","a":true,"e":"Anexo V, regla 10.3.3."}],"pairs":[{"title":"Anexo de MARPOL y su materia","items":[["Anexo I","Hidrocarburos"],["Anexo II","Sustancias nocivas líquidas a granel"],["Anexo III","Sustancias perjudiciales en bultos"],["Anexo IV","Aguas sucias"],["Anexo V","Basuras"],["Anexo VI","Contaminación atmosférica"]]},{"title":"¿Dónde se puede descargar? (fuera de zona especial)","items":[["Comida triturada","En ruta, a más de 3 millas"],["Comida sin triturar","En ruta, a más de 12 millas"],["Aguas sucias desmenuzadas y desinfectadas","A más de 3 millas"],["Aguas sucias sin tratar","A más de 12 millas y a 4 nudos o más"],["Plásticos","Nunca"]]},{"title":"Anexo V: umbrales de la regla 10","items":[["Rótulos","Eslora de 12 m o más"],["Plan de gestión de basuras","100 GT o más, o 15 personas o más"],["Libro registro de basuras","400 GT o más, o 15 personas o más"],["Conservación del libro","2 años"]]}],"cloze":[{"s":"El anexo IV se aplica a buques de arqueo bruto igual o superior a ___ en viajes internacionales.","o":["100","300","400","500"],"a":2},{"s":"Por debajo de 400 GT, se aplica si el buque está autorizado a llevar más de ___ personas.","o":["6","12","15","50"],"a":2},{"s":"La brida de la conexión universal a tierra mide ___ mm de diámetro exterior.","o":["100","170","210","250"],"a":2},{"s":"Las aguas sucias almacenadas se descargan navegando a no menos de ___ nudos.","o":["2","4","7","10"],"a":1},{"s":"Desde plataformas, prohibido descargar basuras a menos de ___ metros.","o":["200","500","1.000","1.852"],"a":1},{"s":"El Libro registro de basuras puede eximirse en buques con viajes de ___ hora(s) como máximo y 15 o más personas.","o":["una","dos","tres","seis"],"a":0}]},{"id":19,"title":"Radiocomunicaciones marítimas","law":"Reglamento de radiocomunicaciones marítimas a bordo de los buques civiles españoles (Real Decreto 1185/2006, modificado por el RD 1435/2010 y el RD 587/2022)","scope":"DT 2.ª (escucha en canal 16) · cap. I, secciones 1.ª, 2.ª y 4.ª · cap. IV, secciones 1.ª y 2.ª (equipamiento de recreo)","intro":"Zonas marítimas A1 a A4 y zonas de navegación de recreo, licencia de estación de barco y MMSI, radiobalizas, VHF portátiles y respondedores, y el equipo de radio obligatorio en cada zona.","update":"El equipamiento de recreo por zonas (arts. 56 a 60) se modificó en 2022 (RD 587/2022); este tema usa el texto vigente.","weight":2,"cards":[{"t":"Escucha en el canal 16","b":"Todos los buques españoles en el mar mantienen \u003cb>escucha continua en 156,800 MHz (canal 16 de VHF)\u003c/b> desde el puesto de gobierno. Se previó hasta 2007, pero se mantiene \u003cb>de forma indefinida\u003c/b> mientras la Administración no lo cambie.","ref":"DT 2.ª"},{"t":"Objeto y ámbito","b":"Regula las radiocomunicaciones e instalaciones radioeléctricas de los buques civiles españoles desde la perspectiva de la \u003cb>seguridad marítima\u003c/b>. Los buques SOLAS van por el capítulo II; los pesqueros de 24 m o más, por el III; el resto (incluido el \u003cb>recreo\u003c/b>), por el \u003cb>capítulo IV\u003c/b>.","ref":"Arts. 1-2"},{"t":"Operadores del SMSSM","b":"\u003cb>Operador General (COG)\u003c/b>: puede operar estaciones de barco en \u003cb>todas las zonas\u003c/b> del SMSSM. \u003cb>Operador Restringido (COR)\u003c/b>: solo en la \u003cb>zona A1\u003c/b>.","ref":"Art. 3.5.c-d"},{"t":"Zonas marítimas A1 a A4","b":"\u003cb>A1\u003c/b>: cobertura de al menos una estación costera de \u003cb>VHF\u003c/b> con alerta LSD. \u003cb>A2\u003c/b>: cobertura de \u003cb>MF\u003c/b> (ondas hectométricas), excluida la A1. \u003cb>A3\u003c/b>: cobertura de satélite geoestacionario de \u003cb>Inmarsat\u003c/b>, excluidas A1 y A2. \u003cb>A4\u003c/b>: el resto.","ref":"Art. 3.5.t-w"},{"t":"Zonas de navegación de recreo","b":"\u003cb>1\u003c/b>: ilimitada. \u003cb>2\u003c/b>: hasta 60 millas. \u003cb>3\u003c/b>: hasta 25 millas. \u003cb>4\u003c/b>: hasta \u003cb>12 millas\u003c/b>. \u003cb>5\u003c/b>: a no más de 5 millas de un abrigo o playa. \u003cb>6\u003c/b>: a no más de 2 millas. \u003cb>7\u003c/b>: aguas protegidas.","ref":"Art. 3.6"},{"t":"Zonas marítimas españolas","b":"Se consideran \u003cb>A1\u003c/b>: entre el litoral mediterráneo y sur peninsular y Ceuta o Melilla, entre islas de Canarias o de Baleares, y entre la península y Baleares. La costa portuguesa, \u003cb>A2\u003c/b>. Entre la península y Canarias, y la costa del noroeste africano a más de 150 millas de una estación española, \u003cb>A3\u003c/b>.","ref":"Art. 4.2"},{"t":"MMSI","b":"La \u003cb>DGMM\u003c/b> asigna las identidades del servicio móvil marítimo (MMSI) y mantiene la base de datos conectada con el \u003cb>Centro Nacional de Coordinación de Salvamento\u003c/b>. Resuelve en \u003cb>un mes\u003c/b>; sin respuesta, se entiende denegado.","ref":"Art. 5"},{"t":"Diario del servicio radioeléctrico","b":"Recoge comunicaciones de socorro, urgencia y seguridad y las pruebas de radiobalizas. Lo legaliza la Capitanía o la DGMM, lo firma el capitán, es \u003cb>documento público\u003c/b> y se conserva a bordo \u003cb>al menos 2 años\u003c/b>. Quien no está obligado anota los sucesos de socorro en el diario de a bordo.","ref":"Art. 6"},{"t":"Licencia de estación de barco (LEB)","b":"La expide la \u003cb>DGMM\u003c/b> y la necesita todo buque con equipo transmisor marítimo. \u003cb>Exentas\u003c/b>: las embarcaciones de recreo de \u003cb>zonas 4 a 7\u003c/b> (salvo que instalen voluntariamente un equipo fijo con LSD o una radiobaliza, que exige MMSI) y quien solo lleve VHF portátiles para emergencias.","ref":"Art. 7.1"},{"t":"Validez de la LEB","b":"\u003cb>5 años\u003c/b> para buques de pasaje, de carga de 300 GT o más, pesqueros de \u003cb>24 m o más\u003c/b> y de servicios de puerto clase T. Para el resto (por ejemplo, \u003cb>pesqueros de menos de 24 m\u003c/b> o recreo), \u003cb>indefinida\u003c/b>.","ref":"Art. 7.2","tip":"Licencia provisional en el extranjero: máximo 5 meses o hasta el primer puerto español."},{"t":"Registro de radiobalizas","b":"Las radiobalizas de 406 MHz se registran en la DGMM y se programan con el \u003cb>MMSI\u003c/b>. Llevan marcadas instrucciones en castellano, caducidad de baterías e identificación del buque. Si se dispara por error, el capitán debe \u003cb>avisar\u003c/b> a la Administración.","ref":"Art. 8"},{"t":"Instaladores y equipos","b":"Solo instalan empresas autorizadas e inscritas en el registro de la DGMM (tipos M-1, M-2 y M-3). En recreo basta \u003cb>notificar\u003c/b> la instalación; las de \u003cb>12 m o menos\u003c/b> no notifican salvo que tengan LEB. Equipos portátiles o de menos de 25 W no obligatorios: basta la factura.","ref":"Arts. 9 y 12"},{"t":"Certificado de seguridad radioeléctrica","b":"Validez máxima de \u003cb>2 años\u003c/b> para pesqueros de menos de 24 m y de \u003cb>1 año\u003c/b> para el resto de buques. Los buques SOLAS en viajes internacionales reciben además el certificado internacional.","ref":"Art. 13"},{"t":"NAVTEX","b":"El receptor \u003cb>NAVTEX\u003c/b> va en el puente y recibe en \u003cb>518 kHz\u003c/b> (los instalados desde junio de 2007, también en \u003cb>490 kHz\u003c/b>). Los mensajes impresos se guardan al menos \u003cb>un año\u003c/b>.","ref":"Art. 21"},{"t":"Dónde va la radiobaliza","b":"La de 406 MHz de activación automática se instala en la \u003cb>misma cubierta del puente\u003c/b>, \u003cb>fuera de él y cerca\u003c/b>, junto a la puerta de salida a los alerones, libre de obstáculos para flotar libremente. \u003cb>Nunca\u003c/b> en mástiles ni donde haga falta una escalera vertical.","ref":"Art. 22.1.a y c"},{"t":"Requisitos de la radiobaliza","b":"Activación y liberación \u003cb>automática y manual\u003c/b>, con localizador en \u003cb>121,5 MHz\u003c/b>. Prueba \u003cb>anual\u003c/b> (en recreo, \u003cb>cada 4 años\u003c/b> por empresa autorizada). Baterías, como regla, \u003cb>4 años\u003c/b>; dispositivo de liberación, \u003cb>2 años\u003c/b>.","ref":"Art. 22.1.b-h"},{"t":"VHF portátiles y respondedores de radar","b":"Los VHF portátiles llevan una \u003cb>batería primaria precintada amarilla o naranja\u003c/b> solo para emergencias (vida máxima 4 años) y van en el puente sin llaves. Los \u003cb>respondedores de radar de 9 GHz\u003c/b> van a ambas bandas, visibles desde el puente; sus baterías duran 4 años.","ref":"Arts. 23-24"},{"t":"Energía de reserva","b":"Los buques llevan baterías de reserva para el equipo de radio básico. En \u003cb>recreo\u003c/b> solo es obligatoria para las de \u003cb>nueva matriculación en zonas 1, 2 y 3\u003c/b>. En el capítulo IV, autonomía de \u003cb>3 horas\u003c/b> (6 en pasaje de más de 20 millas).","ref":"Arts. 26 y 55"},{"t":"Instalación y escucha","b":"Los VHF obligatorios van en la parte frontal del puente; la estación lleva el \u003cb>distintivo de llamada y el MMSI\u003c/b> marcados y un reloj en \u003cb>UTC\u003c/b>. La escucha automática de LSD se hace en el \u003cb>canal 70\u003c/b> (156,525 MHz) y en 2.187,5 kHz.","ref":"Arts. 27-28"},{"t":"Personal y salida a la mar","b":"En recreo, el patrón con su título (PNB, PER, PY o CY) responde del correcto manejo de los equipos. Ningún buque del capítulo IV puede salir si no puede transmitir y recibir alertas de socorro con sus equipos obligatorios.","ref":"Arts. 51 y 53"},{"t":"Recreo: zona 1","b":"\u003cb>ETB\u003c/b> (Inmarsat) o \u003cb>MF/HF\u003c/b> con 2.182 kHz; \u003cb>VHF\u003c/b> (canales 16, 6 y 13) con LSD; \u003cb>radiobaliza de 406 MHz automática y manual\u003c/b>; VHF portátil; \u003cb>respondedor de radar\u003c/b>; y \u003cb>NAVTEX\u003c/b> si es de lista sexta.","ref":"Art. 56"},{"t":"Recreo: zonas 2 y 3","b":"\u003cb>Zona 2\u003c/b>: VHF con LSD, radiobaliza de 406 MHz \u003cb>automática y manual\u003c/b>, y VHF portátil o respondedor de radar. \u003cb>Zona 3\u003c/b>: VHF con LSD y radiobaliza de 406 MHz \u003cb>automática y manual o solo manual\u003c/b>.","ref":"Arts. 57-58"},{"t":"Recreo: zonas 4 y 5","b":"\u003cb>Zona 4\u003c/b>: como mínimo, \u003cb>VHF de tipo fijo\u003c/b>. \u003cb>Zona 5\u003c/b>: VHF fijo, o como alternativa un \u003cb>VHF portátil estanco IPX7\u003c/b>. Para regatas, los equipos los fija la DGMM (transoceánicas) o la Capitanía (locales).","ref":"Arts. 59-61"}],"tf":[{"s":"La escucha continua en el canal 16 de VHF sigue siendo obligatoria para los buques españoles en el mar.","a":true,"e":"DT 2.ª, prorrogada indefinidamente por la Resolución de 4 de diciembre de 2007."},{"s":"El certificado de Operador Restringido permite operar en todas las zonas del SMSSM.","a":false,"e":"Solo en la zona A1; el Operador General, en todas (art. 3.5)."},{"s":"La zona A3 es la cubierta por satélites geoestacionarios de Inmarsat, excluidas A1 y A2.","a":true,"e":"Art. 3.5.v."},{"s":"La navegación entre islas del archipiélago balear se considera zona marítima A1.","a":true,"e":"Art. 4.2.a."},{"s":"La navegación entre la península y Canarias se considera zona A1.","a":false,"e":"Es zona A3 (art. 4.2.d)."},{"s":"Una embarcación de recreo que navega en zona 4 está obligada a tener LEB.","a":false,"e":"Las de zonas 4 a 7 están exentas, salvo que instalen voluntariamente un equipo fijo con LSD o una radiobaliza (art. 7.1)."},{"s":"La LEB de un pesquero de menos de 24 metros tiene validez indefinida.","a":true,"e":"Art. 7.2."},{"s":"El diario del servicio radioeléctrico se conserva a bordo al menos dos años.","a":true,"e":"Art. 6.3."},{"s":"La radiobaliza de 406 MHz puede instalarse en lo alto del mástil para mejorar su cobertura.","a":false,"e":"Nunca en mástiles ni donde haga falta una escalera vertical (art. 22.1.c)."},{"s":"En embarcaciones de recreo la prueba de la radiobaliza es cuatrienal.","a":true,"e":"Art. 22.1.e."},{"s":"La batería primaria precintada de los VHF portátiles es de color amarillo o naranja.","a":true,"e":"Art. 23.1."},{"s":"En zona 3, una embarcación de recreo puede llevar una radiobaliza de 406 MHz únicamente manual.","a":true,"e":"Art. 58.1.b."},{"s":"En zona 2 basta co
