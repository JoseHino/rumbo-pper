uques se aplica","b":"A los de \u003cb>arqueo bruto igual o superior a 300\u003c/b>. Los \u003cb>pesqueros, los históricos y las embarcaciones de recreo de menos de 45 m\u003c/b> solo están sujetos a los arts. 17 a 25 (incidentes, accidentes y refugio). No se aplica a buques de defensa o de servicio público no comercial.","ref":"Art. 2"},{"t":"Definiciones clave","b":"\u003cb>Autoridades competentes\u003c/b>: DGMM y, bajo su dirección, Capitanías y SASEMAR. \u003cb>Estación costera\u003c/b>: los centros de coordinación de salvamento de SASEMAR. \u003cb>Lugar de refugio\u003c/b>: puerto, atracadero, fondeadero u otra zona para acoger buques necesitados de asistencia. \u003cb>SafeSeaNet\u003c/b>: sistema comunitario de intercambio de información marítima.","ref":"Art. 3"},{"t":"Notificación previa de llegada","b":"El buque con destino a un puerto español notifica a la entidad gestora del puerto \u003cb>al menos 24 horas antes\u003c/b>, o al salir del puerto anterior si la travesía dura menos de 24 h, o en cuanto lo sepa si cambia el puerto de escala.","ref":"Art. 4"},{"t":"AIS, LRIT y cajas negras","b":"Todo buque que haga escala en España lleva \u003cb>AIS (SIA)\u003c/b> y lo mantiene funcionando siempre. Los \u003cb>pesqueros de más de 15 m\u003c/b> de eslora total llevan AIS clase A. Ciertos buques llevan \u003cb>LRIT\u003c/b> y un \u003cb>registrador de datos de la travesía (RDT)\u003c/b> o caja negra.","ref":"Arts. 6, 6 bis, 6 ter y 10","tip":"El pesquero puede desconectar el AIS en circunstancias excepcionales si el capitán lo considera necesario para la seguridad."},{"t":"Servicios y sistemas de tráfico","b":"La Administración marítima hace el seguimiento de los buques en los dispositivos de organización del tráfico y en los \u003cb>servicios de tráfico marítimo (STM)\u003c/b>, y exige que cumplan sus reglas.","ref":"Arts. 7-9"},{"t":"Buques de riesgo","b":"Se consideran riesgo potencial los buques que han tenido incidentes, han incumplido notificaciones o reglas de tráfico, han hecho \u003cb>vertidos o infracciones MARPOL\u003c/b>, tienen denegado el acceso a puertos de la UE, \u003cb>no tienen seguro\u003c/b> o presentan anomalías señaladas por prácticos o puertos.","ref":"Art. 16"},{"t":"Notificación de incidentes y accidentes","b":"Los capitanes comunican \u003cb>inmediatamente\u003c/b>: abordajes, varadas, daños, inundaciones o corrimientos de carga; fallos de gobierno, propulsión o navegación; situaciones que puedan contaminar; y \u003cb>manchas, contenedores o bultos a la deriva\u003c/b>.","ref":"Art. 17","tip":"El aviso incluye identidad, posición, puertos de origen y destino, personas a bordo y detalles del suceso."},{"t":"Mal tiempo excepcional","b":"Las Capitanías pueden informar al capitán, \u003cb>recomendar o prohibir la entrada o salida\u003c/b> del puerto y limitar o prohibir la carga de combustible en terminales. Sus medidas se basan en el pronóstico del \u003cb>Instituto Nacional de Meteorología (hoy AEMET)\u003c/b>.","ref":"Art. 18","tip":"El capitán decide con su juicio profesional; si se aparta de la medida, informa a la Capitanía de sus razones."},{"t":"Medidas ante un accidente","b":"La Administración puede: \u003cb>restringir los movimientos\u003c/b> del buque o imponerle un rumbo; emplazar al capitán a poner fin al riesgo; \u003cb>embarcar un equipo de evaluación\u003c/b>; ordenarle ir a un lugar de refugio; imponer \u003cb>practicaje o remolque\u003c/b> a costa del operador.","ref":"Art. 19"},{"t":"Quién decide sobre los buques necesitados de asistencia","b":"El \u003cb>Director General de la Marina Mercante\u003c/b>, asistido por un \u003cb>comité técnico\u003c/b> (capitán marítimo, jefe de distrito, coordinadores de inspección y seguridad). Sus deliberaciones son \u003cb>confidenciales\u003c/b>.","ref":"Art. 20"},{"t":"Planes de acogida","b":"Los elabora la Administración marítima, con participación del DGMM, previa consulta a los sectores e informe \u003cb>no determinante\u003c/b> de Puertos del Estado, siguiendo las Resoluciones OMI A.949(23) y A.950(23).","ref":"Art. 21"},{"t":"Garantía financiera en lugar de refugio","b":"Si se exige, se presenta en un banco con domicilio en España a favor de la DGMM. Límites: buques tanque de hasta 2.000 GT, \u003cb>7 millones €\u003c/b> (+10.000 € por GT de exceso); resto de buques de hasta 2.000 GT, \u003cb>2,5 millones €\u003c/b> (+600 € por GT de exceso).","ref":"Arts. 22-23"},{"t":"Procedimiento de acceso a refugio","b":"Lo pide el capitán o el representante del operador; la \u003cb>Capitanía instruye\u003c/b> (puede inspeccionar) y \u003cb>decide el DGMM\u003c/b>. Por urgencia la resolución puede ser \u003cb>verbal\u003c/b>, notificándose por escrito en un máximo de \u003cb>96 horas\u003c/b>. Pone fin a la vía administrativa: cabe recurso de reposición.","ref":"Art. 24"},{"t":"Clasificación Nacional de Buques","b":"\u003cb>Cinco grupos\u003c/b>: I pasaje; II carga; III servicios de puerto; IV pesqueros; \u003cb>V buques y embarcaciones de recreo\u003c/b>.","ref":"Art. 4 RD 1837/2000"},{"t":"Obligaciones del capitán o patrón con los certificados","b":"Comunicar la caducidad de certificados y pedir su renovación; someterse a las inspecciones; llevar a bordo todos los certificados en lugar accesible y visible; mantener el buque conforme a las normas; \u003cb>no hacer cambios\u003c/b> que afecten a la seguridad sin autorización de la DGMM.","ref":"Art. 14.1 RD 1837/2000"},{"t":"Comunicación de averías y accidentes","b":"Se notifican de inmediato al \u003cb>Capitán Marítimo\u003c/b> si el buque está en puerto español, o a la DGMM y a las autoridades del puerto si es extranjero. Si el buque está \u003cb>navegando\u003c/b>, a las autoridades del \u003cb>primer puerto de arribada, antes de llegar\u003c/b>.","ref":"Art. 14.2 RD 1837/2000"}],"tf":[{"s":"El RD 210/2004 se aplica, en general, a los buques de arqueo bruto igual o superior a 300.","a":true,"e":"Art. 2.1."},{"s":"Las embarcaciones de recreo de menos de 45 metros están sujetas a todo el RD 210/2004.","a":false,"e":"Solo a los arts. 17 a 25 (art. 2.3)."},{"s":"La notificación previa de llegada a puerto se hace al menos 24 horas antes.","a":true,"e":"Art. 4.1."},{"s":"Los buques equipados con AIS pueden apagarlo libremente al entrar en aguas interiores.","a":false,"e":"Deben mantenerlo en funcionamiento en todo momento, salvo normas internacionales de protección de la información (art. 6.2)."},{"s":"Los pesqueros de más de 15 metros de eslora total deben llevar AIS de clase A.","a":true,"e":"Art. 6 bis."},{"s":"Las medidas de las Capitanías por mal tiempo excepcional se basan en el pronóstico de la Autoridad Portuaria.","a":false,"e":"Se basan en el pronóstico del Instituto Nacional de Meteorología (AEMET) (art. 18.3)."},{"s":"Ante un accidente, la Administración marítima puede imponer el remolque del buque a costa del operador.","a":true,"e":"Art. 19.2.d."},{"s":"Las deliberaciones del comité técnico que asesora al DGMM sobre buques necesitados de asistencia son públicas.","a":false,"e":"Son confidenciales (art. 20.1)."},{"s":"La resolución de acceso a un lugar de refugio puede adoptarse verbalmente por urgencia.","a":true,"e":"Art. 24.4, notificándola por escrito en un máximo de 96 horas."},{"s":"La Clasificación Nacional de Buques tiene cinco grupos.","a":true,"e":"Art. 4 RD 1837/2000."},{"s":"Los buques y embarcaciones de recreo forman el grupo IV de la Clasificación Nacional de Buques.","a":false,"e":"Son el grupo V; el IV son los pesqueros."},{"s":"Si el buque está navegando, una avería de consideración se comunica a las autoridades del primer puerto de arribada antes de llegar.","a":true,"e":"Art. 14.2 RD 1837/2000."}],"pairs":[{"title":"Grupos de la Clasificación Nacional de Buques","items":[["Grupo I","Buques de pasaje"],["Grupo II","Buques de carga"],["Grupo III","Servicios de puerto"],["Grupo IV","Pesqueros"],["Grupo V","Recreo"]]},{"title":"Cada concepto con su significado","items":[["SafeSeaNet","Intercambio de información marítima de la UE"],["Estación costera","Centros de coordinación de SASEMAR"],["RDT","Caja negra del buque"],["SIA / AIS","Identificación automática de buques"]]}],"cloze":[{"s":"El RD 210/2004 se aplica a buques de arqueo bruto igual o superior a ___.","o":["100","300","500","1.000"],"a":1},{"s":"Pesqueros, históricos y recreo de menos de ___ m solo cumplen los arts. 17 a 25.","o":["24","30","45","60"],"a":2},{"s":"La resolución verbal de acceso a refugio se notifica por escrito en un máximo de ___ horas.","o":["24","48","72","96"],"a":3},{"s":"Garantía para buques no tanque de hasta 2.000 GT: hasta ___ millones de euros.","o":["1","2,5","7","10"],"a":1},{"s":"Los pesqueros de más de ___ m de eslora total llevan AIS clase A.","o":["12","15","24","45"],"a":1}]},{"id":7,"title":"Concentraciones y pruebas náuticas","law":"Real Decreto 62/2008, de 25 de enero: seguridad en concentraciones náuticas conmemorativas y pruebas náutico-deportivas","scope":"Reglamento completo (caps. I a V) y disposición adicional única","intro":"Qué exige la Capitanía para una concentración náutica o una regata: plazos de comunicación, papel del organizador, del coordinador de seguridad y del patrón, medios de rescate y seguros.","update":null,"weight":2,"cards":[{"t":"Concentración náutica conmemorativa","b":"Acto colectivo marítimo por una efeméride o de carácter cultural o lúdico, con navegación en grupo de embarcaciones normalmente de las \u003cb>listas 3.ª a 7.ª\u003c/b> y extranjeras, en aguas de una Capitanía.","ref":"Art. 2.a"},{"t":"Tipos de pruebas náutico-deportivas","b":"\u003cb>De circuito\u003c/b>: itinerario señalizado o campo de regatas con boyas, cerca de la costa o en puerto. \u003cb>Regatas de altura\u003c/b>: en mar territorial, zona contigua, ZEE o alta mar.","ref":"Art. 2.b-c"},{"t":"Los protagonistas","b":"\u003cb>Entidad organizadora\u003c/b>: quien organiza (clubes, federaciones…). \u003cb>Coordinador de seguridad\u003c/b>: la persona que designa para dirigir internamente el evento y velar por la seguridad (en regatas puede serlo el comité de regatas). \u003cb>Patrón\u003c/b>: quien manda cada embarcación participante.","ref":"Art. 2.d-f"},{"t":"Excepciones","b":"No se aplica a concentraciones con normativa especial de la Administración marítima ni a los \u003cb>grandes eventos deportivos\u003c/b> nacionales o internacionales, salvo los arts. 16 y 17 (regatas de altura e internacionales).","ref":"Art. 4"},{"t":"Autorización del Capitán Marítimo","b":"La Capitanía notifica la autorización en un máximo de \u003cb>10 días desde la solicitud\u003c/b>. Si faltan datos, requiere al organizador en 10 días y este tiene \u003cb>10 días\u003c/b> para subsanar; si no lo hace, se prohíbe el evento. Puede también \u003cb>condicionarlo\u003c/b> a medidas de seguridad, con resolución notificada en \u003cb>10 días desde la recepción\u003c/b>.","ref":"Art. 5.1-5.2"},{"t":"Prohibir, suspender o retrasar","b":"El Capitán Marítimo puede prohibir el evento si se falsean datos o no hay seguros; \u003cb>suspenderlo una vez iniciado\u003c/b> si se incumplen las medidas, notificando la resolución en \u003cb>24 horas\u003c/b>; y retrasar, anular o suprimir pruebas si empeora el tiempo.","ref":"Art. 5.3-5.6","tip":"Contra sus resoluciones cabe recurso de alzada ante el Director General de la Marina Mercante."},{"t":"Seguros","b":"El organizador comprueba que todas las embarcaciones tienen el \u003cb>seguro obligatorio de responsabilidad civil\u003c/b> del RD 607/1999 (o aval a primer requerimiento). Los barcos \u003cb>de alquiler\u003c/b> necesitan además un \u003cb>seguro de accidentes\u003c/b>, con las cuantías del seguro obligatorio de viajeros.","ref":"Art. 6"},{"t":"Comunicar una concentración","b":"La entidad organizadora la comunica \u003cb>por escrito\u003c/b> a la Capitanía \u003cb>al menos 30 días antes\u003c/b>, con fecha y hora de inicio y fin, coordinador de seguridad, condiciones meteorológicas límite, canales de radio, zonas e itinerarios, número de participantes y copia de los seguros.","ref":"Art. 7.1"},{"t":"Otras obligaciones del organizador","b":"Dar medios al coordinador de seguridad y supervisarle; informar a los patrones sobre los seguros; pedir otras autorizaciones; y \u003cb>adoptar las medidas para prevenir la contaminación\u003c/b> producida por las embarcaciones participantes.","ref":"Art. 7.2-7.7"},{"t":"Embarcaciones de rescate en concentraciones","b":"Al menos \u003cb>una por cada 20 embarcaciones\u003c/b> participantes, de francobordo bajo, con motor de \u003cb>al menos 25 CV\u003c/b>, tripuladas por \u003cb>al menos 3 personas\u003c/b> y a la escucha en el canal de seguridad.","ref":"Art. 8.3"},{"t":"Aviso a Salvamento Marítimo","b":"El coordinador comunica al centro de coordinación de salvamento la fecha, horario y zona y, \u003cb>al menos 2 horas antes\u003c/b> del inicio, el número final de participantes; informa en tiempo real de incidentes y del final del evento.","ref":"Arts. 8.4 y 12.10"},{"t":"Instrucciones a los patrones","b":"Posición de cada embarcación y cuál va en cabeza; derrota planificada; un \u003cb>canal de VHF de seguridad\u003c/b> además de la escucha en el \u003cb>canal 16\u003c/b>; velocidad del conjunto, que se comunica a la embarcación de cabeza.","ref":"Art. 8.5"},{"t":"El patrón: cuántas personas a bordo","b":"No más de las autorizadas: con todos a una banda, el francobordo no puede bajar de la mitad. Pesca o acuicultura: N = eslora × manga × 0,5. Pasaje o recreo: lo que figure en sus certificados.","ref":"Art. 9.2.a"},{"t":"El patrón: equipo de seguridad","b":"Barandilla de al menos \u003cb>90 cm\u003c/b> si no hay amuradas; cubierta despejada; \u003cb>al menos 2 aros salvavidas\u003c/b> con cabo y chalecos para todos; \u003cb>un aro más por cada 20 personas\u003c/b> embarcadas.","ref":"Art. 9.2.b-e"},{"t":"Sobrecarga autorizada","b":"Las embarcaciones que lleven más personas de las de sus certificados solo navegan \u003cb>desde el orto hasta una hora antes del ocaso\u003c/b>, nunca en solitario y saliendo con el resto del grupo.","ref":"Art. 9.2.h"},{"t":"Personas embarcadas","b":"Menores y personas con discapacidad que no se valgan solas, acompañados de un adulto responsable; prohibido tirar residuos, lanzar cohetes o petardos (salvo tradición y con instrucciones), manipular radiobalizas, agruparse en una banda o embarcar bajo efectos del alcohol.","ref":"Art. 10"},{"t":"Pruebas náutico-deportivas","b":"Se comunican por escrito al Capitán Marítimo del \u003cb>puerto de partida\u003c/b> con \u003cb>al menos 30 días\u003c/b> de antelación. Los medios de salvamento los pone la organización: \u003cb>no puede contar con los medios públicos\u003c/b> de salvamento. Mínimo \u003cb>una embarcación de rescate por cada 20\u003c/b> participantes.","ref":"Arts. 11-12"},{"t":"Pruebas de circuito en puerto","b":"Si es en zona de servicio portuaria, la autoriza la \u003cb>Autoridad Portuaria con informe vinculante del Capitán Marítimo\u003c/b>. El circuito queda fuera de canales de entrada y de zonas de mercancías peligrosas, y ninguna embarcación ajena puede entrar en él.","ref":"Art. 15.1-15.4"},{"t":"Vela ligera, optimist y remo","b":"En pruebas de remo, vela infantil, optimist, iniciación, cadete o vela ligera hace falta al menos \u003cb>una embarcación de apoyo por cada 10 participantes\u003c/b>, y escolta o remolque si cruzan zonas de tráfico portuario. Las regatas de navegantes solitarios solo se autorizan en circuito.","ref":"Art. 15.5-15.7"},{"t":"Otros eventos y normas específicas","b":"Exhibiciones aéreas sobre la costa, travesías a nado o pruebas de buceo: autorización pedida \u003cb>30 días antes\u003c/b>. Si un requisito es imposible de cumplir, el organizador puede pedir su sustitución \u003cb>10 días antes\u003c/b>.","ref":"Art. 14"},{"t":"Regatas de altura e internacionales","b":"Si la regata pasa por varias Capitanías, fija los criterios el Capitán Marítimo del \u003cb>puerto de origen\u003c/b>. Las regatas internacionales que salen de España hacia aguas extranjeras siguen sus propias normas, pero se comunican a los capitanes marítimos \u003cb>al menos 15 días antes\u003c/b>.","ref":"Arts. 16-17"},{"t":"Espacios protegidos e infracciones","b":"Si el evento puede afectar a reservas marinas u otros espacios protegidos hace falta \u003cb>informe previo del Ministerio de Agricultura, Pesca y Alimentación\u003c/b>. Los incumplimientos son infracciones de la marina civil y responden organizadores, clubes, coordinadores, comités, patrones y personas embarcadas.","ref":"DA única · arts. 18-20"}],"tf":[{"s":"Una concentración náutica se comunica por escrito a la Capitanía al menos con 30 días de antelación.","a":true,"e":"Art. 7.1."},{"s":"La autorización del evento se notifica en un plazo máximo de 15 días desde la solicitud.","a":false,"e":"En un máximo de 10 días desde la solicitud (art. 5.1)."},{"s":"El Capitán Marítimo puede suspender un evento ya iniciado si se ponen en peligro la seguridad marítima o la vida humana.","a":true,"e":"Art. 5.4."},{"s":"Las embarcaciones de alquiler que participan necesitan además un seguro de accidentes.","a":true,"e":"Art. 6."},{"s":"En una concentración náutica debe haber al menos una embarcación de rescate por cada diez participantes.","a":false,"e":"Una por cada veinte embarcaciones participantes (art. 8.3). Una por cada diez es para remo, optimist o vela ligera (art. 15.5)."},{"s":"Las embarcaciones de rescate llevan como mínimo tres tripulantes y un motor de al menos 25 CV.","a":true,"e":"Art. 8.3."},{"s":"El número final de participantes se comunica al centro de salvamento al menos 2 horas antes del inicio.","a":true,"e":"Arts. 8.4 y 12.10."},{"s":"Cada embarcación debe llevar al menos dos aros salvavidas y uno más por cada veinte personas embarcadas.","a":true,"e":"Art. 9.2.d-e."},{"s":"Una embarcación con más personas de las autorizadas en sus certificados puede navegar de noche si va acompañada.","a":false,"e":"Solo entre el orto y una hora antes del ocaso (art. 9.2.h)."},{"s":"En una prueba náutico-deportiva el organizador puede incluir los medios públicos de salvamento entre sus medios de rescate.","a":false,"e":"No debe incluirlos; puede pedir su ayuda en emergencia (art. 11.1.h)."},{"s":"Una regata de navegante solitario solo puede autorizarse en la modalidad de circuito.","a":true,"e":"Art. 15.7."},{"s":"Las regatas internacionales que salen de España se comunican a los capitanes marítimos al menos 15 días antes.","a":true,"e":"Art. 17."},{"s":"La prevención de la contaminación de las embarcaciones participantes corresponde al coordinador de seguridad.","a":false,"e":"Corresponde a la entidad organizadora (art. 7.7)."}],"pairs":[{"title":"Cada plazo con su trámite","items":[["Comunicar una concentración o prueba","30 días antes"],["Notificar la autorización del Capitán Marítimo","10 días desde la solicitud"],["Comunicar una regata internacional","15 días antes"],["Notificar la suspensión de un evento iniciado","24 horas"],["Número final de participantes a Salvamento","2 horas antes"]]},{"title":"Cada ratio de seguridad","items":[["Embarcaciones de rescate en concentraciones y regatas","1 por cada 20 participantes"],["Apoyo en optimist, remo o vela ligera","1 por cada 10 participantes"],["Aros salvavidas extra","1 por cada 20 personas"],["Tripulación mínima de la embarcación de rescate","3 personas"]]},{"title":"¿Quién tiene la obligación?","items":[["Prevenir la contaminación de los participantes","Entidad organizadora"],["Dirigir internamente el evento","Coordinador de seguridad"],["Mantener la posición y velocidad indicadas","Patrón"],["Autorizar pruebas en la zona de servicio del puerto","Autoridad Portuaria (informe vinculante del Capitán Marítimo)"]]}],"cloze":[{"s":"Las embarcaciones de rescate llevarán un motor de al menos ___ CV.","o":["10","15","25","40"],"a":2},{"s":"Si no hay amuradas, se pone una barandilla provisional de al menos ___ cm.","o":["60","75","90","100"],"a":2},{"s":"Para pesca o acuicultura, el número máximo de personas es N = eslora × manga × ___.","o":["0,25","0,5","0,75","1"],"a":1},{"s":"El organizador tiene ___ días para subsanar las deficiencias de su solicitud.","o":["5","10","15","30"],"a":1},{"s":"Una embarcación sobrecargada solo navega hasta ___ hora(s) antes del ocaso.","o":["media","una","dos","tres"],"a":1},{"s":"Si un requisito es de imposible cumplimiento, su sustitución se pide al menos ___ días antes del evento.","o":["5","10","15","30"],"a":1}]},{"id":8,"title":"Abanderamiento y matrícula de recreo","law":"Real Decreto 1435/2010 (abanderamiento y matriculación en listas 6.ª y 7.ª) · Real Decreto 685/2010 (permiso temporal de navegación)","scope":"RD 1435/2010 completo · RD 685/2010 completo","intro":"Cómo se abandera y matricula una embarcación de recreo, el régimen especial de las de 12 m o menos con marcado CE, el certificado de registro español-permiso de navegación y los permisos temporales para salones y pruebas.","update":null,"weight":2,"cards":[{"t":"Embarcación de recreo y auxiliar","b":"\u003cb>Embarcación de recreo\u003c/b>: casco de \u003cb>2,5 a 24 m\u003c/b> de eslora, para deporte u ocio, aunque se use con ánimo de lucro o para entrenamiento. \u003cb>Auxiliar\u003c/b>: hasta \u003cb>4 m\u003c/b> y \u003cb>8 kW\u003c/b>, al servicio exclusivo de la principal y navegando solo en sus proximidades.","ref":"Art. 2.a-b RD 1435/2010"},{"t":"Artefactos flotantes o de playa","b":"Piraguas, kayaks y canoas sin motor; patines a pedal o con motor de \u003cb>menos de 3,5 kW\u003c/b>; \u003cb>motos náuticas\u003c/b>; tablas a vela; tablas deslizantes con motor; instalaciones flotantes fondeadas.","ref":"Art. 2.q","tip":"Pasajeros: todos a bordo excepto los menores de un año, el patrón y la tripulación."},{"t":"Indicativos","b":"\u003cb>Indicativo de matrícula\u003c/b>: lista, provincia marítima, distrito y folio/año. \u003cb>Indicativo de inscripción\u003c/b>: número secuencial que da el distrito a las embarcaciones de \u003cb>12 m o menos\u003c/b> del régimen especial. \u003cb>CIN\u003c/b>: número de identificación del fabricante (país, constructor, serie, mes y año).","ref":"Art. 2.f-g y p"},{"t":"Qué queda fuera","b":"No se aplica a embarcaciones con \u003cb>permiso temporal de navegación\u003c/b> ni a las de lista sexta que lleven \u003cb>más de 12 pasajeros\u003c/b>. No tienen que registrarse las históricas y tradicionales, las de regatas dedicadas solo a competición y los artefactos de playa.","ref":"Art. 3.2"},{"t":"Cómo se solicita","b":"El propietario (o su representante) lo pide en el \u003cb>distrito marítimo\u003c/b> del puerto de matrícula elegido. Con \u003cb>leasing\u003c/b> puede iniciarlo la entidad financiera o el arrendatario.","ref":"Art. 4.1"},{"t":"Preinscripción","b":"Un astillero o comercializadora española puede preinscribir la embarcación. Al venderla, la resolución sirve de \u003cb>permiso provisional de navegación durante 6 meses\u003c/b> desde la transmisión, solo en el mar territorial y dentro de su categoría de diseño. La inscripción definitiva se pide en esos 6 meses.","ref":"Art. 4.3"},{"t":"Resolución del abanderamiento","b":"La dicta el \u003cb>jefe de distrito marítimo en un mes\u003c/b>; sin resolución, se entiende \u003cb>desestimada\u003c/b>. Cabe \u003cb>recurso de alzada ante el Director General de la Marina Mercante\u003c/b>. No se exige inscripción en el Registro de Bienes Muebles.","ref":"Arts. 4.4, 12 y 13"},{"t":"Certificado de registro español-permiso de navegación","b":"Se expide a toda embarcación registrada con \u003cb>tripulación no profesional\u003c/b>; recoge sus características y los datos del propietario. Si lleva tripulación profesional, necesita \u003cb>rol\u003c/b>.","ref":"Art. 6"},{"t":"Nombre de la embarcación","b":"\u003cb>Obligatorio si mide más de 12 m\u003c/b> y voluntario si mide 12 m o menos. Lo propone el interesado y lo asigna el distrito; siempre en alfabeto latino y pintado o fijado en amuras, aletas o popa.","ref":"Art. 7.1-7.3"},{"t":"Cómo se lleva la matrícula","b":"El indicativo de matrícula va en \u003cb>ambas amuras\u003c/b>, lo más alto posible sobre la flotación, en color claro sobre casco oscuro y oscuro sobre casco claro. Las auxiliares llevan el indicativo de su principal seguido de «(Aux)».","ref":"Art. 7.4-7.5"},{"t":"Régimen especial: CE y 12 m o menos","b":"Si la embarcación y su motor tienen \u003cb>marcado CE\u003c/b> y mide \u003cb>12 m o menos\u003c/b> (salvo alta velocidad), está \u003cb>exenta de abanderamiento, matriculación y despacho\u003c/b>. Pero antes de usarla necesita un \u003cb>certificado de inscripción\u003c/b>, que el distrito expide en un máximo de \u003cb>15 días\u003c/b>.","ref":"Art. 8.1 y 8.6"},{"t":"Límites del régimen especial","b":"Solo puede navegar por el \u003cb>mar territorial español\u003c/b> y dentro de su categoría de diseño; debe enarbolar el pabellón español y llevar el indicativo de inscripción en ambas amuras (\u003cb>blanco sobre casco oscuro, negro sobre claro\u003c/b>). Su certificado de inscripción sustituye al de navegabilidad.","ref":"Art. 8.2-8.7"},{"t":"Documentación con marcado CE","b":"Declaración de conformidad de embarcación y motores; título de propiedad; despacho de aduanas si viene de terceros países; baja en el registro anterior; pago del impuesto especial sobre determinados medios de transporte; tasas de inscripción y de ayudas a la navegación.","ref":"Art. 9"},{"t":"Sin marcado CE","b":"Las nuevas o de terceros países necesitan obtener el CE por evaluación posterior a su fabricación. Las de la UE pueden registrarse con un certificado de la DGMM anterior al \u003cb>2 de junio de 1992\u003c/b>, una homologación, o, si se vendieron en la UE antes del \u003cb>16 de junio de 1998\u003c/b>, un proyecto técnico y reconocimiento inicial.","ref":"Art. 10","tip":"Las de otro Estado de la UE con menos de 25 años y menos de 24 m se libran del proyecto si su modelo está homologado por la DGMM."},{"t":"Construidas por aficionados","b":"Pueden abanderarse en \u003cb>lista séptima\u003c/b> con un proyecto firmado por técnico competente y reconocimiento inicial. Para venderlas o inscribirlas en \u003cb>lista sexta\u003c/b> necesitan el marcado CE.","ref":"Art. 11"},{"t":"Sin licencia de estación de barco (LEB)","b":"Si se abandera sin resolver aún la LEB, la embarcación solo puede navegar por el \u003cb>mar territorial\u003c/b> hasta obtenerla. Con la resolución se retiran el certificado de registro, el de navegabilidad y, en su caso, la LEB.","ref":"Art. 14"},{"t":"Renovación del certificado de registro","b":"Cada \u003cb>5 años\u003c/b>, pidiéndola \u003cb>3 meses antes\u003c/b> de que caduque. Si caduca, se \u003cb>prohíbe navegar\u003c/b>. Se puede pedir en cualquier distrito, que resuelve en un mes. Hay que pedir uno nuevo si cambian los datos.","ref":"Art. 17.1-17.2"},{"t":"Venta y canje","b":"La transferencia la comunica el \u003cb>vendedor\u003c/b> (y, si quiere, el comprador) en un máximo de \u003cb>3 meses\u003c/b>. El certificado se canjea si está deteriorado o ilegible, y conserva la misma caducidad salvo que falten menos de 3 meses, que cuenta como renovación.","ref":"Arts. 17.3 y 18"},{"t":"Obligaciones de propietarios y usuarios","b":"El propietario solicita el registro y la baja y mantiene los documentos al día. \u003cb>Propietarios y usuarios\u003c/b> responden de llevar a bordo la documentación.","ref":"Art. 16"},{"t":"Permiso temporal de navegación: para qué","b":"Para embarcaciones de recreo \u003cb>no matriculadas\u003c/b> que se exhiben y prueban en salones náuticos, exposiciones o instalaciones de importadores, constructores, concesionarios o distribuidores \u003cb>antes de venderse\u003c/b>, en aguas interiores y mar territorial. También para trasladarlas entre puertos españoles.","ref":"Art. 1 RD 685/2010","tip":"Si el traslado cruza aguas internacionales, el permiso vale como pasavante provisional."},{"t":"Permiso temporal: trámite","b":"Lo pide la \u003cb>empresa importadora, constructora, concesionaria o distribuidora\u003c/b>, una solicitud por embarcación. Lo resuelve la \u003cb>DGMM en 15 días\u003c/b> (silencio negativo) y vale \u003cb>como máximo 6 meses\u003c/b>. Recurso de alzada ante el Secretario General de Transportes en un mes.","ref":"Arts. 2-6 RD 685/2010"},{"t":"Permiso temporal: a bordo","b":"Gobierno con la \u003cb>titulación profesional o náutico-deportiva adecuada\u003c/b> a la eslora y la distancia. La \u003cb>DGMM fija el número de tripulantes\u003c/b>. A bordo solo posibles compradores o personal de la empresa. Prohibido de noche, con mal tiempo o a más de \u003cb>5 millas del puerto base\u003c/b> o \u003cb>2 de la costa\u003c/b>.","ref":"Art. 8 RD 685/2010"},{"t":"Permiso temporal: prórrogas","b":"Las concede la DGMM por periodos iguales, hasta un máximo de \u003cb>5 años\u003c/b> desde el primer permiso. A los \u003cb>2 años y medio\u003c/b>, reconocimiento extraordinario. Si no resuelve en 15 días, la prórroga se concede \u003cb>automáticamente\u003c/b>. El seguro de responsabilidad civil es obligatorio.","ref":"Arts. 10-11 RD 685/2010"}],"tf":[{"s":"Una embarcación de recreo tiene un casco de entre 2,5 y 24 metros de eslora.","a":true,"e":"Art. 2.a RD 1435/2010."},{"s":"Una embarcación auxiliar puede medir hasta 6 metros.","a":false,"e":"Hasta 4 m de eslora y 8 kW de potencia (art. 2.b)."},{"s":"Las motos náuticas son artefactos flotantes o de playa.","a":true,"e":"Art. 2.q.iii."},{"s":"Si no hay resolución del abanderamiento en un mes, se entiende concedido.","a":false,"e":"Se entiende desestimada la solicitud (art. 13.1)."},{"s":"El nombre es obligatorio en todas las embarcaciones de recreo.","a":false,"e":"Solo en las de eslora superior a 12 m (art. 7.1)."},{"s":"Una embarcación de 10 m con marcado CE en casco y motor está exenta de abanderamiento, matriculación y despacho.","a":true,"e":"Art. 8.1, aunque necesita certificado de inscripción."},{"s":"Las embarcaciones del régimen especial de 12 m o menos pueden navegar fuera del mar territorial si su categoría de diseño lo permite.","a":false,"e":"Solo pueden navegar en el mar territorial español (art. 8.2)."},{"s":"El certificado de registro español-permiso de navegación se renueva cada cinco años.","a":true,"e":"Art. 17.1."},{"s":"La renovación del certificado de registro se solicita un mes antes de su caducidad.","a":false,"e":"Tres meses antes (art. 17.1)."},{"s":"La transferencia de titularidad debe comunicarla obligatoriamente el comprador.","a":false,"e":"La comunica el vendedor; el comprador puede hacerlo potestativamente (art. 17.3)."},{"s":"El permiso temporal de navegación lo solicita el futuro comprador de la embarcación.","a":false,"e":"Lo solicita la empresa importadora, constructora, concesionaria o distribuidora (art. 2 RD 685/2010)."},{"s":"El permiso temporal de navegación tiene una validez máxima de seis meses.","a":true,"e":"Art. 5.2 RD 685/2010."},{"s":"Con permiso temporal no hace falta titulación para gobernar la embarcación.","a":false,"e":"Hace falta titulación profesional o náutico-deportiva adecuada (art. 8.1 RD 685/2010)."},{"s":"Si la DGMM no resuelve una prórroga del permiso temporal en 15 días, se prorroga automáticamente.","a":true,"e":"Art. 10.4 RD 685/2010."}],"pairs":[{"title":"Cada número con su regla","items":[["Eslora máxima de una auxiliar","4 m"],["Potencia máxima de una auxiliar","8 kW"],["Eslora a partir de la cual el nombre es obligatorio","Más de 12 m"],["Renovación del certificado de registro","Cada 5 años"],["Plazo del distrito para el certificado de inscripción","15 días"]]},{"title":"Permiso temporal (RD 685/2010)","items":[["Quién lo solicita","Importador, constructor, concesionario o distribuidor"],["Quién lo concede","Dirección General de la Marina Mercante"],["Validez máxima","6 meses"],["Límite total con prórrogas","5 años"],["Distancia máxima en exhibiciones","5 millas del puerto y 2 de la costa"]]}],"cloze":[{"s":"Los patines con motor de menos de ___ kW son artefactos de playa.","o":["2","3,5","5","8"],"a":1},{"s":"La preinscripción sirve de permiso provisional de navegación durante ___ meses desde la venta.","o":["3","6","9","12"],"a":1},{"s":"La venta de la embarcación se comunica en un plazo máximo de ___ meses.","o":["1","2","3","6"],"a":2},{"s":"Quedan fuera del RD 1435/2010 las embarcaciones de lista sexta con más de ___ pasajeros.","o":["6","10","12","20"],"a":2},{"s":"Con permiso temporal, a los ___ años desde el primer permiso hay un reconocimiento extraordinario.","o":["1","2,5","3","5"],"a":1},{"s":"La DGMM resuelve el permiso temporal en ___ días.","o":["10","15","30","60"],"a":1}]},{"id":9,"title":"Seguro obligatorio de responsabilidad civil","law":"Real Decreto 607/1999, de 16 de abril: Reglamento del seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas","scope":"Reglamento completo (arts. 1-12)","intro":"Qué embarcaciones deben asegurarse, qué cubre y qué no cubre el seguro obligatorio, sus límites y cómo se acredita a bordo.","update":null,"weight":1,"cards":[{"t":"Qué cubre el seguro obligatorio","b":"La \u003cb>responsabilidad civil extracontractual\u003c/b> de navieros o propietarios, de quienes patroneen con su autorización, de quienes les ayuden en el gobierno y de los \u003cb>esquiadores\u003c/b> que arrastre la embarcación, por daños a terceros, a puertos o instalaciones, por colisión, abordaje y en general por el uso de la embarcación en aguas españolas.","ref":"Art. 1.1","tip":"La póliza puede incluir coberturas y límites mayores pactados libremente (art. 1.2)."},{"t":"Qué embarcaciones deben asegurarse","b":"Todas las \u003cb>propulsadas a motor\u003c/b>, incluidas las \u003cb>motos náuticas\u003c/b>, y las \u003cb>sin motor de más de 6 m\u003c/b> de eslora destinadas al recreo y deporte.","ref":"Art. 2","tip":"Un velero sin motor de 5 m no está obligado; uno de 7 m, sí."},{"t":"Cuándo hay que estar asegurado","b":"Durante la navegación y también \u003cb>atracada\u003c/b>, en los periodos en que esté expuesta a los riesgos del reglamento. Para \u003cb>regatas y competiciones\u003c/b> (y sus entrenamientos) hace falta un \u003cb>seguro especial\u003c/b> con al menos la cobertura obligatoria.","ref":"Art. 3"},{"t":"Embarcaciones extranjeras","b":"Las de recreo extranjeras que naveguen por el mar territorial o aguas interiores españolas y entren o salgan de un puerto español deben asegurarse o acreditar un seguro con las mismas condiciones que las españolas.","ref":"Art. 4"},{"t":"Navegar sin seguro","b":"Es una \u003cb>infracción grave\u003c/b> según la Ley de Puertos y de la Marina Mercante.","ref":"Art. 5"},{"t":"Riesgos cubiertos","b":"\u003cb>Muerte o lesiones de terceros\u003c/b>; \u003cb>daños materiales a terceros\u003c/b>; pérdidas económicas consecuencia directa de esos daños; \u003cb>daños a buques por colisión o sin contacto\u003c/b>. Salvo pacto, el asegurador paga las costas de la defensa.","ref":"Art. 6"},{"t":"Exclusiones (I): las personas","b":"No cubre los daños al tomador, naviero, propietario o asegurado; la muerte o lesiones de \u003cb>pasajeros que pagan\u003c/b> el viaje; de quienes trabajan en el mantenimiento de la embarcación; ni del \u003cb>patrón o piloto\u003c/b>.","ref":"Art. 7 a)-d)"},{"t":"Exclusiones (II): los daños","b":"No cubre los \u003cb>daños a la propia embarcación asegurada\u003c/b>; los causados en reparación, en tierra o remolcada por carretera; los de bienes en poder del asegurado u ocupantes; los de embarcaciones remolcadas para salvarlas; los de embarcaciones robadas; ni \u003cb>multas y sanciones\u003c/b>.","ref":"Art. 7 e)-k)"},{"t":"Exclusiones (III): sin título y regatas","b":"Tampoco cubre los daños a quienes suben voluntariamente a una embarcación gobernada por alguien \u003cb>sin el título adecuado\u003c/b>, si el asegurador prueba que lo sabían; ni los daños en \u003cb>regatas y competiciones\u003c/b>, que van con el seguro especial.","ref":"Art. 7 h) y l)"},{"t":"Límites de la cobertura","b":"Daños a personas: \u003cb>120.202,42 €\u003c/b> por víctima (20 millones de pesetas), con máximo de \u003cb>240.404,84 €\u003c/b> por siniestro (40 millones). Daños materiales y pérdidas económicas: \u003cb>96.161,94 €\u003c/b> por siniestro (16 millones).","ref":"Art. 8","tip":"El reglamento sigue expresando las cifras en pesetas; en el examen suelen aparecer en euros."},{"t":"Quién contrata el seguro","b":"El \u003cb>naviero o propietario\u003c/b> a cuyo nombre figure la embarcación en el registro. También puede contratarlo cualquier otro interesado o usuario, indicando en qué concepto.","ref":"Art. 9"},{"t":"Aseguradoras","b":"Entidades autorizadas en el \u003cb>ramo 12\u003c/b> (responsabilidad civil en vehículos marítimos) o domiciliadas en el Espacio Económico Europeo con autorización para operar en España.","ref":"Art. 10"},{"t":"Acreditar el seguro","b":"Prueba la vigencia el \u003cb>justificante del pago de la prima\u003c/b> en curso con aseguradora, embarcación, periodo con fecha y hora, e indicación de que es el seguro obligatorio. Va \u003cb>a bordo\u003c/b>; si no está, hay \u003cb>5 días hábiles\u003c/b> para justificarlo.","ref":"Arts. 11-12"}],"tf":[{"s":"Un velero sin motor de 5 metros de eslora está obligado a tener el seguro obligatorio de responsabilidad civil.","a":false,"e":"Las embarcaciones sin motor solo están obligadas si superan los 6 m (art. 2)."},{"s":"Las motos náuticas están obligadas a tener seguro de responsabilidad civil.","a":true,"e":"Art. 2."},{"s":"El seguro cubre la responsabilidad del esquiador que arrastra la embarcación.","a":true,"e":"Art. 1.1."},{"s":"Navegar sin el seguro obligatorio es una infracción leve.","a":false,"e":"Es grave (art. 5)."},{"s":"El seguro obligatorio cubre los daños sufridos por la propia embarcación asegurada.","a":false,"e":"Están excluidos (art. 7.e)."},{"s":"El seguro obligatorio cubre los daños a buques por colisión o sin contacto.","a":true,"e":"Art. 6.1.d."},{"s":"La muerte o lesiones del patrón de la embarcación están cubiertas.","a":false,"e":"Excluidas (art. 7.d)."},{"s":"Para participar en regatas basta el seguro obligatorio ordinario.","a":false,"e":"Hace falta un seguro especial (art. 3.2); los daños en regatas están excluidos del ordinario (art. 7.l)."},{"s":"El límite por daños a personas es de 120.202,42 euros por víctima.","a":true,"e":"Art. 8 (20 millones de pesetas)."},{"s":"Si no se lleva a bordo el justificante del seguro, hay 5 días hábiles para acreditarlo.","a":true,"e":"Art. 12.2."},{"s":"Solo el propietario puede contratar el seguro de su embarcación.","a":false,"e":"También cualquier otro interesado o usuario, expresando el concepto (art. 9.2)."}],"pairs":[{"title":"¿Cubierto o excluido?","items":[["Lesiones de un bañista arrollado","Cubierto"],["Daños al propio barco asegurado","Excluido"],["Daños a otro buque sin contacto","Cubierto"],["Lesiones de un pasajero que paga el viaje","Excluido"],["Multas impuestas al patrón","Excluido"]]},{"title":"Cada límite con su cuantía","items":[["Por víctima (daños personales)","120.202,42 €"],["Por siniestro (daños personales)","240.404,84 €"],["Daños materiales por siniestro","96.161,94 €"],["Plazo para acreditar el seguro","5 días hábiles"]]}],"cloze":[{"s":"Las embarcaciones sin motor deben asegurarse si su eslora supera los ___ metros.","o":["4","5","6","8"],"a":2},{"s":"El límite por víctima equivale a ___ millones de pesetas.","o":["16","20","40","60"],"a":1},{"s":"Los daños materiales tienen un límite de ___ millones de pesetas por siniestro.","o":["10","16","20","40"],"a":1},{"s":"Las aseguradoras deben estar autorizadas en el ramo número ___.","o":["6","10","12","13"],"a":2},{"s":"Si el justificante no está a bordo, hay ___ días hábiles para presentarlo.","o":["3","5","10","15"],"a":1}]},{"id":10,"title":"Titulaciones de recreo y alcohol","law":"Real Decreto 875/2014, de 10 de octubre (titulaciones náuticas de recreo) · Real Decreto 269/2022, de 12 de abril (art. 86.3)","scope":"RD 875/2014: cap. I, cap. VI (formación), régimen de inspecciones y sanciones y disposiciones adicionales · RD 269/2022 art. 86.3","intro":"Definiciones de las titulaciones de recreo, requisitos de escuelas y embarcaciones de prácticas, inspección por la DGMM, alquiler y títulos extranjeros, y el límite de alcohol de las dotaciones.","update":"Tus apuntes citan el art. 44 del RD 973/2009 para el alcohol; el temario 2026 lo sustituye por el art. 86.3 del RD 269/2022 (mismo límite y las mismas 4 horas). Además, desde 2019 el capítulo de inspecciones y sanciones es el VIII (antes VII).","weight":2,"cards":[{"t":"Objeto del RD 875/2014","b":"Regula los \u003cb>títulos náuticos\u003c/b> para gobernar embarcaciones de recreo y motos náuticas (atribuciones, requisitos y procedimiento) y los medios y titulaciones de los \u003cb>instructores\u003c/b> de escuelas y federaciones de vela y motonáutica.","ref":"Art. 1"},{"t":"Embarcación y buque de recreo","b":"\u003cb>Embarcación de recreo\u003c/b>: casco de 2,5 a 24 m. \u003cb>Buque de recreo\u003c/b>: más de 24 m, menos de \u003cb>3.000 GT\u003c/b> y hasta \u003cb>12 pasajeros\u003c/b> sin contar la tripulación. Los títulos de recreo \u003cb>nunca\u003c/b> habilitan para gobernar buques de recreo ni para trabajar en ellos.","ref":"Arts. 3.1-3.2 y 4.2"},{"t":"Moto náutica","b":"Artefacto flotante de \u003cb>menos de 4 m\u003c/b>, con motor de combustión interna y \u003cb>bomba de chorro de agua\u003c/b>, que se maneja sentado, de pie o de rodillas \u003cb>sobre\u003c/b> el casco, no dentro de él.","ref":"Art. 3.4"},{"t":"Lugar de abrigo","b":"Lugar en el que una embarcación puede \u003cb>refugiarse fácilmente\u003c/b> y permitir que sus ocupantes \u003cb>lleguen a tierra\u003c/b>.","ref":"Art. 3.5"},{"t":"Licencia de navegación","b":"La emiten las \u003cb>federaciones de vela y motonáutica y las escuelas\u003c/b>, bajo su responsabilidad. Habilita para gobernar embarcaciones de recreo y motos náuticas de \u003cb>hasta 6 m\u003c/b> de eslora con la potencia adecuada según el fabricante.","ref":"Art. 3.10"},{"t":"Título y tarjeta","b":"El \u003cb>título\u003c/b> es la habilitación, que consta como \u003cb>anotación registral\u003c/b>. La \u003cb>tarjeta\u003c/b> es el documento que acredita tenerlo. Navegación \u003cb>nocturna\u003c/b>: entre el ocaso y el orto; \u003cb>diurna\u003c/b>: entre el orto y el ocaso.","ref":"Art. 3.11-3.12 y 3.22-3.23"},{"t":"Qué habilitan los títulos","b":"El gobierno de embarcaciones de recreo y motos náuticas abanderadas en España usadas \u003cb>exclusivamente para recreo\u003c/b> (o lo que permitan las habilitaciones anejas). Los titulados profesionales de puente (marina mercante y pesca) pueden gobernarlas según su título, llevando la \u003cb>tarjeta profesional\u003c/b> en vigor.","ref":"Arts. 4-5"},{"t":"Requisitos de las escuelas","b":"Equipo homologado; instructores titulados; \u003cb>seguro obligatorio de responsabilidad civil\u003c/b> y \u003cb>seguro de accidentes\u003c/b> para los alumnos embarcados; y \u003cb>declaración responsable ante la DGMM\u003c/b> antes de empezar. Si no se renueva el seguro, la actividad se paraliza de inmediato.","ref":"Arts. 29-30"},{"t":"Quién puede ser instructor","b":"Para prácticas de \u003cb>PER, PNB y licencia\u003c/b>, radio, vela y prácticas de navegación a Baleares vale, entre otros, el \u003cb>Patrón Profesional de Embarcaciones de Recreo\u003c/b>. Para las de \u003cb>patrón de yate y capitán de yate\u003c/b> se exigen títulos profesionales superiores (capitán, piloto, patrón de altura…), no el PPER.","ref":"Art. 31"},{"t":"Esloras de las embarcaciones de prácticas","b":"Mínimo \u003cb>6 m\u003c/b> para PNB y PER y \u003cb>11,50 m\u003c/b> para patrón de yate y capitán de yate. \u003cb>Prohibidas la vela ligera y las neumáticas\u003c/b>; solo para la licencia de navegación se admiten \u003cb>semirrígidas de al menos 4,5 m\u003c/b>.","ref":"Art. 33.1"},{"t":"Equipo de las embarcaciones de prácticas","b":"\u003cb>Licencia\u003c/b>: equipo de \u003cb>zona 5\u003c/b>. \u003cb>PER y PNB\u003c/b>: \u003cb>zona 4\u003c/b>, más corredera, ancla de capa, 4 arneses, compás de puntas, transportador y regla. \u003cb>PY, CY y prácticas de navegación\u003c/b>: \u003cb>zona 2\u003c/b>, más radar y arneses para todos los de guardia; para CY, además, 2 sextantes, cronómetro y almanaque.","ref":"Art. 33.2","tip":"Todas llevan AIS tipo B con exportación de datos y sonda; licencia, PER y PNB, banderas A, C y N; PY y CY, bandera A."},{"t":"Habilitaciones anejas","b":"CY, PY y PER pueden habilitarse para: \u003cb>transporte de suministros\u003c/b> a otras embarcaciones hasta \u003cb>5 millas\u003c/b> del puerto; atraques, fondeos, remolques y traslados a menos de 5 millas de la costa; \u003cb>pruebas de mar\u003c/b>; y \u003cb>socorrismo en playas\u003c/b>. CY y PY, además, excursiones turísticas o pesca con \u003cb>hasta 6 pasajeros\u003c/b>.","ref":"Art. 34","tip":"Requisito: el curso de formación básica en seguridad (STCW A-VI/1). En motos náuticas, carga máxima 50 kg."},{"t":"Inspecciones","b":"La \u003cb>Dirección General de la Marina Mercante\u003c/b> realiza las inspecciones para comprobar la veracidad de la información y los requisitos. Si hay incumplimientos, \u003cb>suspende provisionalmente\u003c/b> la escuela o federación e inicia, en su caso, el expediente sancionador.","ref":"Art. 37 (antes 34)","tip":"La suspensión pasa a definitiva si se impone como sanción accesoria o si la escuela no subsana."},{"t":"Régimen sancionador","b":"Las infracciones se rigen por el \u003cb>título IV del libro III del TRLPEMM\u003c/b> (el del Tema 1) y por las normas generales de procedimiento sancionador.","ref":"Art. 38 (antes 35)"},{"t":"Embarcaciones de lista octava","b":"La DGMM, a través de las Capitanías, puede autorizar a titulados de recreo a gobernar embarcaciones de \u003cb>lista 8.ª\u003c/b> de entidades sin ánimo de lucro con fines humanitarios, científicos o de salvamento. Resolución en \u003cb>15 días hábiles\u003c/b>; el silencio es \u003cb>positivo\u003c/b>.","ref":"DA 1.ª"},{"t":"Discapacidad","b":"Las personas con discapacidad tituladas pueden gobernar embarcaciones \u003cb>adaptadas\u003c/b>. Si las adapta el fabricante, inspección inicial de la DGMM; si las reforma otro taller, \u003cb>reconocimiento adicional\u003c/b> de una entidad colaboradora.","ref":"DA 2.ª"},{"t":"Alquiler y títulos extranjeros","b":"Las embarcaciones españolas se alquilan a quien tenga un título de recreo en vigor de su país de \u003cb>nacionalidad o residencia\u003c/b> (Espacio Económico Europeo o países del anexo IX), o un título profesional STCW. La DGMM, a través de las Capitanías, autoriza esos títulos extranjeros.","ref":"DA 3.ª y 4.ª"},{"t":"Barcos con bandera extranjera","b":"Quien gobierne en aguas españolas una embarcación de recreo extranjera necesita título: el que exija su país si su nacionalidad coincide con el pabellón; si no coincide, el de su país de \u003cb>residencia\u003c/b> o, en su defecto, el de su nacionalidad.","ref":"DA 5.ª"},{"t":"Límite de alcohol de la dotación","b":"Todo miembro de la dotación respetará \u003cb>0,05 % de alcohol en sangre\u003c/b> o \u003cb>0,25 mg/l en aire espirado\u003c/b> desde \u003cb>4 horas antes\u003c/b> de empezar sus funciones, cualesquiera que sean, \u003cb>hasta que terminen\u003c/b>. Superarlo se considera \u003cb>estado de ebriedad\u003c/b> a efectos sancionadores.","ref":"Art. 86.3 RD 269/2022"}],"tf":[{"s":"Un buque de recreo mide más de 24 m, tiene menos de 3.000 GT y lleva hasta 12 pasajeros.","a":true,"e":"Art. 3.2."},{"s":"Con un título de capitán de yate se puede gobernar un buque de recreo de 30 metros.","a":false,"e":"Los títulos de recreo no habilitan nunca para buques de recreo (art. 4.2)."},{"s":"La moto náutica mide menos de 4 metros y se propulsa con bomba de chorro de agua.","a":true,"e":"Art. 3.4."},{"s":"La licencia de navegación la expide la Capitanía Marítima.","a":false,"e":"La emiten las federaciones de vela y motonáutica y las escuelas (art. 3.10)."},{"s":"La licencia de navegación permite gobernar embarcaciones de hasta 6 metros.","a":true,"e":"Art. 3.10."},{"s":"Las escuelas presentan una declaración responsable ante la DGMM antes de iniciar sus actividades.","a":true,"e":"Arts. 29.1.d y 30."},{"s":"Las prácticas de PER pueden darse en una neumática de 6 metros.","a":false,"e":"No pueden usarse vela ligera ni neumáticas (art. 33.1)."},{"s":"Las embarcaciones de prácticas de patrón de yate deben medir al menos 11,50 metros.","a":true,"e":"Art. 33.1."},{"s":"Las embarcaciones de prácticas para la licencia de navegación van equipadas al menos como exige la zona 4.","a":false,"e":"Como exige la zona 5 (art. 33.2.1.º). Zona 4 es para PER y PNB."},{"s":"Un PPER puede ser instructor de las prácticas de capitán de yate.","a":false,"e":"El art. 31.1.a no incluye al PPER para CY y PY; sí para PER, PNB y licencia (31.1.b)."},{"s":"Las inspecciones del RD 875/2014 las realizan exclusivamente las entidades colaboradoras de inspección.","a":false,"e":"Las realiza la Dirección General de la Marina Mercante (art. 37.1)."},{"s":"El límite de alcohol de la dotación se aplica desde 4 horas antes de empezar las funciones hasta su finalización.","a":true,"e":"Art. 86.3 RD 269/2022."},{"s":"El límite de alcohol en aire espirado para la dotación es de 0,15 mg/l.","a":false,"e":"Es 0,25 mg/l en aliento o 0,05 % en sangre (art. 86.3 RD 269/2022)."},{"s":"Con la habilitación aneja, un patrón de yate puede llevar hasta 6 pasajeros en excursiones turísticas.","a":true,"e":"Art. 34.2."}],"pairs":[{"title":"Embarcación de prácticas: eslora mínima","items":[["Licencia de navegación (semirrígida)","4,5 m"],["PNB y PER","6 m"],["Patrón de yate y capitán de yate","11,50 m"]]},{"title":"Embarcación de prácticas: zona de equipo","items":[["Licencia de navegación","Zona 5"],["PER y PNB","Zona 4"],["PY, CY y prácticas de navegación","Zona 2"]]},{"title":"Cada cifra con su norma","items":[["Alcohol en sangre de la dotación","0,05 %"],["Alcohol en aire espirado","0,25 mg/l"],["Antelación del límite de alcohol","4 horas"],["Distancia máxima de las habilitaciones anejas","5 millas"],["Pasajeros en excursiones con habilitación de PY o CY","6"]]}],"cloze":[{"s":"El buque de recreo tiene un arqueo bruto inferior a ___ GT.","o":["500","1.000","3.000","5.000"],"a":2},{"s":"La licencia de navegación habilita para embarcaciones de hasta ___ m de eslora.","o":["4","5","6","8"],"a":2},{"s":"La moto náutica mide menos de ___ m.","o":["3","4","5","6"],"a":1},{"s":"Las embarcaciones de prácticas de PNB y PER miden al menos ___ m.","o":["4,5","6","8","11,5"],"a":1},{"s":"El límite de alcohol rige desde ___ horas antes del inicio de las funciones.","o":["2","4","6","12"],"a":1},{"s":"La autorización para gobernar embarcaciones de lista octava se resuelve en ___ días hábiles.","o":["10","15","30","60"],"a":1}]},{"id":11,"title":"Inspecciones de embarcaciones de recreo","law":"Real Decreto 1434/1999, de 10 de septiembre: reconocimientos e inspecciones de las embarcaciones de recreo y entidades colaboradoras de inspección (ECI)","scope":"RD 1434/1999 completo (modificado por el RD 1435/2010)","intro":"Los cinco tipos de reconocimiento, cada cuánto toca, el certificado de navegabilidad y las entidades colaboradoras de inspección.","update":null,"weight":1,"cards":[{"t":"Ámbito","b":"Embarcaciones de recreo \u003cb>matriculadas en España\u003c/b>, de \u003cb>2,5 a 24 m\u003c/b> de eslora de casco, para fines recreativos y deportivos, que \u003cb>no transporten más de 12 pasajeros\u003c/b>.","ref":"Art. 2"},{"t":"Reconocimiento inicial","b":"Lo hace la \u003cb>Administración marítima\u003c/b>: examen de planos y documentación técnica e inspección de estructura, máquinas y equipo. Superado, se expide el \u003cb>certificado de navegabilidad\u003c/b>.","ref":"Art. 3.A","tip":"Las embarcaciones con marcado CE no lo necesitan: el certificado se les expide automáticamente."},{"t":"Reconocimientos periódicos","b":"Cada \u003cb>5 años como máximo\u003c/b>: lista 7.ª de \u003cb>6 m o más\u003c/b> (y menos de 24 m) y toda la lista 6.ª sea cual sea su eslora. Incluyen \u003cb>inspección del casco en seco\u003c/b> y del equipo, revisión minuciosa de salvamento y seguridad y comprobación de la documentación.","ref":"Art. 3.B"},{"t":"Exentas de periódicos","b":"Las embarcaciones de \u003cb>lista 7.ª de menos de 6 m\u003c/b> no tienen reconocimientos periódicos: su certificado de navegabilidad lleva la frase \u003cb>«SIN CADUCIDAD»\u003c/b>.","ref":"Art. 3.B"},{"t":"Reconocimientos intermedios","b":"En seco, \u003cb>entre el 2.º y el 3.er año\u003c/b> del periodo: lista 6.ª de 6 m o más; lista 7.ª de \u003cb>15 m o más\u003c/b>; y lista 7.ª de 6 m o más con \u003cb>casco de madera\u003c/b>.","ref":"Art. 3.C"},{"t":"Reconocimientos adicionales","b":"Obligatorios cuando la embarcación: hace \u003cb>reparaciones o modificaciones\u003c/b> en casco, maquinaria o equipo; va a \u003cb>pasar de lista 7.ª a lista 6.ª\u003c/b>; o tras una \u003cb>varada, abordaje\u003c/b> o avería seria que afecte a la seguridad.","ref":"Art. 3.D"},{"t":"Reconocimientos extraordinarios","b":"A requerimiento de un \u003cb>órgano judicial\u003c/b>, o por resolución motivada de la \u003cb>DGMM\u003c/b> cuando haya indicios fundados de peligro para la seguridad marítima o para prevenir la contaminación.","ref":"Art. 3.E"},{"t":"Certificado de navegabilidad","b":"Acredita los reconocimientos hechos y la fecha de los próximos; si no se pasan a tiempo, \u003cb>caduca\u003c/b>. Va \u003cb>siempre a bordo\u003c/b>; si no está, hay \u003cb>5 días hábiles\u003c/b> para acreditarlo. El propietario responde de tenerlo al día.","ref":"Art. 4","tip":"Navegar con él caducado o sin él es infracción grave."},{"t":"Quién hace los reconocimientos","b":"El inicial, la Administración marítima. Los \u003cb>periódicos, intermedios, adicionales y extraordinarios\u003c/b> se hacen a través de las \u003cb>entidades colaboradoras de inspección (ECI)\u003c/b>; en el extranjero, también organizaciones autorizadas.","ref":"Art. 5"},{"t":"Requisitos de una ECI","b":"Independencia total de fabricantes, astilleros, talleres, vendedores y \u003cb>aseguradoras\u003c/b>; personal cualificado y formación; equipos calibrados; seguro de al menos \u003cb>1.202.024 €\u003c/b>; cobertura nacional para inspeccionar en \u003cb>menos de 15 días\u003c/b>; sistema de calidad EN 45004.","ref":"Art. 6"},{"t":"Autorización de las ECI","b":"La concede el \u003cb>Secretario de Estado\u003c/b> (antes de Infraestructuras y Transportes), se publica en el BOE y vale para toda España. Plazo de \u003cb>3 meses\u003c/b>; sin resolución, se entiende desestimada. Sus centros no pueden cubrir más de \u003cb>200 km\u003c/b> (salvo Canarias).","ref":"Art. 7"},{"t":"Obligaciones de las ECI","b":"Auditoría al menos \u003cb>una vez al año\u003c/b> por la DGMM; registros y \u003cb>memoria anual antes del 31 de marzo\u003c/b>; confidencialidad; comunicar sus tarifas; aval de \u003cb>50 millones de pesetas\u003c/b>.","ref":"Art. 8"},{"t":"Cómo se pide un reconocimiento","b":"El propietario lo pide a una ECI con \u003cb>al menos 15 días naturales\u003c/b> antes de que caduque el certificado y elige el lugar (astillero, varadero, puerto, club). Puede estar presente en la inspección.","ref":"Art. 9"},{"t":"Resultado del reconocimiento","b":"\u003cb>Favorable\u003c/b>: la ECI renueva el certificado (si es adicional, informa a la Capitanía, que lo expide). \u003cb>Desfavorable\u003c/b>: hasta \u003cb>2 meses\u003c/b> para subsanar; si no, la Capitanía declara caducado el certificado. Si hay defectos graves, la Capitanía puede \u003cb>inmovilizar\u003c/b> la embarcación.","ref":"Art. 10"},{"t":"Infracciones graves","b":"Navegar \u003cb>sin certificado de navegabilidad o con él caducado\u003c/b>; hacer obras de transformación o \u003cb>cambiar el motor sin autorización\u003c/b>; incumplir las condiciones de la ECI o hacer mal los reconocimientos; no enviar la memoria anual.","ref":"Art. 12"},{"t":"Infracciones muy graves","b":"Navegar sin certificado \u003cb>y además sin condiciones de navegabilidad\u003c/b>, poniendo en peligro la seguridad; que la ECI \u003cb>falsee datos\u003c/b>; o que el propietario falsee informes o datos del certificado.","ref":"Art. 13","tip":"Responden los propietarios por lo suyo y las ECI por lo suyo (art. 14). La suspensión o revocación de la ECI es sanción accesoria."}],"tf":[{"s":"El RD 1434/1999 se aplica a embarcaciones de recreo matriculadas que no transporten más de 12 pasajeros.","a":true,"e":"Art. 2.1."},{"s":"Una embarcación con marcado CE debe pasar el reconocimiento inicial.","a":false,"e":"No lo precisa; el certificado de navegabilidad se le expide automáticamente (art. 3.A)."},{"s":"Los reconocimientos periódicos se hacen cada cinco años como máximo.","a":true,"e":"Art. 3.B."},{"s":"Una embarcación de lista séptima de 5 metros está sujeta a reconocimientos periódicos.","a":false,"e":"Las de lista 7.ª de menos de 6 m están exentas; su certificado dice «SIN CADUCIDAD» (art. 3.B)."},{"s":"Una embarcación de lista sexta de 5 metros está sujeta a reconocimientos periódicos.","a":true,"e":"Las de lista 6.ª, cualquiera que sea su eslora (art. 3.B)."},{"s":"Una embarcación de lista séptima de 10 metros con casco de fibra debe pasar reconocimiento intermedio.","a":false,"e":"En lista 7.ª el intermedio es para 15 m o más, o 6 m o más si el casco es de madera (art. 3.C)."},{"s":"El cambio de lista séptima a lista sexta exige un reconocimiento adicional.","a":true,"e":"Art. 3.D.b."},{"s":"El reconocimiento extraordinario puede ordenarlo un órgano judicial.","a":true,"e":"Art. 3.E.a."},{"s":"La inspección del casco en seco forma parte del reconocimiento periódico.","a":true,"e":"Art. 3.B.1."},{"s":"Una entidad colaboradora de inspección puede estar participada por una aseguradora.","a":false,"e":"Está expresamente prohibido (art. 6.1.a)."},{"s":"El reconocimiento se solicita a la ECI con al menos 15 días naturales de antelación a la caducidad del certificado.","a":true,"e":"Art. 9.1."},{"s":"Tras un reconocimiento desfavorable hay seis meses para subsanar los defectos.","a":false,"e":"Un máximo de dos meses (art. 10.2.º)."},{"s":"Navegar con el certificado de navegabilidad caducado es una infracción grave.","a":true,"e":"Arts. 4.5 y 12.a."}],"pairs":[{"title":"Cada situación con su reconocimiento","items":[["Embarcación nueva sin marcado CE","Inicial"],["Revisión quinquenal con casco en seco","Periódico"],["Revisión entre el 2.º y el 3.er año","Intermedio"],["Paso de lista 7.ª a 6.ª o tras una varada","Adicional"],["Lo pide un juez o la DGMM","Extraordinario"]]},{"title":"Cada cifra con su regla","items":[["Periodicidad máxima de los periódicos","5 años"],["Plazo para subsanar un resultado desfavorable","2 meses"],["Antelación para pedir el reconocimiento","15 días naturales"],["Seguro mínimo de una ECI","1.202.024 €"],["Radio máximo de un centro de la ECI","200 km"]]}],"cloze":[{"s":"En lista 7.ª, las embarcaciones de menos de ___ m están exentas de reconocimientos periódicos.","o":["4","6","8","12"],"a":1},{"s":"En lista 7.ª, el intermedio es obligatorio a partir de ___ m de eslora (si el casco no es de madera).","o":["6","10","12","15"],"a":3},{"s":"El reconocimiento intermedio se hace entre el segundo y el ___ año.","o":["tercer","cuarto","quinto","sexto"],"a":0},{"s":"Si el certificado de navegabilidad no está a bordo, hay ___ días hábiles para acreditarlo.","o":["3","5","10","15"],"a":1},{"s":"Las ECI presentan su memoria anual antes del 31 de ___.","o":["enero","marzo","junio","diciembre"],"a":1},{"s":"La autorización de una ECI se resuelve en un plazo máximo de ___ meses.","o":["1","2","3","6"],"a":2}]},{"id":12,"title":"Equipo de seguridad y contaminación","law":"Real Decreto 339/2021, de 18 de mayo: equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo","scope":"RD 339/2021 completo (deroga la Orden FOM/1144/2003)","intro":"Zonas de navegación, salvamento, señales, fondeo, material náutico, contraincendios, achique, aguas sucias y las multas por no llevar el equipo.","update":"Tus apuntes desarrollan la Orden FOM/1144/2003, derogada desde el 1 de julio de 2021. El temario 2026 y los exámenes preguntan el RD 339/2021, que cambia cifras (por ejemplo, chalecos de 275/150/100 N, bombas de 10/15/30 l/min o la línea de fondeo de 5 esloras).","weight":2,"cards":[{"t":"Ámbito","b":"Embarcaciones de recreo de \u003cb>2,5 a 24 m\u003c/b> que no lleven más de 12 pasajeros: matriculadas, inscritas o preinscritas en España; las que hagan \u003cb>actividad comercial\u003c/b> en aguas españolas con cualquier pabellón; y las extranjeras que naveguen por aguas interiores o mar territorial si su propietario o usuario \u003cb>reside en España\u003c/b>.","ref":"Arts. 1-2.1"},{"t":"Excluidas","b":"Artefactos flotantes (piraguas, kayaks, patines, \u003cb>motos náuticas\u003c/b>, tablas), \u003cb>embarcaciones de regatas\u003c/b> destinadas solo a competición, experimentales no comercializadas, sumergibles, aerodeslizadores, hidroplaneadores, \u003cb>históricas diseñadas antes de 1950\u003c/b> e innovadoras que no puedan llevar el equipo.","ref":"Art. 2.2","tip":"Para las excluidas (salvo artefactos), el capitán marítimo fija la zona en la que pueden navegar (DA 1.ª)."},{"t":"Zonas de navegación","b":"\u003cb>1\u003c/b>: ilimitada. \u003cb>2\u003c/b>: hasta 60 millas. \u003cb>3\u003c/b>: hasta 25 millas. \u003cb>4\u003c/b>: hasta 12 millas. \u003cb>5\u003c/b>: a no más de 5 millas de un abrigo o playa accesible. \u003cb>6\u003c/b>: a no más de 2 millas de abrigo. \u003cb>7\u003c/b>: aguas protegidas (puertos, radas, rías, bahías).","ref":"Art. 3.1"},{"t":"Categorías de diseño y zonas","b":"Con marcado CE: categoría \u003cb>A\u003c/b> → zonas 1 a 7; \u003cb>B\u003c/b> → zonas 2 a 7; \u003cb>C\u003c/b> → zonas 4 a 7; \u003cb>D\u003c/b> → solo zona 7. Siempre según el equipo que lleve a bordo, y nunca con viento y olas superiores a los de su diseño.","ref":"Art. 3.3-3.5"},{"t":"Responsables","b":"Propietarios y, en su caso, patrones mantienen la embarcación y su equipo en regla: siempre en condiciones de hacerse a la mar y sin superar el número máximo de personas autorizado.","ref":"Art. 4"},{"t":"Balsas salvavidas","b":"Obligatorias en \u003cb>zonas 1, 2 y 3\u003c/b>, con capacidad para todas las personas a bordo. Se revisan según el fabricante en estaciones autorizadas; si la embarcación tiene \u003cb>uso comercial\u003c/b>, el intervalo no puede pasar de \u003cb>24 meses\u003c/b>.","ref":"Art. 6"},{"t":"Chalecos salvavidas","b":"Uno por persona, \u003cb>con luz\u003c/b> (en zonas 4-7 y solo de día puede omitirse la luz). En \u003cb>zona 1\u003c/b>, un chaleco \u003cb>adicional\u003c/b>. Chalecos adecuados para niños y bebés. Flotabilidad mínima: \u003cb>275 N en zona 1\u003c/b>, \u003cb>150 N en zonas 2-4\u003c/b> y \u003cb>100 N en zonas 5-7\u003c/b>.","ref":"Art. 7"},{"t":"Aros salvavidas","b":"En \u003cb>zonas 1 a 4\u003c/b>, un aro con \u003cb>luz y rabiza\u003c/b>. En zona 1, además, un segundo aro, que no necesita luz ni rabiza.","ref":"Art. 8"},{"t":"Señales de socorro","b":"\u003cb>Bengalas de mano\u003c/b>: 6 en zonas 1-3 y 3 en zonas 4-6. \u003cb>Cohetes con paracaídas\u003c/b>: 6 en zonas 1-3, 3 en zona 4 y ninguno en 5-6. \u003cb>Fumígenas flotantes\u003c/b>: 2 en zona 1 y 1 en zonas 2-3.","ref":"Art. 9"},{"t":"Luces y señales acústicas","b":"Las del Reglamento de abordajes (partes C y D). En zonas 4-7 y solo de día: con menos de \u003cb>12 m\u003c/b> valen luces no homologadas visibles a 1 milla; con menos de \u003cb>7 m\u003c/b> basta una \u003cb>linterna de luz blanca\u003c/b>. Todas llevan \u003cb>bocina de niebla\u003c/b>; desde \u003cb>20 m\u003c/b>, también \u003cb>campana\u003c/b> de 200 mm.","ref":"Art. 10"},{"t":"Línea de fondeo","b":"Longitud mínima \u003cb>5 veces la eslora\u003c/b>. El tramo de cadena, al menos \u003cb>igual a la eslora\u003c/b>, salvo en embarcaciones de \u003cb>6 m o menos\u003c/b>, que pueden llevar solo estacha. Nada empalmado sin grillete.","ref":"Art. 11.1-11.3"},{"t":"Anclas","b":"La tabla va por eslora: por ejemplo, 12 m → ancla de \u003cb>20 kg\u003c/b>, cadena de 8 mm y estacha de 12 mm; 24 m → 75 kg. Pesos para anclas de alto poder de agarre: otros tipos, \u003cb>un tercio más\u003c/b>. Se puede repartir en dos anclas, con la principal de al menos el \u003cb>75 %\u003c/b>.","ref":"Art. 11.4-11.7"},{"t":"Material náutico por zonas","b":"\u003cb>Pabellón, linterna estanca, reflector de radar\u003c/b> y tablas de señales: todas las zonas. \u003cb>Compás, cartas, publicaciones y prismáticos\u003c/b>: zonas 1 a 4. \u003cb>Barómetro y banderas C y N\u003c/b>: zonas 1 y 2. \u003cb>Sextante, cronómetro y diario de navegación\u003c/b>: solo zona 1.","ref":"Art. 12.1","tip":"Con cabina cerrada de gobierno y categoría A o B, compás, cartas, publicaciones y prismáticos incluso en zonas 5-7."},{"t":"Detalles del material náutico","b":"En zonas 1-2, compás iluminado, compás de marcaciones y \u003cb>tablilla de desvíos revisada cada 5 años\u003c/b>. Publicaciones: Derrotero, Libro de faros y Anuario de mareas (este, salvo en el Mediterráneo). Reflector de radar en cascos no metálicos.","ref":"Art. 12.2"},{"t":"Material diverso y botiquín","b":"Gobierno de emergencia (veleros o motor con gobierno a distancia, salvo fueraborda o cola en Z), \u003cb>dos estachas de amarre\u003c/b>, \u003cb>bichero\u003c/b> e inflador y parches en neumáticas. Sin tripulación profesional, en \u003cb>zonas 1-4\u003c/b>, botiquín tipo \u003cb>balsas de salvamento\u003c/b> y Guía sanitaria.","ref":"Art. 13"},{"t":"Combustibles","b":"\u003cb>Grupo 1.º\u003c/b>: punto de inflamación \u003cb>inferior a 55 °C\u003c/b> (gasolina, encendido por chispa). \u003cb>Grupo 2.º\u003c/b>: \u003cb>55 °C o más\u003c/b> (gasóleo, encendido por compresión). \u003cb>GLP\u003c/b>: propano, butano y similares.","ref":"Art. 14"},{"t":"Extintores portátiles","b":"Con marcado CE, los del manual del fabricante (si no está a bordo, 10 días para acreditarlo). Sin CE o con uso comercial: por eslora, 1 de tipo 34B (menos de 10 m con cabina cerrada, o de 10 a 15 m), 2 (15-20 m) y 3 (20-24 m); por motor, 1 hasta 220 kW y B = P × 0,3 por encima.","ref":"Art. 15","tip":"Cada extintor, al menos 2 kg de agente; uno alcanzable desde el puesto de gobierno."},{"t":"Sistemas fijos, gases y ventilación","b":"Sin CE o con uso comercial y motor de \u003cb>gasolina o GLP\u003c/b>: sistema fijo de extinción en la cámara de motores (UNE-EN ISO 9094). Instalaciones de gas dentro del casco: \u003cb>detector con alarma luminosa y sonora\u003c/b>; con motores de GLP, según \u003cb>UNE-EN 15609:2012\u003c/b>.","ref":"Arts. 16-17"},{"t":"Ventilación y depósitos (sin CE)","b":"Gasolina: ventilación según UNE-EN ISO 11105:2020, \u003cb>forzada\u003c/b> si el arranque es eléctrico. GLP: ventilación forzada. Junto al arranque, una placa que recuerde \u003cb>ventilar 4 minutos\u003c/b> antes de arrancar. Los depósitos de gasolina no forman parte del casco.","ref":"Arts. 18-19"},{"t":"Achique","b":"\u003cb>Zonas 1-3\u003c/b>: bomba movida por el motor u otra fuente, bomba manual y \u003cb>2 baldes\u003c/b> de 5 l. \u003cb>Zonas 4-6\u003c/b>: bomba manual o eléctrica y \u003cb>1 balde\u003c/b>. \u003cb>Zona 7\u003c/b>: bomba manual o eléctrica. Los veleros (zonas 1-6), una bomba manual fija manejable desde la bañera.","ref":"Art. 20.1"},{"t":"Capacidad de las bombas","b":"A 10 kPa: \u003cb>10 l/min\u003c/b> si L ≤ 6 m; \u003cb>15 l/min\u003c/b> si 6 &lt; L &lt; 12 m; \u003cb>30 l/min\u003c/b> si L ≥ 12 m. Las manuales alcanzan esa capacidad con \u003cb>45 emboladas por minuto\u003c/b>.","ref":"Art. 20.2"},{"t":"Contaminación: MARPOL y equipos","b":"Las embarcaciones cumplen los anexos \u003cb>I, V y VI\u003c/b> de MARPOL que les apliquen. Las que tienen inodoro (sin CE) llevan \u003cb>sistema de retención\u003c/b>, planta de tratamiento o sistema de desmenuzado y desinfección; con depósito fijo, \u003cb>conexión universal a tierra\u003c/b> y válvulas precintables.","ref":"Arts. 21-22"},{"t":"Descarga de aguas sucias","b":"Prohibida en aguas españolas salvo: a más de \u003cb>3 millas\u003c/b> si están desmenuzadas y desinfectadas, o a más de \u003cb>12 millas\u003c/b> sin tratar, descargando a ritmo moderado y navegando a \u003cb>4 nudos o más\u003c/b>; o fuera de la zona 7 con una planta de tratamiento homologada.","ref":"Art. 23","tip":"Se permite por seguridad, para salvar vidas o por avería tomando precauciones."},{"t":"Infracciones y multas","b":"No llevar un equipo obligatorio o llevarlo \u003cb>caducado\u003c/b> es infracción \u003cb>grave\u003c/b>. Ejemplos: \u003cb>200-250 €\u003c/b> por chaleco, \u003cb>300-400 €\u003c/b> por extintor, 100-150 € por bengala; balsa: 500-600 € (hasta 7,5 m), 1.000-1.200 € (7,5-12 m) y 2.500-3.000 € (más de 12 m).","ref":"Arts. 24-25"}],"tf":[{"s":"Las embarcaciones de regatas destinadas exclusivamente a la competición están excluidas del RD 339/2021.","a":true,"e":"Art. 2.2.b."},{"s":"Las motos náuticas están incluidas en el ámbito del RD 339/2021.","a":false,"e":"Son artefactos flotantes de recreo excluidos (art. 2.2.a)."},{"s":"La zona 3 de navegación llega hasta 25 millas de la costa.","a":true,"e":"Art. 3.1.c."},{"s":"Una embarcación de categoría de diseño C puede navegar en zona 3.","a":false,"e":"La categoría C permite zonas 4 a 7 (art. 3.3.c)."},{"s":"Las balsas salvavidas son obligatorias en zona 4.","a":false,"e":"Solo en zonas 1, 2 y 3 (art. 6.1)."},{"s":"En zona 1 los chalecos deben tener una flotabilidad mínima de 275 N.","a":true,"e":"Art. 7.5."},{"s":"En zona 4 basta con chalecos de 100 N.","a":false,"e":"En zonas 2, 3 y 4 el mínimo es 150 N; 100 N es para zonas 5, 6 y 7."},{"s":"En zona 1 se lleva un chaleco salvavidas adicional.","a":true,"e":"Art. 7.2."},{"s":"En zona 5 son obligatorios los cohetes con luz roja y paracaídas.","a":false,"e":"En zonas 5 y 6 solo 3 bengalas de mano (art. 9)."},{"s":"La línea de fondeo debe medir al menos cinco veces la eslora.","a":true,"e":"Art. 11.1."},{"s":"Una embarcación de 6 metros puede llevar la línea de fondeo enteramente de estacha.","a":true,"e":"Art. 11.2."},{"s":"El sextante es obligatorio en zona 2.","a":false,"e":"Solo en zona 1 (art. 12.1)."},{"s":"El combustible del grupo 1.º tiene un punto de inflamación inferior a 55 °C.","a":true,"e":"Art. 14.1."},{"s":"Antes de arrancar un motor de gasolina interior hay que ventilar el compartimento durante 4 minutos.","a":true,"e":"Art. 18.4."},{"s":"Una bomba de achique de una embarcación de 10 m debe dar al menos 30 litros por minuto.","a":false,"e":"Para 6 &lt; L &lt; 12 m son 15 l/min; 30 l/min es para L ≥ 12 m (art. 20.2)."},{"s":"Se pueden descargar aguas sucias sin tratar a más de 3 millas de la costa.","a":false,"e":"Sin tratar, a más de 12 millas; desmenuzadas y desinfectadas, a más de 3 (art. 23.1.a)."}],"pairs":[{"title":"Zona de navegación y distancia","items":[["Zona 2","60 millas"],["Zona 3","25 millas"],["Zona 4","12 millas"],["Zona 5","5 millas de un abrigo"],["Zona 6","2 millas de un abrigo"]]},{"title":"Categoría de diseño y zonas permitidas","items":[["Categoría A","Zonas 1 a 7"],["Categoría B","Zonas 2 a 7"],["Categoría C","Zonas 4 a 7"],["Categoría D","Solo zona 7"]]},{"title":"Flotabilidad del chaleco","items":[["Zona 1","275 N"],["Zonas 2, 3 y 4","150 N"],["Zonas 5, 6 y 7","100 N"]]},{"title":"Capacidad de la bomba de achique","items":[["Eslora hasta 6 m","10 l/min"],["Más de 6 y menos de 12 m","15 l/min"],["12 m o más","30 l/min"]]},{"title":"Norma técnica y su materia","items":[["UNE-EN 15609:2012","Detección de gas y ventilación con GLP"],["UNE-EN ISO 11105:2020","Ventilación de motores de gasolina"],["UNE-EN 24565:1992","Cadenas de ancla"],["UNE-EN ISO 16315:2016","Propulsión eléctrica"],["UNE-EN ISO 9094:2017","Protección contra incendios"]]}],"cloze":[{"s":"En zonas 1, 2 y 3 se llevan ___ bengalas de mano.","o":["3","4","6","12"],"a":2},{"s":"Las embarcaciones de ___ m o más llevan además una campana.","o":["12","15","20","24"],"a":2},{"s":"Si el ancla no es de alto poder de agarre, su peso se aumenta en ___.","o":["un cuarto","un tercio","la mitad","el doble"],"a":1},{"s":"La tablilla de desvíos del compás se revisa cada ___ años.","o":["2","3","5","10"],"a":2},{"s":"Por encima de 220 kW, la capacidad de extintores es B = P × ___.","o":["0,1","0,2","0,3","0,5"],"a":2},{"s":"Las bombas manuales deben alcanzar su capacidad con ___ emboladas por minuto.","o":["30","45","60","90"],"a":1},{"s":"Las aguas sucias almacenadas se descargan navegando a no menos de ___ nudos.","o":["2","4","6","8"],"a":1},{"s":"Las balsas de embarcaciones con uso comercial se revisan como máximo cada ___ meses.","o":["12","18","24","36"],"a":2}]},{"id":13,"title":"Requisitos de seguridad y marcado CE","law":"Real Decreto 98/2016, de 11 de marzo: requisitos de seguridad, técnicos y de comercialización de motos náuticas, embarcaciones deportivas y sus componentes","scope":"Cap. I (disposiciones generales) · cap. II (libre circulación) · anexo I.A (diseño y construcción) · anexo I.B.1 (identificación del motor) · anexo II (componentes)","intro":"A qué se aplica el marcado CE de recreo, las categorías de diseño A, B, C y D, la identificación de embarcaciones y motores y los requisitos esenciales de construcción y equipos.","update":null,"weight":1,"cards":[{"t":"Objeto y ámbito","b":"Requisitos esenciales de diseño, fabricación y construcción de \u003cb>embarcaciones de recreo, motos náuticas\u003c/b> (también semiacabadas), sus \u003cb>componentes\u003c/b> del anexo II vendidos por separado y sus \u003cb>motores de propulsión\u003c/b>, además de las emisiones de escape y sonoras. También a embarcaciones y motores con una \u003cb>modificación importante\u003c/b>.","ref":"Arts. 1-2"},{"t":"Exclusiones (I)","b":"Embarcaciones \u003cb>exclusivamente de regatas\u003c/b> (incluido el remo); canoas y kayaks de propulsión humana, góndolas y embarcaciones de pedales; tablas de vela y de surf (incluso con motor); \u003cb>históricas diseñadas antes de 1950\u003c/b>; experimentales no comercializadas.","ref":"Art. 3.1 a)-f)"},{"t":"Exclusiones (II)","b":"Las \u003cb>construidas por el propio usuario\u003c/b> si no se venden en \u003cb>5 años\u003c/b>; las destinadas a llevar \u003cb>pasajeros con fines comerciales y tripulación profesional\u003c/b>; sumergibles, aerodeslizadores, hidroplaneadores, embarcaciones de vapor de combustión externa y \u003cb>anfibios\u003c/b>.","ref":"Art. 3.1 g)-m)","tip":"Que una embarcación también se use para chárter o entrenamiento no la excluye si se comercializa con fines recreativos (art. 3.4)."},{"t":"Embarcación de recreo y moto náutica","b":"\u003cb>Embarcación de recreo\u003c/b>: casco de \u003cb>2,5 a 24 m\u003c/b> para fines deportivos o recreativos, sin contar las motos náuticas. \u003cb>Moto náutica\u003c/b>: menos de \u003cb>4 m\u003c/b>, propulsada por \u003cb>bomba de chorro de agua\u003c/b> y manejada sentado, de pie o de rodillas sobre el casco.","ref":"Art. 4.2-4.3"},{"t":"Modificaciones importantes","b":"\u003cb>Del motor\u003c/b>: la que pueda superar los límites de emisiones o aumente la potencia nominal \u003cb>más de un 15 %\u003c/b>. \u003cb>De la embarcación\u003c/b>: la que cambie el medio de propulsión, implique una modificación importante del motor o pueda incumplir los requisitos esenciales.","ref":"Art. 4.8-4.9"},{"t":"Agentes económicos","b":"\u003cb>Fabricante\u003c/b>, \u003cb>representante autorizado\u003c/b> (con mandato escrito), \u003cb>importador\u003c/b> (trae productos de terceros países al mercado) y \u003cb>distribuidor\u003c/b>. El \u003cb>importador privado\u003c/b> importa sin actividad comercial para su propio uso.","ref":"Art. 4.15-4.20"},{"t":"Conceptos de mercado","b":"\u003cb>Introducción en el mercado\u003c/b>: la primera comercialización. \u003cb>Puesta en servicio\u003c/b>: el primer uso por el usuario final. \u003cb>Organismo notificado\u003c/b>: el de evaluación de la conformidad notificado por la DGMM. \u003cb>Marcado CE\u003c/b>: indica que el producto cumple la legislación de armonización.","ref":"Art. 4.13-4.32"},{"t":"Requisitos esenciales y ferias","b":"Solo se comercializan productos que no entrañen peligro, se usen correctamente y cumplan el anexo I. Los que no cumplen pueden \u003cb>exhibirse en ferias\u003c/b> si se indica de forma visible y acústica que no pueden usarse en España hasta acreditar su conformidad.","ref":"Art. 5"},{"t":"Autoridad notificante","b":"La \u003cb>Dirección General de la Marina Mercante\u003c/b> es la autoridad notificante: evalúa, notifica y supervisa a los organismos de evaluación de la conformidad.","ref":"Art. 6"},{"t":"Libre circulación","b":"Libertad de comercialización en toda España. Las \u003cb>semiacabadas\u003c/b> van con una declaración del fabricante o importador de que las acabará un tercero; los \u003cb>componentes\u003c/b> del anexo II, con declaración del fabricante o importador.","ref":"Arts. 7-10"},{"t":"Categorías de diseño","b":"\u003cb>A\u003c/b>: viento de \u003cb>más de fuerza 8\u003c/b> y ola significativa de \u003cb>más de 4 m\u003c/b>. \u003cb>B\u003c/b>: hasta fuerza 8 y 4 m. \u003cb>C\u003c/b>: hasta fuerza \u003cb>6\u003c/b> y \u003cb>2 m\u003c/b>. \u003cb>D\u003c/b>: hasta fuerza \u003cb>4\u003c/b> y \u003cb>0,3 m\u003c/b> (olas ocasionales de 0,5 m).","ref":"Anexo I.A.1","tip":"La categoría A excluye situaciones anormales como huracanes u olas gigantes."},{"t":"Número de identificación (CIN)","b":"Toda embarcación lleva un número con: \u003cb>código de país\u003c/b> del fabricante, \u003cb>código único del fabricante\u003c/b>, \u003cb>número de serie\u003c/b>, \u003cb>mes y año de producción\u003c/b> y \u003cb>año del modelo\u003c/b>.","ref":"Anexo I.A.2.1"},{"t":"Chapa del fabricante","b":"Placa permanente, separada del CIN, con: fabricante y dirección, \u003cb>marcado CE\u003c/b>, \u003cb>categoría de diseño\u003c/b>, \u003cb>carga máxima recomendada\u003c/b> (sin el contenido de los depósitos fijos llenos) y \u003cb>número de personas recomendado\u003c/b>.","ref":"Anexo I.A.2.2"},{"t":"Seguridad de las personas","b":"Diseño que reduzca la \u003cb>caída por la borda\u003c/b> y permita a quien está en el agua \u003cb>volver a bordo sin ayuda\u003c/b>; \u003cb>visibilidad de 360°\u003c/b> desde el puesto de gobierno; y \u003cb>manual de instrucciones\u003c/b> con toda la información para un uso seguro.","ref":"Anexo I.A.2.3-2.5"},{"t":"Integridad y flotabilidad","b":"Estructura, estabilidad, francobordo y flotabilidad según la categoría y la carga máxima. Los multicascos habitables que puedan volcar \u003cb>flotan invertidos\u003c/b>; las de \u003cb>menos de 6 m\u003c/b> que puedan inundarse llevan medios para seguir a flote.","ref":"Anexo I.A.3.1-3.3"},{"t":"Aberturas, inundación y carga","b":"Las aberturas cerradas no comprometen la estanqueidad; los pasacascos bajo la flotación llevan \u003cb>cierres de fácil acceso\u003c/b>. Bañeras y pozos \u003cb>autoachicables\u003c/b>. La carga máxima incluye combustible, agua, provisiones, equipos y personas.","ref":"Anexo I.A.3.4-3.6"},{"t":"Balsas, evacuación y fondeo","b":"Emplazamiento para \u003cb>balsas salvavidas\u003c/b> en categorías A y B y en C y D de \u003cb>más de 6 m\u003c/b>. Medios de evacuación en caso de vuelco (multicascos habitables) y de incendio (todas las habitables). Puntos de fondeo, amarre y remolque.","ref":"Anexo I.A.3.7-3.9"},{"t":"Motores","b":"Motor en recinto cerrado y aislado de la habitación, con aislamiento \u003cb>incombustible\u003c/b> y ventilado. Los fuerabordas llevan un dispositivo que \u003cb>impide arrancar con marcha metida\u003c/b> (salvo empuje inferior a 500 N); los de caña, \u003cb>parada de e
