const topicPassed = t => (tpr(t).exam == null ? -1 : tpr(t).exam) >= 60;
const stagesDone = t => STAGES.filter(s => stageDone(t, s.k)).length;
function nextTopic() { const t = TOPICS.find(x => !topicPassed(x.id)); return t ? t.id : null; }
function nextStage(t) { const s = STAGES.find(x => !stageDone(t, x.k)); return s ? s.k : null; }
function seaDays() { return Object.values(P.days).filter(v => v >= GOAL.dayMiles).length; }
function trips() { return P.sims.filter(s => s.s >= EXAM.pass).length; }
function streak() {
  const act = new Set(Object.keys(P.days).filter(k => P.days[k] > 0).map(keyToNum));
  let d = today(); if (!act.has(d)) d--;
  let n = 0; while (act.has(d)) { n++; d--; }
  return n;
}
function rankOf(xp) {
  let cur = RANKS[0], next = null;
  for (const r of RANKS) { if (xp >= r[0]) cur = r; else { next = r; break; } }
  return { name: cur[1], min: cur[0], next };
}
function addXP(n, why) {

}

/* --- almacenamiento: tu cuenta (db privada) con copia local --- */
const Store = {
  K: 'rumbo-pper-v1', ref: null, mode: 'local', writing: false, dirty: false, timer: null,
  loadLocal() { try { return JSON.parse(localStorage.getItem(this.K) || 'null'); } catch (e) { return null; } },
  saveLocal() { try { localStorage.setItem(this.K, JSON.stringify(P)); } catch (e) { /* sin almacenamiento local */ } },
  async connect() {
    if (window.PPER_WEB) return this.connectWeb();
    try {
      const c = window.claude;
      if (!c || typeof c.use !== 'function') return;
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.ref = db.doc('data/users/' + uid + '/progress');
      let snap;
      try { snap = await this.ref.get(); } catch (e) {
        if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); snap = await this.ref.get(); } else throw e;
      }
      this.mode = 'cloud';
      let remote = null;
      if (snap && snap.exists) { const d = snap.data(); try { remote = d && typeof d.p === 'string' ? normalize(JSON.parse(d.p)) : null; } catch (e) { remote = null; } }
      if (remote && remote.ts > P.ts) { P = remote; this.saveLocal(); applyTheme(); render(false); }
      else if (P.ts > (remote ? remote.ts : 0)) this.flush();
      if (cur().v === 'log') render(false);
    } catch (e) { this.ref = null; this.mode = 'local'; }
  },
  async connectWeb() {
    if (typeof AUTH === 'undefined' || !AUTH.user) return;
    try {
      const row = await AUTH.pull();
      this.ref = 'web'; this.mode = 'cloud';
      let remote = null;
      if (row && row.p) { try { remote = normalize(JSON.parse(row.p)); } catch (e) { remote = null; } }
      if (remote && remote.ts > P.ts) { P = remote; this.saveLocal(); applyTheme(); render(false); }
      else if (P.ts > (remote ? remote.ts : 0) || !row) this.flush();
      if (cur().v === 'log') render(false);
    } catch (e) { this.ref = 'web'; this.mode = 'cloud'; /* sin conexión: se sube al guardar */ }
  },
  save() {
    P.ts = Date.now();
    this.saveLocal();
    if (!this.ref) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 1500);
  },
  async flush(retried) {
    if (!this.ref) return;
    clearTimeout(this.timer); this.timer = null;
    if (this.writing) { this.dirty = true; return; }
    this.writing = true;
    try { if (this.ref === 'web') await AUTH.push(P); else await this.ref.set({ v: 1, ts: P.ts, p: JSON.stringify(P) }); }
    catch (e) {
      const code = e && e.code;
      if (code === 'unavailable' && !retried) { this.writing = false; setTimeout(() => this.flush(true), 1200 + Math.random() * 1500); return; }
      if (code === 'revoked') { this.ref = null; this.mode = 'local'; }
      if (code === 'quota_exceeded') toast('No se pudo guardar en tu cuenta: espacio lleno');
    }
    this.writing = false;
    if (this.dirty) { this.dirty = false; this.flush(); }
  },
};
const save = () => Store.save();
function applyTheme() {
  const r = document.documentElement;
  if (P.theme === 'light' || P.theme === 'dark') r.setAttribute('data-theme', P.theme); else r.removeAttribute('data-theme');
  // barra de estado del móvil (solo en la versión web, que declara theme-color)
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    const own = /dark/.test(m.media || '') ? '#0A121C' : '#F7F9F8';
    m.content = P.theme === 'dark' ? '#0A121C' : P.theme === 'light' ? '#F7F9F8' : own;
  });
}

/* --- navegación --- */
const NAV = { stack: [{ v: 'home', p: {} }] };
let S = {};
const VIEWS = {};
const ACT = {};
const timers = new Set();
const cur = () => NAV.stack[NAV.stack.length - 1];
function later(fn, ms) { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; }
function every(fn, ms) { const id = setInterval(fn, ms); timers.add(id); return id; }
function clearTimers() { timers.forEach(id => { clearTimeout(id); clearInterval(id); }); timers.clear(); }
function leave(fn) {
  if (S.guard) { confirmBox(S.guard, () => { S.guard = null; fn(); }); return; }
  fn();
}
function go(v, p = {}) { leave(() => { clearTimers(); S = {}; NAV.stack.push({ v, p }); render(true); }); }
function swap(v, p = {}) { clearTimers(); S = {}; NAV.stack[NAV.stack.length - 1] = { v, p }; render(true); }
function back() { leave(() => { clearTimers(); S = {}; if (NAV.stack.length > 1) NAV.stack.pop(); render(true); }); }
function tab(v) { leave(() => { clearTimers(); S = {}; NAV.stack = [{ v, p: {} }]; render(true); }); }
const TABS = [['home', 'Ruta', 'route'], ['claves', 'Claves', 'key'], ['review', 'Repaso', 'review'], ['simMenu', 'Simulacro', 'sim'], ['log', 'Bitácora', 'log'], ['info', 'Examen', 'info']];
function tabOf(v, p) { const t = VIEWS[v] && VIEWS[v].tab; return (typeof t === 'function' ? t(p || {}) : t) || v; }
function topChip() { return S.clock ? `<span class="chip clock" id="clock">${S.clock}</span>` : `<span class="chip" id="xpchip" title="Millas navegadas">${nf(P.xp)} mi</span>`; }
function updateTopChip() { const c = document.getElementById('xpchip'); if (c) c.textContent = nf(P.xp) + ' mi'; }
function render(scrollTop) {
  const c = cur();
  const V = VIEWS[c.v];
  const html = V.render(c.p);
  const title = typeof V.title === 'function' ? V.title(c.p) : V.title;
  document.getElementById('top').innerHTML =
    (NAV.stack.length > 1 ? `<button class="iconbtn" data-act="back" aria-label="Volver">${ICONS.back}</button>` : '') +
    `<h1>${esc(title)}</h1>` + topChip();
  document.getElementById('view').innerHTML = html;
  const due = dueIds().length;
  const on = tabOf(c.v, c.p);
  document.getElementById('tabs').innerHTML = TABS.map(([v, label, ic]) =>
    `<button data-act="tab" data-v="${v}" class="${on === v ? 'on' : ''}" ${on === v ? 'aria-current="page"' : ''}>${ICONS[ic]}<span>${label}</span></button>`).join('');
  if (V.after) V.after(c.p);
  if (scrollTop) window.scrollTo(0, 0);
}
const rerender = () => render(false);

/* --- avisos y confirmaciones dentro de la página --- */
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}
function confirmBox(o, onOk) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(o.title)}</h3><p class="muted">${esc(o.text)}</p><div class="btnrow"><button class="btn ghost" data-m="0">${esc(o.cancel || 'Cancelar')}</button><button class="btn ${o.danger ? 'mag' : ''}" data-m="1">${esc(o.ok || 'Aceptar')}</button></div></div>`;
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-m]');
    if (e.target !== m && !b) return;
    e.stopPropagation();
    m.remove();
    if (b && b.dataset.m === '1') onOk();
  });
  m.addEventListener('keydown', e => { if (e.key === 'Escape') m.remove(); });
  document.body.appendChild(m);
  m.querySelector('[data-m="1"]').focus();
}

ACT.topicJump = d => {

};

/* --- Lección: fichas --- */
VIEWS.lesson = {

    }

        t.cards.map((c, i) => cardHtml(c, i, n, true)).join('') +

    }
    const c = t.cards[S.i];

<div class="prog"><span>${S.i + 1}/${n}</span><div class="bar"><i style="width:${pct(S.i + 1, n)}%"></i></div><button class="chip" data-act="lessonList">Ver todas</button></div>
${cardHtml(c, S.i, n)}
<div class="btnrow"><button class="btn ghost" data-act="lessonPrev" ${S.i === 0 ? 'disabled' : ''}>Anterior</button><button class="btn" data-act="lessonNext">${S.i === n - 1 ? 'Terminar' : 'Siguiente'}</button></div>

  key(e) {

function markSeen(t, i) {

function lessonEnd(t) {

<p class="muted">${seen >= n ? `Has leído las ${n} fichas del tema ${t}.` : `Llevas ${seen} de ${n} fichas leídas.`} Ahora, a ponerlo a prueba.</p></div>
<div class="stack"><button class="btn wide" data-act="stage" data-v="tf" data-t="${t}">Siguiente etapa: Babor o estribor</button>
<button class="btn ghost wide" data-act="lessonRestart">Repasar las fichas desde el principio</button></div>`;

/* ===== Etapas de juego: babor o estribor, amarres, cifras clave y examen del tema ===== */
const lifeIcons = n => [0, 1, 2].map(i => ICONS.buoy.replace('<svg', `<svg class="${i < n ? '' : 'lost'}"`)).join('');
function endButtons(t, nextK, nextName, extra) {

<button class="btn ghost wide" data-act="back">Volver al tema</button></div>`;

/* --- Babor o estribor (verdadero/falso con reloj y 3 aros) --- */
VIEWS.tf = {
  tab: 'home',
  title: p => `Tema ${p.t} · Babor o estribor`,
  render(p) {
    if (!S.items) Object.assign(S, { items: shuffle(TOPIC[p.t].tf).slice(0, 12), i: 0, ok: 0, lives: 3, lost: 0, T: 20, left: 20, ans: null, missed: [] });
    if (S.end) return tfEnd(p.t);
    const it = S.items[S.i];
    const answered = S.ans != null;
    const good = answered && S.okNow;
    return `
<div class="hud"><div class="lives" aria-label="${S.lives} aros salvavidas">${lifeIcons(S.lives)}</div><div class="tbar ${S.left <= 5 ? 'low' : ''}" id="tbar"><i style="width:${(100 * S.left) / S.T}%"></i></div><span class="mono" id="tsec">${Math.ceil(S.left)} s</span></div>
<div class="prog"><span>${S.i + 1}/${S.items.length}</span><div class="bar"><i style="width:${pct(S.i + (answered ? 1 : 0), S.items.length)}%"></i></div><span>${S.ok} ✓</span></div>
<div class="tfcard">${it.s}</div>
<div class="tfbtns"><button class="port" data-act="tfAns" data-v="0" ${answered ? 'disabled' : ''}>Falso<span>Babor</span></button><button class="stbd" data-act="tfAns" data-v="1" ${answered ? 'disabled' : ''}>Verdadero<span>Estribor</span></button></div>
${answered ? `<div class="fb ${good ? '' : 'bad'}" style="margin-top:14px" aria-live="polite"><span class="h">${good ? 'Correcto' : S.ans === 'time' ? 'Se acabó el tiempo' : 'Incorrecto'}</span>Es <b>${it.a ? 'verdadero' : 'falso'}</b>. ${it.e}</div>
<button class="btn wide" style="margin-top:12px" data-act="tfNext">${S.lives <= 0 || S.i >= S.items.length - 1 ? 'Ver resultado' : 'Siguiente'}</button>` : ''}`;
  },
  after() { if (!S.end && S.ans == null) tfTick(); },
  key(e) {
    if (S.end) return;
    if (S.ans == null && (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'f')) tfAnswer(false);
    else if (S.ans == null && (e.key === 'ArrowRight' || e.key.toLowerCase() === 'v')) tfAnswer(true);
    else if (S.ans != null && e.key === 'Enter') ACT.tfNext();
  },
};
function tfTick() {
  if (S.timer) return;
  const t0 = Date.now(), start = S.left;
  S.timer = every(() => {
    S.left = Math.max(0, start - (Date.now() - t0) / 1000);
    const bar = document.querySelector('#tbar>i'); if (bar) bar.style.width = (100 * S.left) / S.T + '%';
    const tb = document.getElementById('tbar'); if (tb) tb.classList.toggle('low', S.left <= 5);
    const sec = document.getElementById('tsec'); if (sec) sec.textContent = Math.ceil(S.left) + ' s';
    if (S.left <= 0) tfAnswer(null);
  }, 250);
}
function tfStop() { if (S.timer) { clearInterval(S.timer); timers.delete(S.timer); S.timer = null; } }
function tfAnswer(v) {
  if (S.ans != null || S.end) return;
  tfStop();
  const it = S.items[S.i];
  const ok = v === it.a;
  S.ans = v === null ? 'time' : v;
  S.okNow = ok;
  if (ok) { S.ok++; addXP(XP.tf); } else { S.lives--; S.lost++; S.missed.push(it); buzz(70); }
  rerender();
}
ACT.tfAns = d => tfAnswer(d.v === '1');
ACT.tfNext = () => {
  const p = cur().p;
  if (S.lives <= 0 || S.i >= S.items.length - 1) {
    S.end = true;
    if (S.lives > 0) {
      const x = tp(p.t);
      x.tf = Math.max(x.tf, pct(S.ok, S.items.length));
      award('first');
      if (S.lost === 0) award('nomob');
      save();

    render(true);
    return;
  }
  S.i++; S.ans = null; S.left = S.T;
  rerender();
};
function tfEnd(t) {

<h2>${alive ? (S.lost === 0 ? 'Nadie al agua' : 'Etapa superada') : '¡Hombre al agua!'}</h2>
<div class="big">${S.ok}<small>/${S.items.length}</small></div>
<p class="muted">${alive ? `Llegas a puerto con ${plural(S.lives, 'aro', 'aros')} salvavidas.` : 'Has perdido los tres aros. Repasa la carta y vuelve a intentarlo.'}</p></div>
${missedList(S.missed.map(it => `<b>${it.a ? 'Verdadero' : 'Falso'}:</b> ${it.s}<br><span class="muted">${it.e}</span>`))}
${endButtons(t, alive ? 'pairs' : null, 'Amarres', alive ? '' : `<button class="btn ghost wide" data-act="stage" data-v="lesson" data-t="${t}">Volver a la carta</button>`)}`;

/* --- Amarres (unir parejas) --- */
VIEWS.pairs = {
  tab: 'home',
  title: p => `Tema ${p.t} · Amarres`,
  render(p) {
    if (!S.sets) { Object.assign(S, { sets: shuffle(TOPIC[p.t].pairs).slice(0, 4), si: 0, totalMiss: 0 }); setupSet(); }
    if (S.end) return pairsEnd(p.t);
    const set = S.sets[S.si];
    const tile = (side, key, text, done, sel, no) => `<button class="tile ${done ? 'done' : ''} ${sel ? 'sel' : ''} ${no ? 'no' : ''}" data-act="pair${side}" data-k="${key}" ${done ? 'disabled' : ''}>${text}</button>`;
    return `
<div class="prog"><span>Juego ${S.si + 1}/${S.sets.length}</span><div class="bar"><i style="width:${pct(S.si, S.sets.length)}%"></i></div><span>${plural(S.totalMiss, 'fallo', 'fallos')}</span></div>
<p class="q">${set.title}</p>
<p class="small muted" style="margin:-8px 0 12px">Toca un elemento de cada columna para amarrarlos.</p>
<div class="pairs"><div class="col">${S.left.map(x => tile('L', x.i, x.t, S.doneL[x.i], S.selL === x.i, S.flash && S.flash.l === x.i)).join('')}</div>
<div class="col">${S.right.map((x, j) => tile('R', j, x.t, S.doneR[j], S.selR === j, S.flash && S.flash.r === j)).join('')}</div></div>`;
  },
};
function setupSet() {
  const set = S.sets[S.si];
  S.left = shuffle(set.items.map((x, i) => ({ i, t: x[0] })));
  S.right = shuffle(set.items.map((x, i) => ({ i, t: x[1] })));
  Object.assign(S, { doneL: {}, doneR: {}, selL: null, selR: null, flash: null, miss: 0, lock: false });
}
ACT.pairL = d => { if (S.lock) return; S.selL = +d.k; S.flash = null; tryPair(); };
ACT.pairR = d => { if (S.lock) return; S.selR = +d.k; S.flash = null; tryPair(); };
function tryPair() {
  if (S.selL == null || S.selR == null) return rerender();
  const set = S.sets[S.si];
  if (S.right[S.selR].t === set.items[S.selL][1]) {
    S.doneL[S.selL] = true; S.doneR[S.selR] = true; S.selL = S.selR = null; buzz(15);
    if (Object.keys(S.doneL).length === set.items.length) {
      S.lock = true;
      addXP(XP.pairSet, 'amarre completo');
      rerender();
      later(() => {
        if (S.si < S.sets.length - 1) { S.si++; setupSet(); rerender(); return; }
        const x = tp(cur().p.t); x.pairs = 1; award('first');
        if (S.totalMiss === 0) award('knot');
        save(); S.end = true; render(true);
      }, 750);
      return;
    }
  } else {
    S.miss++; S.totalMiss++; S.flash = { l: S.selL, r: S.selR }; S.selL = S.selR = null; buzz(70);
  }
  rerender();
}
function pairsEnd(t) {

<div class="big">${S.sets.length}<small> juegos</small></div><p class="muted">${S.totalMiss === 0 ? 'Sin un solo fallo.' : `Con ${plural(S.totalMiss, 'fallo', 'fallos')} por el camino.`}</p></div>
${endButtons(t, 'cloze', 'Cifras clave')}`;
}

/* --- Examen del tema --- */
VIEWS.exam = {
  tab: 'home',
  title: p => `Tema ${p.t} · Examen`,
  render(p) {
    if (!S.items) {
      const pool = BYT[p.t] || [];

};
function examFinish(t) {
  const sc = pct(S.ok, S.items.length);
  const x = tp(t);
  const was = x.exam >= 60, prevStars = x.stars || 0, st = starsFor(sc);
  x.exam = Math.max(x.exam, sc);
  x.stars = Math.max(prevStars, st);
  S.score = sc; S.st = st;
  if (sc >= 60) award('first');
  if (sc >= 60 && !was) addXP(XP.firstPass, 'tema aprobado');

const convName = c => (DATA.replicas.find(r => r.conv === c) || {}).name || c;
const fmtClock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
function buildSim(conv) {
  if (conv) {
    const r = DATA.replicas.find(x => x.conv === conv);
    return r.ids.filter(id => QBY[id]).map(id => present(QBY[id], true));
  }
  const items = [];
  for (const t of TOPICS) {
    const pool = BYT[t.id] || [];
    const off = shuffle(pool.filter(q => q.src === 'oficial'));
    const pr = shuffle(pool.filter(q => q.src === 'practica'));
    for (let k = 0; k < t.weight; k++) {
      const q = (off.length && (Math.random() < 0.5 || !pr.length)) ? off.pop() : pr.pop();
      if (q) items.push(present(q));
    }
  }
  return items;
}
function simBest(conv) {
  const s = P.sims.filter(x => x.m === conv);
  return s.length ? Math.max(...s.map(x => x.s)) : null;
}

function clavePickIds(k, t) {

  for (let i = 0; i < 4; i++) {
    x = x.replace(/^(aprobad[oa]s? por|por (el|la) que|que regula|que se regula|sobre|de \d+ de \w+|de Navegación Marítima)\b[^,?¿]*?,\s*/i, '');
    x = x.replace(/^de la navegación y de la vida humana en la mar[^?¿]*?deportivas[,:]\s*/i, '');
    x = x.replace(/^El Real Decreto \d+\/\d+, sobre [^?¿]*?carga,\s*/i, '');
  }
  x = x.replace(/^¿(\S)/, (m, c) => '¿' + c.toUpperCase());
  x = x.charAt(0).toUpperCase() + x.slice(1);
  return x.length > 110 ? x.slice(0, 107).replace(/\s+\S*$/, '') + '…' : x;
};

const AUTH = {
  sb: null, user: null, name: '', step: 'login', email: '', pass: '', info: '', err: '', busy: false,
  cfg: window.PPER_SUPA || null,
  async call(body) {
    try {
      const res = await fetch(this.cfg.url + '/functions/v1/registro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: this.cfg.key, Authorization: 'Bearer ' + this.cfg.key },
        body: JSON.stringify(body),
      });
      return { ok: res.ok, data: await res.json().catch(() => ({})) };
    } catch (e) { return { ok: false, data: { error: 'No hay conexión. Inténtalo cuando tengas cobertura.' } }; }
  },
  async boot(go) {
    this.go = go;
    if (!this.cfg || !window.supabase) { this.paint('Sin conexión', '<p>Para entrar la primera vez necesitas conexión a internet. Después la app funciona sin cobertura.</p>'); return; }
    this.sb = window.supabase.createClient(this.cfg.url, this.cfg.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'rumbo-pper-auth' } });
    let session = null;
    try { session = (await this.sb.auth.getSession()).data.session; } catch (e) { session = null; }
    if (session && session.user) { if (await this.enter(session.user)) return; this.step = 'login'; return; }
    this.form();
  },
  async enter(user) {
    // Solo entra quien tiene el acceso activo (lista de alumnos). Sin conexión se deja pasar: ya entró antes.
    let activo = true;
    try { const { data, error } = await this.sb.rpc('tengo_acceso'); if (!error && data === false) activo = false; } catch (e) { /* sin conexión */ }
    if (!activo) {
      try { await this.sb.auth.signOut(); } catch (e) { /* sin conexión */ }
      try { localStorage.removeItem(Store.K); } catch (e) { /* sin almacenamiento */ }
      this.paint('Sin acceso', `<p>La cuenta <b>${esc(user.email || '')}</b> no tiene el acceso activo.</p><p class="small muted">Si crees que es un error, escribe a quien te dio el acceso.</p><p class="auth-alt"><button class="link" data-auth-step="login">Entrar con otra cuenta</button></p>`);
      return false;
    }
    this.user = user;
    this.name = (user.user_metadata && user.user_metadata.full_name) || '';
    document.body.classList.remove('locked');
    this.go();
    return true;
  },
  async logout() {
    try {
      await Store.flush();
      // espera a que termine cualquier guardado en curso antes de cerrar la sesión
      for (let i = 0; i < 40 && (Store.writing || Store.dirty || Store.timer); i++) await new Promise(r => setTimeout(r, 250));
      await this.sb.auth.signOut();
    } catch (e) { /* sin conexión */ }
    try { localStorage.removeItem(Store.K); } catch (e) { /* sin almacenamiento */ }
    location.reload();

  form() {

<p class="small muted">Usa el mismo correo con el que te dieron acceso. Te enviaremos un código de 6 cifras para comprobar que es tuyo. Tu progreso se guardará en tu cuenta y lo tendrás en cualquier dispositivo.</p>
${msg}<button class="btn wide" ${dis}>${this.busy ? 'Creando…' : 'Crear cuenta'}</button></form>
<p class="auth-alt">¿Ya tienes cuenta? <button class="link" data-auth-step="login">Entra</button></p>`],
      code: ['Verifica tu correo', `<form data-auth="code">
<p>Hemos enviado un código de 6 cifras a <b>${e}</b>. Escríbelo aquí para terminar. Si no lo ves, mira en «Correo no deseado».</p>
<label>Código<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required class="auth-code"></label>
${msg}<button class="btn wide" ${dis}>${this.busy ? 'Comprobando…' : 'Verificar'}</button></form>
<p class="auth-alt"><button class="link" data-auth-do="resend">Enviar otro código</button> · <button class="link" data-auth-step="login">Volver</button></p>`],
      reset: ['Cambiar la contraseña', `<form data-auth="reset">
<p>Escribe el correo con el que te registraste y te enviaremos un código para poner una contraseña nueva.</p>
<label>Correo<input name="email" type="email" autocomplete="email" required value="${e}"></label>
${msg}<button class="btn wide" ${dis}>${this.busy ? 'Enviando…' : 'Enviar código'}</button></form>
<p class="auth-alt"><button class="link" data-auth-step="login">Volver</button></p>`],
      reset2: ['Contraseña nueva', `<form data-auth="reset2">
<p>Si hay una cuenta con <b>${e}</b>, te hemos enviado un código de 6 cifras.</p>
<label>Código<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required class="auth-code"></label>
<label>Contraseña nueva <span class="small muted">(8 caracteres o más)</span><input name="pass" type="password" autocomplete="new-password" required minlength="8"></label>
${msg}<button class="btn wide" ${dis}>${this.busy ? 'Guardando…' : 'Guardar y entrar'}</button></form>
<p class="auth-alt"><button class="link" data-auth-step="reset">Enviar otro código</button> · <button class="link" data-auth-step="login">Volver</button></p>`],
    }[this.step];
    this.paint(F[0], F[1]);
    const first = document.querySelector('.auth input:not([value]), .auth input[value=""]');
    if (first && !this.busy) first.focus();
  },
  setStep(s) { this.step = s; this.err = ''; this.info = ''; this.form(); },
  async signIn(email, pass) {
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password: pass });
    if (error) {
      if (error.code === 'email_not_confirmed') { this.pass = pass; this.call({ action: 'resend', email }); this.step = 'code'; this.info = 'Tu correo aún no está verificado: te hemos enviado un código nuevo.'; return; }
      this.err = error.status === 400 ? 'El correo o la contraseña no son correctos.' : 'No se ha podido entrar. Inténtalo de nuevo.'; return;
    }
    if (await this.enter(data.user)) return true;
    return 'bloqueado';
  },
  async submit(kind, f) {
    const v = n => (f.elements[n] ? f.elements[n].value : '');
    this.err = ''; this.info = '';
    if (v('email')) this.email = v('email').trim().toLowerCase();
    this.busy = true; this.form(); this.busy = false;
    let done = false;
    if (kind === 'login') done = await this.signIn(this.email, v('pass'));
    else if (kind === 'signup') {
      const pass = v('pass');
      const { ok, data } = await this.call({ action: 'signup', name: v('name').trim(), email: this.email, password: pass });
      if (!ok) this.err = data.error || 'No se ha podido crear la cuenta. Inténtalo de nuevo.';
      else if (data.verify) { this.pass = pass; this.step = 'code'; }
      else done = await this.signIn(this.email, pass);
    } else if (kind === 'code') {
      const { ok, data } = await this.call({ action: 'verify', email: this.email, code: v('code').replace(/\D/g, '') });
      if (!ok) this.err = data.error || 'El código no es correcto.';
      else if (this.pass) done = await this.signIn(this.email, this.pass);
      else { this.step = 'login'; this.info = 'Correo verificado. Ya puedes entrar.'; }
    } else if (kind === 'reset') {
      const { ok, data } = await this.call({ action: 'reset_request', email: this.email });
      if (!ok) this.err = data.error || 'No se ha podido enviar el código.'; else this.step = 'reset2';
    } else if (kind === 'reset2') {
      const pass = v('pass');
      const { ok, data } = await this.call({ action: 'reset_confirm', email: this.email, code: v('code').replace(/\D/g, ''), password: pass });
      if (!ok) this.err = data.error || 'El código no es correcto.'; else done = await this.signIn(this.email, pass);
    }
    if (!done) this.form();
  },
  /* progreso en la tabla «progreso» (cada usuario solo ve su fila) */
  async pull() {
    const { data, error } = await this.sb.from('progreso').select('p, ts').eq('user_id', this.user.id).maybeSingle();
    if (error) throw error;
    return data;
  },
  async push(p) {
    const days = Object.keys(p.days || {}).length;
    const { error } = await this.sb.from('progreso').upsert({
      user_id: this.user.id, p: JSON.stringify(p), ts: p.ts, millas: p.xp || 0,
      respuestas: (p.st && p.st.ans) || 0, aciertos: (p.st && p.st.ok) || 0, dias: days,
      simulacros: (p.sims || []).length, actualizado: new Date().toISOString(),
    });
    if (error) throw error;
  },
};
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-auth]');
  if (!f) return;
  e.preventDefault();
  AUTH.submit(f.dataset.auth, f);
});
document.addEventListener('click', e => {
  const s = e.target.closest('[data-auth-step]');
  if (s) { e.preventDefault(); AUTH.setStep(s.dataset.authStep); return; }
  const d = e.target.closest('[data-auth-do="resend"]');
  if (d) {
    e.preventDefault();
    AUTH.call({ action: 'resend', email: AUTH.email }).then(({ ok, data }) => { AUTH.err = ok ? '' : (data.error || ''); AUTH.info = ok ? 'Te hemos enviado un código nuevo.' : ''; AUTH.form(); });
  }
});
ACT.logout = () => confirmBox({ title: 'Cerrar sesión', text: 'Tu progreso queda guardado en tu cuenta. Para volver a entrar necesitarás tu correo y tu contraseña.', ok: 'Cerrar sesión' }, () => AUTH.logout());

/* ===== Arranque ===== */
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || document.querySelector('.modal')) return;
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const V = VIEWS[cur().v];
  if (V && V.key) V.key(e, cur().p);
});
function start(data) {
  try {
    const nav = data && data.nav;
    if (Array.isArray(nav) && nav.length && nav.every(x => x && VIEWS[x.v])) NAV.stack = nav.map(x => ({ v: x.v, p: x.p || {} }));
  } catch (e) { /* se empieza en la ruta */ }
  P = normalize(Store.loadLocal());
  applyTheme();
  render(true);
  Store.connect();
}
const HOT = window.claude && window.claude.hot;
try { if (HOT && typeof HOT.snapshot === 'function') HOT.snapshot(() => ({ nav: NAV.stack })); } catch (e) { /* sin recarga en caliente */ }
if (window.PPER_WEB && typeof AUTH !== 'undefined') AUTH.boot(() => start({}));
else if (HOT && typeof HOT.ready === 'function') HOT.ready(start); else start((HOT && HOT.data) || {});

</script>
