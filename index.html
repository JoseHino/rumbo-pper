ame":"Abril 2018","q":"Según el Reglamento sobre Despacho de Buques, se considerará infracción muy grave:","o":["La presentación ante la Autoridad Marítima, a efectos del despacho del buque, de la Declaración General del Capitán, firmada por persona distinta de éste.","El incumplimiento del deber de facilitar la información que deba ser suministrada a la Autoridad Marítima, en materia de despachos, enroles y desenroles.","La existencia en la mar de una tripulación diferente de la que figura en la Lista de Tripulantes del despacho.","La carencia, deterioro o inexactitud grave de la documentación reglamentaria de que haya de ir provisto el buque a efectos del despacho y enrolamiento."],"a":2,"e":"Con el antiguo Reglamento de Despacho, era muy grave que la tripulación en la mar no coincidiera con la Lista de Tripulantes.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 el despacho, el rol y sus infracciones los regula el RD 186/2023 (tema 5): comprueba la respuesta en la norma nueva."}},{"id":"2018abr-1-09","t":6,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Real Decreto 210/2004, por el que se establece un sistema de seguimiento y de información sobre el tráfico marítimo, como parte del contenido de la «información general» que debe notificar el capitán de un buque con destino a un puerto español, se consignará el número total de:","o":["Personas a bordo.","Tripulantes a bordo excluidos los supernumerarios.","Pasajeros a bordo.","Tripulantes a bordo."],"a":0,"e":"RD 210/2004: en la información general se consigna el número total de personas a bordo."},{"id":"2018abr-1-10","t":7,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar aplicable a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, en los actos colectivos náuticos, ¿cuál es el número mínimo de embarcaciones de rescate?","o":["Una embarcación de rescate por cada veinte embarcaciones participantes, sin incluir en dicho número mínimo la presencia de servicios públicos de salvamento marítimo.","Una embarcación de rescate por cada veinte embarcaciones participantes, incluyendo en dicho número mínimo la presencia de servicios públicos de salvamento marítimo.","Una embarcación de rescate por cada quince embarcaciones participantes, sin incluir en dicho número mínimo la presencia de servicios públicos de salvamento marítimo.","Una embarcación de rescate por cada quince embarcaciones participantes, incluyendo en dicho número mínimo la presencia de servicios públicos de salvamento marítimo."],"a":0,"e":"RD 62/2008: una embarcación de rescate por cada veinte participantes, sin contar los servicios públicos de salvamento."},{"id":"2018abr-1-11","t":7,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar aplicable a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, en las regatas internacionales, ¿con qué antelación deberán los organizadores de las pruebas poner en conocimiento de los capitanes marítimos la fecha de iniciación?","o":["Con antelación suficiente y al menos 30 días antes del comienzo.","Con antelación suficiente y al menos 15 días antes de presentar la solicitud.","Con antelación suficiente y al menos 15 días antes del comienzo.","Con antelación suficiente y al menos 30 días antes de presentar la solicitud."],"a":2,"e":"RD 62/2008: en regatas internacionales se avisa al capitán marítimo con antelación suficiente y al menos 15 días antes del comienzo."},{"id":"2018abr-1-12","t":8,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el artículo 7 del Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, el nombre propuesto en el abanderamiento de una embarcación se asignará con sujeción a los siguientes requisitos:","o":["Podrá autorizarse cualquier anagrama, siempre que su tamaño sea adecuado a la eslora de la embarcación.","Podrán autorizarse nombres escritos en idioma chino.","El nombre figurará en alfabeto latino.","El nombre figurará en alfabeto latino o cirílico."],"a":2,"e":"RD 1435/2010 art. 7: el nombre debe figurar en alfabeto latino."},{"id":"2018abr-1-13","t":8,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Real Decreto 685/2010, por el que se regula el otorgamiento de permiso temporal de navegación para determinadas embarcaciones de recreo, en relación a la asignación de señales identificativas, ¿cuál de las opciones es FALSA?","o":["En el certificado se asignará a las embarcaciones y buques una señal alfanumérica que coincidirá con el número de identificación (CIN).","La señal identificativa deberá llevarse adherida o pintada en el casco, con pintura o material indeleble.","La señal identificativa será en caracteres oscuros sobre fondo claro o en caracteres claros sobre fondo oscuro en función del color de la pintura del buque.","La señal identificativa sólo se efectuará mediante grabación en hueco o en relieve, o con punzón, o bien mediante cualquier otro método equivalente."],"a":3,"e":"RD 685/2010: es falso que la señal solo pueda grabarse; basta llevarla adherida o pintada con material indeleble."},{"id":"2018abr-1-14","t":9,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"El seguro obligatorio, establecido en el Reglamento del seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas, NO cubrirá uno de los siguientes riesgos, señale cuál:","o":["Daños materiales a terceros.","Muerte o lesiones sufridas por el patrón o piloto de la embarcación.","Muerte o lesiones corporales de terceras personas.","Daños a buques por colisión o sin contacto."],"a":1,"e":"RD 607/1999: el seguro obligatorio no cubre la muerte o lesiones del patrón o piloto."},{"id":"2018abr-1-15","t":10,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según definición del Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, se entenderá por embarcación de recreo toda embarcación de cualquier tipo, con independencia de su medio de propulsión, cuyo casco tenga una eslora (Lh):","o":["Superior a 24 metros.","Entre 2,5 y 30 metros.","Entre 5 y 24 metros.","Entre 2,5 y 24 metros."],"a":3,"e":"RD 875/2014: embarcación de recreo es la de eslora de casco entre 2,5 y 24 metros."},{"id":"2018abr-1-16","t":10,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según definición del Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, se entenderá por buque de recreo:","o":["Todo buque de cualquier tipo, con independencia de su modo de propulsión, cuya eslora de casco (Lh) sea superior a 24 metros, con un arqueo bruto inferior a 3.000 GT y capacidad para 12 pasajeros incluyendo la tripulación; destinado al recreo, turismo, ocio, la práctica del deporte o la pesca no profesional.","Todo buque de cualquier tipo, con independencia de su modo de propulsión, cuya eslora de casco (Lh) sea inferior a 24 metros, con un arqueo bruto inferior a 3.000 GT y capacidad para 12 pasajeros sin incluir la tripulación; destinado al recreo, turismo, ocio, la práctica del deporte o la pesca no profesional.","Todo buque de cualquier tipo, con independencia de su modo de propulsión, cuya eslora de casco (Lh) sea inferior a 24 metros, con un arqueo bruto superior a 3.000 GT y capacidad para 12 pasajeros sin incluir la tripulación; destinado al recreo, turismo, ocio, la práctica del deporte o la pesca no profesional.","Todo buque de cualquier tipo, con independencia de su modo de propulsión, cuya eslora de casco (Lh) sea superior a 24 metros, con un arqueo bruto inferior a 3.000 GT y capacidad para 12 pasajeros sin incluir a los tripulantes, destinado al recreo, turismo, ocio, la práctica del deporte o la pesca no profesional."],"a":3,"e":"RD 875/2014: buque de recreo es el de más de 24 m, menos de 3.000 GT y capacidad para 12 pasajeros sin contar la tripulación."},{"id":"2018abr-1-17","t":11,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Real Decreto 1434/1999, por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo, ¿con qué antelación se debe solicitar la realización de los reconocimientos intermedios a las entidades colaboradoras de inspección autorizadas?","o":["Con una antelación mínima de quince días hábiles a la fecha de caducidad del certificado.","Con una antelación mínima de veinte días naturales a la fecha de caducidad del certificado.","Con una antelación mínima de veinte días hábiles a la fecha de caducidad del certificado.","Con una antelación mínima de quince días naturales a la fecha de caducidad del certificado."],"a":3,"e":"RD 1434/1999: los reconocimientos se piden a la ECI con al menos quince días naturales antes de la caducidad."},{"id":"2018abr-1-18","t":11,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Real Decreto 1434/1999, por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo, ¿qué tipo de reconocimientos e inspecciones se realizarán a través de las entidades colaboradoras de inspección de embarcaciones de recreo?","o":["Iniciales, periódicas, intermedias y extraordinarias.","Periódicas, intermedias, adicionales y extraordinarias.","Iniciales, periódicas, intermedias y adicionales.","Periódicas, intermedias, adicionales y de renovación."],"a":1,"e":"RD 1434/1999: por las ECI pasan los reconocimientos periódicos, intermedios, adicionales y extraordinarios."},{"id":"2018abr-1-19","t":12,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, ¿cuántas balsas deberán llevar como mínimo aquellas que naveguen dentro de la Zona de Navegación 2?","o":["Una o varias balsas salvavidas para el total, más un 10 %, de las personas permitidas a bordo.","Una balsa salvavidas a cada banda.","Una o varias balsas salvavidas para el total de las personas permitidas a bordo.","Una balsa salvavidas por cada costado para el total, más un 25 %, de las personas permitidas a bordo."],"a":2,"e":"Con la Orden FOM/1144/2003, en zona 2 se llevaban balsas para el total de las personas permitidas a bordo.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el equipo de las embarcaciones de recreo lo regula hoy el RD 339/2021 (tema 12), que cambia muchas cifras. No te fíes de esta respuesta."}},{"id":"2018abr-1-20","t":12,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, las embarcaciones que naveguen por la Zona 5 llevarán como mínimo:","o":["Un chaleco salvavidas por persona autorizada, más un 10 % del total.","Un chaleco salvavidas por persona autorizada, más chalecos salvavidas para el 100 % de niños a bordo.","Un chaleco salvavidas por persona autorizada.","El 110 % de chalecos salvavidas para el total de las personas autorizadas, más chalecos para el 100 % de los niños que vayan a bordo."],"a":1,"e":"Con la Orden FOM/1144/2003, en zona 5 se llevaba un chaleco por persona más chalecos para el 100 % de los niños.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el equipo de las embarcaciones de recreo lo regula hoy el RD 339/2021 (tema 12), que cambia muchas cifras. No te fíes de esta respuesta."}},{"id":"2018abr-1-21","t":13,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"¿Cuántos años habrán de conservar los fabricantes la documentación técnica de los productos sujetos al ámbito de aplicación del Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes?","o":["2.","7.","10.","5."],"a":2,"e":"RD 98/2016: los fabricantes conservan la documentación técnica durante 10 años."},{"id":"2018abr-1-22","t":14,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, los órganos de gobierno de la Sociedad de Salvamento y Seguridad Marítima son:","o":["El Consejo de Administración y el Director de la Sociedad.","El Consejo de Administración y el Presidente.","El Director de la Sociedad y el Presidente.","El Consejo de Administración y el Director General de la Marina Mercante."],"a":1,"e":"TRLPEMM: los órganos de gobierno de SASEMAR son el Consejo de Administración y el Presidente (el Director es el de gestión)."},{"id":"2018abr-1-23","t":15,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"De acuerdo con la Ley 14/2014, de Navegación Marítima, se inscribirán las titularidades y gravámenes sobre los buques, embarcaciones y artefactos navales en:","o":["La Sección de Buques del Registro de Bienes Muebles.","El Registro Marítimo Provincial.","Ninguna parte, este tipo de inscripciones no afecta a los bienes muebles.","El Distrito Marítimo donde esté registrada su matrícula."],"a":0,"e":"Ley de Navegación Marítima: titularidades y gravámenes se inscriben en la Sección de Buques del Registro de Bienes Muebles."},{"id":"2018abr-1-24","t":15,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según la Ley 14/2014, de Navegación Marítima, y con arreglo a las disposiciones de esta Ley y al Convenio internacional sobre los privilegios marítimos y la hipoteca naval, pueden ser objeto de hipoteca naval:","o":["Sólo los buques, incluso en construcción, con una finalidad mercantil.","Todos los buques, embarcaciones y artefactos navales, incluso en construcción.","Los buques mercantes y buques de Estado, con excepción de otras embarcaciones y artefactos navales.","Sólo los buques en construcción con independencia de su finalidad."],"a":1,"e":"Ley de Navegación Marítima: pueden hipotecarse todos los buques, embarcaciones y artefactos navales, incluso en construcción."},{"id":"2018abr-1-25","t":16,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según lo dispuesto en el Código Civil, el testamento marítimo en forma especial o extraordinaria podrá otorgarse de palabra, ante dos testigos:","o":["Necesitándose la autorización del Capitán para su validez.","Si hubiera peligro de naufragio.","Pero este testamento quedará ineficaz si el testador no se salva del peligro.","Aunque no se salve, será ineficaz si se formaliza posteriormente por los testigos."],"a":1,"e":"Código Civil: el testamento marítimo de palabra ante dos testigos solo cabe si hay peligro de naufragio."},{"id":"2018abr-1-26","t":17,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, si queremos poner una reclamación relacionada con una deficiencia en la prestación del servicio debemos dirigirla a:","o":["La entidad gestora del puerto.","La Autoridad Portuaria.","La Capitanía Marítima.","Aduanas."],"a":0,"e":"Con el RD 1381/2002, las reclamaciones por deficiencias del servicio se dirigían a la entidad gestora del puerto.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2018abr-1-27","t":17,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Según el Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, atendiendo a los tipos de desechos que generan los buques, las instalaciones portuarias receptoras se clasifican al menos en las siguientes categorías:","o":["MARPOL Anexos I, II, IV y V.","MARPOL Anexos I, II, III y V.","MARPOL Anexos I, II, III, IV y V.","MARPOL Anexos I, II, III, IV, V y VI."],"a":0,"e":"Con el RD 1381/2002, las instalaciones se clasificaban al menos por los anexos I, II, IV y V de MARPOL.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2018abr-1-28","t":18,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"¿Qué certificado prescribe el Anexo V del Convenio MARPOL?","o":["Certificado internacional de prevención de la contaminación por las basuras de los buques.","Certificado internacional de prevención de la contaminación atmosférica ocasionada por los buques.","Certificado internacional de prevención de la contaminación por las aguas sucias de los buques.","Ninguno."],"a":3,"e":"MARPOL anexo V no prescribe ningún certificado."},{"id":"2018abr-1-29","t":19,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"Indicar cuál de las siguientes respuestas, de acuerdo al Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, es FALSA:","o":["La zona norte/sur de la costa portuguesa se considerará como zona marítima A1.","La zona marítima comprendida entre cualquier punto del litoral mediterráneo y sur peninsulares y los puertos de Ceuta o Melilla, así como la zona marítima entre islas del archipiélago canario o balear, se considera a todos los efectos como zona marítima A1.","La zona norte/sur de la costa portuguesa se considerará como zona marítima A2.","La zona comprendida entre cualquier punto de la costa nacional peninsular o insular y los puertos del archipiélago canario, así como la zona de costa del noroeste africano cuya distancia desde una estación costera nacional peninsular o insular sea superior a las 150 millas, tendrá la consideración de zona marítima A3."],"a":0,"e":"RD 1185/2006: la costa portuguesa norte/sur es zona A2, no A1."},{"id":"2018abr-1-30","t":19,"src":"oficial","conv":"2018abr","convName":"Abril 2018","q":"El Reglamento de radiocomunicaciones marítimas en los buques civiles españoles establece que los buques y embarcaciones de recreo autorizados a navegar por la Zona 1 deben estar provistos, entre otros, del siguiente equipamiento radioeléctrico:","o":["Una radiobaliza personal de 121,5 MHz, de activación automática y manual.","Un equipo radiotelefónico bidireccional portátil de MF/HF.","Un respondedor de radar de 3 GHz.","Un receptor NAVTEX."],"a":3,"e":"Según la plantilla oficial de 2018, en Zona 1 la embarcación de recreo llevaba, entre otros, un receptor NAVTEX.","av":{"n":"derogada","x":"El equipo radio de recreo por zonas se modificó en 2022 (RD 587/2022). Hoy (art. 56) el NAVTEX en Zona 1 solo se exige a las embarcaciones de lista sexta: la respuesta ya no vale para todas."}},{"id":"2017oct-1-01","t":1,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, se considera Marina Mercante:","o":["La garantía del cumplimiento de las obligaciones en materia de defensa nacional y protección civil en la mar.","La inspección técnica y operativa de buques, tripulaciones, puertos y mercancías.","La ordenación de la flota pesquera, en los ámbitos propios de la pesca y de la ordenación del sector pesquero.","La ordenación y el control de la flota civil española afecta al servicio de la defensa nacional."],"a":0,"e":"TRLPEMM: entre lo que se considera Marina Mercante está garantizar las obligaciones de defensa nacional y protección civil en la mar."},{"id":"2017oct-1-02","t":1,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"A tenor del Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, el incumplimiento del deber de comunicación de un accidente o incidente marítimo constituye una infracción:","o":["Muy grave contra la protección marítima.","Grave en materia de Marina Civil cuando ponga en grave peligro la seguridad del buque o de la navegación.","Leve contra la ordenación del tráfico marítimo.","Grave contra la seguridad marítima."],"a":3,"e":"TRLPEMM: no comunicar un accidente o incidente marítimo es infracción grave contra la seguridad marítima."},{"id":"2017oct-1-03","t":2,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según la Ley 14/2014 de Navegación Marítima, el ámbito de aplicación de dicha ley también considera navegación marítima:","o":["Únicamente la realizada por las aguas de la mar.","Además de la realizada por las aguas de la mar, la que se lleva a cabo por las aguas de los ríos, canales, lagos y embalses.","Además de la realizada por las aguas de la mar, la que se lleva a cabo por las aguas de los ríos, canales, lagos y embalses, cuando sean accesibles desde el mar y donde se haga sensible el efecto de las mareas.","La realizada por las aguas de la mar y por las aguas continentales."],"a":2,"e":"Ley de Navegación Marítima: también es navegación marítima la de ríos, canales, lagos y embalses accesibles desde el mar donde se note la marea."},{"id":"2017oct-1-04","t":2,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según la Ley 14/2014 de Navegación Marítima, como norma general un buque mercante nacional que lleva 10 tripulantes, incluidos el capitán y el primer oficial, deberá tener al menos:","o":["La dotación española o de algún otro Estado miembro del Espacio Económico Europeo (EEE).","El 50 % de su dotación, española o de algún otro Estado miembro del EEE.","El capitán y el primer oficial de cubierta de nacionalidad de un Estado miembro del EEE, además del resto de la dotación en un 50 %.","El capitán de nacionalidad de un Estado miembro del EEE, además del resto de la dotación en un 50 %."],"a":2,"e":"Ley de Navegación Marítima: capitán y primer oficial deben ser del EEE y el resto de la dotación en al menos un 50 %."},{"id":"2017oct-1-05","t":3,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, diga cuál de las siguientes afirmaciones respecto a la Comisión Permanente de Investigación de Accidentes e Incidentes Marítimos (CIAIM) NO es correcta:","o":["Los investigadores, que actuarán con plena independencia de criterio en el ejercicio de sus funciones, tendrán la condición de autoridad pública.","Es el órgano colegiado, adscrito al Ministerio de Fomento, con competencia para la investigación de las causas técnicas de los accidentes e incidentes marítimos.","La investigación que lleve a cabo la CIAIM perseguirá la determinación de responsabilidad y la atribución de la culpa.","La CIAIM publicará un informe en el plazo de doce meses a partir de la fecha del siniestro. Si no fuera posible presentar a tiempo el informe definitivo, se deberá publicar un informe provisional en dicho plazo."],"a":2,"e":"TRLPEMM: la CIAIM no busca responsables ni culpables; solo las causas técnicas."},{"id":"2017oct-1-06","t":4,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Conforme al Real Decreto 638/2007, por el que se regulan las Capitanías Marítimas y los Distritos Marítimos, el Capitán Marítimo, en el caso de un accidente marítimo, solicitará la adopción de las medidas necesarias para exigir al propietario de la embarcación el cumplimiento de sus obligaciones:","o":["Al capitán de la embarcación.","Al asegurador de la embarcación.","Al P&I de la embarcación.","A la autoridad judicial."],"a":3,"e":"RD 638/2007: el Capitán Marítimo pide a la autoridad judicial las medidas para exigir al propietario sus obligaciones."},{"id":"2017oct-1-07","t":5,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Reglamento sobre Despacho de Buques, diga cuál de las siguientes afirmaciones NO es correcta:","o":["El Rol se canjeará por uno nuevo cuando se alteren de forma sustancial los medios de carga y descarga del buque.","El Rol se canjeará por uno nuevo cuando el buque cambie de matrícula o Lista.","El Rol caducará cuando el buque pase a prestar un servicio para el que el Rol no sea obligatorio.","El Rol estará bajo la custodia y responsabilidad del capitán del buque."],"a":1,"e":"Con el antiguo Reglamento de Despacho, no era correcto que el Rol se canjease por cambio de matrícula o Lista.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 el despacho y el rol los regula el RD 186/2023 (tema 5): comprueba la respuesta en la norma nueva."}},{"id":"2017oct-1-08","t":5,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Están exentas del ámbito de aplicación del Reglamento sobre Despacho de Buques las embarcaciones que naveguen a vela, siempre que tengan número de vela registrado en la Federación Deportiva correspondiente, que participen en competiciones, y que cumplan las siguientes condiciones:","o":["Estar inscritas en la lista 7.ª, cualquiera que sea su eslora.","Estar inscritas en la lista 7.ª, sólo si su eslora es igual o inferior a 12 metros.","Estar inscritas en la lista 7.ª, sólo si su eslora es igual o inferior a 24 metros.","Estar inscritas en lista 6.ª o 7.ª, si su eslora es igual o inferior a 24 metros."],"a":0,"e":"Con el antiguo Reglamento de Despacho, quedaban exentas las de vela de competición inscritas en la lista 7.ª, cualquiera que fuese su eslora.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 el despacho y el rol los regula el RD 186/2023 (tema 5): comprueba la respuesta en la norma nueva."}},{"id":"2017oct-1-09","t":6,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"En el Real Decreto 210/2004, por el que se establece un sistema de seguimiento y de información sobre el tráfico marítimo, la definición de «El servicio que se establece para mejorar la seguridad y la eficacia del tráfico marítimo y para proteger el medio ambiente marino, con capacidad de actuar sobre el tráfico y de responder a las situaciones que en relación con éste se plantean en su zona», se corresponde con el:","o":["Servicio de organización del tráfico.","Servicio de tráfico marítimo.","Sistema obligatorio de notificación de buques.","Servicio de identificación y seguimiento de largo alcance de buques."],"a":1,"e":"RD 210/2004: esa definición corresponde al Servicio de tráfico marítimo (STM)."},{"id":"2017oct-1-10","t":7,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, en los actos colectivos náuticos, ¿quién deberá comunicar a la capitanía marítima el comienzo y el final del evento?","o":["El coordinador de seguridad.","El centro de control de tráfico.","La entidad organizadora.","Los patrones de las embarcaciones."],"a":0,"e":"RD 62/2008: el comienzo y el final del evento los comunica a la capitanía el coordinador de seguridad."},{"id":"2017oct-1-11","t":7,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, en los actos colectivos náuticos, en cada una de las embarcaciones, el número mínimo de aros salvavidas se deberá incrementar en función del número de personas embarcadas, como mínimo en un aro más por cada:","o":["20 personas.","12 personas.","6 personas.","10 personas."],"a":0,"e":"RD 62/2008: en actos colectivos se añade como mínimo un aro salvavidas más por cada 20 personas embarcadas."},{"id":"2017oct-1-12","t":8,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"¿Cuál de los siguientes actos queda fuera del ámbito de aplicación del Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques?","o":["El abanderamiento y matriculación en las listas sexta y séptima de las embarcaciones de recreo.","Las anotaciones en las hojas de asiento de cualquier acto registrable que se den sobre las embarcaciones ya abanderadas y registradas en las listas sexta y séptima.","Los procedimientos de cambio de lista, salvo los que se produzcan entre las listas sexta y séptima de las listas enumeradas en el artículo 4 del Real Decreto 1027/1989, de 28 de julio.","El abanderamiento y matriculación de las embarcaciones de recreo de la lista sexta que transporten menos de doce pasajeros."],"a":2,"e":"RD 1435/2010: quedan fuera los cambios de lista, salvo los que se hacen entre la sexta y la séptima."},{"id":"2017oct-1-13","t":8,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, el certificado de registro español-permiso de navegación le será expedido:","o":["A toda embarcación registrada y abanderada, dotada de tripulación no profesional.","Únicamente a las embarcaciones de lista sexta.","A las embarcaciones de recreo de la lista sexta que transporten más de doce pasajeros.","A toda embarcación registrada y abanderada, dotada de tripulación profesional."],"a":0,"e":"RD 1435/2010: el certificado de registro español-permiso de navegación se expide a toda embarcación registrada y abanderada con tripulación no profesional."},{"id":"2017oct-1-14","t":9,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"En el Reglamento del seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas, el seguro cubrirá:","o":["Los daños sufridos por la embarcación asegurada.","Los daños producidos a embarcaciones y objetos remolcados, con el fin de salvarlos, y a sus ocupantes.","Los daños materiales a terceros.","Los daños producidos al tomador del seguro o al propietario de la embarcación."],"a":2,"e":"RD 607/1999: el seguro obligatorio cubre los daños materiales a terceros."},{"id":"2017oct-1-15","t":10,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"A efectos del Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, se comprenden dentro de los artefactos flotantes de recreo los patines con pedales o provistos de motor, siempre que la potencia sea:","o":["Superior a 3,5 kW.","Inferior a 5 kW.","Superior a 5 kW.","Inferior a 3,5 kW."],"a":3,"e":"RD 875/2014: los patines con pedales o con motor de potencia inferior a 3,5 kW son artefactos flotantes de recreo."},{"id":"2017oct-1-16","t":10,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, se define como embarcación a vela:","o":["Aquella embarcación que posee motor y aparejo de velas para poder propulsarse.","Aquella embarcación a motor y aparejo de vela cuya propulsión puede ser indistinta.","Aquella embarcación que utiliza las velas y los motores para poder navegar.","Aquella embarcación en la que el aparejo de vela constituye su forma principal de propulsión."],"a":3,"e":"RD 875/2014: embarcación a vela es aquella en la que el aparejo de vela es su forma principal de propulsión."},{"id":"2017oct-1-17","t":11,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Real Decreto 1434/1999, por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo, estarán obligadas a realizar un reconocimiento intermedio en seco las embarcaciones de casco de material compuesto registradas en la lista 7.ª a partir de una eslora mayor o igual a:","o":["16 metros.","6 metros.","15 metros.","12 metros."],"a":2,"e":"RD 1434/1999: en lista 7.ª, las de material compuesto hacen reconocimiento intermedio en seco a partir de 15 m de eslora."},{"id":"2017oct-1-18","t":11,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Real Decreto 1434/1999, por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo, la autorización de actuación de las entidades colaboradoras de inspección de embarcaciones de recreo corresponde:","o":["Al Director General de la Marina Mercante.","Al Secretario de Estado de Infraestructuras, Transporte y Vivienda.","Al Subsecretario del Ministerio de Fomento.","Al Secretario General de Transporte."],"a":1,"e":"Según la plantilla oficial de 2017, la autorización de las ECI correspondía al Secretario de Estado de Infraestructuras, Transporte y Vivienda.","av":{"n":"derogada","x":"Ese cargo ya no existe con ese nombre: el Ministerio de Fomento es hoy el de Transportes y Movilidad Sostenible. Comprueba en el tema 11 quién autoriza hoy a las ECI."}},{"id":"2017oct-1-19","t":12,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, las zonas 2 y 3 de navegación para las embarcaciones de recreo corresponden a la:","o":["Zona de navegación ilimitada.","Zona de navegación en aguas costeras.","Zona de navegación pre oceánica.","Zona de navegación en alta mar."],"a":3,"e":"Con la Orden FOM/1144/2003, las zonas 2 y 3 eran navegación en alta mar.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el equipo de las embarcaciones de recreo lo regula hoy el RD 339/2021 (tema 12), que cambia muchas cifras y definiciones. No te fíes de esta respuesta."}},{"id":"2017oct-1-20","t":12,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según la Orden FOM/1144/2003, por la que se regulan los equipos de seguridad, salvamento, contra incendios, navegación y prevención de vertidos por aguas sucias, que deben llevar a bordo las embarcaciones de recreo, las embarcaciones de recreo de zona 4 deberán llevar:","o":["Una bomba accionada por el motor principal, otra bomba de accionamiento manual y un balde.","Una bomba accionada por el motor principal, otra bomba de accionamiento manual y dos baldes.","Un balde y una bomba.","Una bomba manual."],"a":2,"e":"Con la Orden FOM/1144/2003, en zona 4 se llevaba un balde y una bomba.","av":{"n":"derogada","x":"La Orden FOM/1144/2003 está derogada desde 2021: el equipo de las embarcaciones de recreo lo regula hoy el RD 339/2021 (tema 12), que cambia muchas cifras y definiciones. No te fíes de esta respuesta."}},{"id":"2017oct-1-21","t":13,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, están sujetos al marcado CE:","o":["Los motores de propulsión de las embarcaciones únicamente.","Únicamente las embarcaciones y los motores de propulsión.","Sólo los componentes de las embarcaciones.","Las embarcaciones, los componentes que se introducen en el mercado por separado y los motores de propulsión."],"a":3,"e":"RD 98/2016: llevan marcado CE las embarcaciones, los componentes comercializados por separado y los motores de propulsión."},{"id":"2017oct-1-22","t":14,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Convenio Internacional sobre Búsqueda y Salvamento Marítimos de 1979, un sistema de notificación para buques debería comprender los siguientes tipos de notificación:","o":["El plan de atraque, la notificación de mercancías peligrosas y la notificación final.","El plan de contraincendios.","El plan de navegación, la notificación de la situación y la notificación final.","El plan de navegación, la entrega de residuos y la previsión meteorológica."],"a":2,"e":"Convenio SAR: plan de navegación, notificación de situación y notificación final."},{"id":"2017oct-1-23","t":15,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según la Ley 14/2014 de Navegación Marítima, la navegación bajo pabellón nacional se realizará:","o":["Sólo una vez sea obtenida la Patente de Navegación.","Una vez se haga firme el contrato de compraventa entre una persona física o jurídica española y cualquier otra del ámbito de la Unión Europea.","Una vez que el buque esté registrado y esté en aguas jurisdiccionales españolas.","Una vez obtenida la Patente de Navegación. Provisionalmente podrá también realizarse por medio de pasavante por el tiempo necesario para que un buque adquirido en el extranjero pueda realizar los viajes necesarios para llegar a un puerto nacional."],"a":3,"e":"Ley de Navegación Marítima: se navega con pabellón nacional tras obtener la Patente; provisionalmente, con pasavante para traer a puerto nacional un buque comprado fuera."},{"id":"2017oct-1-24","t":15,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según la Ley 14/2014 de Navegación Marítima, para que la hipoteca naval quede válidamente constituida podrá ser otorgada:","o":["En escritura pública, en póliza intervenida por notario o en documento privado y deberá inscribirse en el Registro Marítimo Central.","En escritura pública, en póliza intervenida por notario o en documento privado y deberá inscribirse en el Registro de Bienes Muebles.","En escritura pública, en póliza intervenida por notario o en documento privado y deberá inscribirse en la capitanía marítima de puerto de registro.","Sólo en escritura pública."],"a":1,"e":"Ley de Navegación Marítima: la hipoteca naval se otorga en escritura pública, póliza notarial o documento privado y se inscribe en el Registro de Bienes Muebles."},{"id":"2017oct-1-25","t":16,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según lo dispuesto en el artículo 730 del Código Civil, los testamentos, abiertos y cerrados, otorgados con arreglo a lo prevenido en la sección 8.ª, Del testamento marítimo:","o":["No caducarán.","Caducarán pasado 1 año, contado desde el momento en que el testador desembarque en un punto donde pueda testar en la forma ordinaria.","Caducarán pasados 4 meses, contados desde el momento en que el testador desembarque en un punto donde pueda testar en la forma ordinaria.","Caducarán pasados 2 años, contados desde el momento en que el testador desembarque en un punto donde pueda testar en la forma ordinaria."],"a":2,"e":"Código Civil art. 730: los testamentos marítimos caducan a los cuatro meses desde que el testador desembarca donde puede testar en forma ordinaria."},{"id":"2017oct-1-26","t":17,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, las baterías eléctricas desechadas se consideran:","o":["Desecho MARPOL anexo I.","Desecho MARPOL anexo III.","Desecho MARPOL anexo V.","Otros desechos y residuos."],"a":3,"e":"Con el RD 1381/2002, las baterías desechadas eran «otros desechos y residuos».","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2017oct-1-27","t":17,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Real Decreto 1381/2002, sobre instalaciones portuarias de recepción de desechos generados por los buques y residuos de carga, las embarcaciones de recreo para un máximo de doce pasajeros abonarán una tarifa por la recepción de los desechos generados por la embarcación:","o":["Del coste del servicio efectivamente recibido.","De un coste fijo anual con independencia del uso que haga.","El coste depende de la tarifa por tiempo contratada.","Es gratuita."],"a":0,"e":"Con el RD 1381/2002, las embarcaciones de recreo de hasta doce pasajeros pagaban el coste del servicio efectivamente recibido.","av":{"n":"derogada","x":"Pregunta del RD 1381/2002, derogado en 2022 por el RD 128/2022 (tema 17). La respuesta era válida con la norma antigua; hoy manda el RD 128/2022."}},{"id":"2017oct-1-28","t":19,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, la zona de navegación 1:","o":["Es la zona de navegación ilimitada y equivale a la zona marítima A1.","Equivale a la zona marítima A2.","Se aplica a la zona de navegación de los pesqueros de altura.","Es la zona de navegación ilimitada."],"a":3,"e":"RD 1185/2006: la zona de navegación 1 es la de navegación ilimitada."},{"id":"2017oct-1-29","t":19,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"Según el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, la radiobaliza obligatoria de una embarcación autorizada para navegar en la zona de navegación 2:","o":["Deberá situarse permanentemente en su soporte con un sistema de liberación adecuado, salvo que sea de activación únicamente manual para lo cual no necesitará dicho sistema.","Se someterá a un examen y mantenimiento completos en tierra por un instalador autorizado cada cinco años.","Por regla general, la batería deberá cambiarse cada cinco años y el dispositivo de liberación cada tres años.","Será objeto de un examen y mantenimiento completos cada cuatro años, en un centro aprobado de ensayo o del servicio técnico de la casa instaladora autorizada."],"a":3,"e":"Según la plantilla oficial de 2017, la radiobaliza de zona 2 se sometía a examen y mantenimiento completos cada cuatro años en centro aprobado.","av":{"n":"derogada","x":"El equipo radio de las embarcaciones de recreo se modificó en 2022 (RD 587/2022). Comprueba en el tema 19 las reglas actuales de la radiobaliza."}},{"id":"2017oct-1-30","t":18,"src":"oficial","conv":"2017oct","convName":"Octubre 2017","q":"El Anexo IV del Convenio Internacional para prevenir la contaminación por los buques, 1973, será de aplicación:","o":["A todos los buques.","A buques nuevos de arqueo bruto igual o superior a 200.","A buques nuevos de arqueo bruto igual o superior a 300.","A buques nuevos de arqueo bruto igual o superior a 400."],"a":3,"e":"MARPOL anexo IV se aplica a los buques nuevos de arqueo bruto igual o superior a 400 (y a los menores autorizados a llevar más de 15 personas)."},{"id":"p1-1","t":1,"src":"practica","q":"Según el TRLPEMM, ¿qué distancia abarca la zona contigua?","o":["Desde la costa hasta 12 millas.","Desde el límite exterior del mar territorial hasta 24 millas contadas desde las líneas de base.","Desde las líneas de base hasta 200 millas.","Desde el límite del mar territorial hasta 36 millas."],"a":1,"e":"Art. 8.1: la zona contigua va desde el límite exterior del mar territorial hasta las 24 millas contadas desde las líneas de base."},{"id":"p1-2","t":1,"src":"practica","q":"¿Cuál de las siguientes actividades NO se considera Marina Mercante?","o":["La ordenación del tráfico y las comunicaciones marítimas.","El salvamento marítimo.","La ordenación de la flota pesquera en el ámbito de la pesca.","La inspección técnica y operativa de buques."],"a":2,"e":"Art. 6.2: la ordenación de la flota pesquera y la inspección en el ámbito pesquero no son Marina Mercante."},{"id":"p1-3","t":1,"src":"practica","q":"La navegación de cabotaje es la que:","o":["Transcurre íntegramente dentro de un puerto.","No siendo interior, se efectúa entre puertos o puntos situados en zonas en las que España ejerce soberanía, derechos soberanos o jurisdicción.","Se efectúa entre puertos españoles y puertos extranjeros.","Se efectúa entre puertos situados fuera de las zonas españolas."],"a":1,"e":"Art. 8.2."},{"id":"p1-4","t":1,"src":"practica","q":"Según el TRLPEMM, se entiende por buque mercante:","o":["Todo buque civil, incluidos los pesqueros.","Todo buque civil utilizado para la navegación con un propósito mercantil, excluidos los dedicados a la pesca.","Cualquier embarcación de más de 24 metros.","Solo los buques que transportan mercancías."],"a":1,"e":"Art. 9.3."},{"id":"p1-5","t":1,"src":"practica","q":"¿Quién decide sobre la acogida de un buque necesitado de asistencia en un lugar de refugio?","o":["El Capitán Marítimo del puerto más cercano.","El Presidente de la Autoridad Portuaria.","El Director General de la Marina Mercante.","El Ministro de Defensa."],"a":2,"e":"Art. 299.2: lo decide el Director General de la Marina Mercante."},{"id":"p1-6","t":1,"src":"practica","q":"Las operaciones de desguace de buques en aguas portuarias requieren previamente:","o":["Autorización del Consejo de Ministros.","Informe vinculante del Capitán Marítimo.","Informe no vinculante de Puertos del Estado.","Únicamente licencia municipal."],"a":1,"e":"Art. 303."},{"id":"p1-7","t":1,"src":"practica","q":"Navegar excediendo el límite de velocidad en la franja de 200 metros en playas es una infracción:","o":["Leve.","Grave.","Muy grave.","No es infracción si no hay bañistas."],"a":1,"e":"Art. 307.2.l: navegación en la franja de 200 m en playas y 50 m en el resto de la costa excediendo la velocidad es grave."},{"id":"p1-8","t":1,"src":"practica","q":"Las acciones u omisiones del capitán o patrón del buque en estado de ebriedad que puedan alterar su capacidad son infracción:"," a legislación de su país de residencia o, en su defecto, la de su nacionalidad.","La ley del pabellón siempre.","No necesita titulación."],"a":1,"e":"DA 5.ª.2."},{"id":"p10-10","t":10,"src":"practica","q":"Según el art. 86.3 del RD 269/2022, superar el límite de alcohol determina:","o":["Una simple advertencia.","Que el miembro de la dotación se encuentra en estado de ebriedad a efectos del régimen sancionador.","La pérdida automática del título.","Que debe desembarcar al llegar a puerto."],"a":1,"e":"Art. 86.3 RD 269/2022."},{"id":"p11-1","t":11,"src":"practica","q":"Según el RD 1434/1999, ¿quién realiza el reconocimiento inicial?","o":["Una entidad colaboradora de inspección.","La Administración marítima.","El astillero.","La Federación de Vela."],"a":1,"e":"Art. 3.A."},{"id":"p11-2","t":11,"src":"practica","q":"Las embarcaciones de lista sexta están sujetas a reconocimientos periódicos:","o":["Solo si miden más de 6 m.","Cualquiera que sea su eslora, cada cinco años como máximo.","Cada diez años.","Nunca."],"a":1,"e":"Art. 3.B."},{"id":"p11-3","t":11,"src":"practica","q":"¿Qué embarcaciones deben pasar reconocimiento intermedio?","o":["Todas las de lista 7.ª.","Las de lista 6.ª de 6 m o más, las de lista 7.ª de 15 m o más y las de lista 7.ª de 6 m o más con casco de madera.","Solo las de más de 20 m.","Solo las motos náuticas."],"a":1,"e":"Art. 3.C."},{"id":"p11-4","t":11,"src":"practica","q":"¿Cuál de los siguientes supuestos obliga a un reconocimiento adicional?","o":["Cambiar de propietario.","Haber sufrido una varada o abordaje que pueda afectar a la seguridad.","Cambiar el nombre de la embarcación.","Renovar el seguro."],"a":1,"e":"Art. 3.D.c."},{"id":"p11-5","t":11,"src":"practica","q":"¿Qué consecuencia tiene no realizar o no superar los reconocimientos en plazo?","o":["Una multa automática sin más.","La caducidad del certificado de navegabilidad.","La baja en el registro.","Ninguna mientras haya seguro."],"a":1,"e":"Art. 4.1."},{"id":"p11-6","t":11,"src":"practica","q":"La autorización de las entidades colaboradoras de inspección corresponde a:","o":["El Capitán Marítimo.","El Secretario de Estado (Infraestructuras y Transportes en el texto original).","Las Comunidades Autónomas.","ENAC."],"a":1,"e":"Art. 7.1."},{"id":"p11-7","t":11,"src":"practica","q":"Las entidades colaboradoras de inspección deben poder efectuar los reconocimientos solicitados en un plazo inferior a:","o":["48 horas.","7 días.","15 días naturales desde la solicitud.","Un mes."],"a":2,"e":"Art. 6.1.g."},{"id":"p11-8","t":11,"src":"practica","q":"¿Con qué frecuencia mínima son auditadas las ECI por la DGMM?","o":["Cada cinco años.","Al menos una vez al año.","Cada tres años.","Solo cuando hay una denuncia."],"a":1,"e":"Art. 8.a."},{"id":"p11-9","t":11,"src":"practica","q":"¿Quién elige el lugar donde se realiza el reconocimiento?","o":["La ECI.","La Capitanía.","El propietario de la embarcación.","El club náutico."],"a":2,"e":"Art. 9.2."},{"id":"p11-10","t":11,"src":"practica","q":"Si la embarcación presenta defectos de tal gravedad que comprometen la seguridad de la navegación:","o":["La ECI la hunde.","Se comunica de inmediato a la Capitanía Marítima, que puede acordar su inmovilización.","Se le da un año de plazo.","La aseguradora decide."],"a":1,"e":"Art. 10.3.º."},{"id":"p11-11","t":11,"src":"practica","q":"Realizar obras de transformación o un cambio de motor sin la autorización correspondiente es:","o":["Una infracción leve.","Una infracción grave.","Una infracción muy grave.","No es infracción."],"a":1,"e":"Art. 12.b."},{"id":"p12-1","t":12,"src":"practica","q":"Según el RD 339/2021, la zona 5 de navegación es aquella en la que la embarcación:","o":["No se aleja más de 12 millas de la costa.","No se aleja más de 5 millas de un abrigo o playa accesible.","Navega en aguas protegidas.","No se aleja más de 2 millas de un abrigo."],"a":1,"e":"Art. 3.1.e."},{"id":"p12-2","t":12,"src":"practica","q":"Una embarcación de categoría de diseño B puede navegar por las zonas:","o":["1 a 7.","2 a 7.","4 a 7.","Solo 7."],"a":1,"e":"Art. 3.3.b."},{"id":"p12-3","t":12,"src":"practica","q":"Las embarcaciones de recreo extranjeras quedan sujetas al RD 339/2021 cuando:","o":["Nunca.","Desarrollan actividad comercial en aguas españolas, o navegan por aguas interiores o mar territorial y su propietario o usuario reside en España.","Superan los 12 m.","Están más de un mes en España."],"a":1,"e":"Art. 2.1.b-c."},{"id":"p12-4","t":12,"src":"practica","q":"¿En qué zonas es obligatorio el aro salvavidas con luz y rabiza?","o":["Solo en zona 1.","En zonas 1, 2, 3 y 4.","En todas las zonas.","En zonas 5 a 7."],"a":1,"e":"Art. 8."},{"id":"p12-5","t":12,"src":"practica","q":"¿Cuántas señales fumígenas flotantes se exigen en zona 1?","o":["Ninguna.","1.","2.","6."],"a":2,"e":"Art. 9."},{"id":"p12-6","t":12,"src":"practica","q":"Una embarcación de menos de 7 m que navega solo de día en zona 5 puede prescindir de las luces de navegación si lleva:","o":["Un reflector de radar.","Una linterna eléctrica de luz blanca.","Bengalas de mano.","Un silbato."],"a":1,"e":"Art. 10.3."},{"id":"p12-7","t":12,"src":"practica","q":"El tramo de cadena de la línea de fondeo debe ser, como mínimo:","o":["La mitad de la eslora.","Igual a la eslora, salvo en embarcaciones de 6 m o menos, que pueden usar solo estacha.","Cinco veces la eslora.","Diez metros en todo caso."],"a":1,"e":"Art. 11.2."},{"id":"p12-8","t":12,"src":"practica","q":"¿En qué zonas son obligatorios el barómetro y el juego de banderas C y N?","o":["Zonas 1 y 2.","Zonas 1 a 4.","Todas las zonas.","Solo zona 1."],"a":0,"e":"Art. 12.1."},{"id":"p12-9","t":12,"src":"practica","q":"¿Qué embarcaciones deben llevar botiquín tipo balsas de salvamento?","o":["Todas.","Las que no tienen tripulación profesional y navegan en zonas 1, 2, 3 o 4.","Solo las de más de 20 m.","Solo las de alquiler."],"a":1,"e":"Art. 13.2.b."},{"id":"p12-10","t":12,"src":"practica","q":"Una embarcación sin marcado CE de 1 tión."},{"id":"p15-1","t":15,"src":"practica","q":"Según la Ley 14/2014, la Sección de Buques del Registro de Bienes Muebles depende de:","o":["El Ministerio de Transportes.","El Ministerio de Justicia, a cargo de un Registrador de la Propiedad y Mercantil.","La Capitanía Marítima.","Puertos del Estado."],"a":1,"e":"Art. 68.1."},{"id":"p15-2","t":15,"src":"practica","q":"La primera inscripción de un buque en el Registro de Bienes Muebles será de:","o":["Hipoteca.","Dominio.","Arrendamiento.","Embargo."],"a":1,"e":"Art. 71.1."},{"id":"p15-3","t":15,"src":"practica","q":"El dominio y la libertad de cargas de un buque solo pueden acreditarse en perjuicio de tercero mediante:","o":["El Certificado de Matrícula.","La certificación del registrador, salvo lo dispuesto para los privilegios marítimos.","Una declaración jurada del propietario.","El Diario de Navegación."],"a":1,"e":"Art. 72.2."},{"id":"p15-4","t":15,"src":"practica","q":"¿Quién firma los asientos del Cuaderno de Bitácora?","o":["El capitán.","Los pilotos.","El jefe de máquinas.","El armador."],"a":1,"e":"Art. 85.1."},{"id":"p15-5","t":15,"src":"practica","q":"En caso de cambio de propiedad o de pabellón, los libros del buque:","o":["Se destruyen.","Se depositan en la Administración Marítima del último puerto de matrícula.","Se entregan al nuevo propietario.","Se envían al Registro de Bienes Muebles."],"a":1,"e":"Art. 86.2."},{"id":"p15-6","t":15,"src":"practica","q":"¿Qué se requiere para matricular en España un buque procedente de un registro extranjero?","o":["Nada especial.","Que el registro extranjero acredite la baja o certifique que será simultánea al alta en España.","Un informe de la sociedad de clasificación.","Que tenga menos de 10 años."],"a":1,"e":"Art. 92."},{"id":"p15-7","t":15,"src":"practica","q":"Un buque español arrendado por un residente en el extranjero:","o":["Debe darse de baja definitiva.","Puede ser autorizado a abanderarse temporalmente en el Estado de residencia del arrendatario mientras dure el contrato.","No puede salir de aguas españolas.","Pierde sus hipotecas."],"a":1,"e":"Art. 94.1."},{"id":"p15-8","t":15,"src":"practica","q":"Los privilegios marítimos gozan de preferencia:","o":["Solo sobre los créditos ordinarios.","Sobre las hipotecas y demás gravámenes inscritos, cualquiera que sea su fecha.","Después de las hipotecas.","Solo si se inscriben."],"a":1,"e":"Art. 122.2."},{"id":"p15-9","t":15,"src":"practica","q":"Si el acreedor hipotecario notifica la hipoteca al asegurador del buque:","o":["El asegurador puede pagar al asegurado libremente.","El asegurador no podrá pagar indemnización por pérdida o averías no reparadas sin consentimiento del acreedor.","El seguro se anula.","El acreedor pasa a ser propietario."],"a":1,"e":"Art. 135."},{"id":"p15-10","t":15,"src":"practica","q":"El acreedor con hipoteca naval puede ejercitar su derecho cuando:","o":["El buque cambia de nombre.","El deudor es declarado en concurso.","El buque entra en un puerto extranjero.","Cambia el capitán."],"a":1,"e":"Art. 140.b."},{"id":"p16-1","t":16,"src":"practica","q":"Según el art. 10.2 del Código Civil, los derechos que se constituyan sobre un buque quedan sometidos a:","o":["La ley del lugar donde se halle.","La ley del lugar de su abanderamiento, matrícula o registro.","La ley de la nacionalidad del propietario.","La ley española en todo caso."],"a":1,"e":"Art. 10.2."},{"id":"p16-2","t":16,"src":"practica","q":"¿Qué ley se aplica a los actos jurídicos autorizados por un cónsul español en el extranjero?","o":["La del país donde está el consulado.","La ley española.","La ley elegida por las partes.","La del pabellón."],"a":1,"e":"Art. 11.3."},{"id":"p16-3","t":16,"src":"practica","q":"Dos extranjeros que se casan en España pueden hacerlo:","o":["Solo en forma española.","En la forma prescrita para los españoles o en la establecida por la ley personal de cualquiera de ellos.","Solo ante su cónsul.","No pueden casarse en España."],"a":1,"e":"Art. 50."},{"id":"p16-4","t":16,"src":"practica","q":"¿Quién puede autorizar el matrimonio secreto?","o":["El Alcalde.","El Ministro de Justicia, cuando concurra causa grave suficientemente probada.","El capitán del buque.","El encargado del Registro Civil."],"a":1,"e":"Art. 54."},{"id":"p16-5","t":16,"src":"practica","q":"En el matrimonio por apoderado:","o":["Ambos contrayentes pueden estar representados.","Uno de los contrayentes puede actuar por apoderado con poder especial, pero el otro debe asistir personalmente.","No se permite en España.","Basta un poder general."],"a":1,"e":"Art. 55."},{"id":"p16-6","t":16,"src":"practica","q":"El acta de celebración del matrimonio la firman:","o":["Solo los contrayentes.","Quien lo celebra, los contrayentes y dos testigos.","Los padres de los contrayentes.","El encargado del Registro Civil únicamente."],"a":1,"e":"Art. 62."},{"id":"p16-7","t":16,"src":"practica","q":"¿Quiénes no pueden otorgar testamento cerrado?","o":["Los extranjeros.","Quienes no sepan o no puedan leer.","Los mayores de 80 años.","Los marinos en navegación."],"a":1,"e":"Art. 708."},{"id":"p16-8","t":16,"src":"practica","q":"En un buque de guerra, el testamento marítimo se otorga:","o":["Ante el Capitán y un testigo.","Ante el Contador o quien ejerza sus funciones, con dos testigos idóneos y el visto bueno del Comandante.","Ante el capellán.","Solo de palabra."],"a":1,"e":"Art. 722."},{"id":"p16-9","t":16,"src":"practica","q":"Al llegar al primer puerto español, el capitán entregará el testamento marítimo original:","o":["Al notario del puerto.","A la Autoridad marítima local, con copia de la nota del Diario.","Al juez de guardia.","A los herederos."],"a":1,"e":"Art. 726."},{"id":"p16-10","t":16,"src":"practica","q":"Un español que navega en alta mar a bordo de un buque extranjero puede testar:","o":["Solo al volver a España.","Con sujeción a las leyes de la nación a la que pertenezca el buque.","Solo en forma ológrafa.","Ante cualquier pasajero."],"a":1,"e":"Art. 732."},{"id":"p16-11","t":16,"src":"practica","q":"Si un testador revoca un testamento posterior y declara expresamente que quiere que valga el primero:","o":["El primero sigue revocado.","El primero recobra su fuerza.","Ninguno es válido.","Decide el juez."],"a":1,"e":"Art. 739."},{"id":"p17-1","t":17,"src":"practica","q":"Según el RD 128/2022, los «desechos generados por buques» son:","o":["Solo los residuos de carga.","Los producidos durante el servicio del buque, distintos de los residuos de carga, de los anexos I, IV, V y VI de MARPOL.","Las capturas descartadas.","Los residuos de los astilleros."],"a":1,"e":"Art. 2.j."},{"id":"p17-2","t":17,"src":"practica","q":"¿Quién garantiza la puesta a disposición de las instalaciones portuarias receptoras?","o":["La Capitanía Marítima.","La entidad gestora del puerto.","El naviero.","La Comunidad Autónoma siempre."],"a":1,"e":"Art. 4.2."},{"id":"p17-3","t":17,"src":"practica","q":"Las instalaciones portuarias receptoras deben tener capacidad para recoger los desechos:","o":["Mezclados en un único contenedor.","Por separado, según las categorías del Convenio MARPOL.","Solo los oleosos.","Solo los que pueda pagar el buque."],"a":1,"e":"Art. 6."},{"id":"p17-4","t":17,"src":"practica","q":"La Guía de Usuario de los planes de recepción estará disponible al menos en:","o":["Castellano.","Castellano e inglés.","Inglés y francés.","Las lenguas cooficiales."],"a":1,"e":"Art. 12.2."},{"id":"p17-5","t":17,"src":"practica","q":"Si el viaje hasta el puerto español dura menos de 24 horas, la notificación previa de desechos se hace:","o":["Al atracar.","A más tardar en el momento de salir del último puerto.","48 horas antes.","No hace falta."],"a":1,"e":"Art. 16.2.c."},{"id":"p17-6","t":17,"src":"practica","q":"Tras la entrega de desechos, el recibo lo expide:","o":["La Capitanía.","El gestor de la instalación portuaria receptora.","El capitán del buque.","Puertos del Estado."],"a":1,"e":"Art. 17.2."},{"id":"p17-7","t":17,"src":"practica","q":"La Capitanía exigirá la entrega de todos los desechos antes de salir cuando:","o":["El buque sea de pabellón español.","Se desconozca el siguiente puerto de escala o no conste que este tenga instalaciones adecuadas.","El buque vaya a un puerto de la UE.","Llueva."],"a":1,"e":"Art. 17.6."},{"id":"p17-8","t":17,"src":"practica","q":"Las tarifas de recepción de desechos se reducirán, entre otros casos, para:","o":["Los cruceros de lujo.","El transporte marítimo de corta distancia y los buques que generan cantidades limitadas de desechos y los gestionan de forma sostenible.","Los petroleros de casco único.","Los buques sin notificación previa."],"a":1,"e":"Art. 18.5."},{"id":"p17-9","t":17,"src":"practica","q":"¿Quién puede eximir a un buque en tráfico regular de las obligaciones de notificación y entrega?","o":["La Autoridad Portuaria.","La Dirección General de la Marina Mercante.","El capitán del buque.","Puertos del Estado."],"a":1,"e":"Art. 21.1."},{"id":"p17-10","t":17,"src":"practica","q":"Si una inspección acredita que un buque no ha entregado sus desechos, la Capitanía:","o":["Le impone solo una multa.","Le prohíbe salir del puerto hasta que los entregue, sin perjuicio del expediente sancionador.","Le obliga a tirarlos en alta mar.","No puede hacer nada."],"a":1,"e":"Art. 23.1."},{"id":"p18-1","t":18,"src":"practica","q":"Según MARPOL, la «Administración» es:","o":["La OMI.","El gobierno del Estado bajo cuya autoridad opera el buque (Estado del pabellón).","La autoridad portuaria del puerto de escala.","El armador."],"a":1,"e":"Art. 2 del Convenio."},{"id":"p18-2","t":18,"src":"practica","q":"¿Qué anexos de MARPOL puede un Estado declarar que no acepta?","o":["I y II.","III, IV y V.","Solo el VI.","Ninguno."],"a":1,"e":"Art. 14: anexos facultativos."},{"id":"p18-3","t":18,"src":"practica","q":"Según la regla 1 del anexo IV, ¿cuál de los siguientes SÍ son aguas sucias?","o":["Desagües de cámaras de máquinas.","Desagües de lavabos y lavaderos de las cámaras de servicios médicos.","Agua de lastre.","Agua de lavado de tanques de carga."],"a":1,"e":"Anexo IV, regla 1.3.2."},{"id":"p18-4","t":18,"src":"practica","q":"¿Qué reconocimiento del anexo IV se hace antes de que el buque entre en servicio?","o":["El de renovación.","El inicial.","El adicional.","El anual."],"a":1,"e":"Anexo IV, regla 4.1.1."},{"id":"p18-5","t":18,"src":"practica","q":"¿Cuál de estos NO es un sistema de tratamiento de aguas sucias admitido por la regla 9 del anexo IV?","o":["Instalación de tratamiento aprobada.","Sistema para desmenuzar y desinfectar.","Tanque de retención.","Descarga directa al mar sin tratamiento en puerto."],"a":3,"e":"Anexo IV, regla 9."},{"id":"p18-6","t":18,"src":"practica","q":"Las aguas sucias no desmenuzadas ni desinfectadas solo pueden descargarse:","o":["A más de 3 millas.","A más de 12 millas, a régimen moderado, en ruta y a 4 nudos o más.","En cualquier lugar.","Solo en puerto."],"a":1,"e":"Anexo IV, regla 11.1.1."},{"id":"p18-7","t":18,"src":"practica","q":"¿Cuál de estas descargas está prohibida siempre en el anexo V (salvo las excepciones de la regla 7)?","o":["Comida triturada a 5 millas fuera de zona especial.","Plásticos, incluidas las redes sintéticas.","Agua de lavado de cubierta sin sustancias perjudiciales.","Comida sin triturar a 15 millas en ruta."],"a":1,"e":"Anexo V, regla 3.2."},{"id":"p18-8","t":18,"src":"practica","q":"En una zona especial como el Mediterráneo, la comida triturada se puede descargar en ruta a no menos de:","o":["3 millas.","6 millas.","12 millas.","25 millas."],"a":2,"e":"Anexo V, regla 6.1.1."},{"id":"p18-9","t":18,"src":"practica","q":"¿Qué buques deben llevar un plan de gestión de basuras?","o":["Todos los de más de 12 m.","Los de 100 GT o más, los autorizados a llevar 15 personas o más y las plataformas.","Solo los de pasaje.","Solo los de más de 400 GT."],"a":1,"e":"Anexo V, regla 10.2."},{"id":"p18-10","t":18,"src":"practica","q":"En el Libro registro de basuras, la categoría A corresponde a:","o":["Desechos de alimentos.","Plásticos.","Artes de pesca.","Aceite de cocina."],"a":1,"e":"Apéndice del anexo V: A plásticos, B alimentos, C domésticos, D aceite, E cenizas, F operacionales, G residuos de carga, H cadáveres, I artes de pesca."},{"id":"p18-11","t":18,"src":"practica","q":"Si un buque de menos de 400 GT pierde accidentalmente basuras, ¿dónde se anota?","o":["En ningún sitio.","En el diario oficial de navegación.","En el rol.","En el certificado de aguas sucias."],"a":1,"e":"Anexo V, regla 10.3.4."},{"id":"p19-1","t":19,"src":"practica","q":"Según el RD 1185/2006, ¿por qué capítulo se rigen las embarcaciones de recreo en materia de radiocomunicaciones?","o":["Capítulo II (SOLAS).","Capítulo III (pesqueros de 24 m o más).","Capítulo IV (otros buques).","No están reguladas."],"a":2,"e":"Art. 2.5."},{"id":"p19-2","t":19,"src":"practica","q":"¿Qué organismo asigna el MMSI a los buques españoles?","o":["La Capitanía Marítima.","La Dirección General de la Marina Mercante.","La Secretaría de Estado de Telecomunicaciones.","SASEMAR."],"a":1,"e":"Art. 5.1."},{"id":"p19-3","t":19,"src":"practica","q":"¿Qué ocurre si la radiobaliza se activa involuntariamente?","o":["Nada, se apaga sola.","El capitán debe comunicarlo a la Administración marítima para evitar movilizar medios de salvamento.","Se tira al mar.","Se espera a llegar a puerto."],"a":1,"e":"Art. 8.7."},{"id":"p19-4","t":19,"src":"practica","q":"Una embarcación de recreo de 10 m que instala un VHF portátil:","o":["Necesita autorización previa de la DGMM.","No está obligada a notificar la instalación si no tiene LEB.","Debe obtener siempre LEB.","Necesita un proyecto técnico."],"a":1,"e":"Art. 12.1: las de 12 m o menos no notifican salvo que dispongan de LEB."},{"id":"p19-5","t":19,"src":"practica","q":"La radiobaliza de 406 MHz debe disponer, además, de un localizador en la frecuencia de:","o":["156,8 MHz.","121,5 MHz.","518 kHz.","2.182 kHz."],"a":1,"e":"Art. 22.1.b."},{"id":"p19-6","t":19,"src":"practica","q":"Cada cuántos años se hace el examen y mantenimiento completo de las radiobalizas en un centro aprobado?","o":["Cada año.","Cada dos años.","Cada cuatro años.","Cada diez años."],"a":2,"e":"Art. 22.1.e."},{"id":"p19-7","t":19,"src":"practica","q":"¿Dónde deben ir los respondedores de radar de 9 GHz en los buques españoles?","o":["En la sala de máquinas.","En soportes a ambas bandas, claramente visibles desde el puente.","En la cofa.","Dentro de la balsa salvavidas siempre."],"a":1,"e":"Art. 24.1."},{"id":"p19-8","t":19,"src":"practica","q":"La fuente de energía de reserva de los buques del capítulo IV debe alimentar los equipos de radio durante un mínimo de:","o":["1 hora.","3 horas, y 6 en buques de pasaje de más de 20 millas.","12 horas.","24 horas."],"a":1,"e":"Art. 55.1."},{"id":"p19-9","t":19,"src":"practica","q":"¿Qué equipo NO exige el art. 56 a una embarcación de recreo de zona 1?","o":["Radiobaliza de 406 MHz automática y manual.","Respondedor de radar de 9 GHz.","VHF portátil.","Radar con APRA."],"a":3,"e":"Art. 56."},{"id":"p19-10","t":19,"src":"practica","q":"Una embarcación de recreo de lista sexta en zona 1 debe llevar además:","o":["Un receptor NAVTEX.","Un sextante electrónico.","Un segundo radar.","Un teléfono satelital personal."],"a":0,"e":"Art. 56.3.a."}],"replicas":[{"conv":"2026nov","name":"Noviembre 2026","test":1,"ids":["2026nov-1-01","2026nov-1-02","2026nov-1-03","2026nov-1-04","2026nov-1-05","2026nov-1-06","2026nov-1-07","2026nov-1-08","2026nov-1-09","2026nov-1-10","2026nov-1-11","2026nov-1-12","2026nov-1-13","2026nov-1-14","2026nov-1-15","2026nov-1-16","2026nov-1-17","2026nov-1-18","2026nov-1-19","2026nov-1-20","2026nov-1-21","2026nov-1-22","2026nov-1-23","2026nov-1-24","2026nov-1-25","2026nov-1-26","2026nov-1-27","2026nov-1-28","2026nov-1-29","2026nov-1-30"]},{"conv":"2026abr","name":"Abril 2026","test":1,"ids":["2026abr-1-01","2026abr-1-02","2026abr-1-03","2026abr-1-04","2026abr-1-05","2026abr-1-06","2026abr-1-07","2026 abr-1-06","2018abr-1-07","2018abr-1-08","2018abr-1-09","2018abr-1-10","2018abr-1-11","2018abr-1-12","2018abr-1-13","2018abr-1-14","2018abr-1-15","2018abr-1-16","2018abr-1-17","2018abr-1-18","2018abr-1-19","2018abr-1-20","2018abr-1-21","2018abr-1-22","2018abr-1-23","2018abr-1-24","2018abr-1-25","2018abr-1-26","2018abr-1-27","2018abr-1-28","2018abr-1-29","2018abr-1-30"]},{"conv":"2017oct","name":"Octubre 2017","test":1,"ids":["2017oct-1-01","2017oct-1-02","2017oct-1-03","2017oct-1-04","2017oct-1-05","2017oct-1-06","2017oct-1-07","2017oct-1-08","2017oct-1-09","2017oct-1-10","2017oct-1-11","2017oct-1-12","2017oct-1-13","2017oct-1-14","2017oct-1-15","2017oct-1-16","2017oct-1-17","2017oct-1-18","2017oct-1-19","2017oct-1-20","2017oct-1-21","2017oct-1-22","2017oct-1-23","2017oct-1-24","2017oct-1-25","2017oct-1-26","2017oct-1-27","2017oct-1-28","2017oct-1-29","2017oct-1-30"]}],"claves":[{"t":1,"pos":"1-2","law":"TRLPEMM (RDL 2/2011)","s":["Clases de navegación (ámbito y prestación)","Objetivos de la Marina Mercante","Infracciones: gravedad, prescripción y responsables","Buque abandonado"],"k":[["Navegación por su ámbito: interior, de cabotaje, exterior y extranacional. Por sus condiciones de prestación: regular y no regular.",5],["No son objetivos de la Marina Mercante: la señalización marítima y ayudas a la navegación (es de Puertos del Estado), la protección de la biodiversidad ni la promoción de la competencia.",4],["Infracciones: prescriben a los 5 años las muy graves, 3 las graves y 1 las leves. Por contaminación desde buques responden solidariamente naviero, propietario, asegurador y capitán."],["Buque abandonado: lo declara el Consejo de Administración de la Autoridad Portuaria.",3]]},{"t":2,"pos":"3-4","law":"Ley 14/2014 de Navegación Marítima","s":["Quién cierra puertos y autoriza la entrada","Sistemas de tráfico obligatorios","Pabellón y buques extranjeros","Plataformas, dotación y defunciones a bordo"],"k":[["Cierre temporal de puertos y terminales: lo ordena la Autoridad Portuaria, previo informe de la Capitanía Marítima.",3],["Los sistemas de tráfico solo pueden ser obligatorios en aguas interiores marítimas y mar territorial.",2],["La entrada en puerto la autoriza la Administración Portuaria. Cartas náuticas y Avisos a los Navegantes: Ministerio de Defensa.",3],["En aguas interiores se lleva izado el pabellón. Submarinos extranjeros: en superficie y con el pabellón desplegado. Zona de seguridad de plataformas: hasta 500 m."],["Fallece alguien sin médico a bordo: el capitán certifica la defunción, pero no antes de 24 horas."]]},{"t":3,"pos":"5","law":"TRLPEMM · RD 253/2024","s":["CIAIM: qué hace y cómo se compone","Funciones de la DGMM y sus Subdirecciones","Qué es Administración central y qué no"],"k":[["CIAIM: investiga las causas técnicas de los accidentes, sin buscar culpables. Presidente, Vicepresidente, un Secretario y vocales; sus investigadores son autoridad pública.",5],["La Capitanía Marítima no es Administración central: es periférica."],["RD 253/2024: la DGMM se encarga de la ordenación general de la navegación y la flota civil; las bonificaciones a residentes de Canarias y Baleares, la SG de Coordinación y Gestión Administrativa."]]},{"t":4,"pos":"6","law":"TRLPEMM art. 266 · RD 638/2007","s":["Qué forma la Administración periférica","Funciones del Capitán Marítimo","Coordinación con la Autoridad Portuaria"],"k":[["La Administración marítima periférica son las Capitanías Marítimas y los Distritos Marítimos.",4],["Donde lo exija la actividad, el tráfico o la seguridad hay una Capitanía Marítima.",2],["En puertos autonómicos coordinan la Administración portuaria y la Capitanía. El informe vinculante sobre los canales de entrada lo da el Capitán Marítimo."]]},{"t":5,"pos":"7","law":"RD 186/2023 (Reglamento de Ordenación de la Navegación)","s":["Rol de despacho y dotación","Enrolamientos y comunicaciones (RD 186/2023)"],"k":[["Desde 2025 la pregunta sale del RD 186/2023: rol de despacho y dotación, enrolamientos y entrada en aguas españolas. Solo hay 3 preguntas oficiales de esta norma: estudia el tema 5."],["Todas las preguntas de antes (Orden de 18 de enero de 2000) llevan aviso rojo: no te fíes de ellas."]]},{"t":6,"pos":"8","law":"RD 210/2004 · RD 1837/2000","s":["Notificaciones de buques con destino a España","SIA y registrador de datos","Defectos de seguridad (RD 1837/2000)"],"k":[["La información del anexo I se notifica al menos 24 horas antes, o al salir del puerto anterior si la travesía es más corta."],["Pesqueros de 15 m o más que desembarcan en España: SIA clase A. El registrador de datos y los planes de acogida: Administración Marítima."],["RD 1837/2000: navegando, los defectos que afecten a la seguridad se comunican a la autoridad del primer puerto de arribada, antes de llegar.",2]]},{"t":7,"pos":"9-10","law":"RD 62/2008 (concentraciones y pruebas náuticas)","s":["Quién autoriza, dirige o suspende la prueba","Plazos (10 y 15 días)","Embarcaciones de apoyo, aros y personas a bordo","Regatas de altura e internacionales"],"k":[["Retrasar, anular o suprimir la prueba si empeora la seguridad: el Capitán Marítimo.",3],["Coordinador de seguridad: dirige internamente el evento y comunica su comienzo y su final.",3],["Plazos: autorización notificada en 10 días; en regatas internacionales, aviso con al menos 15 días.",2],["Vela infantil: 1 embarcación de apoyo por cada 10 participantes. Aros: uno más por cada 20 personas.",4],["Regatas de altura: en mar territorial, zona contigua, ZEE y alta mar. Las de alquiler necesitan además seguro de accidentes.",4]]},{"t":8,"pos":"11-12","law":"RD 1435/2010 · RD 685/2010","s":["Renovación del certificado (5 años)","Indicativo de matrícula, nombre y CIN","Permiso temporal de navegación"],"k":[["El certificado de registro español-permiso de navegación se renueva cada 5 años, ante cualquier distrito marítimo.",4],["Indicativo de matrícula: lista, provincia marítima, distrito marítimo y folio/año.",3],["El nombre es obligatorio por encima de 12 m de eslora y va en alfabeto latino.",4],["CIN: país del fabricante, constructor, número de serie, mes y año de fabricación y año del modelo (no el puerto de matrícula).",2],["Permiso temporal: lo pide la empresa importadora, constructora o vendedora y lo resuelve la DGMM."]]},{"t":9,"pos":"13","law":"RD 607/1999 (seguro obligatorio)","s":["Qué cubre y qué NO cubre el seguro","Navegar sin seguro (infracción grave)"],"k":[["Sale en las 15 convocatorias. Cubre a terceros: muerte o lesiones, daños materiales, daños a buques por colisión o sin contacto y pérdidas económicas derivadas.",15],["NO cubre: los daños de la propia embarcación, la muerte o lesiones del patrón, las de quien paga el viaje ni las regatas (seguro especial).",7],["Navegar sin seguro es infracción grave. Si no lo llevas a bordo, tienes 5 días hábiles para justificarlo.",3]]},{"t":10,"pos":"14-15","law":"RD 875/2014 · RD 269/2022 art. 86.3","s":["Alcohol: límites y 4 horas antes","Definiciones (moto náutica, eslora, recreo)","Escuelas y prácticas","Quién inspecciona (DGMM)"],"k":[["Alcohol: 0,05 % en sangre o 0,25 mg/l en aire espirado; se mide en sangre o en aliento; desde 4 horas antes de empezar el servicio.",6],["Las inspecciones del RD 875/2014 las hace la DGMM.",2],["Motos náuticas = artefactos flotantes. Patines: con motor de menos de 3,5 kW. Embarcación de recreo: de 2,5 a 24 m; buque de recreo: más de 24 m."],["Prácticas de PNB y PER: embarcación de al menos 6 m; de patrón de yate, 11,5 m. Navegación diurna: entre el orto y el ocaso."]]},{"t":11,"pos":"16","law":"RD 1434/1999 (inspecciones)","s":["Tipos de reconocimiento (periódico, adicional, extraordinario)","Plazos: 15 días, 2 meses, 5 días hábiles","Certificado de navegabilidad"],"k":[["Los reconocimientos los pide el propietario a una ECI con al menos 15 días naturales antes de la caducidad.",2],["A requerimiento judicial = reconocimiento extraordinario. Cambio de lista 7.ª a 6.ª = adicional.",5],["Inspección desfavorable: la ECI da hasta 2 meses. Certificado no a bordo: 5 días hábiles para justificarlo. Máximo 12 pasajeros."]]},{"t":12,"pos":"17-18","law":"RD 339/2021 (equipo de seguridad)","s":["Línea de fondeo (5 esloras)","Ámbito: regatas fuera, comerciales dentro","Material por zona: aros, extintores, reflector, chalecos, bombas"],"k":[["Línea de fondeo: al menos 5 veces la eslora.",2],["Fuera de su ámbito: las embarcaciones de regatas destinadas exclusivamente a competir. Dentro: las de recreo con fines comerciales, cualquiera que sea su pabellón.",2],["Casco no metálico: reflector de radar en cualquier zona. Más de 50 V: al menos un extintor apto para fuegos eléctricos.",2],["Cifras que han salido: chalecos de 275 N, bombas de 15 l/min de 6 a 12 m, aguas sucias entre 3 y 12 millas solo desmenuzadas y desinfectadas."]]},{"t":13,"pos":"19","law":"RD 98/2016 (marcado CE)","s":["Categorías de diseño A y B","Qué entra y qué no (regatas, componentes)","Marcado CE y modificación del motor"],"k":[["Categorías de diseño: B, vientos hasta fuerza 8 y ola de hasta 4 m; A, más de fuerza 8 y más de 4 m.",3],["No se aplica a las embarcaciones exclusivamente de regatas. Antenas, radios u hornillos no son «componentes»."],["Modificación importante del motor: más de un 15 % de potencia. Documentación técnica: 10 años."]]},{"t":14,"pos":"20-21","law":"Convenios SAR 1979 y Salvamento 1989 · SASEMAR","s":["Fases de emergencia","Notificaciones de buques","SASEMAR: naturaleza y órganos","Recompensa y contratos de salvamento"],"k":[["Fases de emergencia: incertidumbre, alerta y peligro.",4],["Notificaciones de buques: plan de navegación, notificación de situación y notificación final.",4],["SASEMAR: entidad pública empresarial; órgano de gestión, el Director; de gobierno, el Consejo de Administración y el Presidente.",8],["Salvamento 1989: la recompensa no supera el valor de lo salvado; el capitán puede contratar el salvamento en nombre del propietario."]]},{"t":15,"pos":"22-23","law":"Ley 14/2014 (registro, nacionalidad e hipoteca)","s":["Registro de Bienes Muebles","Hipoteca naval","Diarios, Bitácora y su conservación","Patente, pasavante y Certificado de Matrícula"],"k":[["Titularidades, gravámenes e hipoteca naval se inscriben en la Sección de Buques del Registro de Bienes Muebles (Ministerio de Justicia).",9],["Hipoteca naval: escritura pública, póliza notarial o documento privado; la acción prescribe a los 3 años.",5],["Diarios y cuadernos: se conservan 1 año. Cuaderno de Bitácora: con dos o más oficiales de puente. Actos del capitán con funciones públicas: en el Diario de Navegación.",5],["La Patente de Navegación acredita la nacionalidad; provisionalmente, pasavante. El Certificado de Matrícula acredita que está matriculado en España.",6]]},{"t":16,"pos":"24","law":"Código Civil","s":["Testamentos: común, marítimo y su caducidad","Custodia del testamento por el capitán","Matrimonio y fallecimiento a bordo"],"k":[["Testamentos en 11 de 15 convocatorias. El común es ológrafo, abierto o cerrado; el marítimo es especial.",11],["Testamento marítimo de palabra ante dos testigos: solo con peligro de naufragio. Caduca a los 4 meses de desembarcar donde pueda testar normalmente.",4],["Los custodia el Capitán y se anotan en el Diario de Navegación.",2],["Nave presuntamente naufragada: declaración de fallecimiento al mes de las últimas noticias. Matrimonio en peligro de muerte a bordo: lo autoriza el Capitán."]]},{"t":17,"pos":"25-26","law":"RD 128/2022 (desechos de buques)","s":["Ámbito del RD 128/2022","Definiciones (desechos de buques)","SafeSeaNet, tarifas y exenciones"],"k":[["Se aplica a buques de cualquier pabellón que hagan escala en puerto español, salvo los de Estado y los de servicios portuarios.",2],["«Desechos de buques» incluye los residuos de carga. Las aguas sucias son categoría MARPOL anexo IV. Notificación por SafeSeaNet."],["Las preguntas de 2017-2022 son del RD 1381/2002, derogado: llevan aviso rojo."]]},{"t":18,"pos":"27-28","law":"MARPOL: articula
