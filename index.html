enos, está exenta de abanderamiento, matriculación y despacho."},{"id":"2026nov-1-12","t":8,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según el Real Decreto 685/2010, por el que se regula el otorgamiento de permiso temporal de navegación para determinadas embarcaciones de recreo, ¿quién es responsable de iniciar el procedimiento para la obtención de dicho permiso?","o":["La Dirección General de la Marina Mercante, que iniciará el procedimiento siempre de oficio a propuesta de los astilleros nacionales.","Las entidades organizadoras o los representantes legales de los salones náuticos y exposiciones donde se exhiban los buques.","El capitán de la embarcación.","La empresa importadora, constructora, concesionaria o distribuidora."],"a":3,"e":"El permiso temporal de navegación lo solicita la empresa importadora, constructora, concesionaria o distribuidora de la embarcación."},{"id":"2026nov-1-13","t":9,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según el Real Decreto 607/1999, que regula el seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas, la cobertura del seguro de responsabilidad civil de suscripción obligatoria cubrirá:","o":["Los daños sufridos por los bienes que por cualquier motivo (propiedad, depósito, uso, manipulación, transporte u otros) se hallen en poder del asegurado o de las personas que de él dependan o de los ocupantes de la embarcación.","El pago de sanciones y multas, así como las consecuencias del impago de las mismas.","Los daños sufridos por la embarcación asegurada.","Las pérdidas económicas sufridas por terceros que sean consecuencia directa de daños materiales causados por la embarcación asegurada."],"a":3,"e":"El seguro obligatorio cubre los daños a terceros, incluidas las pérdidas económicas que sean consecuencia directa de daños materiales causados por la embarcación asegurada. Quedan fuera los daños a la propia embarcación, los bienes en poder del asegurado o de los ocupantes, y las multas y sanciones."},{"id":"2026nov-1-14","t":10,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según el Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, ¿cuál de las siguientes características corresponde a un buque de recreo?","o":["Todo buque de cualquier tipo, con independencia de su modo de propulsión, cuya eslora de casco (Lh) sea inferior a 24 metros.","Disponen de un arqueo bruto superior a 3000 GT.","Tienen capacidad para transportar hasta 24 pasajeros sin contar la tripulación.","Disponen de un arqueo bruto inferior a 3000 GT."],"a":3,"e":"Un buque de recreo mide más de 24 m, tiene un arqueo bruto inferior a 3.000 GT y lleva hasta 12 pasajeros sin contar la tripulación."},{"id":"2026nov-1-15","t":10,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según el Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo; dentro del ámbito de comunidades autónomas que no hayan asumido competencias en náutica de recreo, ¿con que titulación NO podría el instructor de la escuela impartir las prácticas reglamentarias de seguridad y navegación para los títulos de capitán y patrón de yate?","o":["Capitán de la Marina Mercante.","Patrón de Pesca de Altura.","Oficiales del Cuerpo General de la Armada Española.","Patrón Portuario."],"a":3,"e":"El título de Patrón Portuario no figura entre los que permiten impartir las prácticas de seguridad y navegación de capitán y patrón de yate. Sí figuran Capitán de la Marina Mercante, Patrón de Pesca de Altura y los oficiales del Cuerpo General de la Armada."},{"id":"2026nov-1-16","t":11,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según el Real Decreto 1434/1999, por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo para garantizar la seguridad de la vida humana en la mar y se determinan las condiciones que deben reunir las entidades colaboradoras de inspección, ¿cada cuánto tiempo debe realizar un reconocimiento periódico una embarcación registrada en la lista 7ª de 5 metros de eslora?","o":["Cada 5 años.","Entre el segundo y el tercer año del período establecido.","Anualmente.","Está exenta de realizar el reconocimiento periódico."],"a":3,"e":"Las embarcaciones de la lista 7.ª de menos de 6 m de eslora están exentas de los reconocimientos periódicos. Una de 5 m no tiene que pasarlos."},{"id":"2026nov-1-17","t":12,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, las que se encuentren navegando en la zona 2 y 3, deberán disponer a bordo, como mínimo de bengalas de mano, cohetes con luz roja y paracaídas y señales fumígenas flotantes, en las siguientes cantidades respectivamente:","o":["6, 6, 1.","3, 3, 0.","6, 6, 2.","6, 5, 2."],"a":0,"e":"En las zonas 2 y 3, el RD 339/2021 exige como mínimo 6 bengalas de mano, 6 cohetes con luz roja y paracaídas y 1 señal fumígena flotante."},{"id":"2026nov-1-18","t":12,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"De acuerdo con el Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, las embarcaciones de recreo NO navegarán:","o":["En situaciones de oleaje y viento que sobrepasa hasta en el doble los parámetros máximos de diseño.","En situaciones con vientos superiores a 80 km/h y olas de más de 4 metros de altura.","En situaciones de olas y viento superiores a las de su diseño.","En situaciones con vientos superiores a 70 km/h y olas de más de 3 metros de altura."],"a":2,"e":"Las embarcaciones de recreo no navegarán con olas y viento superiores a los de su categoría de diseño."},{"id":"2026nov-1-19","t":13,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Conforme a lo establecido en el Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, señale la respuesta CORRECTA:","o":["Toda embarcación de recreo independientemente de su eslora y categoría de diseño, tendrá uno o más emplazamientos para estibar una o varias balsas salvavidas con capacidad suficiente para el número de personas recomendado por el fabricante para cuyo transporte se haya diseñado la embarcación de recreo.","En el caso de las embarcaciones de recreo, la persona que las gobierne, desde el puesto principal de gobierno y en condiciones normales de utilización, deberá disponer de una buena visibilidad de 90°.","La embarcación estará diseñada de forma que se reduzca al mínimo el peligro de caer por la borda y de manera que se facilite subir de nuevo a bordo a la persona que se haya caído.","Únicamente las embarcaciones de eslora L mayor a 12 metros llevarán marcado un número de identificación."],"a":2,"e":"Entre los requisitos esenciales del RD 98/2016, la embarcación debe diseñarse para reducir al mínimo el riesgo de caer por la borda y facilitar que quien caiga pueda volver a subir a bordo."},{"id":"2026nov-1-20","t":14,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"De acuerdo con el Convenio Internacional sobre Búsqueda y Salvamento Marítimo, de 1979, el sistema de notificación para buques debería facilitar información de última hora acerca del movimiento de los buques, de modo que, en caso de que se produzca un suceso que entrañe peligro, sea posible:","o":["Identificar los buques que no están cumpliendo con el sistema de notificación para buques.","Imponer sanciones a los buques que no presten auxilio.","Lograr el permiso para contactar con el buque en peligro a la mayor brevedad.","Lograr, entre otros, la rápida identificación de los buques a los que pueda pedirse ayuda y facilitar auxilio o asesoramiento médico urgente."],"a":3,"e":"El Convenio SAR prevé que los sistemas de notificación para buques den información al día de sus movimientos para, si hay un siniestro, identificar rápido qué buques pueden ayudar y dar auxilio o asesoramiento médico urgente."},{"id":"2026nov-1-21","t":14,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"La Sociedad de Salvamento y Seguridad Marítima (SASEMAR):","o":["Gestiona la autorización o prohibición de entrada y salida de buques en aguas situadas en zonas en las que España ejerce soberanía, derechos soberanos o jurisdicción.","Dispone de un amplio despliegue de medios a lo largo de todas las costas españolas, tanto humanos como materiales, que incluyen medios marítimos y aéreos.","Debe realizar una solicitud para llevar a cabo labores de salvamento.","Aprueba el Plan Nacional de Servicios Especiales de Salvamento de la vida humana en la mar y de la lucha contra la contaminación del medio marino."],"a":1,"e":"SASEMAR tiene un amplio despliegue de medios humanos y materiales, marítimos y aéreos, por todas las costas españolas. El Plan Nacional lo aprueba el Gobierno y la autorización de entrada y salida de buques corresponde a las Capitanías."},{"id":"2026nov-1-22","t":15,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"De acuerdo con la Ley 14/2014, de Navegación Marítima, ¿un buque puede estar matriculado simultáneamente en el Registro de buques y Empresas navieras y en el registro de otro u otros Estados?","o":["Si, siempre que el buque enarbole pabellón español tomado en arrendamiento por residentes en España, mientras dure el contrato de arrendamiento.","No, salvo que el buque enarbole pabellón extranjero y su arrendatario sea extranjero.","No, salvo que los buques extranjeros sean tomados en arrendamiento por residentes en España o buques nacionales arrendados por un residente fuera de España, en ambos casos mientras dure el contrato de arrendamiento.","Sí, siempre que el buque disponga de autorización expresa del Armador."],"a":2,"e":"Un buque no puede estar matriculado a la vez en el Registro de Buques y Empresas Navieras y en el de otro Estado, salvo los buques extranjeros arrendados por residentes en España o los nacionales arrendados por residentes fuera de España, y solo mientras dure el arrendamiento."},{"id":"2026nov-1-23","t":15,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"De acuerdo con la Ley 14/2014, de Navegación Marítima, para que la hipoteca naval sobre un buque en construcción pueda inscribirse es indispensable que:","o":["La propiedad del buque figure inscrita en el Registro de Bienes Inmuebles únicamente.","En todo caso que la cuarta parte de la cantidad en que se haya presupuestado el valor total del casco esté invertida en la hipoteca naval.","La propiedad del buque figure inscrita en el Registro de Bienes Muebles y se invierta en la hipoteca naval la tercera parte de la cantidad presupuestada del valor total del casco.","No hay nada indispensable para que se pueda inscribir la hipoteca naval de un buque en construcción."],"a":2,"e":"Para inscribir la hipoteca de un buque en construcción, la propiedad debe figurar inscrita en el Registro de Bienes Muebles y debe estar invertida la tercera parte del valor presupuestado del casco."},{"id":"2026nov-1-24","t":16,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Conforme al artículo 675 del Código Civil, ¿cómo debe interpretarse toda disposición testamentaria?","o":["Restrictivamente en favor de los legatarios frente a los herederos universales en caso de contradicción.","Literalmente de sus palabras, a no ser que aparezca claramente que fue otra la voluntad del testador.","Extensivamente ante cualquier duda interpretativa para favorecer siempre a los herederos legítimos.","Aplicando de forma supletoria y directa las normas de interpretación de los contratos del artículo 1281 y siguientes."],"a":1,"e":"Art. 675 del Código Civil: toda disposición testamentaria se entiende en el sentido literal de sus palabras, a no ser que aparezca claramente que la voluntad del testador fue otra."},{"id":"2026nov-1-25","t":17,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según dispone el Real Decreto 128/2022, sobre instalaciones portuarias receptoras de desechos de buques, ¿dónde estará disponible la Guía de Usuario de los elementos esenciales de los planes de recepción y manipulación de desechos de buques?","o":["En el punto de información de la Capitanía Marítima.","En la Web del Ministerio de Transportes y Movilidad Sostenible.","Por medios electrónicos en el sistema de intercambio de información marítima SafeSeaNet y se hará pública a través del portal de internet de la entidad gestora del puerto y de las instalaciones portuarias receptoras de desechos de buques.","En el punto de información de la Autoridad Portuaria."],"a":2,"e":"La Guía de Usuario se pone a disposición por medios electrónicos en SafeSeaNet y se publica en el portal de internet de la entidad gestora del puerto y de las instalaciones receptoras."},{"id":"2026nov-1-26","t":17,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"De acuerdo con su ámbito de aplicación, las disposiciones del Real Decreto 128/2022, sobre instalaciones portuarias receptoras de desechos de buques, ¿en qué idiomas debe encontrarse disponible, como mínimo, la Guía de Usuario de los planes de recepción y manipulación de desechos?","o":["Castellano e inglés.","Castellano, francés y portugués.","Inglés y la lengua cooficial.","Castellano y la lengua cooficial."],"a":0,"e":"La Guía de Usuario de los planes de recepción y manipulación de desechos tiene que estar, como mínimo, en castellano y en inglés."},{"id":"2026nov-1-27","t":18,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según el Anexo V del Convenio MARPOL, ¿en qué circunstancias se pueden tirar restos de comida al mar sin haber sido tratados previamente fuera de una zona especial?","o":["Con el buque fondeado a más de 12 millas de la costa.","Con el buque en ruta a más de 12 millas de la costa.","Con el buque parado a más de 12 millas de la costa.","Con el buque en ruta a menos de 12 millas de la costa."],"a":1,"e":"Fuera de zonas especiales, los restos de comida sin triturar solo pueden echarse al mar con el buque en ruta y a más de 12 millas de la tierra más próxima (Anexo V de MARPOL)."},{"id":"2026nov-1-28","t":18,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según las definiciones dadas en el Anexo IV del Convenio MARPOL, ¿qué NO se entiende por aguas sucias?","o":["Desagües y otros residuos, procedentes de cualquier tipo de inodoros y urinarios.","Desagües procedentes de lavabos, lavaderos y conductos de salida situados en cámaras de servicios médicos.","Desechos líquidos provenientes de espacios de carga contaminados con productos de la carga.","Desagües procedentes de espacios en que se transporten animales vivos."],"a":2,"e":"El Anexo IV considera aguas sucias los desagües de inodoros y urinarios, los de los locales de servicios médicos y los de espacios con animales vivos. Los desechos de espacios de carga contaminados por la carga no son aguas sucias."},{"id":"2026nov-1-29","t":19,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"De acuerdo con el Real Decreto 1185/2006, por el que se aprueba el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, sobre el diario de servicio radioeléctrico señale la respuesta FALSA:","o":["Es obligatorio para los buques de pasaje autorizados a realizar navegaciones superiores a 20 millas.","Es obligatorio para los buques de carga de 150 toneladas o más.","Es obligatorio para los buques de pasaje autorizados a realizar navegaciones superiores a 5 millas.","Es obligatorio para los buques de servicios de puerto que salen al mar (clase T) de 150 toneladas o más."],"a":2,"e":"Pregunta para marcar la FALSA. El diario del servicio radioeléctrico es obligatorio para los buques de pasaje autorizados a navegar más de 20 millas, no a partir de 5 millas."},{"id":"2026nov-1-30","t":19,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"De conformidad con el Real Decreto 1185/2006, por el que se aprueba el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, en su Capítulo I, Sección 2ª, las empresas que vayan a actuar como empresas de instalación a bordo de buques se clasificarán como tipo:","o":["1, 2, 3 y 4.","M-1, M-2, M-3.","A1, A2, A3 y A4.","A, B, C y D."],"a":1,"e":"Las empresas instaladoras de equipos radioeléctricos a bordo se clasifican en los tipos M-1, M-2 y M-3 y deben estar inscritas en el registro de la DGMM."},{"id":"2024nov-1-01","t":1,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, el plazo de prescripción de las infracciones será:","o":["Tres años para las muy graves, dos años para las graves y un año para las leves.","Tres años para las muy graves, dos años para las graves y seis meses para las leves.","Cinco años para las muy graves, tres años para las graves y un año para las leves.","Cinco años para las muy graves, tres años para las graves y seis meses para las leves."],"a":2,"e":"TRLPEMM: las infracciones prescriben a los cinco años las muy graves, a los tres años las graves y al año las leves."},{"id":"2024nov-1-02","t":1,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, se considera responsable de las infracciones en materia de Marina Civil por contaminación del medio marino producidas desde buques:","o":["La empresa naviera titular de la actividad o, en su defecto, el capitán del buque.","La empresa naviera titular de la actividad y subsidiariamente el capitán del buque.","El naviero, el propietario, el asegurador de la responsabilidad civil y el capitán del buque, mancomunadamente.","El naviero, el propietario, el asegurador de la responsabilidad civil y el capitán del buque, solidariamente."],"a":3,"e":"TRLPEMM: en las infracciones por contaminación desde buques responden solidariamente el naviero, el propietario, el asegurador de la responsabilidad civil y el capitán."},{"id":"2024nov-1-03","t":2,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"Según la Ley 14/2014, de Navegación Marítima, los buques submarinos extranjeros y otros vehículos sumergibles deberán navegar por las aguas interiores marítimas y por el mar territorial españoles:","o":["Sumergidos.","En superficie sólo por las aguas interiores.","En superficie y con su pabellón desplegado.","En superficie en caso de avería."],"a":2,"e":"Ley de Navegación Marítima: los submarinos y sumergibles extranjeros navegan por aguas interiores y mar territorial en superficie y con el pabellón desplegado."},{"id":"2024nov-1-04","t":2,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"Según la Ley 14/2014, de Navegación Marítima, establece que en torno a los artefactos navales o plataformas se establecerán zonas de seguridad de la navegación en un radio que NO exceda de:","o":["Doscientos metros a partir de su borde exterior.","Cuatrocientos metros a partir de su borde exterior.","Cien metros a partir de su borde exterior.","Quinientos metros a partir de su borde exterior, si bien podrán ir más allá cuando se ajusten a las normas internacionales, que, en su caso, resulten aplicables."],"a":3,"e":"Ley de Navegación Marítima: la zona de seguridad en torno a artefactos y plataformas no excede de 500 metros desde su borde exterior, salvo lo que permitan las normas internacionales."},{"id":"2024nov-1-05","t":3,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"Según el Real Decreto 253/2024, por el que se desarrolla la estructura orgánica básica del Ministerio de Transportes y Movilidad Sostenible, la gestión y control de las bonificaciones al transporte marítimo de los residentes en las Comunidades Autónomas de Canarias e Illes Balears corresponde a la Subdirección General de:","o":["Normativa Marítima y Cooperación Internacional.","Seguridad, Contaminación e Inspección Marítima.","Gestión Económica y Administrativa.","Coordinación y Gestión Administrativa."],"a":3,"e":"RD 253/2024: las bonificaciones a residentes de Canarias e Illes Balears las gestiona la Subdirección General de Coordinación y Gestión Administrativa de la DGMM."},{"id":"2024nov-1-06","t":4,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, ¿cuál de los siguientes organismos tiene competencias relacionadas con la administración marítima periférica?","o":["Las Capitanías Marítimas.","Salvamento Marítimo.","La Guardia Civil.","Las Autoridades Portuarias."],"a":0,"e":"TRLPEMM art. 266: la Administración marítima periférica son las Capitanías Marítimas."},{"id":"2024nov-1-07","t":5,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"Según el Reglamento de Despacho de buques, aprobado por la Orden de 18 de enero de 2000, ¿qué documentos han de presentarse para formalizar el despacho de un buque mercante?","o":["Licencia de navegación y DIM.","Rol de despacho y dotación y Licencia de navegación.","Patente de navegación y Diario de navegación.","Declaración General del Capitán y Lista de Tripulantes."],"a":3,"e":"Con el antiguo Reglamento de Despacho (Orden de 18 de enero de 2000), el despacho de un buque mercante se formalizaba con la Declaración General del Capitán y la Lista de Tripulantes.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000), que desde 2023 sustituye el RD 186/2023 (tema 5). La respuesta oficial era la de entonces: no la des por buena sin mirar el RD 186/2023."}},{"id":"2024nov-1-08","t":6,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Real Decreto 210/2004, por el que se establece un sistema de seguimiento y de información sobre el tráfico marítimo, en lo referente al uso de sistemas de identificación automática (SIA) por los buques pesqueros, ¿cuál de los siguientes buques debe ir equipado con un sistema de identificación automática SIA (clase A)?","o":["Un buque pesquero de 12 metros de eslora total que faene en mar territorial español.","Un buque pesquero de 17 metros de eslora total que desembarque sus capturas en un puerto español.","Un buque pesquero de 12 metros de eslora total que desembarque sus capturas en un puerto español.","Todos los buques pesqueros deberán disponer de un sistema de identificación automática (SIA)."],"a":1,"e":"RD 210/2004: los pesqueros de eslora total igual o superior a 15 metros que desembarquen en puerto español deben llevar SIA clase A."},{"id":"2024nov-1-09","t":7,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Real Decreto 62/2008, por el que se aprueba el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, ¿a quién le corresponde la función de, previamente a su participación en una concentración náutica, asegurar que los equipos y aparatos que se hallen a bordo reúnen las condiciones técnicas adecuadas para la navegación?","o":["Al coordinador de seguridad.","Al capitán marítimo.","A la entidad organizadora.","Al patrón de la embarcación."],"a":3,"e":"RD 62/2008: comprobar antes de participar que los equipos de a bordo reúnen las condiciones técnicas es obligación del patrón de la embarcación."},{"id":"2024nov-1-10","t":7,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Real Decreto 62/2008, por el que se aprueba el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, ¿qué se entiende por “Regatas de altura”?","o":["Aquellas de carácter colectivo que tengan lugar, solamente, en zona contigua y zona económica exclusiva.","Aquellas de carácter colectivo que tengan lugar en el mar territorial, zona contigua, zona económica exclusiva y en alta mar.","Aquellas de carácter no colectivo que se celebren en zonas en las que España ejerza soberanía, derechos soberanos o jurisdicción.","Aquellas de carácter colectivo que tengan lugar, exclusivamente, en alta mar."],"a":1,"e":"RD 62/2008: regatas de altura son las colectivas que se celebran en mar territorial, zona contigua, zona económica exclusiva y alta mar."},{"id":"2024nov-1-11","t":8,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, el indicativo de matrícula con el que se individualiza cada embarcación consiste en un conjunto alfanumérico compuesto por los siguientes datos:","o":["La lista, la provincia marítima, el distrito marítimo y el folio / año.","La lista, la provincia marítima y el número identificativo de la embarcación.","La lista, el número identificativo de la embarcación y el folio / año.","El número identificativo de la embarcación y el folio / año."],"a":0,"e":"RD 1435/2010: el indicativo de matrícula se compone de lista, provincia marítima, distrito marítimo y folio/año."},{"id":"2024nov-1-12","t":8,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, la renovación o nueva expedición del certificado de registro español-permiso de navegación:","o":["Deberá realizarse cada 3 años, a solicitud del propietario solo ante el distrito marítimo del puerto de matrícula.","Deberá realizarse cada 5 años, a solicitud del propietario solo ante el distrito marítimo del puerto de matrícula.","Deberá realizarse cada 3 años, a solicitud del propietario ante cualquier distrito marítimo.","Deberá realizarse cada 5 años, a solicitud del propietario ante cualquier distrito marítimo."],"a":3,"e":"RD 1435/2010: el certificado de registro español-permiso de navegación se renueva cada cinco años, a solicitud del propietario ante cualquier distrito marítimo."},{"id":"2024nov-1-13","t":9,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"¿Cuál de los riesgos recogidos en el seguro, NO es de cobertura obligatoria, de acuerdo con el RD 607/1999, por el que se regula el Reglamento del seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas?","o":["Muerte o lesiones corporales de terceras personas.","Daños Materiales a terceros.","Daños al motor de la propia embarcación asegurada, cuando comprometan la estanqueidad y exista riesgo de hundimiento.","Pérdidas económicas adicionales sufridas por terceros, que sean consecuencia de un daño material o muerte o lesión cubierta por la póliza."],"a":2,"e":"RD 607/1999: el seguro obligatorio cubre muerte o lesiones, daños materiales y pérdidas económicas de terceros; nunca los daños de la propia embarcación asegurada."},{"id":"2024nov-1-14","t":10,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con las definiciones dispuestas en el Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, las motos náuticas se considerarán:","o":["Embarcaciones de recreo.","Artefactos flotantes de recreo.","Buques de recreo.","Ninguna categoría de las anteriores."],"a":1,"e":"RD 875/2014: a efectos de titulaciones, las motos náuticas se consideran artefactos flotantes de recreo."},{"id":"2024nov-1-15","t":10,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"Conforme al Real Decreto 269/2022, por el que se regulan los títulos profesionales y de competencia de la Marina Mercante, la medición del límite de alcohol a un miembro de la dotación podrá ser realizada:","o":["Exclusivamente en sangre.","Tanto en sangre como en aliento.","Tanto en orina como en aliento.","Tanto en sangre como en orina."],"a":1,"e":"RD 269/2022 art. 86.3: el alcohol de un miembro de la dotación puede medirse tanto en sangre como en aire espirado."},{"id":"2024nov-1-16","t":11,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"Según dispone el Real Decreto 1434/1999, sobre inspecciones de las embarcaciones de recreo, la realización de los reconocimientos periódicos, intermedios 0, en su caso, adicionales que puedan ser programados será solicitada por los propietarios de embarcaciones de recreo a:","o":["Una de las entidades colaboradoras de inspección autorizadas, con una antelación mínima de quince días naturales a la fecha de caducidad del certificado.","La DGMM, con una antelación mínima de quince días naturales a la fecha de caducidad del certificado.","Una de las entidades colaboradoras de inspección autorizadas, con una antelación mínima de diez días naturales a la fecha de caducidad del certificado.","La DGMM, con una antelación mínima de diez días naturales a la fecha de caducidad del certificado."],"a":0,"e":"RD 1434/1999: el propietario solicita los reconocimientos a una entidad colaboradora de inspección con al menos quince días naturales de antelación a la caducidad del certificado."},{"id":"2024nov-1-17","t":12,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, las embarcaciones de recreo estarán dotadas del siguiente material náutico:","o":["Todas las embarcaciones de recreo de casco no metálico, independientemente de su zona de navegación, deberán instalar un reflector de radar.","Todas las embarcaciones independientemente de su zona de navegación llevarán un sextante.","Únicamente las embarcaciones que naveguen por zona 3, 4, 5, 6 y 7 llevarán a bordo un barómetro.","Todas las embarcaciones independientemente de su zona de navegación llevarán un cronómetro."],"a":0,"e":"RD 339/2021: todas las embarcaciones de casco no metálico, sea cual sea su zona, llevan reflector de radar."},{"id":"2024nov-1-18","t":12,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, las embarcaciones de recreo deberán disponer de una línea de fondeo cuya longitud:","o":["No podrá ser inferior a tres veces la eslora de la embarcación.","No podrá ser inferior al doble de la eslora de la embarcación.","No podrá ser inferior a cinco veces la eslora de la embarcación.","Será como mínimo igual a la eslora de la embarcación."],"a":2,"e":"RD 339/2021: la línea de fondeo no puede ser inferior a cinco veces la eslora."},{"id":"2024nov-1-19","t":13,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, una embarcación con categoría de diseño B:","o":["Se considera diseñada para vientos que superen fuerza 8 (escala Beaufort) y altura significativa de ola de hasta 4 m inclusive.","Se considera diseñada para vientos de hasta fuerza 8 inclusive (escala Beaufort) y altura significativa de ola de hasta 4 m inclusive.","Se considera diseñada para vientos de hasta fuerza 8 inclusive (escala Beaufort) y altura significativa de ola de hasta 4 m o más.","Se considera diseñada para vientos de hasta fuerza 6 (escala Beaufort) y altura significativa de ola de hasta 4 m inclusive."],"a":1,"e":"RD 98/2016: categoría de diseño B, vientos hasta fuerza 8 inclusive y ola significativa hasta 4 m inclusive."},{"id":"2024nov-1-20","t":14,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Convenio Internacional sobre Búsqueda y Salvamento Marítimo, 1979, en relación con los procedimientos operacionales, indique qué situación de las siguientes está contenida en la fase de incertidumbre:","o":["Cuando la capacidad operacional del buque se ve disminuida, pero no al punto de que esto haga probable una situación de peligro.","Cuando han fallado los intentos de establecer contacto con el buque y no han dado resultado las indagaciones llevadas a cabo.","Cuando la capacidad operacional del buque ha disminuido al punto de que es probable que se produzca una situación de peligro.","Cuando un buque ha dejado de transmitir la notificación que de él se esperaba en relación con su situación o con su seguridad."],"a":3,"e":"Convenio SAR: hay fase de incertidumbre cuando un buque deja de transmitir la notificación esperada sobre su situación o su seguridad."},{"id":"2024nov-1-21","t":14,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, en relación con la Sociedad de Salvamento y Seguridad Marítima, indique qué opción NO constituye objeto de la Sociedad:","o":["La restricción de la navegación por razones de seguridad.","La prevención y lucha contra la contaminación del medio marino.","La prestación de los servicios de seguimiento y ayuda al tráfico marítimo, de seguridad marítima y de la navegación.","La prestación de los servicios de remolque y asistencia a buques."],"a":0,"e":"TRLPEMM: el objeto de SASEMAR es salvamento, lucha contra la contaminación, tráfico marítimo y remolque; restringir la navegación no es objeto suyo, sino de la Administración marítima."},{"id":"2024nov-1-22","t":15,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con la Ley 14/2014, de Navegación Marítima, el Registro de Bienes Muebles, en su Sección de Buques, se llevará bajo la dependencia de:","o":["El Ministerio de Justicia.","El Ministerio de Transportes y Movilidad Sostenible.","La Dirección General de la Marina Mercante.","El Ministerio del Interior."],"a":0,"e":"Ley de Navegación Marítima: el Registro de Bienes Muebles, Sección de Buques, depende del Ministerio de Justicia."},{"id":"2024nov-1-23","t":15,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con la Ley 14/2014, de Navegación Marítima, ¿dónde se anotarán los actos del capitán cuando actúe en el ejercicio de funciones públicas?","o":["En el Rol de Despacho y Dotación.","En el Diario de Navegación.","En el Cuaderno de Bitácora.","En el Certificado de Matrícula."],"a":1,"e":"Ley de Navegación Marítima: los actos del capitán en ejercicio de funciones públicas se anotan en el Diario de Navegación."},{"id":"2024nov-1-24","t":16,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"Según lo dispuesto en el artículo 676 del Código Civil, el testamento puede ser común o especial. El común puede ser:","o":["Ológrafo, abierto o cerrado.","Militar.","Marítimo.","Hecho en país extranjero."],"a":0,"e":"Código Civil art. 676: el testamento común puede ser ológrafo, abierto o cerrado; el militar, el marítimo y el hecho en el extranjero son especiales."},{"id":"2024nov-1-25","t":17,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Real Decreto 128/2022, sobre instalaciones portuarias receptoras de desechos de buques, las instalaciones que reciben aguas sucias de los buques se clasifican en la categoría de:","o":["Convenio MARPOL anexo I.","Convenio MARPOL anexo II.","Convenio MARPOL anexo IV.","Convenio MARPOL anexo V."],"a":2,"e":"RD 128/2022: las instalaciones que reciben aguas sucias son de la categoría MARPOL anexo IV."},{"id":"2024nov-1-26","t":17,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"Las entidades gestoras de los puertos pequeños no comerciales caracterizados por un tráfico raro o escaso constituido exclusivamente por embarcaciones y buques de recreo que no realicen actividades comerciales ¿pueden eximir a estos puertos de tener un plan de recepción y manipulación de desechos de buques y su correspondiente guía de usuarios según el Real Decreto 128/2022, sobre instalaciones portuarias receptoras de desechos de buques?","o":["Sí, siempre, ya que están fuera del ámbito de aplicación.","Previo informe de la capitanía marítima, y si las instalaciones portuarias receptoras del puerto están integradas en el sistema municipal de gestión de residuos y se garantiza que la información sobre el sistema de gestión de residuos se pone ala disposición de los usuarios de dichos puertos.","Sí, siempre que existan cubos con los colores amarillos, verde, azul y marrón de tamaño suficiente distribuidos por las áreas de servicio.","Siempre que exista un informe previo favorable evacuado por el ayuntamiento."],"a":1,"e":"RD 128/2022: estos puertos pequeños pueden quedar exentos del plan, previo informe de la Capitanía Marítima, si sus instalaciones están integradas en el sistema municipal de residuos y se informa a los usuarios."},{"id":"2024nov-1-27","t":18,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"Según el articulado del Convenio MARPOL, ¿cuáles son los anexos facultativos?","o":["Anexos II, IV y V.","Anexos II, III y VI.","Anexos III, IV y V.","Anexos I, IV y VI."],"a":2,"e":"MARPOL: los anexos facultativos son el III, el IV y el V (también el VI); los I y II son obligatorios."},{"id":"2024nov-1-28","t":18,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"Según el Convenio MARPOL Anexo IV, ¿cuáles de estos buques nuevos dedicados a viajes internacionales NO entran dentro del ámbito de aplicación?","o":["Los de arqueo bruto igual a 1000 que transporten a 99 personas.","Los de arqueo bruto igual a 325 que transporten a 12 personas.","Los de arqueo bruto igual a 140 que transporten a 30 personas.","Los de arqueo bruto igual a 505 que transporten a 10 personas."],"a":1,"e":"MARPOL anexo IV: se aplica a buques nuevos de 400 o más de arqueo bruto o de menos de 400 autorizados a llevar más de 15 personas; uno de 325 con 12 personas queda fuera."},{"id":"2024nov-1-29","t":19,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Real Decreto 1185/2006, por el que se aprueba el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, un «Operador Restringido del Sistema Mundial de Socorro y Seguridad Marítimo» está habilitado a operar las estaciones de barco en las zonas marítimas:","o":["A1 del SMSSM.","A1 y A2 del SMSSM.","A1, A2 y A3 del SMSSM.","A1, A2, A3 y M4 del SMSSM."],"a":0,"e":"RD 1185/2006: el Operador Restringido del SMSSM solo puede operar en la zona A1."},{"id":"2024nov-1-30","t":19,"src":"oficial","conv":"2024nov","convName":"Noviembre 2024","q":"De acuerdo con el Real Decreto 1185/2006, por el que se aprueba el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, la «Zona de navegación 5» se corresponde con navegación en la cual la embarcación NO se aleje más de:","o":["5 millas de un abrigo o playa accesible.","2 millas de un abrigo o playa accesible.","12 millas de un abrigo o playa accesible.","25 millas de un abrigo o playa accesible."],"a":0,"e":"RD 1185/2006: la zona de navegación 5 es la que no se aleja más de 5 millas de un abrigo o playa accesible."},{"id":"2024abr-1-01","t":1,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, la navegación, en función de sus condiciones de prestación, puede clasificarse en:","o":["Interior y Exterior.","Nacional y Extranacional.","Regular y No Regular.","Pesquera y Mercante."],"a":2,"e":"TRLPEMM: por sus condiciones de prestación, la navegación es regular o no regular (por su ámbito es interior, cabotaje, exterior o extranacional)."},{"id":"2024abr-1-02","t":2,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Según la Ley 14/2014, de Navegación Marítima, los buques extranjeros:","o":["Podrán ser directamente representados por el capitán.","Podrán ser directamente representados por su propietario.","Deberán tener un consignatario en los puertos nacionales.","Al igual que las embarcaciones de recreo, no tienen obligación de tener un consignatario."],"a":2,"e":"Ley de Navegación Marítima: los buques extranjeros deben tener consignatario en los puertos nacionales; los de recreo están exentos."},{"id":"2024abr-1-03","t":1,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, ¿cuál de los siguientes NO es un objetivo de la Marina Mercante?","o":["La tutela y el mantenimiento de la señalización marítima y las ayudas a la navegación.","La tutela de la seguridad de la navegación marítima.","La tutela de la seguridad marítima.","La existencia de los servicios de transporte marítimo que demanden las necesidades del país. MARÍTIMO"],"a":0,"e":"TRLPEMM: la señalización marítima no es un objetivo de la política de Marina Mercante (corresponde a Puertos del Estado); sí lo son la seguridad marítima y de la navegación y los servicios de transporte."},{"id":"2024abr-1-04","t":2,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Según la Ley 14/2014, de Navegación Marítima, cuando fallezca a bordo una persona y a falta de médico enrolado, corresponderá al capitán la extensión del certificado de defunción, pero no podrá hacerlo:","o":["Antes de que hayan transcurrido cuarenta y ocho horas a partir del momento en que, a su buen juicio, hayan aparecido señales inequívocas de muerte.","Hasta que un juez lo verifique.","Antes de que hayan transcurrido veinticuatro horas a partir del momento en que, a su buen juicio, hayan aparecido señales inequívocas de muerte.","Hasta que arribe a puerto."],"a":2,"e":"Ley de Navegación Marítima: sin médico enrolado, el capitán extiende el certificado de defunción, pero no antes de 24 horas desde las señales inequívocas de muerte."},{"id":"2024abr-1-05","t":3,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, la Comisión Permanente de Investigación de Accidentes e Incidentes Marítimos (CIAIM), está compuesta por:","o":["Un Presidente, un Vicepresidente, dos Secretarios y el número reglamentario de Vocales, formando parte de ella, además, investigadores propios o adscritos, todos ellos con conocimientos especializados en los hechos a investigar.","Un Presidente, un Vicepresidente, un Secretario y el número reglamentario de Vocales, formando parte de ella, además, investigadores propios o adscritos, todos ellos con conocimientos especializados en los hechos a investigar.","Un Presidente, un Vicepresidente, un Secretario, un Director General y número reglamentario de Vocales, formando parte de ella, además, investigadores propios o adscritos, todos ellos con conocimientos especializados en los hechos a investigar.","Un Presidente, un Vicepresidente, dos Secretarios, un Director General y número reglamentario de Vocales, formando parte de ella, además, investigadores propios o adscritos, todos ellos con conocimientos especializados en los hechos a investigar. MARÍTIMO"],"a":1,"e":"TRLPEMM: la CIAIM tiene un Presidente, un Vicepresidente, un Secretario y los Vocales que se fijen, además de investigadores propios o adscritos."},{"id":"2024abr-1-06","t":4,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el artículo 266, del Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, dedicado a la Capitanía Marítima y sus funciones, en los puertos de competencia de las Comunidades Autónomas, ¿qué dos administraciones coordinarán sus actuaciones para el cumplimiento de sus fines respectivos?","o":["Guardia Civil y Salvamento Marítimo.","Administración portuaria y Guardia Civil.","Comandancias de marina y Salvamento Marítimo.","Administración portuaria y la Capitanía Marítima."],"a":3,"e":"TRLPEMM art. 266: en los puertos autonómicos, la Administración portuaria y la Capitanía Marítima coordinan sus actuaciones."},{"id":"2024abr-1-07","t":5,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Según el Reglamento de Despacho de Buques, aprobado por la Orden de 18 de enero de 2000, ¿qué buques están obligados a llevar Rol de despacho y dotación?","o":["Todos los buques y embarcaciones nacionales.","Los buques españoles, cuyo tonelaje de registro bruto (TRB) o, en su caso, GT sea igual o superior a 20 toneladas, excluidos los buques de recreo inscritos en la Lista Séptima.","Los buques españoles, cuyo tonelaje de registro bruto (TRB) o, en su caso, GT sea inferior a 20 toneladas.","Los buques de recreo inscritos en la Lista Séptima cuyo tonelaje de registro bruto (TRB) o, en su caso, GT, sea igual o superior a 20 toneladas."],"a":1,"e":"Con el antiguo Reglamento de Despacho (Orden de 18-1-2000), llevaban Rol los buques españoles de 20 o más TRB/GT, salvo los de recreo de la Lista Séptima.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 el rol lo regula el RD 186/2023 (tema 5): la respuesta oficial puede no coincidir con la norma de hoy."}},{"id":"2024abr-1-08","t":6,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el Real Decreto 210/2004, por el que se establece un sistema de seguimiento y de información sobre el tráfico marítimo, ¿quién será el responsable de exigir y verificar que los buques que hagan escala en un puerto español estén equipados con un sistema registrador de datos de la travesía (RTD) de acuerdo con las modalidades establecidas en la sección II del anexo II?","o":["La Administración Portuaria.","La Administración Marítima.","La Comisión permanente de investigación de siniestros marítimos.","La Comisión Europea. MARÍTIMO"],"a":1,"e":"RD 210/2004: exigir y verificar el registrador de datos de la travesía (RDT) de los buques que hacen escala corresponde a la Administración Marítima."},{"id":"2024abr-1-09","t":7,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el artículo 6 del Real Decreto 62/2008 por el que se aprueba el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, ¿qué embarcaciones deben tener además de un seguro de responsabilidad civil, un seguro de accidentes?","o":["Las de pesca.","Las de recreo con independencia de su uso.","Las que se utilicen en régimen de alquiler.","Los buques de la Armada."],"a":2,"e":"RD 62/2008 art. 6: las embarcaciones en régimen de alquiler necesitan, además del seguro de responsabilidad civil, un seguro de accidentes."},{"id":"2024abr-1-10","t":7,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el Real Decreto 62/2008, por el que se aprueba el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, ¿a quién le corresponde la función de retrasar, anular o suprimir las pruebas si se ha producido un empeoramiento de las condiciones meteorológicas?","o":["Al coordinador de seguridad, sin necesidad de consultar al capitán marítimo.","Al capitán marítimo.","A la entidad organizadora.","Al patrón de la embarcación. MARÍTIMO"],"a":1,"e":"RD 62/2008: retrasar, anular o suspender la prueba por empeoramiento del tiempo corresponde al capitán marítimo."},{"id":"2024abr-1-11","t":8,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el Real Decreto 685/2010, por el que se regula el otorgamiento del permiso temporal de navegación para determinadas embarcaciones de recreo, el permiso temporal de navegación:","o":["Se tramitará y resolverá por la Dirección General de la Marina Mercante en el plazo de quince días desde su entrada en el registro de la sede electrónica asociada del Ministerio de Transportes, Movilidad y Agenda Urbana.","Se tramitará en la Capitanía Marítima donde la embarcación vaya a ser exhibida y la resolución la llevará a cabo el Capitán Marítimo en el plazo de un mes desde su recepción en dicha Capitanía.","Se tramitará en la Dirección General de la Marina Mercante y resolverá el Secretario General de Transportes en el plazo de un mes contado a partir del día siguiente de su entrada en el registro de la sede electrónica asociada del Ministerio de Transportes, Movilidad y Agenda Urbana.","Se tramitará y resolverá por la Dirección General de la Marina Mercante en el plazo de un mes desde su entrada en el registro de la sede electrónica asociada del Ministerio de Transportes, Movilidad y Agenda Urbana."],"a":0,"e":"RD 685/2010: el permiso temporal lo tramita y resuelve la DGMM en quince días desde su entrada en el registro."},{"id":"2024abr-1-12","t":8,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, la renovación del certificado de registro español-permiso de navegación deberá realizarse:","o":["Cada 5 años.","Cada 4 años.","Nunca, es un certificado que se emite sin caducidad.","Cada 3 años, coincidiendo con la renovación de la licencia de estación de barco (LEB). MARÍTIMO"],"a":0,"e":"RD 1435/2010: el certificado de registro español-permiso de navegación se renueva cada cinco años."},{"id":"2024abr-1-13","t":9,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el Real Decreto 607/1999, por el que se regula el Reglamento del seguro de responsabilidad civil de subscripción obligatoria para las embarcaciones de recreo o deportivas, la cobertura del seguro de responsabilidad civil de suscripción obligatoria NO comprenderá:","o":["Los daños sufridos por la embarcación asegurada.","Las pérdidas económicas sufridas por terceros que sean consecuencia directa de los daños relacionados con la muerte o lesiones corporales de terceras personas y los daños materiales a terceros.","Los daños materiales a terceros.","Los daños a buques por colisión o sin contacto."],"a":0,"e":"RD 607/1999: el seguro obligatorio no cubre los daños de la propia embarcación asegurada."},{"id":"2024abr-1-14","t":10,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Los titulados profesionales marítimos de la sección de puente, de acuerdo con lo dispuesto en el Real Decreto 36/2014, por el que se regulan los títulos profesionales del sector pesquero:","o":["Podrán gobernar las embarcaciones de recreo, de acuerdo con las atribuciones que les confiere su título profesional.","No podrán gobernar las embarcaciones de recreo.","Podrán gobernar exclusivamente embarcaciones de recreo propulsadas a motor, de acuerdo con las atribuciones que les confiere su título profesional.","Podrán gobernar las embarcaciones de recreo y sus atribuciones serán en cualquier caso las de un Capitán de Yate. MARÍTIMO"],"a":0,"e":"Los titulados profesionales de puente pueden gobernar embarcaciones de recreo según las atribuciones de su título profesional."},{"id":"2024abr-1-15","t":10,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Conforme al Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, las escuelas situadas en comunidades autónomas que no hayan asumido competencias en materia de enseñanzas náutico-deportivas deberán cumplir desde el comienzo de su actividad entre otros con el siguiente de los requisitos:","o":["Disponer de todo el equipo necesario, homologado o no, para realizar los cursos correspondientes a las enseñanzas y pruebas que se vayan a impartir y desarrollar.","Disponer de un seguro voluntario de responsabilidad civil en vigor para embarcaciones de recreo, el cual se acreditará mediante el justificante de pago de la prima correspondiente.","Contar con instructores para impartir clases y cursos de formación que estén en posesión de las titulaciones exigidas en este Real Decreto.","Disponer como mínimo de embarcaciones semirrígidas, con una eslora mínima de 4 metros, para la impartición de las prácticas correspondientes."],"a":2,"e":"RD 875/2014: las escuelas deben contar desde el inicio con instructores que tengan las titulaciones exigidas en el real decreto."},{"id":"2024abr-1-16","t":11,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Conforme con lo establecido en el Real Decreto 1434/1999, sobre inspecciones de las embarcaciones de recreo, si el resultado de una inspección fuera desfavorable:","o":["La entidad colaboradora de inspección concederá un plazo de dos meses como máximo para subsanar las anomalías detectadas.","La entidad colaboradora de inspección concederá un plazo de tres meses como máximo para subsanar las anomalías detectadas.","La Dirección General de la Marina Mercante concederá un plazo de tres meses como máximo para subsanar las anomalías detectadas.","La Dirección General de la Marina Mercante concederá un plazo de dos meses como máximo para subsanar las anomalías detectadas. MARÍTIMO"],"a":0,"e":"RD 1434/1999: con inspección desfavorable, la entidad colaboradora concede un plazo máximo de dos meses para subsanar."},{"id":"2024abr-1-17","t":12,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"¿Cuáles de las siguientes embarcaciones entran dentro del ámbito de aplicación del Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo?","o":["Las embarcaciones de regatas que estén destinadas exclusivamente a la competición.","Todas las embarcaciones de recreo que naveguen por la zona contigua española, cualquiera que sea su Estado de pabellón, y que sus propietarios tengan o no residencia o domicilio social en España.","Las embarcaciones de recreo que desarrollen una actividad con fines comerciales o lucrativos en aguas marítimas en las que España ejerce soberanía, derechos soberanos o jurisdicción, cualquiera que sea su Estado de pabellón.","Las embarcaciones históricas originales y las reproducciones individuales de embarcaciones históricas diseñadas antes de 1950, reconstruidas esencialmente con los materiales originales y denominados así por el fabricante."],"a":2,"e":"RD 339/2021: se aplica a las embarcaciones de recreo con fines comerciales o lucrativos en aguas españolas, cualquiera que sea su pabellón."},{"id":"2024abr-1-18","t":12,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Según el artículo 8 del Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, las embarcaciones de recreo que naveguen por la zona 1, deberán llevar, como mínimo:","o":["Un aro salvavidas con luz y rabiza, y un aro adicional con luz y rabiza.","Un aro salvavidas con luz y rabiza, y dos aros adicionales con luz y rabiza.","Un aro salvavidas, que no necesitará ni luz ni rabiza.","Un aro salvavidas con luz y rabiza y un aro adicional que no necesitará ni luz ni rabiza. MARÍTIMO"],"a":3,"e":"RD 339/2021 art. 8: en zona 1, un aro con luz y rabiza y otro aro adicional que no necesita luz ni rabiza."},{"id":"2024abr-1-19","t":13,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"El Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, NO es de aplicación a:","o":["La fabricación de las embarcaciones deportivas destinadas exclusivamente a regatas.","Los motores de propulsión instalados fuera de embarcaciones de recreo.","Las embarcaciones de recreo semiacabadas.","Las motos náuticas."],"a":0,"e":"RD 98/2016: no se aplica a las embarcaciones destinadas exclusivamente a regatas."},{"id":"2024abr-1-20","t":14,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el Convenio Internacional sobre Salvamento Marítimo, 1989, la recompensa determinada por una operación de salvamento, excluidos los intereses y las costas judiciales exigibles en virtud del fallo:","o":["No excederá del valor del buque y demás bienes salvados.","Podrá exceder el valor del buque y demás bienes salvados, pero nunca en más de un 25%.","Podrá exceder el valor del buque y demás bienes salvados, pero nunca en más de un 50%.","No excederá el 50% del valor del buque y demás bienes salvados."],"a":0,"e":"Convenio de Salvamento de 1989: la recompensa, sin intereses ni costas, no excede del valor del buque y bienes salvados."},{"id":"2024abr-1-21","t":14,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el Convenio Internacional sobre Búsqueda y Salvamento Marítimo, 1979, ¿cuál de los siguientes NO es un tipo de notificación para buques?","o":["Plan de Navegación.","Notificación de cambio imprevisto en la derrota.","Notificación de la situación.","Notificación final. MARÍTIMO"],"a":1,"e":"Convenio SAR: las notificaciones son plan de navegación, notificación de situación, de desviación y final; «cambio imprevisto en la derrota» no es un tipo."},{"id":"2024abr-1-22","t":15,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el artículo 86 de la Ley 14/2014, de Navegación Marítima, los Diarios de Navegación, los Cuadernos de Máquinas y de Bitácora deberán conservarse a bordo desde el último asiento practicado durante un periodo mínimo de:","o":["1 año.","2 años.","3 años.","6 meses."],"a":0,"e":"Ley de Navegación Marítima art. 86: los diarios y cuadernos se conservan a bordo al menos un año desde el último asiento."},{"id":"2024abr-1-23","t":15,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el artículo 142 de la Ley 14/2014, de Navegación Marítima, la acción hipotecaria naval prescribe:","o":["A los dos años, contados desde que pueda ejercitarse, conforme a las prescripciones de la presente ley.","A los cuatro años, contados desde que pueda ejercitarse, conforme a las prescripciones de la presente ley.","A los tres años, contados desde que pueda ejercitarse, conforme a las prescripciones de la presente ley.","A los seis meses, contados desde que pueda ejercitarse, conforme a las prescripciones de la presente ley."],"a":2,"e":"Ley de Navegación Marítima art. 142: la acción hipotecaria naval prescribe a los tres años desde que puede ejercitarse."},{"id":"2024abr-1-24","t":16,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Según el artículo 56 del Código Civil, los requisitos de capacidad o la inexistencia de impedimentos o su dispensa, de quienes deseen contraer matrimonio:","o":["Sólo se acreditan en el caso de personas con discapacidad.","Se acreditarán en el momento de contraer matrimonio.","No será necesario acreditarlos.","Se acreditarán previamente en acta o expediente, por quienes deseen contraer matrimonio. MARÍTIMO"],"a":3,"e":"Código Civil art. 56: capacidad e impedimentos se acreditan previamente en acta o expediente."},{"id":"2024abr-1-25","t":17,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Las disposiciones del Real Decreto 128/2022, sobre instalaciones portuarias receptoras de desechos de buques, se aplicarán:","o":["A cualquier buque o embarcación, sin excepción.","A los buques, cualquiera que sea el pabellón que enarbolen, que hagan escala u operen en un puerto español, excepto los buques que estén afectos a la prestación de servicios portuarios y los buques de Estado.","Exclusivamente a los buques nacionales, que hagan escala u operen en un puerto español.","En todo caso a los buques que enarbolen el pabellón de un estado miembro de la Unión Europea, que hagan escala u operen en un puerto español."],"a":1,"e":"RD 128/2022: se aplica a los buques de cualquier pabellón que hagan escala u operen en puerto español, salvo los de servicios portuarios y los de Estado."},{"id":"2024abr-1-26","t":17,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Atendiendo a las definiciones del Real Decreto 128/2022, sobre instalaciones portuarias receptoras de desechos de buques, ¿en qué concepto estarían los desechos que se producen durante el servicio de un buque, distintos de los residuos de carga, contemplados en los Anexos I, IV, V y VI del Convenio MARPOL?","o":["Residuos minerales de carga.","Residuos MARPOL Anexo V (origen mineral).","Desechos pescados de manera no intencionada.","Desechos generados por buques."],"a":3,"e":"RD 128/2022: los desechos producidos durante el servicio del buque (anexos I, IV, V y VI de MARPOL), distintos de los residuos de carga, son «desechos generados por buques»."},{"id":"2024abr-1-27","t":18,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Según la regla 9 del Anexo IV del Convenio MARPOL, para buques dentro del ámbito de aplicación, ¿cuál de los siguientes NO es un sistema de tratamiento de aguas sucias?","o":["Instalación de tratamiento de aguas sucias.","Conexión universal de descarga bajo la línea de flotación.","Sistema para desmenuzar y desinfectar.","Tanque de retención con capacidad suficiente. MARÍTIMO"],"a":1,"e":"MARPOL anexo IV regla 9: los sistemas son instalación de tratamiento, sistema para desmenuzar y desinfectar y tanque de retención; la conexión universal no lo es."},{"id":"2024abr-1-28","t":18,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"Según la regla 1 del Anexo V del Convenio MARPOL, ¿cuál de las siguientes NO es una zona especial?","o":["Zona especial del mar Báltico.","Zona especial del mar Mediterráneo.","Zona especial del mar Cantábrico.","Zona especial del mar del Norte."],"a":2,"e":"MARPOL anexo V: el Cantábrico no es zona especial; sí lo son el Báltico, el Mediterráneo y el mar del Norte, entre otras."},{"id":"2024abr-1-29","t":19,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el Real Decreto 1185/2006, por el que se aprueba el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, ¿quién es el órgano competente para la asignación de las identidades del servicio móvil marítimo (MMSI)?","o":["La Dirección General de la Marina Mercante.","Salvamento Marítimo.","La Autoridad Portuaria correspondiente a la zona donde se solicite.","Los prácticos del puerto correspondiente a la zona donde se solicite."],"a":0,"e":"RD 1185/2006: las identidades MMSI las asigna la Dirección General de la Marina Mercante."},{"id":"2024abr-1-30","t":19,"src":"oficial","conv":"2024abr","convName":"Abril 2024","q":"De acuerdo con el Real Decreto 1185/2006, por el que se aprueba el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, en relación con el equipamiento radioeléctrico prescrito para los buques y duplicaciones, los buques que naveguen por la zona marítima A1 y que opten por la duplicación de equipos como método de mantenimiento, deben llevar como equipo duplicado:","o":["Una instalación de VHF, de características iguales a las exigidas como equipo básico obligatorio.","Una instalación de MF, de características iguales a las exigidas como equipo básico obligatorio.","Una instalación de HF, de características iguales a las exigidas como equipo básico obligatorio.","Un receptor NAVTEX."],"a":0,"e":"RD 1185/2006: en zona A1, quien opte por duplicar equipos lleva una segunda instalación de VHF igual a la básica."},{"id":"2022abr-1-01","t":1,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Conforme al Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, se entiende por navegación de cabotaje:","o":["La que, no siendo navegación interior, se efectúa entre puertos o puntos situados en zonas en las que España ejerce soberanía, derechos soberanos o jurisdicción.","La que transcurre integramente dentro del ámbito de un determinado puerto o de otras aguas interiores marítimas españolas.","La que se efectúa entre puertos o puntos situados en zonas en las que España ejerce soberanía, derechos soberanos o jurisdicción y puertos o puntos situados fuera de dichas zonas.","La que se efectúa entre puertos o puntos situados fuera de las zonas en las que España ejerce soberanía, derechos soberanos y jurisdicción."],"a":0,"e":"TRLPEMM: cabotaje es la que, no siendo interior, se efectúa entre puertos o puntos de zonas en las que España ejerce soberanía, derechos soberanos o jurisdicción."},{"id":"2022abr-1-02","t":1,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, ¿cuál de las siguientes se considera una infracción grave?","o":["El incumplimiento de las disposiciones reglamentarias sobre la seguridad marítima que ocasione accidentes con daños para las personas.","Las alteraciones sustanciales realizadas en la construcción de los elementos de salvamento respecto de las características de los prototipos oficialmente homologados.","El embarque clandestino a bordo de un buque español.","Ordenar o emprender la navegación sin que el buque reúna las debidas condiciones de navegabilidad haciendo peligrar su seguridad."],"a":2,"e":"TRLPEMM: el embarque clandestino a bordo de buque español es infracción grave; las otras opciones son muy graves."},{"id":"2022abr-1-03","t":2,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según la Ley 14/2014, de Navegación Marítima, ¿a quién corresponde ordenar el cierre temporal de puertos y terminales a la navegación de buques?","o":["A la Dirección General de la Marina Mercante.","A la Capitanía Marítima.","A la Autoridad Portuaria correspondiente, previo informe de la Capitanía Marítima.","Al Distrito Marítimo."],"a":2,"e":"Ley de Navegación Marítima: el cierre temporal de puertos y terminales lo ordena la Autoridad Portuaria, previo informe de la Capitanía Marítima."},{"id":"2022abr-1-04","t":2,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según la Ley 14/2014, de Navegación Marítima, los sistemas de tráfico marítimo sólo podrán ser de empleo obligatorio cuando estén emplazados:","o":["En las aguas con una densidad de tráfico elevada.","En las aguas interiores marítimas o en el mar territorial.","En la zona económica exclusiva, siempre que estén aprobados por la Dirección General de la Marina Mercante.","En la zona contigua."],"a":1,"e":"Ley de Navegación Marítima: los sistemas de tráfico solo pueden ser obligatorios en aguas interiores marítimas o en el mar territorial."},{"id":"2022abr-1-05","t":3,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"De acuerdo con la estructura de la Administración marítima regulada en el Título II del Libro Segundo del Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, ¿qué NO se considera Administración Central?","o":["La Capitanía Marítima.","El Servicio público de salvamento.","La Comisión Permanente de Investigación de Accidentes e Incidentes Marítimos (CIAIM).","La Dirección General de la Marina Mercante."],"a":0,"e":"TRLPEMM: la Capitanía Marítima es Administración periférica, no central."},{"id":"2022abr-1-06","t":4,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"De acuerdo con Real Decreto 638/2007, por el que se regulan las Capitanías Marítimas y los Distritos Marítimos, la Administración marítima periférica se estructura en:","o":["Capitanías Marítimas y Distritos Marítimos.","Capitanías Marítimas de 1.ª y 2.ª categoría.","Capitanías Marítimas de 1.ª y 2.ª categoría, y Comandancias de Marina según las zonas determinadas reglamentariamente.","Distritos Marítimos de 1.ª y 2.ª categoría."],"a":0,"e":"RD 638/2007: la Administración marítima periférica se estructura en Capitanías Marítimas y Distritos Marítimos."},{"id":"2022abr-1-07","t":5,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"De acuerdo al Reglamento sobre Despacho de Buques, aprobado por la Orden de 18 de enero de 2000, ¿deben figurar en el Rol los endosos por cambio de titularidad del buque?","o":["Sí.","No. El Reglamento lo prohíbe expresamente, debiendo estos cambios constar únicamente en la hoja de asiento del registro correspondiente.","No es obligatorio, pero pueden incluirse.","Solamente en el Rol de los buques mercantes."],"a":0,"e":"Con el antiguo Reglamento de Despacho (Orden de 18-1-2000), los endosos por cambio de titularidad debían figurar en el Rol.","av":{"n":"derogada","x":"Pregunta del antiguo Reglamento de Despacho (Orden de 18-1-2000). Desde 2023 el rol lo regula el RD 186/2023 (tema 5): comprueba la respuesta en la norma nueva."}},{"id":"2022abr-1-08","t":6,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"De acuerdo al Real Decreto 210/2004, por el que se establece un sistema de seguimiento y de información sobre el tráfico marítimo, los planes de acogida de los buques necesitados de asistencia serán elaborados por:","o":["SASEMAR.","La Administración Marítima.","El armador del buque.","La compañía de gestión de la seguridad del buque."],"a":1,"e":"RD 210/2004: los planes de acogida de buques necesitados de asistencia los elabora la Administración Marítima."},{"id":"2022abr-1-09","t":7,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según el Real Decreto 62/2008, sobre las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, es obligación del patrón respecto de la embarcación de pesca o auxiliares de acuicultura que el número máximo de personas admisible sobre cubierta sea inferior a:","o":["Eslora total (m.) x Manga (m.) x 0,5.","Lo indicado en el certificado de navegabilidad.","Eslora total (m.) x Manga (m.) x 0,7.","Lo indicado por salvamento marítimo."],"a":0,"e":"RD 62/2008: en embarcaciones de pesca o auxiliares de acuicultura, las personas sobre cubierta no superarán eslora total × manga × 0,5."},{"id":"2022abr-1-10","t":7,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según el Real Decreto 62/2008, sobre las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, en los actos náuticos colectivos, si la prueba náutico deportiva corresponde a vela infantil, se deberá establecer un número adecuado de embarcaciones de auxilio o apoyo a las embarcaciones participantes; no debiendo bajar la citada relación de una embarcación de apoyo por cada:","o":["Cinco participantes.","Diez participantes.","Quince participantes.","No existe una disposición especial para este caso."],"a":1,"e":"RD 62/2008: en vela infantil, al menos una embarcación de apoyo por cada diez participantes."},{"id":"2022abr-1-11","t":8,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"De acuerdo con el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, ¿cuál de los siguientes supuestos está fuera del ámbito de aplicación?","o":["El abanderamiento y matriculación en la lista sexta de las embarcaciones de recreo.","El abanderamiento y matriculación en la lista séptima de las embarcaciones de recreo.","Las embarcaciones de recreo de la lista sexta que transporten menos de doce pasajeros.","Las embarcaciones que tengan otorgado permiso temporal de navegación de acuerdo con la normativa vigente."],"a":3,"e":"RD 1435/2010: no se aplica a las embarcaciones con permiso temporal de navegación."},{"id":"2022abr-1-12","t":8,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"De acuerdo al Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, la renovación del certificado de registro español-permiso de navegación deberá realizarse:","o":["Anualmente.","Cada 3 años.","Cada 5 años.","Este certificado no caduca. Una vez emitido no es necesaria su renovación y solamente se canjeará por uno nuevo cuando el documento sea ilegible."],"a":2,"e":"RD 1435/2010: el certificado de registro español-permiso de navegación se renueva cada cinco años."},{"id":"2022abr-1-13","t":9,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"De acuerdo al Real Decreto 607/1999, por el que se regula el Reglamento del seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas, la navegación de las embarcaciones dentro del ámbito de aplicación de esta norma, que NO estén aseguradas en la forma establecida, será considerada:","o":["Infracción muy grave.","Delito penal.","Infracción grave.","Infracción leve."],"a":2,"e":"RD 607/1999: navegar sin el seguro obligatorio es infracción grave."},{"id":"2022abr-1-14","t":10,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según el artículo 31 del Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, no podrá impartir las prácticas reglamentarias de seguridad y navegación para Capitán y Patrón de Yate:","o":["Un Capitán de la Marina Mercante.","Un Patrón de Altura.","Un Capitán de Pesca.","Un Patrón de Litoral."],"a":3,"e":"RD 875/2014 art. 31: un Patrón de Litoral no puede impartir las prácticas de seguridad y navegación de Capitán y Patrón de Yate."},{"id":"2022abr-1-15","t":10,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según lo establecido en la disposición adicional tercera del Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, las embarcaciones de recreo españolas se podrán alquilar:","o":["A cualquier persona física siempre que ésta disponga de un título de recreo o un certificado habilitante en vigor.","A cualquier persona jurídica siempre que ésta disponga de un título de recreo o un certificado habilitante en vigor.","A cualquier persona física siempre que ésta disponga de una tarjeta de recreo o un certificado habilitante en vigor.","A cualquier persona jurídica siempre que ésta disponga de una tarjeta de recreo o un certificado habilitante en vigor."],"a":0,"e":"RD 875/2014, DA 3.ª: las embarcaciones españolas pueden alquilarse a cualquier persona física con título de recreo o certificado habilitante en vigor."},{"id":"2022abr-1-16","t":11,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Conforme al Real Decreto 1434/1999, sobre inspecciones de las embarcaciones de recreo, el certificado de navegabilidad deberá llevarse siempre a bordo. Caso de ser requerido por las autoridades competentes y no encontrarse dicho Certificado a bordo:","o":["Se considerará como infracción leve y será motivo de sanción de acuerdo con lo dispuesto en el capítulo IV de este Real Decreto.","Se dispondrá del plazo de diez días hábiles, contados a partir del requerimiento, para justificar ante las mismas la existencia y vigencia del mismo.","Se considerará como infracción muy grave y será motivo de sanción de acuerdo con lo dispuesto en el capítulo IV de este Real Decreto.","Se dispondrá del plazo de cinco días hábiles, contados a partir del requerimiento, para justificar ante las mismas la existencia y vigencia del mismo."],"a":3,"e":"RD 1434/1999: si no se lleva a bordo el certificado de navegabilidad, hay cinco días hábiles desde el requerimiento para justificar su existencia y vigencia."},{"id":"2022abr-1-17","t":12,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Conforme al Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, ¿podría autorizarse la descarga de aguas sucias a 3,5 millas de la costa española?","o":["No, está prohibida cualquier descarga de aguas sucias dentro del mar territorial, solamente se podrá a partir de 12 millas náuticas de tierra siempre que la embarcación se encuentre en ruta y a una velocidad no inferior a 4 nudos.","No, solamente está permitida la descarga en aguas protegidas siempre que éstas hayan sido previamente desmenuzadas y desinfectadas por una planta de tratamiento aprobada.","Sí, siempre que las aguas sucias fuesen previamente desmenuzadas y desinfectadas cumpliendo determinadas prescripciones.","Sí, siempre que se realice en ruta a una velocidad no inferior a 4 nudos y el efluente produzca sólidos flotantes."],"a":2,"e":"RD 339/2021: entre 3 y 12 millas puede autorizarse la descarga de aguas sucias previamente desmenuzadas y desinfectadas."},{"id":"2022abr-1-18","t":12,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Conforme al Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, con relación a las publicaciones náuticas:","o":["En zonas 1-2-3-4-5 y 6 son obligatorios el Barómetro, el Derrotero y el Libro de faros, y señales de niebla, actualizados de la zona en que navegue.","En zonas 3 y 4 entre otras publicaciones náuticas será obligatorio el Libro de radioseñales actualizado.","En zona 1 será obligatorio el Nomenclátor Lista VI.","En zonas 2 y 3 será obligatorio el Libro de radioseñales actualizado."],"a":3,"e":"RD 339/2021: en zonas 2 y 3 es obligatorio el Libro de radioseñales actualizado."},{"id":"2022abr-1-19","t":13,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"Según establece el Anexo II del Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, ¿cuál de los siguientes componentes no es considerado como “componente de la embarcación”?","o":["Mecanismo que impide la puesta en marcha de los motores fueraborda cuando está engranada alguna de las marchas.","Escotillas y portillos prefabricados.","Timones, mecanismos de dirección y conjuntos de cables.","Antenas y equipos transmisores de radio comunicaciones."],"a":3,"e":"RD 98/2016 anexo II: las antenas y equipos de radio no son «componentes de la embarcación»."},{"id":"2022abr-1-20","t":14,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"¿Cómo se denomina el convenio que faculta al capitán para celebrar contratos de operaciones de salvamento en nombre del propietario del buque?","o":["Convenio Internacional sobre Salvamento Marítimo, 1989.","Convenio Internacional sobre Búsqueda y Salvamento Marítimo, 1979.","Convenio MARPOL 73/78.","Convenio Internacional sobre Operaciones de Salvamento, 2000."],"a":0,"e":"Convenio de Salvamento de 1989: faculta al capitán para celebrar contratos de salvamento en nombre del propietario del buque."},{"id":"2022abr-1-21","t":14,"src":"oficial","conv":"2022abr","convName":"Abril 2022","q":"De acuerdo al Convenio Internacional sobre Búsqueda y Salvamento Marítimo, 1979, una unidad compuesta por personal capacitado y dotada de equipo apropiado para ejecutar con rapidez operaciones de búsqueda y salvament
