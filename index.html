n una radiobaliza de activación únicamente manual.","a":false,"e":"En zona 2 debe ser de activación automática y manual (art. 57.1.b)."},{"s":"En zona 5 se admite un VHF portátil estanco IPX7 en lugar del fijo.","a":true,"e":"Art. 60."},{"s":"El receptor NAVTEX recibe en 518 kHz.","a":true,"e":"Art. 21.3."}],"pairs":[{"title":"Zona marítima del SMSSM y su cobertura","items":[["A1","Estación costera de VHF con LSD"],["A2","Estación costera de MF (ondas hectométricas)"],["A3","Satélite geoestacionario de Inmarsat"],["A4","Fuera de A1, A2 y A3"]]},{"title":"Equipo mínimo de recreo por zona","items":[["Zona 1","ETB o MF/HF, VHF, radiobaliza y respondedor"],["Zona 3","VHF y radiobaliza manual o automática"],["Zona 4","VHF fijo"],["Zona 5","VHF fijo o portátil IPX7"]]},{"title":"Cada frecuencia con su uso","items":[["156,800 MHz (canal 16)","Escucha de socorro en radiotelefonía"],["156,525 MHz (canal 70)","Llamada selectiva digital (LSD)"],["518 kHz","NAVTEX"],["121,5 MHz","Localizador de la radiobaliza"],["2.182 kHz","Socorro en MF por radiotelefonía"]]}],"cloze":[{"s":"La zona de navegación 4 llega hasta ___ millas de la costa.","o":["5","12","25","60"],"a":1},{"s":"La LEB de un buque de pasaje vale ___ años.","o":["2","4","5","10"],"a":2},{"s":"Las baterías de la radiobaliza duran, como regla, ___ años.","o":["2","3","4","5"],"a":2},{"s":"El dispositivo de liberación hidrostática dura, como regla, ___ años.","o":["1","2","4","5"],"a":1},{"s":"En recreo, la energía de reserva solo se exige a las de nueva matriculación en las zonas 1, 2 y ___.","o":["3","4","5","7"],"a":0},{"s":"El certificado de seguridad radioeléctrica de un pesquero de menos de 24 m vale como máximo ___ años.","o":["1","2","3","5"],"a":1}]}],"questions":[{"id":"2026abr-1-01","t":1,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, en las infracciones cometidas con ocasión de la navegación marítima de buques mercantes en materia de Marina Civil, serán responsables:","o":["La empresa naviera titular de la actividad que realiza el buque y, subsidiariamente el capitán del buque.","La empresa naviera titular de la actividad o, en su defecto, el capitán del buque.","El capitán del buque y, subsidiariamente la empresa naviera titular de la actividad que realiza el buque.","El naviero, el propietario, el asegurador de la responsabilidad civil y el capitán del buque, conjuntamente."],"a":1,"e":"Art. 310.2.b: en buques mercantes responde la empresa naviera titular de la actividad o, en su defecto, el capitán. La responsabilidad solidaria de naviero, propietario, asegurador y capitán es solo para contaminación (310.2.d)."},{"id":"2026abr-1-02","t":1,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, la competencia para la imposición de las sanciones en los supuestos de infracciones leves contra la seguridad marítima y ordenación del tráfico marítimo corresponderá a:","o":["Los Capitanes Marítimos.","Los Capitanes Marítimos a propuesta de la Directora General de la Marina Mercante.","La Directora General de la Marina Mercante.","La Directora General de la Marina Mercante a propuesta de los Capitanes Marítimos."],"a":0,"e":"Art. 315.1.b: las leves contra la seguridad marítima, el tráfico marítimo o por contaminación desde buques las sancionan los Capitanes Marítimos."},{"id":"2026abr-1-03","t":2,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"¿Cuál es el objeto principal de la Ley 14/2014, de Navegación Marítima?","o":["Regular exclusivamente el transporte marítimo de mercancías.","Regular la pesca marítima profesional.","Regular las situaciones y relaciones jurídicas nacidas con ocasión de la navegación marítima.","Regular únicamente los puertos del Estado."],"a":2,"e":"Art. 1.1: el objeto es regular las situaciones y relaciones jurídicas nacidas con ocasión de la navegación marítima."},{"id":"2026abr-1-04","t":2,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según la Ley 14/2014, de Navegación Marítima, la dotación mínima de seguridad de un buque:","o":["La fija el capitán antes de cada viaje.","La determina la Administración Marítima atendiendo a las circunstancias técnicas, de navegación y de tráfico, así como al régimen y organización del trabajo a bordo.","La establece la empresa naviera libremente.","La fija la autoridad portuaria del puerto de salida."],"a":1,"e":"Art. 161.2: la Administración Marítima fija la dotación mínima de seguridad de cada buque atendiendo a sus circunstancias técnicas, de navegación y de tráfico y a la organización del trabajo a bordo."},{"id":"2026abr-1-05","t":3,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, la Comisión Nacional de Salvamento Marítimo es el órgano encargado de:","o":["La coordinación de las Administraciones públicas competentes en la planificación y en el seguimiento de los objetivos comprendidos en la misma, cuya composición y funciones se determinan reglamentariamente.","La coordinación de las inspecciones de seguridad en puertos y en buques, y de elaborar planes de emergencia.","La prestación de los servicios públicos de salvamento de la vida humana en la mar.","La prestación de los servicios públicos de emergencias para los buques que se encuentren en peligro de naufragar o que, en general, supongan una amenaza para la navegación o la integridad del medio ambiente marino."],"a":0,"e":"Art. 264.4 TRLPEMM: la Comisión Nacional de Salvamento Marítimo es el órgano de coordinación de las Administraciones públicas competentes en la planificación y seguimiento. La prestación del servicio corresponde a SASEMAR, no a la Comisión."},{"id":"2026abr-1-06","t":4,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"De acuerdo con el Real Decreto 638/2007, por el que se regulan las Capitanías Marítimas y los Distritos Marítimos, ¿cuál es la dependencia jerárquica de los Capitanes Marítimos?","o":["Dependen directamente del Presidente de la Autoridad Portuaria correspondiente.","Dependen orgánica y funcionalmente de la Dirección General de la Marina Mercante.","Dependen del Ministerio de Defensa al ser autoridades marítimas.","Dependen de las Comunidades Autónomas donde se ubique el puerto."],"a":1,"e":"Art. 6 RD 638/2007: Capitanías y Distritos dependen orgánica y funcionalmente del Ministerio a través de la Dirección General de la Marina Mercante."},{"id":"2026abr-1-07","t":5,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"De acuerdo con el artículo 23 “Comunicación de enrolamientos y desenrolamientos” del Real Decreto 186/2023, por el que se aprueba el Reglamento de Ordenación de la Navegación Marítima, se deben comunicar a la Administración Marítima los enrolamientos y desenrolamientos que se produzcan en los buques y embarcaciones a la mayor brevedad posible y a más tardar antes de salir a la mar o, en caso de encontrarse en la mar, en el plazo máximo de…","o":["72 horas, a través de la sede electrónica asociada del Ministerio de Transportes y Movilidad Sostenible (antes Ministerio de Transportes, Movilidad y Agenda Urbana).","48 horas, a través de la sede electrónica asociada del Ministerio de Transportes y Movilidad Sostenible (antes Ministerio de Transportes, Movilidad y Agenda Urbana).","24 horas, a través de la sede electrónica asociada del Ministerio de Transportes y Movilidad Sostenible (antes Ministerio de Transportes, Movilidad y Agenda Urbana).","12 horas, a través de la sede electrónica asociada del Ministerio de Transportes y Movilidad Sostenible (antes Ministerio de Transportes, Movilidad y Agenda Urbana)."],"a":2,"e":"Art. 23.1 RD 186/2023: a más tardar antes de salir a la mar o, en la mar, en un máximo de 24 horas, por la sede electrónica."},{"id":"2026abr-1-08","t":6,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según el Real Decreto 210/2004, por el que se establece un sistema de seguimiento y de información sobre el tráfico marítimo, las medidas adoptadas por las Capitanías Marítimas en condiciones meteorológicas excepcionalmente desfavorables del estado del mar habrán de basarse en el pronóstico facilitado por:","o":["La Dirección General de la Marina Mercante.","La Autoridad Portuaria.","La Dirección General de Pesca.","El Instituto Nacional de Meteorología. (Agencia Estatal de Meteorología- AEMET)."],"a":3,"e":"Art. 18.3 RD 210/2004: las medidas de las Capitanías por mal tiempo excepcional se basan en el pronóstico del Instituto Nacional de Meteorología (hoy AEMET)."},{"id":"2026abr-1-09","t":7,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según el Real Decreto 62/2008, por el que se aprueba el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, la resolución del Capitán Marítimo para condicionar la realización del evento por circunstancias de seguridad marítima, de la navegación o del tráfico marítimo debe ser notificada con un plazo de:","o":["15 días de antelación a la fecha de realización del evento.","10 días desde la recepción de la solicitud.","48 horas.","24 horas."],"a":1,"e":"Art. 5.2: la resolución que condiciona el evento se notifica en el plazo de 10 días desde la recepción de la solicitud."},{"id":"2026abr-1-10","t":7,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"De conformidad con el Capítulo II del Real Decreto 62/2008, por el que se aprueba el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas: en cuanto a las obligaciones de los patrones de las embarcaciones respecto de la embarcación, el número mínimo de aros salvavidas, se deberá incrementar en función del número de personas embarcadas, como mínimo en:","o":["Un aro más por cada cinco personas.","Un aro más por cada diez personas.","Un aro más por cada quince personas.","Un aro más por cada veinte personas."],"a":3,"e":"Art. 9.2.e: el número mínimo de aros (dos) se incrementa al menos en un aro más por cada veinte personas embarcadas."},{"id":"2026abr-1-11","t":8,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según el Real Decreto 1435/2010, por el que se regula el abanderamiento y la matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, ¿con qué periodicidad debe renovarse en todo caso el certificado de registro español–permiso de navegación?","o":["Cada 3 años.","Cada 4 años.","Cada 5 años.","El permiso de navegación no tiene caducidad; únicamente deberá solicitarse uno nuevo cuando se produzcan cambios en los datos del propietario o de la embarcación."],"a":2,"e":"Art. 17.1 RD 1435/2010: renovación cada cinco años, pidiéndola tres meses antes de que caduque."},{"id":"2026abr-1-12","t":8,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"¿A qué embarcaciones de recreo resulta de aplicación el régimen de permisos temporales de navegación previsto en el Real Decreto 685/2010, por el que se regula el otorgamiento de permiso temporal de navegación para determinadas embarcaciones de recreo?","o":["A las embarcaciones de recreo no matriculadas que, al ser exhibidas en exposiciones, salones náuticos, puertos o lugares utilizados por las empresas importadoras, constructoras, concesionarias o distribuidoras antes de su adquisición, sean probadas mediante la realización de actividades de exhibición en aguas interiores marítimas y mar territorial sobre los que España ejerce su soberanía.","A todas las embarcaciones de recreo de lista 6ª que transporten a más de 12 pasajeros, únicamente.","A toda embarcación de cualquier tipo, con independencia de su medio de propulsión, cuyo casco tenga una eslora comprendida entre 2,5 y 24 metros, y utilizada para fines deportivos o de ocio.","A las embarcaciones con marcado CE, cuando la adquisición de la embarcación sea a través de fórmulas de arrendamiento financiero con opción a compra."],"a":0,"e":"Art. 1.1 RD 685/2010: embarcaciones de recreo no matriculadas que se exhiben y prueban antes de su venta en aguas interiores y mar territorial."},{"id":"2026abr-1-13","t":9,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según el Real Decreto 607/1999, que regula el seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas, la cobertura del seguro de responsabilidad civil de suscripción obligatoria no comprenderá:","o":["Los daños sufridos por la embarcación asegurada.","Muerte o lesiones corporales de terceras personas.","Daños materiales a terceros.","Daños a buques por colisión o sin contacto."],"a":0,"e":"Art. 7.e: el seguro obligatorio no cubre los daños sufridos por la embarcación asegurada. Las otras tres opciones sí están cubiertas (art. 6)."},{"id":"2026abr-1-14","t":10,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según el Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, ¿qué órgano realizará las inspecciones necesarias al objeto de comprobar la veracidad de la información aportada y el cumplimiento de los requisitos exigidos en dicho Real Decreto?","o":["La Dirección General de la Marina Mercante.","Las Entidades Colaboradoras de Inspección.","La Sociedad de Salvamento y Seguridad Marítima.","El gobierno autonómico aplicable."],"a":0,"e":"Art. 37.1 RD 875/2014 (antes art. 34): las inspecciones las realiza la Dirección General de la Marina Mercante."},{"id":"2026abr-1-15","t":10,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según el Real Decreto 269/2022, por el que se regulan los títulos profesionales y de competencia de la Marina Mercante, ¿durante que período no debe superar todo miembro de la tripulación el límite de concentración de alcohol impuesto?","o":["Durante las cuatro horas antes del inicio del desempeño de sus funciones, hasta su finalización.","Durante una hora antes del inicio del desempeño de sus funciones, hasta su finalización.","Desde el inicio del desempeño de sus funciones, hasta su finalización.","Desde el inicio del desempeño de sus funciones y hasta una hora después de su finalización."],"a":0,"e":"Art. 86.3 RD 269/2022: desde cuatro horas antes del inicio de sus funciones hasta su finalización."},{"id":"2026abr-1-16","t":11,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según el Real Decreto 1434/1999, por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo para garantizar la seguridad de la vida humana en la mar y se determinan las condiciones que deben reunir las entidades colaboradoras de inspección, ¿se debe realizar un reconocimiento cuando una embarcación vaya a cambiar de la lista séptima a la lista sexta?","o":["No, no es obligatorio.","Sí, un reconocimiento adicional.","Sí, un reconocimiento extraordinario.","Sí, un reconocimiento periódico."],"a":1,"e":"Art. 3.D.b RD 1434/1999: el cambio de la lista séptima a la sexta exige un reconocimiento adicional."},{"id":"2026abr-1-17","t":12,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según el Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, la flotabilidad mínima que deben tener los chalecos salvavidas de las embarcaciones que naveguen por la Zona 1 será de:","o":["150 N.","175 N.","100 N.","275 N."],"a":3,"e":"Art. 7.5 RD 339/2021: en zona 1 la flotabilidad mínima es de 275 N (150 N en zonas 2-4 y 100 N en zonas 5-7)."},{"id":"2026abr-1-18","t":12,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"De acuerdo con el Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, quedan excluidos del ámbito de aplicación de este Real Decreto:","o":["Las embarcaciones que desarrollen una actividad con fines comerciales en aguas marítimas en las que España ejerce soberanía.","Las embarcaciones que estén preinscritas en España.","Las embarcaciones de regatas destinadas exclusivamente a la competición.","Las embarcaciones propiedad de personas jurídicas con domicilio social en España que naveguen por las aguas interiores marítimas españolas o el mar territorial español."],"a":2,"e":"Art. 2.2.b: quedan excluidas las embarcaciones de regatas con sus propias normas y destinadas exclusivamente a la competición."},{"id":"2026abr-1-19","t":13,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"En relación con las categorías de diseño establecidas en el Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, ¿qué condiciones definen la Categoría A?","o":["Navegación limitada a 12 millas de la costa.","Navegación con vientos de hasta fuerza 4 incluido y altura significativa de ola superior a 2 metros.","Navegación en aguas protegidas y lagos.","Navegación con vientos de fuerza superior a 8 y altura significativa de ola superior a 4 metros."],"a":3,"e":"Anexo I.A.1 RD 98/2016: categoría A, viento superior a fuerza 8 y ola significativa superior a 4 metros."},{"id":"2026abr-1-20","t":14,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"De acuerdo con el Capítulo III – “Derecho de los salvadores” del Convenio Internacional sobre Salvamento Marítimo de 1989, ¿tiene el salvador derecho a una recompensa si NO se ha logrado un resultado útil?","o":["Sí, siempre se cobra por el tiempo empleado.","No, en ningún caso se recibe nada si el buque no se salva.","No, salvo lo dispuesto en relación con la protección del medio ambiente (compensación especial).","Sí, pero solo el 50% de los gastos."],"a":2,"e":"Arts. 12 y 14 Convenio de Salvamento 1989: sin resultado útil no hay recompensa, salvo la compensación especial por proteger el medio ambiente."},{"id":"2026abr-1-21","t":14,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Según el Convenio SAR de 1979, ¿cuál es el objetivo principal de un Centro Coordinador de Salvamento?","o":["Promover la buena organización de los servicios de búsqueda y salvamento.","Imponer sanciones a los buques que no presten auxilio.","Realizar el mantenimiento de los faros y señales de seguridad.","Regular el tráfico que afecta a la seguridad de los puertos comerciales."],"a":0,"e":"SAR 1979: el centro coordinador de salvamento se encarga de promover la buena organización de los servicios de búsqueda y salvamento y de coordinar las operaciones en su región."},{"id":"2026abr-1-22","t":15,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"De acuerdo con la Ley 14/2014, de Navegación Marítima, ¿un buque puede estar simultáneamente matriculado en el Registro de Buques y Empresas Navieras y en el Registro de Buques de otro u otros Estados?","o":["Sí, en todo caso.","No, salvo en los supuestos de abanderamiento temporal contemplados en la Ley 14/2014.","No, en todo caso.","Sí, salvo en los supuestos de abanderamiento temporal contemplados en la Ley 14/2014."],"a":1,"e":"Art. 91.1 Ley 14/2014: no puede haber doble matrícula, salvo en los supuestos de abanderamiento temporal."},{"id":"2026abr-1-23","t":15,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"De acuerdo con la Ley 14/2014, de Navegación Marítima, el Certificado de Matrícula acredita que el buque está legalmente matriculado en España y deberá exhibirse a petición de las autoridades competentes de:","o":["La Administración Marítima nacional.","La Guardia Civil.","La Policía Portuaria.","Los servicios de guardacostas."],"a":0,"e":"Art. 79 Ley 14/2014: se exhibe a petición de las autoridades de la Administración Marítima nacional (y de las del Estado ribereño o del puerto)."},{"id":"2026abr-1-24","t":16,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Un pasajero francés otorga testamento ológrafo mientras viaja en un crucero con bandera de Italia que se encuentra en aguas territoriales de Grecia. Según el principio de la ley del pabellón, ¿bajo qué requisitos de forma debe redactarse el testamento para ser válido en España?","o":["Debe cumplir con las formas exigidas por la ley francesa, ya que el pasajero es francés.","Debe cumplir con las formas exigidas por la ley italiana (Estado de abanderamiento), ya que el acto se reputa celebrado en territorio italiano.","Debe cumplir con las formas exigidas por la ley griega, ya que el crucero se encuentra en aguas territoriales griegas.","No será necesario ningún requisito, el pasajero francés tendrá que esperar a volver a Francia y redactar testamento ante Notario."],"a":1,"e":"Art. 11.1 Código Civil: el acto otorgado a bordo durante la navegación se entiende celebrado en el país del abanderamiento (Italia), sea cual sea la nacionalidad del pasajero o las aguas donde esté el buque."},{"id":"2026abr-1-25","t":17,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"En el marco del Real Decreto 128/2022, ¿qué se entiende por \"desechos de buques\"?","o":["Únicamente los residuos generados durante el servicio del buque definidos en el Convenio MARPOL.","Solo los residuos de carga y los lodos de depuradora.","Todos los desechos, incluidos los residuos de carga, los desechos generados durante el servicio del buque y los desechos pescados de forma no intencionada.","Exclusivamente los residuos sólidos urbanos generados por la tripulación."],"a":2,"e":"Art. 2.i RD 128/2022: desechos de buques son los generados por el buque, los residuos de carga y los desechos pescados de manera no intencionada."},{"id":"2026abr-1-26","t":17,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"Bajo el Real Decreto 128/2022, ¿quién es el responsable de sufragar los costes de las instalaciones portuarias receptoras mediante el pago de una tarifa indirecta?","o":["Exclusivamente los buques que decidan usar la instalación.","Solo los buques que transporten mercancías peligrosas.","Todos los buques que hagan escala en el puerto, independientemente de que utilicen o no las instalaciones.","El Estado, a través de los Presupuestos Generales."],"a":2,"e":"Art. 18.2.a RD 128/2022: todos los buques que hacen escala pagan la tarifa indirecta, entreguen o no desechos."},{"id":"2026abr-1-27","t":18,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"De acuerdo con la Regla 8 “Duración y validez del certificado”, del Anexo IV “Reglas para prevenir la contaminación por las aguas sucias” del Convenio Internacional para Prevenir la Contaminación por los Buques (Convenio MARPOL 73/78), el Certificado Internacional de Prevención de la Contaminación por Aguas Sucias se expedirá para un período que especificará la Administración y que no excederá de...","o":["Dos años.","Tres años.","Cuatro años.","Cinco años."],"a":3,"e":"Anexo IV, regla 8.1: el certificado se expide por el periodo que fije la Administración, que no excederá de cinco años."},{"id":"2026abr-1-28","t":18,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"De acuerdo con la Regla 2 “Ámbito de aplicación”, del Anexo IV “Reglas para prevenir la contaminación por las aguas sucias” del Convenio Internacional para Prevenir la Contaminación por los Buques (Convenio MARPOL 73/78), las disposiciones del citado Anexo IV NO se aplicarán a…","o":["los buques nuevos de arqueo bruto inferior a 400 que estén autorizados a transportar hasta un máximo de 15 personas.","los buques nuevos de arqueo bruto igual o superior a 400.","los buques nuevos de arqueo bruto inferior a 400 que estén autorizados a transportar más de 15 personas.","los buques nuevos de arqueo bruto de 500 que estén autorizados a transportar más de 15 pasajeros."],"a":0,"e":"Anexo IV, regla 2: se aplica a buques de 400 GT o más y a los de menos de 400 autorizados a llevar más de 15 personas; no a los de menos de 400 con 15 personas o menos."},{"id":"2026abr-1-29","t":19,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"De acuerdo con el Real Decreto 1185/2006, por el que se aprueba el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, en su Capítulo I, Sección 4ª, ¿dónde deberá estar instalada la radiobaliza de localización de siniestros en un buque nacional?","o":["En el camarote del capitán o patrón.","En un mástil.","En la misma cubierta del puente de navegación, fuera de él y cercana al mismo, cerca de la puerta de salida a los alerones.","En cualquier lugar en el que solo pueda alcanzarse mediante una escalera vertical."],"a":2,"e":"Art. 22.1.a RD 1185/2006: en la misma cubierta del puente, fuera de él y cerca, junto a la puerta de salida a los alerones; nunca donde solo se llegue con escalera vertical."},{"id":"2026abr-1-30","t":19,"src":"oficial","conv":"2026abr","convName":"Abril 2026","q":"De conformidad con el Real Decreto 1185/2006, por el que se aprueba el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, en su Capítulo I, Sección 2ª, la zona marítima comprendida entre cualquier punto del litoral mediterráneo y sur peninsulares y los puertos de Ceuta o Melilla, así como la zona marítima entre islas del archipiélago canario o balear, se considera a todos los efectos como zona marítima:","o":["A1.","A2.","A3.","A4."],"a":0,"e":"Art. 4.2.a RD 1185/2006: esa zona se considera a todos los efectos zona marítima A1."},{"id":"2025nov-1-01","t":1,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, navegar sin sistemas de señalización reglamentariamente establecidos que permitan la localización y visualización permanente de la embarcación destinada a usos de transporte, pesca o de recreo:","o":["Es una infracción leve.","Es una infracción grave.","Es una infracción muy grave.","No está contemplado como infracción en el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante."],"a":1,"e":"Art. 307.3.o: navegar sin los sistemas de señalización para la localización y visualización permanente es infracción grave contra la ordenación del tráfico marítimo."},{"id":"2025nov-1-02","t":1,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, un buque atracado, amarrado o fondeado, se considerará abandonado cuando:","o":["Permanezca más de dos meses en el mismo lugar dentro del puerto sin actividad apreciable exteriormente y sin haber abonado las correspondientes tasas o tarifas.","Permanezca más de dos meses en el mismo lugar dentro del puerto sin actividad apreciable exteriormente o no haber abonado las correspondientes tasas o tarifas.","Permanezca más de tres meses en el mismo lugar dentro del puerto sin actividad apreciable exteriormente y sin haber abonado las correspondientes tasas o tarifas, y así lo declare el Consejo de Administración de la Autoridad Portuaria.","Permanezca más de tres meses en el mismo lugar dentro del puerto sin actividad apreciable exteriormente o no haber abonado las correspondientes tasas o tarifas, o así lo declare la Dirección General de la Marina Mercante."],"a":2,"e":"Art. 302.2: más de tres meses, sin actividad apreciable Y sin pagar tasas, y declaración del Consejo de Administración de la Autoridad Portuaria."},{"id":"2025nov-1-03","t":2,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según la Ley 14/2014, de Navegación Marítima, los sistemas de tráfico marítimo sólo podrán ser de empleo obligatorio cuando estén emplazados:","o":["En las aguas con una densidad de tráfico elevada.","En las aguas interiores marítimas o en el mar territorial.","En la zona económica exclusiva, siempre que estén aprobados por la Dirección General de la Marina Mercante.","En la zona contigua."],"a":1,"e":"Art. 30.3: los sistemas de tráfico marítimo solo pueden ser obligatorios en aguas interiores o mar territorial (y en la ZEE si lo aprueba la OMI)."},{"id":"2025nov-1-04","t":2,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según la Ley 14/2014, de Navegación Marítima, ¿cómo se denomina al buque que ha quedado amarrado, varado o fondeado en un lugar fijo, y destinado, con carácter permanente, a actividades distintas de la navegación?","o":["Embarcación.","Plataforma fija.","Artefacto Naval.","Vehículo."],"a":2,"e":"Art. 58.2: el buque que queda amarrado, varado o fondeado en un lugar fijo y se destina permanentemente a otras actividades es un artefacto naval."},{"id":"2025nov-1-05","t":3,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, el Plan Nacional de Servicios Especiales de Salvamento de la vida humana en la mar y de la lucha contra la contaminación del medio marino será aprobado por:","o":["La Directora General de la Marina Mercante.","El Ministro de Fomento, a propuesta de la Directora General de la Marina Mercante.","El Ministro de Fomento.","El Gobierno, a propuesta del Ministro de Fomento."],"a":3,"e":"Art. 264.2 TRLPEMM: el Plan Nacional lo aprueba el Gobierno a propuesta del Ministro (el texto aún dice Fomento)."},{"id":"2025nov-1-06","t":4,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según el Real Decreto 638/2007, por el que se regulan las Capitanías Marítimas y los Distritos Marítimos, ¿quién dirige las actuaciones de la Sociedad de Salvamento y Seguridad Marítima en el ámbito de las Capitanías Marítimas?","o":["La Directora General de la Marina Mercante.","El Director de Salvamento Marítimo.","El Capitán Marítimo correspondiente.","El Coordinador Nacional de Salvamento."],"a":2,"e":"Art. 7.2 RD 638/2007: los servicios de SASEMAR en el ámbito de una Capitanía se prestan bajo la dirección y las instrucciones del Capitán Marítimo correspondiente."},{"id":"2025nov-1-07","t":5,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con el Real Decreto 186/2023, por el que se aprueba el Reglamento de Ordenación de la Navegación Marítima, el Rol de despacho y dotación es:","o":["Un certificado estatutario del buque o embarcación.","Un documento personal del marino.","Un título habilitante para el manejo de embarcaciones de recreo en distancias próximas a la costa.","El documento exigido a los buques y embarcaciones de pabellón español que acredita el viaje que está realizando, así como el hecho de que lo ha emprendido previo cumplimiento de todos los requisitos legales y reglamentarios para su despacho."],"a":3,"e":"Art. 19.1 RD 186/2023: es el documento exigido a los buques de pabellón español que acredita el viaje que realiza y que lo emprendió tras cumplir los requisitos de despacho."},{"id":"2025nov-1-08","t":6,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con el Real Decreto 1837/2000, por el que se aprueba el Reglamento de inspección y certificación de buques civiles, la comunicación, en caso de que el buque se encuentre en navegación, de todas las averías, y accidentes de consideración, así como los defectos descubiertos y las prácticas de reparación del buque y de sus equipos que afecten a la seguridad del buque, de la vida humana en el mar o de la navegación o que puedan significar un riesgo de contaminación del medio ambiente marino, deberá realizarse:","o":["Al Jefe del Distrito del primer puerto al que vaya a arribar, en el caso de que el buque sea español.","A las autoridades indicadas del primer puerto al que vaya a arribar y siempre con anterioridad a la arribada a dicho puerto.","Al Presidente de Puertos del Estado, antes de arribar al primer puerto, en el caso de que el buque sea extranjero.","A la Dirección General de la Marina Mercante y a las autoridades marítimas competentes del puerto en cuestión, si éste es español."],"a":1,"e":"Art. 14.2 RD 1837/2000: con el buque navegando, la comunicación se hace a las autoridades del primer puerto de arribada y siempre antes de llegar a él."},{"id":"2025nov-1-09","t":7,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según el Capítulo IV del Real Decreto 62/2008, por el que se aprueba el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, cuando se celebren pruebas de remo, vela infantil, clase optimist, vela iniciación, cadete, vela ligera o similares, además de las medidas de seguridad que se regulan en este reglamento, se deberá establecer un número adecuado de embarcaciones de auxilio o apoyo a las embarcaciones participantes; no debiendo bajar la citada relación de:","o":["Una embarcación de apoyo por cada cuarenta participantes.","Una embarcación de apoyo por cada treinta participantes.","Una embarcación de apoyo por cada veinte participantes.","Una embarcación de apoyo por cada diez participantes."],"a":3,"e":"Art. 15.5: en remo, vela infantil, optimist, iniciación, cadete o vela ligera, al menos una embarcación de apoyo por cada diez participantes."},{"id":"2025nov-1-10","t":7,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con el Real Decreto 62/2008, por el que se aprueba el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, las regatas internacionales organizadas por instituciones internacionales o nacionales de reconocido prestigio, deberán de poner en conocimiento de los capitanes marítimos, la fecha de iniciación, calendario previsto, características y número de embarcaciones participantes y descripción de las derrotas, antes del comienzo de la regata con una antelación de al menos:","o":["15 días.","10 días.","No hay un plazo específico.","Lo determina el Capitán Marítimo competente por razón del puerto de origen."],"a":0,"e":"Art. 17: los organizadores de regatas internacionales informan a los capitanes marítimos al menos 15 días antes del comienzo."},{"id":"2025nov-1-11","t":8,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques, ¿es obligatorio asignar a las embarcaciones de recreo un nombre?","o":["No en ningún caso.","Sí, en todo caso.","Sí, para las que tengan un motor de 150 KW.","Sí, para las de eslora superior a 12 metros."],"a":3,"e":"Art. 7.1 RD 1435/2010: obligatorio para las de eslora superior a 12 metros y potestativo para las de 12 metros o menos."},{"id":"2025nov-1-12","t":8,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según el Real Decreto 685/2010, por el que se regula el otorgamiento del permiso temporal de navegación para determinadas embarcaciones de recreo, ¿se requiere de titulación para el gobierno de una embarcación de recreo, la cual dispone de un permiso temporal de navegación?","o":["No, no se requiere siempre que se realicen actividades de exhibición en aguas interiores marítimas y mar territorial.","No, no se requiere en ningún caso.","Sí, se requiere la titulación profesional náutica o la titulación náutico- deportiva adecuada a la eslora de la embarcación y a la distancia de navegación.","Sí, siempre que se alejen más de 3 millas de la costa."],"a":2,"e":"Art. 8.1 RD 685/2010: el gobierno exige titulación profesional náutica o náutico-deportiva adecuada a la eslora y a la distancia de navegación."},{"id":"2025nov-1-13","t":9,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según el Real Decreto 607/1999, que regula el seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas, ¿se considera infracción la navegación sin el seguro?","o":["Sí, infracción leve.","Sí, infracción grave.","Sí, infracción muy grave.","No, no se considera infracción."],"a":1,"e":"Art. 5: la navegación sin el seguro obligatorio es infracción grave."},{"id":"2025nov-1-14","t":10,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según dispone el Real Decreto 269/2022, por el que se regulan los títulos profesionales y de competencia de la Marina Mercante (Artículo 86.3), todo miembro de la dotación respetará el límite de 0,05 % de nivel de alcohol en sangre, o 0,25 mg/l de alcohol en aliento, o una cantidad de alcohol que lleve a dicha concentración desde:","o":["Dos horas antes al inicio del desempeño de sus funciones, cualesquiera que éstas sean, hasta su finalización.","Seis horas antes al inicio del desempeño de sus funciones, cualesquiera que éstas sean, hasta su finalización.","Doce horas antes al inicio del desempeño de sus funciones, cualesquiera que éstas sean, hasta su finalización.","Cuatro horas antes al inicio del desempeño de sus funciones, cualesquiera que éstas sean, hasta su finalización."],"a":3,"e":"Art. 86.3 RD 269/2022: el límite rige desde cuatro horas antes del inicio de las funciones hasta su finalización."},{"id":"2025nov-1-15","t":10,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con lo establecido en el Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, las inspecciones necesarias al objeto de comprobar la veracidad de la información aportada y el cumplimiento de los requisitos exigidos en este real decreto serán realizadas exclusivamente por:","o":["Las Entidades Colaboradoras de Inspección.","La Dirección General de la Marina Mercante y las Entidades Colaboradoras de Inspección.","La Dirección General de la Marina Mercante.","La Dirección General de la Marina Mercante y funcionarios autorizados de las Comunidades Autónomas."],"a":2,"e":"Art. 37.1 RD 875/2014: la DGMM realiza las inspecciones; no las entidades colaboradoras ni las Comunidades Autónomas."},{"id":"2025nov-1-16","t":11,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según el Real Decreto 1434/1999, por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo para garantizar la seguridad de la vida humana en la mar y se determinan las condiciones que deben reunir las entidades colaboradoras de inspección, una inspección del casco en seco y del equipo, acompañada de pruebas cuando sea necesario, a fin de garantizar que se cumplen las prescripciones que se especifican en el Certificado de navegabilidad y que su estado es satisfactorio e idóneo para el servicio de la embarcación, deberá realizarse reglamentariamente siempre en el reconocimiento:","o":["Inicial.","Periódico.","Adicional.","Extraordinario."],"a":1,"e":"Art. 3.B.1: la inspección del casco en seco y del equipo con pruebas forma parte del reconocimiento periódico."},{"id":"2025nov-1-17","t":12,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, en las embarcaciones de recreo con motores que utilicen combustible GLP ¿cuál es la norma técnica que indica los requisitos que debe cumplir el sistema de detección de gas a instalar en el compartimento interior de cada motor y de cada espacio de almacenamiento de combustible?","o":["UNE-EN ISO 11105:2020 o, en su caso, la norma técnica armonizada que la sustituya.","UNE-EN 24565:1992 o, en su caso, la norma técnica armonizada que la sustituya.","UNE-EN 15609:2012 o, en su caso, la norma técnica armonizada que la sustituya.","UNE-EN ISO 16315: 2016 o, en su caso, la norma técnica armonizada que la sustituya."],"a":2,"e":"Art. 17.2: el sistema de detección de gas con motores de GLP cumplirá la UNE-EN 15609:2012."},{"id":"2025nov-1-18","t":12,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, respecto de los medios de achique, la capacidad de las bombas no debe ser menor de (a una presión de 10kPa):","o":["15 Litros por minuto para 6 \u003c L \u003c 12 m.","5 Litros por minuto para L \u003c= 6 m.","10 Litros por minuto para 6 \u003c L \u003c 12 m.","25 Litros por minuto para L >= 12 m."],"a":0,"e":"Art. 20.2: 10 l/min para L ≤ 6 m, 15 l/min para 6 &lt; L &lt; 12 m y 30 l/min para L ≥ 12 m."},{"id":"2025nov-1-19","t":13,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con el Anexo II del Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, señale cuál de los siguientes componentes NO se contempla en dicho Anexo:","o":["Timones, mecanismos de dirección y conjuntos de cables.","Escotillas y portillos prefabricados.","Depósitos de combustible destinados a instalaciones fijas y conductos de combustible.","Hornillos portátiles, aires acondicionados y microondas."],"a":3,"e":"Anexo II RD 98/2016: solo cinco componentes (protección contra el fuego, antiarranque con marcha, timones y dirección, depósitos y conductos, escotillas y portillos). Hornillos, aires y microondas no figuran."},{"id":"2025nov-1-20","t":14,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con el Real Decreto Legislativo 2/2011, por el que se aprueba el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, indique cuál de las siguientes actividades NO se incluye como funciones de la Sociedad de Salvamento y Seguridad Marítima:","o":["La inspección de la seguridad de los buques.","La ayuda al tráfico marítimo.","El seguimiento del tráfico marítimo.","La prevención y lucha contra la contaminación marina."],"a":0,"e":"Art. 268.1 TRLPEMM: la inspección de la seguridad de los buques no está en el objeto de SASEMAR (sí la ayuda y el seguimiento del tráfico y la lucha contra la contaminación)."},{"id":"2025nov-1-21","t":14,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con el Real Decreto Legislativo 2/2011, por el que se aprueba el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, la Sociedad de Salvamento y Seguridad Marítima en operaciones de lucha contra la contaminación:","o":["No podrá reclamar los gastos derivados de la lucha contra la contaminación.","Necesitará autorización judicial previa para ejecutar cualquier aval relacionado con gastos por contaminación marítima.","Estará facultada para reclamar los costes ocasionados directamente de quien los haya ocasionado.","Podrá actuar si previamente ha sido contratada por el armador del buque contaminante."],"a":2,"e":"Art. 268.4 TRLPEMM: SASEMAR puede reclamar los costes de las medidas contra la contaminación directamente de quien los haya ocasionado."},{"id":"2025nov-1-22","t":15,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con la Ley 14/2014, de Navegación Marítima, los Diarios de Navegación, Cuadernos de Bitácora y de Máquinas deberán conservarse a bordo tras practicarse el último asiento durante:","o":["1 mes.","3 meses.","6 meses.","1 año."],"a":3,"e":"Art. 86.1 Ley 14/2014: los libros se conservan durante un año a partir del último asiento."},{"id":"2025nov-1-23","t":15,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con el artículo 128 de la Ley 14/2014, para que la hipoteca naval quede válidamente constituida:","o":["Deberá ser otorgada en escritura pública, en póliza intervenida por notario o en documento privado y podrá inscribirse en el Registro de Bienes Muebles.","Podrá ser otorgada en escritura pública, en póliza intervenida por notario o en documento privado y deberá inscribirse en el Registro de Bienes Inmuebles.","Podrá ser otorgada en escritura pública, en póliza intervenida por notario o en documento privado y deberá inscribirse en el Registro de Bienes Muebles.","Deberá ser otorgada en escritura pública, en póliza intervenida por notario o en documento privado y deberá inscribirse en el Registro de Bienes Inmuebles."],"a":2,"e":"Art. 128 Ley 14/2014: «podrá» otorgarse en escritura, póliza notarial o documento privado y «deberá» inscribirse en el Registro de Bienes Muebles."},{"id":"2025nov-1-24","t":16,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"Según lo dispuesto en el artículo 730 del Código Civil, los testamentos, abiertos y cerrados, otorgados con arreglo a lo prevenido en la Sección 8ª Del testamento marítimo:","o":["No caducarán.","Caducarán pasado 1 año, contado desde el momento en que el testador desembarque en un punto donde pueda testar en la forma ordinaria.","Caducarán pasados 4 meses, contados desde el momento en que el testador desembarque en un punto donde pueda testar en la forma ordinaria.","Caducarán pasados 2 años, contados desde el momento en que el testador desembarque en un punto donde pueda testar en la forma ordinaria."],"a":2,"e":"Art. 730 Código Civil: caducan a los cuatro meses desde que el testador desembarque en un punto donde pueda testar en la forma ordinaria."},{"id":"2025nov-1-25","t":17,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con las definiciones del Real Decreto 128/2022, sobre instalaciones portuarias receptoras de desechos de buques, ¿qué sistema debe utilizarse para las comunicaciones electrónicas relacionadas con la entrega de desechos?","o":["AIS (Automatic Identification System).","GISIS.","SafeSeaNet.","VTS (Vessel Traffic Services)."],"a":2,"e":"Art. 27.1 RD 128/2022: las comunicaciones e intercambio de información se basan en SafeSeaNet."},{"id":"2025nov-1-26","t":17,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"¿Qué buques están excluidos del ámbito de aplicación del Real Decreto 128/2022, sobre instalaciones portuarias receptoras de desechos de buques?","o":["Buques de recreo.","Buques de Estado y buques afectos a la prestación de servicios portuarios.","Buques pesqueros.","Buques mercantes de bandera extranjera."],"a":1,"e":"Art. 3.1.a RD 128/2022: se excluyen los buques de Estado y los afectos a la prestación de servicios portuarios."},{"id":"2025nov-1-27","t":18,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con la regla 1 “Definiciones”, del Anexo IV “Reglas para prevenir la contaminación por las aguas sucias” del Convenio Internacional para Prevenir la Contaminación por los Buques (Convenio MARPOL 73/78), por aguas sucias NO se entiende…","o":["Desagües y otros residuos, procedentes de cualquier tipo de inodoros y urinarios.","Desagües procedentes de espacios en que se transporten animales vivos.","Desagües procedentes de lavabos, lavaderos y conductos de salida situados en cámaras de servicios médicos (dispensario, hospital, etc.).","Desagües procedentes de los espacios de máquinas."],"a":3,"e":"Anexo IV, regla 1.3: los desagües de los espacios de máquinas no son aguas sucias."},{"id":"2025nov-1-28","t":18,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con la regla 2 “Ámbito de aplicación”, del Anexo V “Reglas para prevenir la contaminación por las basuras de los buques” del Convenio Internacional para Prevenir la Contaminación por los Buques (Convenio MARPOL 73/78), las disposiciones del citado Anexo V se aplicarán a…","o":["Buques mayores de 500 GT que realicen viajes internacionales.","Todos los buques, a menos que se disponga expresamente otra cosa.","Buques mayores de 400 GT que transporten más de 15 personas a bordo.","Buques mayores de 500 GT que transporten más de 12 pasajeros."],"a":1,"e":"Anexo V, regla 2: salvo disposición expresa en contrario, se aplica a todos los buques."},{"id":"2025nov-1-29","t":19,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con el Real Decreto 1185/2006, por el que se aprueba el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, las embarcaciones de recreo autorizadas a navegar por la zona de navegación 4, deben ir provistas como mínimo del siguiente equipamiento radioeléctrico:","o":["Una radiobaliza de 406 MHz, de activación automática y manual o únicamente manual.","Un receptor NAVTEX.","Una instalación radiotelefónica de VHF de tipo portátil.","Una instalación radiotelefónica de VHF de tipo fijo."],"a":3,"e":"Art. 59 RD 1185/2006: en zona 4, como mínimo, una instalación radiotelefónica de VHF de tipo fijo."},{"id":"2025nov-1-30","t":19,"src":"oficial","conv":"2025nov","convName":"Noviembre 2025","q":"De acuerdo con el Real Decreto 1185/2006, por el que se aprueba el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, la Licencia de Estación de Barco (LEB) para un buque de pesca de eslora menor de 24 metros tendrá un período de validez:","o":["De dos años.","Indefinida.","De cuatro años.","De cinco años."],"a":1,"e":"Art. 7.2 RD 1185/2006: la LEB dura 5 años en pesqueros de 24 m o más; para los menores de 24 m es indefinida."},{"id":"2025abr-1-01","t":1,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, ¿qué tipo de navegación se reconoce en función de su ámbito?","o":["Regular y no regular.","Marítima y fluvial.","Interior, de cabotaje, exterior y extranacional.","Recreativa, comercial, pesquera y mercante."],"a":2,"e":"Art. 8.2: por su ámbito la navegación es interior, de cabotaje, exterior y extranacional. Regular/no regular es la clasificación por condiciones de prestación (8.3)."},{"id":"2025abr-1-02","t":1,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, ¿quién es la Autoridad competente para la toma de decisiones respecto de los buques necesitados de asistencia, cuando por su propia situación o por circunstancias externas supongan una amenaza para la navegación?","o":["El Director de Salvamento Marítimo.","El Director de la Autoridad Portuaria.","El Director General de la Marina Mercante.","El Capitán Marítimo."],"a":2,"e":"Art. 299.1: el Director General de la Marina Mercante es la autoridad competente para los buques necesitados de asistencia."},{"id":"2025abr-1-03","t":2,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Según la Ley 14/2014, de Navegación Marítima, ¿a quién corresponde ordenar el cierre temporal de puertos y terminales a la navegación de buques?","o":["A la Dirección General de la Marina Mercante.","A la Capitanía Marítima.","A la Autoridad Portuaria correspondiente, previo informe de la Capitanía Marítima.","Al Distrito Marítimo."],"a":2,"e":"Art. 8.1: la Autoridad Portuaria ordena el cierre temporal de puertos y terminales, previo informe de la Capitanía Marítima."},{"id":"2025abr-1-04","t":2,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Según la Ley 14/2014, de Navegación Marítima, la plataforma fija tiene la consideración de:","o":["Bien mueble con arreglo al Código Civil.","Bien de dominio público con arreglo al Código Civil.","Bien inmueble con arreglo al Código Civil.","Bien de propiedad privada con arreglo al Código Civil."],"a":2,"e":"Art. 59.2: por estar permanentemente sujeta al fondo, la plataforma fija es bien inmueble con arreglo al Código Civil."},{"id":"2025abr-1-05","t":3,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Según el Real Decreto 253/2024, por el que se desarrolla la estructura orgánica básica del Ministerio de Transportes y Movilidad Sostenible, el órgano competente para la ordenación general de la navegación marítima y de la flota civil española es:","o":["El Gobierno, a propuesta del Ministro de Transportes y Movilidad Sostenible.","La Secretaría General de Transportes Aéreo y Marítimo.","La Capitanía Marítima.","La Dirección General de la Marina Mercante."],"a":3,"e":"Art. 9.1 RD 253/2024: la Dirección General de la Marina Mercante es el órgano competente para la ordenación general de la navegación marítima y de la flota civil española."},{"id":"2025abr-1-06","t":4,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, en relación a la administración periférica, en aquellos puertos, o grupos de puertos, en los que se desarrolle un determinado nivel de actividades de navegación o lo requieran las condiciones de tráfico, seguridad o protección marítima, existirá:","o":["Una torre de control marítimo.","Una Capitanía Marítima.","Una Autoridad Portuaria.","Una Comandancia de Marina."],"a":1,"e":"Art. 266.1 TRLPEMM: en esos puertos o grupos de puertos existirá una Capitanía Marítima."},{"id":"2025abr-1-07","t":5,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Según el Real Decreto 186/2023, por el que se aprueba el Reglamento de Ordenación de la Navegación Marítima, ¿en cuál de las siguientes circunstancias necesita siempre un buque autorización expresa para su entrada en los espacios marítimos españoles?","o":["Cuando se sujete al régimen de paso inocente, en navegación lateral.","Cuando se dirija a puerto, una vez cumplimentado procedimiento integrado de escala.","Cuando el buque haya sufrido una inundación y tenga que entrar urgentemente en aguas interiores.","Cuando se trate de una navegación en los espacios marítimos españoles en los que exista libertad de navegación."],"a":2,"e":"Art. 28.c RD 186/2023: requieren autorización expresa los buques con avería, corrimiento de carga, incendio o inundación. Las otras tres opciones son casos de autorización tácita (art. 27)."},{"id":"2025abr-1-08","t":6,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Según Real Decreto 1837/2000, por el que se aprueba el Reglamento de inspección y certificación de buques civiles, ¿en cuántos grupos se divide la Clasificación Nacional de Buques?","o":["6.","4.","5.","8."],"a":2,"e":"Art. 4 RD 1837/2000: cinco grupos (pasaje, carga, servicios de puerto, pesqueros y recreo)."},{"id":"2025abr-1-09","t":7,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con el Real Decreto 62/2008, por el que se aprueba el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, ¿a quién le corresponde la función de, adoptar las medidas precisas para prevenir, en su caso, la contaminación marítima producida por las embarcaciones participantes en el evento, de acuerdo con la normativa aplicable al respecto?","o":["Al Coordinador de Seguridad.","Al Capitán Marítimo.","A la Entidad Organizadora.","Al Patrón de la Embarcación."],"a":2,"e":"Art. 7.7: la entidad organizadora debe adoptar las medidas para prevenir la contaminación producida por las embarcaciones participantes."},{"id":"2025abr-1-10","t":7,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con el Real Decreto 62/2008, por el que se aprueba el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, ¿con cuántos días de antelación y de qué modo la entidad organizadora debe comunicar la celebración de la concentración náutica a la capitanía marítima en cuyas aguas vaya a tener lugar el evento?","o":["Al menos con 30 días de antelación a la celebración de la concentración náutica y por escrito indicando la fecha y hora previstas tanto de su inicio como de su finalización.","Al menos con 15 días de antelación a la celebración de la concentración náutica y de manera expresa, indicando la fecha y hora previstas de su inicio, así como de su recorrido.","Con 15 días de antelación a la celebración de la concentración náutica y de forma verbal.","Al menos con 30 días de antelación a la celebración de la concentración náutica y de forma verbal."],"a":0,"e":"Art. 7.1: por escrito, al menos 30 días antes, indicando fecha y hora previstas de inicio y de finalización."},{"id":"2025abr-1-11","t":8,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Según el Real Decreto 685/2010, por el que se regula el otorgamiento del permiso temporal de navegación para determinadas embarcaciones de recreo, ¿quién establece el número de tripulantes para estas embarcaciones, en función del tamaño y tipo de embarcación, la zona de navegación y la duración de ésta?","o":["El propietario de la embarcación.","La Dirección General de la Marina Mercante.","El capitán de la embarcación.","El constructor, fabricante o distribuidor autorizado de la embarcación."],"a":1,"e":"Art. 8.2 RD 685/2010: la Dirección General de la Marina Mercante establece el número de tripulantes."},{"id":"2025abr-1-12","t":8,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Según el Real Decreto 685/2010, por el que se regula el otorgamiento del permiso temporal de navegación para determinadas embarcaciones de recreo, ¿quién es responsable de iniciar el procedimiento para la obtención de dicho permiso?","o":["La Dirección General de la Marina Mercante.","La razón social o el representante legal del salón náutico responsable de la exhibición.","El capitán de la embarcación.","La empresa importadora, constructora, concesionaria o distribuidora."],"a":3,"e":"Art. 2.1 RD 685/2010: el procedimiento se inicia a instancia de la empresa importadora, constructora, concesionaria o distribuidora."},{"id":"2025abr-1-13","t":9,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Según el Real Decreto 607/1999, que regula el seguro de responsabilidad civil de suscripción obligatoria para embarcaciones de recreo o deportivas, la cobertura del seguro de responsabilidad civil de suscripción obligatoria comprenderá:","o":["La muerte o lesiones sufridas por personas transportadas que efectúen pagos para el crucero o viaje.","La muerte o lesiones sufridas por el patrón o piloto de la embarcación.","Los daños sufridos por la embarcación asegurada.","Daños materiales a terceros."],"a":3,"e":"Art. 6.1.b: cubre los daños materiales a terceros. Las otras opciones son exclusiones del art. 7."},{"id":"2025abr-1-14","t":10,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con las definiciones dispuestas en el Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, si con nuestra embarcación arribamos a un lugar donde nos podemos refugiar fácilmente y desde este podemos llegar a tierra, nos referimos a:","o":["Una dársena.","Un fondeadero.","Un lugar de abrigo.","Una bahía."],"a":2,"e":"Art. 3.5 RD 875/2014: lugar de abrigo es aquel en el que fácilmente puede refugiarse una embarcación y permitir la llegada a tierra de sus ocupantes."},{"id":"2025abr-1-15","t":10,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Respecto a lo dispuesto en el Real Decreto 875/2014, por el que se regulan las titulaciones náuticas para el gobierno de las embarcaciones de recreo, para la realización de las prácticas destinadas a obtener la licencia de navegación, las embarcaciones de prácticas estarán equipadas, además de con todo aquel material necesario para la correcta impartición de las prácticas, como mínimo de acuerdo con las exigencias de la siguiente zona de navegación:","o":["2.","3.","4.","5."],"a":3,"e":"Art. 33.2.1.º RD 875/2014: para la licencia de navegación, como mínimo las exigencias de la zona 5."},{"id":"2025abr-1-16","t":11,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Regulado en el Real Decreto 1434/1999, por el que se establecen los reconocimientos e inspecciones de las embarcaciones de recreo para garantizar la seguridad de la vida humana en la mar y se determinan las condiciones que deben reunir las entidades colaboradoras de inspección, podremos encontrar:","o":["El Certificado de Seguridad.","El Certificado de Navegabilidad.","El Documento de Cumplimiento.","El Certificado de Inspección."],"a":1,"e":"Art. 4 RD 1434/1999: el certificado de navegabilidad acredita los reconocimientos de la embarcación."},{"id":"2025abr-1-17","t":12,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con el Real Decreto 339/2021, por el que se regula el equipo de seguridad y de prevención de la contaminación de las embarcaciones de recreo, las embarcaciones de recreo deberán disponer de una línea de fondeo cuya longitud no podrá ser inferior a:","o":["Tres veces la eslora de la embarcación.","Cinco veces la eslora de la embarcación.","Como mínimo igual a la eslora de la embarcación.","Dos veces la eslora de la embarcación."],"a":1,"e":"Art. 11.1: la línea de fondeo no puede ser inferior a cinco veces la eslora."},{"id":"2025abr-1-19","t":13,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con el Artículo 6, del Real Decreto 98/2016, por el que se regulan los requisitos de seguridad, técnicos y de comercialización de las motos náuticas, embarcaciones deportivas y sus componentes, ¿qué organismo tiene el carácter de ‘Autoridad Notificante’?","o":["La Comunidad Europea (CE).","El Ministerio de Fomento.","El Ministerio de Industria, Energía y Turismo.","La Dirección General de la Marina Mercante."],"a":3,"e":"Art. 6 RD 98/2016: la Dirección General de la Marina Mercante es la autoridad notificante."},{"id":"2025abr-1-20","t":14,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con el Convenio Internacional sobre Búsqueda y Salvamento Marítimo, 1979, indique el orden de precedencia de las Fases de emergencia:","o":["Fase de alerta, fase de incertidumbre y fase de peligro.","Fase de incertidumbre, fase de alerta, fase de peligro y fase de auxilio.","Fase de incertidumbre, fase de alerta y fase de peligro.","Fase de incertidumbre, fase de alerta y fase de salvamento."],"a":2,"e":"SAR 1979: las fases son incertidumbre, alerta y peligro (no existe una cuarta fase de auxilio o salvamento)."},{"id":"2025abr-1-21","t":14,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con el Artículo 10, del Convenio Internacional sobre Salvamento Marítimo, 1989. ¿En qué situación un capitán NO estaría obligado a prestar auxilio a una persona en peligro en la mar?","o":["Cuando la persona en peligro estuviese a bordo de otro buque.","Cuando existan dudas de que la persona en peligro pudiese ofrecer una recompensa inmediata.","Cuando prestar auxilio implicase un grave peligro para su propio buque y tripulación.","Cuando la persona en peligro estuviese en aguas internacionales."],"a":2,"e":"Art. 10 Convenio de Salvamento 1989: no hay obligación cuando el auxilio entrañe grave peligro para el propio buque y las personas a bordo."},{"id":"2025abr-1-22","t":15,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con la Ley 14/2014, de Navegación Marítima, ¿cuándo es obligatorio llevar a bordo el Cuaderno de Bitácora?","o":["Cuando vaya enrolado, como mínimo, un oficial de puente.","Cuando vayan enrolados dos o más oficiales de puente.","Cuando vayan enrolados al menos un oficial de puente, un oficial de máquinas y un marinero.","Se ha de llevar a bordo con independencia del número de tripulantes."],"a":1,"e":"Art. 83 Ley 14/2014: el Cuaderno de Bitácora es obligatorio cuando van enrolados dos o más oficiales de puente."},{"id":"2025abr-1-23","t":15,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con la Ley 14/2014, de Navegación Marítima, la navegación bajo pabellón español de un buque construido y abanderado en España se realiza una vez se haya obtenido:","o":["El Acta de Pruebas Oficiales.","La botadura.","El Certificado de Matrícula del Registro de Buques y Empresas Navieras.","La Patente de Navegación."],"a":3,"e":"Art. 89 Ley 14/2014: la navegación bajo pabellón nacional se realiza una vez obtenida la Patente de Navegación."},{"id":"2025abr-1-24","t":16,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"El testamento marítimo en forma especial o extraordinaria podrá otorgarse, válidamente, de palabra, ante dos testigos:","o":["Necesitándose la autorización del Capitán para su validez.","Si hubiera peligro de naufragio.","Será ineficaz si el testador no se salva del peligro.","Será ineficaz si se formaliza posteriormente por los testigos."],"a":1,"e":"Arts. 731 y 720 Código Civil: si hay peligro de naufragio, de palabra ante dos testigos. Es ineficaz si el testador se salva o si los testigos no lo formalizan."},{"id":"2025abr-1-25","t":17,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con las definiciones del Real Decreto 128/2022, sobre instalaciones portuarias receptoras de desechos de buques, ¿a cuál de los siguientes conceptos nos referimos con los desechos generados por buques, los residuos de carga y los desechos pescados de manera no intencionada?","o":["Basuras y desperdicios marinos.","Desperdicios.","Basuras.","Desechos de buques."],"a":3,"e":"Art. 2.i RD 128/2022: esa definición corresponde a «desechos de buques»."},{"id":"2025abr-1-26","t":17,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Con relación a “la entrega de desechos de buques” regulado en el Real Decreto 128/2022, sobre instalaciones portuarias receptoras de desechos de buques, de los siguientes supuestos ¿qué buques están exentos de realizar una notificación previa de desechos?","o":["Los buques de arqueo bruto igual o superior a 300, siempre que expresamente no se establezca otra cosa distinta.","Los buques pesqueros de eslora igual o superior a 45 metros.","Los buques de recreo de eslora inferior a 45 metros.","Los buques tradicionales de eslora igual o superior a 45 metros."],"a":2,"e":"Art. 16.1 RD 128/2022: quedan exceptuados de la notificación previa pesqueros, tradicionales, embarcaciones y buques de recreo de eslora inferior a 45 metros."},{"id":"2025abr-1-27","t":18,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Según el anexo V del MARPOL, ¿en qué circunstancias se pueden tirar restos de comida al mar, sin tratar, fuera de una zona especial?","o":["Con el buque fondeado a más de 6 millas de la costa.","Con el buque en ruta a más de 12 millas de la costa.","Con el buque fondeado a más de 12 millas de la costa.","Con el buque en ruta a más de 6 millas de la costa."],"a":1,"e":"Anexo V, regla 4.1.2: los desechos de alimentos no triturados, en ruta y a no menos de 12 millas de la tierra más próxima."},{"id":"2025abr-1-28","t":18,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"Según las definiciones dadas en el Anexo IV del MARPOL, qué NO se entiende por aguas sucias:","o":["Desagües y otros residuos, procedentes de cualquier tipo de inodoros y urinarios.","Desagües procedentes de lavabos, lavaderos y conductos de salida situados en cámaras de servicios médicos.","Desechos líquidos provenientes de espacios de carga contaminados con productos de la carga.","Desagües procedentes de espacios en que se transporten animales vivos."],"a":2,"e":"Anexo IV, regla 1.3: los desechos líquidos de espacios de carga contaminados con productos de la carga no entran en la definición de aguas sucias."},{"id":"2025abr-1-29","t":19,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con el Real Decreto 1185/2006, por el que se aprueba el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, se define como zona de navegación 4:","o":["Navegación en la zona comprendida entre la costa y la línea paralela a la misma trazada a 25 millas.","Navegación en la cual la embarcación no se aleje más de 5 millas de un abrigo o playa accesible.","Navegación en la cual la embarcación no se aleje más de 2 millas de un abrigo o playa accesible.","Navegación en la zona comprendida entre la costa y la línea paralela a la misma trazada a 12 millas."],"a":3,"e":"Art. 3.6.d RD 1185/2006: zona 4, entre la costa y la paralela a 12 millas."},{"id":"2025abr-1-30","t":19,"src":"oficial","conv":"2025abr","convName":"Abril 2025","q":"De acuerdo con el Real Decreto 1185/2006, por el que se aprueba el Reglamento por el que se regulan las radiocomunicaciones marítimas a bordo de los buques civiles españoles, las embarcaciones de recreo autorizadas a realizar navegaciones por la zona 3, deben estar provistas, entre otros, del siguiente equipo radioeléctrico:","o":["Una radiobaliza de 406 MHz, de activación automática y manual o únicamente manual.","Una estación terrena de buque (ETB).","Un receptor NAVTEX.","Un respondedor de radar de 9 GHz."],"a":0,"e":"Art. 58.1.b RD 1185/2006: en zona 3, radiobaliza de 406 MHz de activación automática y manual o únicamente manual."},{"id":"2026nov-1-01","t":1,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, incumplir las normas sobre despacho de buques y embarcaciones o sobre enrolamiento de tripulaciones y régimen del rol ante las Capitanías Marítimas es una infracción:","o":["Muy grave.","Leve.","Grave.","No se tipifica como infracción en el citado texto legal."],"a":2,"e":"El TRLPEMM tipifica como infracción grave incumplir las normas sobre despacho de buques y embarcaciones y sobre enrolamiento de tripulaciones y régimen del rol ante las Capitanías Marítimas."},{"id":"2026nov-1-02","t":1,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, la navegación en función de su ámbito será:","o":["Territorial y extraterritorial.","Interior, de cabotaje, exterior y extranacional.","Regular y no regular.","Portuaria, nacional e internacional."],"a":1,"e":"Por su ámbito, el TRLPEMM clasifica la navegación en interior, de cabotaje, exterior y extranacional. «Regular y no regular» es la clasificación por su forma de prestación, no por su ámbito."},{"id":"2026nov-1-03","t":2,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según la Ley 14/2014, de Navegación Marítima, el objetivo de la publicidad de los peligros es:","o":["Garantizar que las embarcaciones cumplan sus obligaciones fiscales.","Controlar el tráfico marítimo para prevenir delitos de contrabando.","Promocionar puertos y rutas comerciales seguras.","Informar a los navegantes de circunstancias transitorias que representen un peligro para la navegación."],"a":3,"e":"La publicidad de los peligros (avisos a los navegantes) sirve para informar a los navegantes de las circunstancias transitorias que suponen un peligro para la navegación."},{"id":"2026nov-1-04","t":2,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según la Ley 14/2014, de Navegación Marítima, ¿qué requisito formal es indispensable para que la adquisición de la propiedad de un buque surta plenos efectos frente a terceros?","o":["La mera entrega material (traditio) del buque en puerto español ante dos testigos mercantiles.","La inscripción del título adquisitivo en el Registro de Buques y Empresas Navieras.","La notificación fehaciente al Capitán Marítimo del puerto de abanderamiento del buque.","La autorización previa del Ministerio de Transportes y Movilidad Sostenible mediante resolución publicada en el BOE."],"a":1,"e":"La adquisición del buque debe constar por escrito y, para surtir efectos frente a terceros, inscribirse en el registro. De las cuatro opciones, la única que exige inscripción es la B, que es la que da por buena la plantilla.","av":{"n":"ojo","x":"La plantilla da por buena la inscripción en el «Registro de Buques y Empresas Navieras». La Ley 14/2014 exige inscribir la adquisición para que afecte a terceros y remite al Registro de Bienes Muebles (sección de buques), que es como lo explica el tema 2."}},{"id":"2026nov-1-05","t":3,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según el Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, aprobado por el Real Decreto Legislativo 2/2011, NO constituye un objetivo básico del Plan Nacional de Servicios Especiales de Salvamento de la vida humana en la mar y de la lucha contra la contaminación del medio marino:","o":["Potenciar los medios de salvamento y lucha contra la contaminación marina ya existentes y formar al personal especializado responsable de la dirección y coordinación de las operaciones de búsqueda y salvamento y lucha contra la contaminación marina.","Implantar un sistema de control del tráfico marítimo que cubra la totalidad de nuestras costas, mediante el establecimiento de centros de coordinadores regionales y locales.","Establecer mecanismos de prevención de accidentes marítimos y de protección de la seguridad de la navegación en las aguas marítimas españolas.","Coordinar los medios capaces de realizar operaciones de búsqueda, salvamento de vidas humanas y lucha contra la contaminación marina pertenecientes a las diversas Administraciones Públicas, así como a instituciones públicas y privadas."],"a":2,"e":"Los objetivos del Plan Nacional de Salvamento son coordinar los medios de las Administraciones e instituciones, potenciar los medios existentes y formar al personal, e implantar un sistema de control del tráfico marítimo en todas las costas. Prevenir accidentes y proteger la seguridad de la navegación no figura entre ellos."},{"id":"2026nov-1-06","t":4,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"De acuerdo con el Real Decreto 638/2007, por el que se regulan las Capitanías Marítimas y los Distritos Marítimos, ¿quién ejerce, bajo la dependencia de la Dirección General de la Marina Mercante, la dirección y coordinación de las actuaciones relativas a la seguridad marítima, seguridad de la navegación y protección del medio marino dentro de su ámbito territorial?","o":["El Presidente de la Autoridad Portuaria.","El Capitán Marítimo.","El Jefe del Distrito Marítimo.","El Delegado del Gobierno."],"a":1,"e":"El Capitán Marítimo dirige y coordina, bajo la dependencia de la DGMM, la seguridad marítima, la seguridad de la navegación y la protección del medio marino en su ámbito territorial."},{"id":"2026nov-1-07","t":5,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según el Real Decreto 186/2023, por el que se aprueba el Reglamento de Ordenación de la Navegación Marítima, ¿cuáles de los siguientes tipos de buques y/o embarcaciones NO podrán acogerse al despacho simplificado?","o":["Los buques de recreo de pabellón español.","Los buques y/o embarcaciones de pesca.","Los buques y embarcaciones que no se puedan identificar en las bases de datos de la Administración marítima.","Los buques dedicados a navegaciones de línea regular, así como los de cabotaje y cabotaje consecutivo, que no siendo línea regular se efectúen con itinerarios repetitivos."],"a":2,"e":"No pueden acogerse al despacho simplificado los buques y embarcaciones que no se puedan identificar en las bases de datos de la Administración marítima: el despacho simplificado se apoya precisamente en esos datos."},{"id":"2026nov-1-08","t":6,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según el Real Decreto 210/2004, por el que se establece un sistema de seguimiento y de información sobre el tráfico marítimo, cualquier buque que haga escala en un puerto español deberá ir equipado con un sistema que cumpla los requisitos establecidos por la OMI:","o":["AtoN AIS.","VMS.","LRIT.","SIA."],"a":3,"e":"Todo buque que haga escala en un puerto español debe llevar un sistema de identificación automática (SIA, o AIS en inglés) que cumpla los requisitos de la OMI."},{"id":"2026nov-1-09","t":7,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"De conformidad con el Capítulo II del Real Decreto 62/2008, por el que se aprueba el reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas: durante una concentración náutica para una embarcación de pasaje o recreo ¿cuál es el número máximo de personas permitidas a bordo?","o":["Se calcula en función de la eslora total y la manga de la embarcación.","El máximo número de personas que hagan que, si todos los ocupantes de la embarcación se disponen a una banda, el francobordo se reduzca a menos de la mitad del existente con la embarcación adrizada.","Al tratarse de una concentración náutica y al no tener que cumplir los criterios de estabilidad, no existe un límite de personas permitidas a bordo.","El que figure autorizado en sus certificados."],"a":3,"e":"En una concentración náutica, una embarcación de pasaje o de recreo no puede llevar más personas que las que figuren autorizadas en sus certificados."},{"id":"2026nov-1-10","t":7,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"Según el Real Decreto 62/2008, por el que se aprueba el Reglamento de las condiciones de seguridad marítima, de la navegación y de la vida humana en la mar, aplicables a las concentraciones náuticas de carácter conmemorativo y pruebas náutico-deportivas, ¿cuál de las siguientes facultades corresponde al capitán marítimo cuando disminuyen las condiciones de seguridad durante la celebración de una prueba náutico-deportiva?","o":["Modificar la clasificación de la prueba.","Retrasar, anular o suprimir las pruebas.","Proporcionar al coordinador de seguridad, a los patrones de las embarcaciones y al personal de la organización toda la información que se estime precisa a efectos de garantizar el buen orden durante la realización del evento.","Sustituir al coordinador de seguridad por personal de la Capitanía."],"a":1,"e":"Si disminuyen las condiciones de seguridad durante una prueba náutico-deportiva, el capitán marítimo puede retrasar, anular o suprimir las pruebas."},{"id":"2026nov-1-11","t":8,"src":"oficial","conv":"2026nov","convName":"Noviembre 2026","q":"¿Qué embarcaciones de recreo están exentas de la obligación de abanderamiento, matriculación y despacho, según el Real Decreto 1435/2010, por el que se regula el abanderamiento y matriculación de las embarcaciones de recreo en las listas sexta y séptima del registro de matrícula de buques?","o":["Las embarcaciones de eslora inferior a 6 metros que naveguen exclusivamente en aguas interiores y playas no balizadas.","Las embarcaciones de eslora igual o inferior a 12 metros, siempre que la propia embarcación y su equipo propulsor ostenten el marcado CE.","Todas las embarcaciones de lista 7.ª con marcado CE, independientemente de su eslora, si navegan a menos de 12 millas de la costa.","Las embarcaciones auxiliares."],"a":1,"e":"Régimen especial del RD 1435/2010: si la embarcación y su equipo propulsor llevan marcado CE y mide 12 m o m
